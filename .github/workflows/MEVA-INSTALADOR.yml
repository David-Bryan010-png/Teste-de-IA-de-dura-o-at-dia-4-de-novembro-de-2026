# MEVA — INSTALADOR ÚNICO
# Coloque este arquivo em: .github/workflows/MEVA-INSTALADOR.yml
# Execute primeiro com deploy_now=false para gerar e commitar os arquivos sem credenciais externas.
# Para publicar na Cloudflare, configure os 4 Secrets descritos abaixo e execute novamente com deploy_now=true.
# Este único YAML cria automaticamente os arquivos do painel móvel, autenticação,
# banco/migrações, agente local de programação e workflow de implantação.
#
# Secrets necessários somente para deploy_now=true (Settings > Secrets and variables > Actions):
# CLOUDFLARE_API_TOKEN   (Cloudflare Workers Scripts Write + D1 Read/Edit)
# CLOUDFLARE_ACCOUNT_ID  (ID da conta Cloudflare)
# MEVA_GITHUB_TOKEN      (Fine-grained PAT: Actions:Read and write + Metadata:Read)
# MEVA_BOOTSTRAP_SECRET  (chave escolhida por você; mínimo 20 caracteres)
#
# Segurança: nunca coloque esses valores neste YAML, no Pages ou em commits.
# O pacote incorporado é validado por SHA-256 antes de ser extraído.

name: MEVA — instalação completa em um único YAML
run-name: MEVA Setup — ${{ github.repository }}

on:
  workflow_dispatch:
    inputs:
      deploy_now:
        description: "Publicar também na Cloudflare (exige os 4 Secrets; deixe false para instalar os arquivos primeiro)"
        type: boolean
        required: true
        default: false
      overwrite_existing:
        description: "Substituir arquivos MEVA existentes (faça backup se já personalizou)"
        type: boolean
        required: true
        default: true

permissions:
  contents: write


concurrency:
  group: meva-one-file-installer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  install:
    name: Criar e configurar toda a MEVA
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Garantir instalação na branch padrão
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Execute este instalador na branch padrão ($DEFAULT_BRANCH), não em $GITHUB_REF_NAME." >&2
            exit 1
          fi

      - name: Validar credenciais necessárias para publicação
        if: ${{ inputs.deploy_now }}
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.MEVA_GITHUB_TOKEN }}
          BOOTSTRAP: ${{ secrets.MEVA_BOOTSTRAP_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CF_TOKEN" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          [[ -n "$CF_ACCOUNT" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "$GH_TOKEN" ]] || missing+=("MEVA_GITHUB_TOKEN")
          [[ -n "$BOOTSTRAP" ]] || missing+=("MEVA_BOOTSTRAP_SECRET")
          if (( ${#missing[@]} > 0 )); then
            printf 'Secrets ausentes em Settings > Secrets and variables > Actions:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            echo 'Defina os quatro Secrets ou execute com deploy_now=false para instalar os arquivos primeiro.' >&2
            exit 1
          fi
          if (( ${#BOOTSTRAP} < 20 )); then
            echo 'MEVA_BOOTSTRAP_SECRET precisa ter pelo menos 20 caracteres.' >&2
            exit 1
          fi
          echo 'Credenciais presentes. Os valores não serão exibidos.' 

      - name: Preparar ferramentas
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruir automaticamente todos os arquivos MEVA
        id: files
        shell: bash
        env:
          OVERWRITE: ${{ inputs.overwrite_existing }}
        run: |
