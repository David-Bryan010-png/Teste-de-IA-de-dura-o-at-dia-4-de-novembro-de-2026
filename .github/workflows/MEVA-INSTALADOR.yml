  deploy-pages:
    name: Publicar interface MEVA Pages (3 tentativas)
    if: ${{ inputs.mode == 'install' }}
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy_1.outputs.page_url || steps.deploy_2.outputs.page_url || steps.deploy_3.outputs.page_url }}
    steps:
      - name: Publicar MEVA CODE V19 — tentativa 1/3
        id: deploy_1
        continue-on-error: true
        uses: actions/deploy-pages@v5.0.1
        with:
          timeout: 300000
          error_count: 20

      - name: Aguardar antes da segunda tentativa
        if: ${{ steps.deploy_1.outcome == 'failure' }}
        shell: bash
        run: sleep 15

      - name: Publicar MEVA CODE V19 — tentativa 2/3
        id: deploy_2
        if: ${{ steps.deploy_1.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/deploy-pages@v5.0.1
        with:
          timeout: 300000
          error_count: 20

      - name: Aguardar antes da terceira tentativa
        if: ${{ steps.deploy_2.outcome == 'failure' }}
        shell: bash
        run: sleep 30

      - name: Publicar MEVA CODE V19 — tentativa 3/3
        id: deploy_3
        if: ${{ steps.deploy_2.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/deploy-pages@v5.0.1
        with:
          timeout: 300000
          error_count: 20

      - name: Confirmar que pelo menos uma implantação terminou com sucesso
        id: deploy_gate
        if: always()
        env:
          DEPLOY_1: ${{ steps.deploy_1.outcome }}
          DEPLOY_2: ${{ steps.deploy_2.outcome }}
          DEPLOY_3: ${{ steps.deploy_3.outcome }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Tentativa 1: ${DEPLOY_1:-não executada}"
          echo "Tentativa 2: ${DEPLOY_2:-não executada}"
          echo "Tentativa 3: ${DEPLOY_3:-não executada}"
          if [[ "$DEPLOY_1" == success || "$DEPLOY_2" == success || "$DEPLOY_3" == success ]]; then
            echo 'deployed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'deployed=false' >> "$GITHUB_OUTPUT"
          echo 'Todas as três tentativas de GitHub Pages falharam. O artefato continua disponível no job install.'
          exit 1

      - name: Verificar a página publicada por HTTP
        if: ${{ steps.deploy_gate.outputs.deployed == 'true' }}
        env:
          PAGE_URL: ${{ steps.deploy_1.outputs.page_url || steps.deploy_2.outputs.page_url || steps.deploy_3.outputs.page_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$PAGE_URL" == https://* ]] || { echo 'URL HTTPS de Pages ausente ou inválida.'; exit 1; }
          ok=0
          for attempt in $(seq 1 12); do
            code="$(curl --connect-timeout 10 --max-time 25 -sS -L -o /tmp/meva-v19-page.html -w '%{http_code}' "$PAGE_URL" || true)"
            if [[ "$code" == 200 ]] && grep -q 'MEVA CODE V19' /tmp/meva-v19-page.html; then
              echo "Página HTTP verificada: ${PAGE_URL} (HTTP ${code})"
              ok=1
              break
            fi
            echo "Aguardando propagação do Pages (${attempt}/12; HTTP ${code:-sem resposta})…"
            sleep 10
          done
          [[ "$ok" == 1 ]] || { echo 'O deployment reportou sucesso, mas a página não passou na verificação HTTP/conteúdo.'; exit 1; }

      - name: Diagnosticar GitHub Pages quando houver falha
        if: ${{ failure() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/meva-v19-pages-diagnostic
          curl --connect-timeout 10 --max-time 20 -fsSL https://www.githubstatus.com/api/v2/status.json -o /tmp/meva-v19-pages-diagnostic/status.json || true
          curl --connect-timeout 10 --max-time 20 -fsSL https://www.githubstatus.com/api/v2/components.json -o /tmp/meva-v19-pages-diagnostic/components.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/meva-v19-pages-diagnostic')
          for name in ('status.json','components.json'):
              f=p/name
              if not f.is_file():
                  print(name+': indisponível')
                  continue
              try:
                  d=json.loads(f.read_text(encoding='utf-8'))
                  if name=='status.json': print('GitHub Status:',(d.get('status') or {}).get('description','indisponível'))
                  else:
                      items=[x for x in d.get('components',[]) if 'pages' in x.get('name','').lower()]
                      print('Componentes Pages:',json.dumps(items,ensure_ascii=False)[:5000])
              except Exception as e: print(name+': JSON inválido:',type(e).__name__)
          PY
          echo 'Consulte Settings → Pages e confirme Source = GitHub Actions. O workflow não altera a configuração administrativa do repositório automaticamente.'

      - name: Enviar diagnóstico de Pages
        if: ${{ always() && failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MEVA-V19-PAGES-DIAGNOSTICO-${{ github.run_id }}
          path: /tmp/meva-v19-pages-diagnostic/
          if-no-files-found: warn
          retention-days: 7

  ai:
    name: Executar agente MEVA V19
    if: ${{ inputs.mode == 'chat' || inputs.mode == 'agent' || inputs.mode == 'linux_zip' || inputs.mode == 'self_test' || inputs.mode == 'resume' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    permissions:
      contents: write
    steps:
      - name: Baixar branch de trabalho (separada da branch temporária do upload)
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: ''

      - name: Materializar agente embutido (meva/ 1/5)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p '/tmp/meva-agent-src/meva'
          cat > '/tmp/meva-agent-src/meva/__init__.py' <<'MEVA_EOF_691578'
          """MEVA CODE V19 — agente de engenharia verificável (pacote testável)."""
          from .util import VERSION

          __all__ = ['VERSION']
          MEVA_EOF_691578
          mkdir -p '/tmp/meva-agent-src/meva'
          cat > '/tmp/meva-agent-src/meva/__main__.py' <<'MEVA_EOF_551319'
          """Ponto de entrada: `python -m meva` (chamado pelo workflow)."""
          from __future__ import annotations

          import json
          import os
          import sys
          import time

          from .agent import Agent
          from .config import Config, load_config
          from .github_api import GitHub
          from .intents import compile_requested, tests_requested
          from .plugins import active_plugins
          from .project_io import ProjectIO, valid_upload_meta
          from .prompts import build_system
          from .providers import Router
          from .report import create_package
          from .sandbox import BwrapSandbox
          from .session import Session
          from .tools import _obj, S
          from .util import atomic_json, log, now_iso, read_memory_safe, redact
          from .validate import validate_project
          from .workspace import Workspace, environment_info


          def sanitize_history(messages: list) -> list:
              """Histórico textual de conversas anteriores → alternância válida user/assistant começando por user."""
              out: list[dict] = []
              for m in messages:
                  if not isinstance(m, dict) or m.get('role') not in ('user', 'assistant') or not isinstance(m.get('content'), str):
                      continue
                  item = {'role': m['role'], 'content': m['content'][:12000]}
                  if out and out[-1]['role'] == item['role']:
                      out[-1]['content'] += '\n\n' + item['content']
                  else:
                      out.append(item)
              while out and out[0]['role'] != 'user':
                  out.pop(0)
              if out and out[-1]['role'] == 'user':
                  out.pop()  # a próxima mensagem do usuário assume o papel 'user'
              return out


          def evaluate_final(s, finished: bool, reason: str, user: str) -> tuple[str, list[str]]:
              """Decide o estado final apenas com evidências; nunca promove falha/limite a sucesso."""
              cfg, notes = s.cfg, []
              status = 'completed' if finished else 'partial'
              if not finished:
                  notes.append(f'Execução PARCIAL: {reason}. Use Retomar para continuar.')
              if cfg.write_allowed and s.edit_seq > 0 and s.validated_seq != s.edit_seq:
                  changed = s.changed_for_validation()
                  v = validate_project(s.ws, only=changed)
                  s.last_validation = v
                  s.record_event('automatic_validation', 'arquivos modificados', 'success' if v['ok'] else 'failed', result=v, agent='runtime')
                  if v['ok']:
                      s.validated_seq = s.edit_seq
                      if not v.get('complete'):
                          notes.append('Validação sintática incompleta: alguns arquivos ficaram NOT_RUN/SKIP (validador ausente ou arquivo grande). Veja MEVA-VALIDATION.json.')
                  else:
                      status = 'partial'
                      notes.append('Validação automática encontrou erros de sintaxe/estrutura (veja MEVA-VALIDATION.json). O resultado permanece PARCIAL.')
              if cfg.write_allowed:
                  c_req, t_req = compile_requested(user), tests_requested(user)
                  if c_req and not s.build_ok_current:
                      status = 'partial'
                      why = ('allow_build=false (NOT_RUN)' if not cfg.allow_build else
                             'sandbox indisponível (NOT_RUN): ' + s.sandbox.reason if not s.sandbox.available else
                             'nenhum build bem-sucedido depois da última edição')
                      notes.append('Validação: a tarefa pediu compilação, mas ' + why + '. Não será declarada compilação concluída.')
                  if t_req and not s.tests_ok_current:
                      status = 'partial'
                      notes.append('Validação: a tarefa pediu testes, mas nenhum runner terminou com exit code 0 depois da última edição '
                                   '(ou não foi autorizado/executado). O resultado permanece parcial.')
                  for p in s.plugins:
                      msgs = p.final_gate(s.ws, compile_requested=c_req, build_ok=s.build_ok_current)
                      if msgs:
                          status = 'partial'
                          notes += msgs
              vr = s.verify_result
              if vr and vr.get('verdict') == 'FAIL' and any(f.get('severity') in ('blocker', 'major') for f in vr.get('findings', [])):
                  status = 'partial'
                  notes.append('O verificador independente reprovou o resultado e os achados não foram resolvidos (MEVA-VERIFY.json).')
              elif vr and vr.get('verdict') == 'INCONCLUSIVE':
                  notes.append('O verificador independente não conseguiu concluir: ' + vr.get('summary', '')[:300])
              return status, notes


          def self_test(router) -> tuple[str, str]:
              t = router.complete('Responda em português e seja breve.', [{'role': 'user', 'content': 'Responda somente: MEVA V19 API operacional.'}], [])
              probe = {'name': 'ping', 'description': 'Ferramenta de teste.', 'input_schema': _obj({'msg': S}, ['msg'])}
              t2 = router.complete('Use as ferramentas quando pedido.', [{'role': 'user', 'content': 'Chame a ferramenta ping com msg="ok" agora.'}], [probe])
              tool_ok = any(c.name == 'ping' and isinstance(c.args, dict) and 'msg' in c.args for c in t2.tool_calls)
              answer = ('Autoteste: texto OK (' + t.text[:80] + '); tool calling nativo: ' + ('OK' if tool_ok else 'FALHOU — o modelo/provedor não devolveu tool_use')
                        + f' [{router.provider}/{router.model}]')
              return ('completed' if tool_ok else 'partial'), answer


          def run(cfg: Config, router_factory=None, sandbox=None) -> dict:
              work = cfg.work
              ws = Workspace(cfg)
              gh = GitHub(cfg.gh_repo, cfg.gh_token)
              pio = ProjectIO(cfg, gh, ws)
              sandbox = sandbox or BwrapSandbox(ws, cfg)
              s = Session(cfg, ws, sandbox)
              history = {'id': cfg.cid, 'messages': []}
              old_messages: list = []
              answer, provider, model, status = '', '', '', 'failed'
              upload_meta = None
              router_holder = {}

              def make_router(cheap: bool = False):
                  if router_factory:
                      return router_factory(cheap)
                  r = Router(cfg, prefer_cheap=cheap)
                  router_holder[cheap] = r
                  return r

              def usage():
                  r = router_holder.get(False)
                  return r.usage if r else None

              def save_state():
                  history.update({'id': cfg.cid, 'updated_at': now_iso(), 'provider': provider, 'model': model, 'autonomy': cfg.autonomy,
                                  'mode': cfg.mode, 'status': status, 'todos': s.todos})
                  atomic_json(cfg.state_path, history)
                  atomic_json(cfg.checkpoint_path, {'conversation_id': cfg.cid, 'actions': s.done, 'updated_at': history['updated_at'],
                                                    'project_loaded': ws.loaded(), 'completed': status == 'completed', 'status': status,
                                                    'summary': answer[:4000], 'provider': provider, 'model': model, 'pending_upload': history.get('pending_upload')})

              try:
                  for d in (work, cfg.inbox, cfg.state_path.parent, cfg.checkpoint_path.parent):
                      d.mkdir(parents=True, exist_ok=True)
                  user = cfg.user
                  if cfg.state_path.is_file():
                      try:
                          history = json.loads(cfg.state_path.read_text(encoding='utf-8'))
                      except Exception:  # noqa: BLE001
                          history = {'id': cfg.cid, 'messages': []}
                  old_messages = [m for m in history.get('messages', []) if isinstance(m, dict) and m.get('role') in ('user', 'assistant') and isinstance(m.get('content'), str)][-36:] \
                      if isinstance(history.get('messages'), list) else []
                  if cfg.mode == 'resume' and not user:
                      user = next((m['content'] for m in reversed(old_messages) if m['role'] == 'user'), '')
                      if not user:
                          raise RuntimeError('Não existe tarefa anterior para retomar.')
                  upload_meta = valid_upload_meta(cfg.attachments, cfg.upload_ref)
                  if upload_meta:
                      history['pending_upload'] = upload_meta
                      save_state()
                  elif isinstance(history.get('pending_upload'), dict):
                      upload_meta = history['pending_upload']
                  if upload_meta:
                      pio.install_stage(pio.load_git_upload(upload_meta))
                      history['project_loaded'] = True
                      history['original_upload'] = upload_meta
                      out = os.getenv('GITHUB_OUTPUT')
                      if out:
