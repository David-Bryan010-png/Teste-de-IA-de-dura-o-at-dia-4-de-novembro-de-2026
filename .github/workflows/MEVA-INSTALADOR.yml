                              if namesz<1 or namesz>4096 or size>MAX_UNPACKED: raise RuntimeError('Entrada CPIO fora dos limites.')
                              name_b=f.read(namesz)
                              if len(name_b)!=namesz or not name_b.endswith(b'\0'): raise RuntimeError('Nome CPIO truncado ou sem terminador NUL.')
                              rawname=name_b[:-1].decode('utf-8','strict')
                              pad=(4-((110+namesz)%4))%4
