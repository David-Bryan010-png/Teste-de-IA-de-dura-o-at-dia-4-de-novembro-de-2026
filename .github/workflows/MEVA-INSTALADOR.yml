            build-essential \
            gcc \
            g++ \
            clang \
            make \
            cmake \
            ninja-build \
            pkg-config \
            git \
            curl \
            wget \
            zip \
            unzip \
            p7zip-full \
            poppler-utils \
            maven \
            cargo \
            rustc \
            libssl-dev \
            zlib1g-dev \
            libffi-dev \
            libsqlite3-dev

          python -m pip install \
            --disable-pip-version-check \
            --upgrade pip pytest

      - name: Preparar Node.js
        if: ${{ inputs.mode == 'agent' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Preparar Go
        if: ${{ inputs.mode == 'agent' }}
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Preparar Java
        if: ${{ inputs.mode == 'agent' }}
