                      selected.add(('workspace/'+p.relative_to(work).as_posix(),p.relative_to(root).as_posix()))
          out=Path('/tmp/MEVA-V9-RESULT.zip'); total=0; manifest=[]
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=5) as z:
              for dest,rel in sorted(selected):
                  p=(root/rel).resolve()
                  if root.resolve() not in p.parents or not p.is_file() or p.is_symlink(): continue
                  size=p.stat().st_size
