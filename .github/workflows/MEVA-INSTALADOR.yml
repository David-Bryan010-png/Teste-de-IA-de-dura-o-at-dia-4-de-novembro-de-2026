              def status(self, cap: int = 300) -> str:
                  if not self.enabled:
                      return 'git indisponível: ' + self.reason
                  lines = self._out('status', '--short', '--untracked-files=normal').splitlines()
                  more = f'\n[… +{len(lines) - cap} linhas]' if len(lines) > cap else ''
                  return '\n'.join(lines[:cap]) + more

              def diff(self, path: str | None = None, cap: int = 60000, against_base: bool = False) -> str:
                  if not self.enabled:
