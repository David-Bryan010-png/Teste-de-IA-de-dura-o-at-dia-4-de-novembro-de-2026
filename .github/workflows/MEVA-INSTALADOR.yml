          def valid_upload_meta(raw: str, dispatch_ref: str):
              if not raw:
                  return None
              try:
                  d = json.loads(raw)
              except Exception as e:  # noqa: BLE001
                  raise RuntimeError('Manifesto de transporte inválido: ' + redact(e))
              if not isinstance(d, dict) or d.get('transport') != 'git_files':
                  raise RuntimeError('Transporte de upload desconhecido.')
              ref = d.get('upload_ref')
              uid = d.get('upload_id')
              commit = str(d.get('commit_sha', '')).lower()
              blob = str(d.get('manifest_blob_sha', '')).lower()
              mh = str(d.get('manifest_sha256', '')).lower()
              ms = d.get('manifest_size')
              if not isinstance(ref, str) or not re.fullmatch(r'meva-upload-[a-z0-9-]{8,80}', ref):
                  raise RuntimeError('upload_ref inválido.')
              if not isinstance(uid, str) or not re.fullmatch(r'[a-z0-9-]{8,80}', uid) or ref != 'meva-upload-' + uid:
                  raise RuntimeError('upload_id/ref divergentes.')
              if not re.fullmatch(r'[0-9a-f]{40}', commit) or not re.fullmatch(r'[0-9a-f]{40}', blob):
                  raise RuntimeError('SHA Git do commit/manifesto inválido.')
              if not re.fullmatch(r'[0-9a-f]{64}', mh):
                  raise RuntimeError('SHA-256 do manifesto inválido.')
              if isinstance(ms, bool) or not isinstance(ms, int) or not 0 < ms <= 8 * 1024 * 1024:
                  raise RuntimeError('Tamanho do manifesto inválido.')
              if not dispatch_ref or dispatch_ref != ref:
                  raise RuntimeError('upload_ref do dispatch não corresponde ao manifesto.')
              return {'transport': 'git_files', 'upload_ref': ref, 'upload_id': uid, 'commit_sha': commit,
                      'manifest_blob_sha': blob, 'manifest_sha256': mh, 'manifest_size': ms}


          class ProjectIO:
              def __init__(self, cfg, gh, ws):
                  self.cfg = cfg
                  self.gh = gh
                  self.ws = ws

              # ------------------------------------------------------------ upload por blocos Git
              def load_git_upload(self, meta: dict) -> Path:
                  gh = self.gh
                  ref = gh.get('/git/ref/heads/' + urllib.parse.quote(meta['upload_ref'], safe=''))
                  if (ref.get('object') or {}).get('sha') != meta['commit_sha']:
                      raise RuntimeError('Branch temporária não aponta para o commit esperado.')
                  manifest_raw = gh.download_blob(meta['manifest_blob_sha'], meta['manifest_size'], meta['manifest_sha256'])
                  try:
