          """Estado compartilhado de uma execução do agente (auditoria, evidências, leituras, plano)."""
          from __future__ import annotations

          import threading

          from .util import file_hash, redact, now_iso


          class Session:
              def __init__(self, cfg, ws, sandbox, plugins=None):
                  self.cfg = cfg
                  self.ws = ws
                  self.sandbox = sandbox
                  self.plugins = plugins or []
                  self.lock = threading.RLock()
                  self.audit: list[dict] = []
                  self.plan_recorded = False
                  self.plan_text = ''
                  self.todos: list[dict] = []
                  self.read_hashes: dict[str, str] = {}
                  self.touched: set[str] = set()
                  self.pending_paths: set[str] = set()
                  self.exec_dirty = False
                  self.failed: set[str] = set()
                  self.state_version = 0       # muda a cada mutação do workspace (libera retry de ação que falhou)
                  self.edit_seq = 0            # edições de código; build/test NÃO incrementam
                  self.validated_seq = -1
                  self.build_ok_seq = None
                  self.tests_ok_seq = None
                  self.exec_shell_edited = False
                  self.last_build: dict | None = None
                  self.last_tests: dict | None = None
                  self.last_validation: dict | None = None
                  self.verify_result: dict | None = None
                  self.subagent_runner = None  # callable(role, task) -> str, definido pelo agente
                  self.memory_text = ''
                  self.done = 0                # ações do agente principal (limite max_actions)

              # --------------------------------------------------------------- auditoria
              def record_event(self, kind, target, status, result=None, error=None, agent='main'):
                  with self.lock:
                      ev = {'index': len(self.audit) + 1, 'tool': str(kind)[:80], 'target': str(target)[:240],
                            'status': status, 'agent': agent, 'at': now_iso()}
                      if result is not None:
                          ev['result'] = audit_result(result)
                      if error:
                          ev['error'] = redact(error)
                      self.audit.append(ev)
                      return ev

              # --------------------------------------------------------------- leitura antes de editar
              def note_read(self, rel: str) -> None:
                  p = self.ws.project / rel
                  try:
                      h = file_hash(p) if p.stat().st_size <= 25 * 1024 * 1024 else 'too-large'
                  except OSError:
                      return
                  with self.lock:
                      self.read_hashes[rel] = h

              def require_fresh_read(self, rel: str) -> None:
                  """Arquivo existente só pode ser alterado se foi lido e não mudou desde a leitura."""
                  p = self.ws.project / rel
                  if not p.exists():
                      return
                  with self.lock:
                      seen = self.read_hashes.get(rel)
                  if seen is None:
                      raise ValueError(f'Leia o arquivo com read_file antes de alterá-lo: {rel}')
                  if seen == 'too-large' or file_hash(p) != seen:
                      raise ValueError(f'O arquivo mudou desde a última leitura (ou é grande demais): leia {rel} de novo antes de editar.')

              # --------------------------------------------------------------- mutações
              def mark_edit(self, rel: str | None, code_edit: bool = True) -> None:
                  with self.lock:
                      self.state_version += 1
                      if rel:
                          self.touched.add(rel)
                          self.pending_paths.add(rel)
                          self.note_read(rel)  # o conteúdo novo passa a ser o "último lido"
                      if code_edit:
                          self.edit_seq += 1

              def mark_exec_writable(self, code_edit: bool = False) -> None:
                  with self.lock:
                      self.state_version += 1
                      self.exec_dirty = True
                      if code_edit:
                          self.edit_seq += 1
                          self.exec_shell_edited = True

              def changed_for_validation(self) -> list[str]:
                  """touched + arquivos novos/modificados por shell (comparando com o snapshot inicial)."""
                  names = set(self.touched)
                  try:
                      if self.ws.snapshot_before is not None and self.exec_shell_edited:
                          names |= {c['path'] for c in self.ws.changes_since(self.ws.snapshot_before) if c['status'] != 'deleted'}
                  except Exception:  # noqa: BLE001
                      pass
                  return [n for n in sorted(names) if (self.ws.project / n).is_file()]

              def drain_pending(self):
                  with self.lock:
                      paths, dirty = set(self.pending_paths), self.exec_dirty
                      self.pending_paths.clear()
                      self.exec_dirty = False
                  return paths, dirty

              # --------------------------------------------------------------- evidências
              @property
              def build_ok_current(self) -> bool:
                  return self.build_ok_seq is not None and self.build_ok_seq == self.edit_seq

              @property
              def tests_ok_current(self) -> bool:
                  return self.tests_ok_seq is not None and self.tests_ok_seq == self.edit_seq


          def audit_result(v):
              if not isinstance(v, dict):
                  return {'type': type(v).__name__, 'length': len(str(v))}
              out = {}
              for k, x in v.items():
                  if k in ('content', 'output', 'diff', 'patch', 'matches', 'files', 'tools'):
                      continue
                  if isinstance(x, (str, int, float, bool)) or x is None:
                      out[k] = redact(x) if isinstance(x, str) else x
                  elif isinstance(x, list):
                      out[k + '_count'] = len(x)
              for k in ('matches', 'files'):
                  if isinstance(v.get(k), list):
                      out[k + '_count'] = len(v[k])
              if isinstance(v.get('content'), str):
                  out['content_length'] = len(v['content'])
              if isinstance(v.get('output'), str):
                  out['output_tail'] = redact(v['output'][-1000:])
              return out
