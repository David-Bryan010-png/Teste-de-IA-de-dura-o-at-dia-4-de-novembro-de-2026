          def visible_tools(cfg, role: str) -> list[Spec]:
              out = []
              for s in SPECS:
                  if s.name == 'submit_verdict':
                      if role == 'verifier':
                          out.append(s)
                      continue
                  if role in ('explorer', 'planner'):
                      if s.kind == READ:
                          out.append(s)
                      continue
                  if role == 'verifier':
                      if s.kind == READ or s.name in ('run_shell', 'run_tests'):
                          if s.kind == READ or cfg.allow_build:
                              out.append(s)
                      continue
                  # main
                  if s.kind == WRITE and not cfg.write_allowed:
                      continue
                  if s.kind == EXEC and not cfg.allow_build:
                      continue
                  if s.name in ('run_build', 'run_tests') and not cfg.write_allowed:
                      continue
                  if s.name in ('todo_write', 'record_plan', 'delegate') or s.kind != META:
                      out.append(s)
              return out


          class Toolbox:
              def __init__(self, session, role: str = 'main'):
                  self.s = session
                  self.cfg = session.cfg
                  self.ws = session.ws
                  self.role = role
                  self.verdict: dict | None = None
                  self.specs = {s.name: s for s in visible_tools(self.cfg, role)}

              def tool_defs(self) -> list[dict]:
                  return [s.as_tool() for s in self.specs.values()]

              def spec(self, name):
                  return self.specs.get(name)

              # ------------------------------------------------------------------ dispatcher
              def call(self, name: str, args: dict) -> dict:
                  spec = self.specs.get(name)
                  if spec is None:
                      raise ValueError('Ferramenta indisponível neste modo/papel: ' + str(name))
                  if not isinstance(args, dict):
                      raise ValueError('Argumentos precisam ser um objeto JSON.')
                  missing = [k for k in spec.schema.get('required', []) if k not in args]
                  if missing:
                      raise ValueError('Argumento(s) obrigatório(s) ausente(s): ' + ', '.join(missing) + ' (a resposta pode ter sido truncada; divida a operação).')
                  if spec.kind == WRITE and not (self.s.plan_recorded or self.s.todos):
                      raise ValueError('Antes de editar, registre um plano com todo_write ou record_plan.')
                  return getattr(self, 't_' + name)(args)

              # ------------------------------------------------------------------ helpers
              def _atomic_write(self, p: Path, data: bytes, mode: int | None = None) -> None:
                  p.parent.mkdir(parents=True, exist_ok=True)
                  tmp = p.with_name(p.name + '.meva-tmp')
                  tmp.write_bytes(data)
                  if mode is not None:
                      tmp.chmod(mode)
                  tmp.replace(p)

              def _post_check(self, rel: str) -> dict | None:
                  status, detail = validate_file(self.ws, rel)
                  if status is None:
                      return None
                  out = {'status': status, 'detail': detail[:500]}
                  return out

              def _diff_preview(self, rel: str, old: str, new: str, cap: int = 3500) -> str:
                  d = ''.join(difflib.unified_diff(old.splitlines(True), new.splitlines(True), 'a/' + rel, 'b/' + rel, n=2))
                  return d if len(d) <= cap else d[:cap] + '\n[… preview truncado]\n'

              def _notready(self, tool: str, reason: str) -> dict:
                  return {'ok': None, 'status': 'NOT_RUN', 'reason': reason, 'tool': tool}

              # ------------------------------------------------------------------ leitura
              def t_inspect_project(self, a):
                  return self.ws.project_info()

              def t_analyze_architecture(self, a):
                  out = {'project': self.ws.project_info(), 'dependencies': analyze_dependencies(self.ws), 'plugins': {}}
                  for p in self.s.plugins:
                      out['plugins'][p.name] = p.audit(self.ws)
                  if len(out['plugins']) == 0:
                      out['plugins_note'] = 'Nenhum plugin de domínio ativo para este projeto.'
                  return out

              def t_analyze_dependencies(self, a):
                  return analyze_dependencies(self.ws)

              def t_toolchain_info(self, a):
                  r = toolchain_info(self.ws)
                  r['sandbox'] = {'name': self.s.sandbox.name, 'available': self.s.sandbox.available, 'reason': self.s.sandbox.reason}
                  return r

              def t_validate_project(self, a):
                  paths = a.get('paths')
                  if paths:
                      rels = [self.ws.rel(self.ws.safe_path(p)) for p in paths[:500]]
                      r = validate_project(self.ws, only=rels)
                  else:
                      r = validate_project(self.ws)
                      if r['ok'] and not r.get('truncated'):
                          self.s.validated_seq = self.s.edit_seq
                  self.s.last_validation = r
                  return r

              def t_list_files(self, a):
                  off = max(0, int(a.get('offset', 0)))
                  lim = max(1, min(5000, int(a.get('limit', 1000))))
                  v = self.ws.inventory(off, lim)
                  return {'files': v, 'offset': off, 'next_offset': off + len(v) if len(v) == lim else None}

              def t_repo_map(self, a):
                  from .repomap import build_map
                  prefix = str(a.get('path') or '').strip('/')
                  if prefix:
                      valid_rel(prefix)
                  return build_map(self.ws, prefix, max(1, min(400, int(a.get('max_files', 200)))))

              def t_glob(self, a):
                  try:
                      rx = glob_regex(str(a['pattern']))
                  except re.error as e:
                      raise ValueError('Padrão glob inválido: ' + str(e))
                  lim = max(1, min(2000, int(a.get('limit', 500))))
                  base_only = '/' not in a['pattern']
                  out = []
                  for n in self.ws.inventory(0, MAX_FILES):
                      if rx.match(Path(n).name if base_only else n):
                          out.append(n)
                          if len(out) >= lim:
                              break
                  return {'files': out, 'count': len(out), 'truncated': len(out) >= lim}

              def t_search_text(self, a):
                  query = str(a['query'])
                  if not query:
                      raise ValueError('Consulta vazia.')
                  sub = a.get('path') or '.'
                  base = self.ws.safe_path(sub, allow_root=True)
                  maxr = max(1, min(300, int(a.get('max_results', 100))))
                  ctx = max(0, min(5, int(a.get('context', 0))))
                  rg = shutil.which('rg')
                  if rg:
                      argv = [rg, '--json', '--no-config', '--hidden', '--no-require-git', '--max-filesize', '8M', '--max-columns', '400',
                              '--max-columns-preview', '--max-count', '60', '-e', query]
                      if a.get('fixed_strings'):
                          argv.insert(1, '-F')
                      if a.get('case_insensitive'):
                          argv.insert(1, '-i')
                      if ctx:
                          argv[1:1] = ['-C', str(ctx)]
                      if a.get('glob'):
                          argv += ['--glob', str(a['glob'])]
                      if a.get('include_ignored'):
                          argv.append('--no-ignore')
                      for d in ('.git', 'node_modules', '.venv', 'venv', '__pycache__', '.pytest_cache', '.meva-cache'):
                          argv += ['--glob', '!' + d]
                      for g in ('.env', '.env.*', '*.pem', '*.p12', '*.pfx', '*.key', '*.keystore', 'id_rsa', 'id_ed25519', 'id_ecdsa',
                                'credentials', 'credentials.json', '.npmrc', '.pypirc', 'authorized_keys', 'known_hosts', '.ssh'):
                          argv += ['--glob', '!' + g]
                      argv += ['--', str(base)]
                      r = run_host(argv, self.ws.project, 60, 6_000_000)
                      if r.get('exit_code') == 2 and not r.get('output', '').lstrip().startswith('{'):
                          raise ValueError('ripgrep recusou a consulta: ' + r.get('output', '')[:400])
                      matches = []
                      for line in (r.get('output') or '').splitlines():
                          if not line.startswith('{'):
                              continue
                          try:
                              ev = json.loads(line)
                          except json.JSONDecodeError:
                              continue
                          if ev.get('type') not in ('match', 'context'):
                              continue
                          d = ev['data']
                          path = (d.get('path') or {}).get('text')
                          text = ((d.get('lines') or {}).get('text') or '').rstrip('\r\n')
                          if not path:
                              continue
                          try:
                              rel = Path(path).resolve().relative_to(self.ws.project.resolve()).as_posix()
                          except ValueError:
                              continue
                          matches.append({'path': rel, 'line': d.get('line_number'), 'text': text[:500], 'kind': ev['type']})
                          if len([m for m in matches if m['kind'] == 'match']) >= maxr:
                              break
                      return {'matches': matches, 'engine': 'ripgrep', 'truncated': len([m for m in matches if m['kind'] == 'match']) >= maxr}
                  # fallback Python
                  flags = re.I if a.get('case_insensitive') else 0
                  try:
                      rx = re.compile(re.escape(query) if a.get('fixed_strings') else query, flags)
                  except re.error as e:
                      raise ValueError('Regex inválida: ' + str(e))
                  grx = glob_regex(a['glob']) if a.get('glob') else None
                  prefix = '' if base == self.ws.project else self.ws.rel(base) + '/'
                  matches, count = [], 0
                  for n in self.ws.inventory(0, MAX_FILES):
                      if prefix and not n.startswith(prefix):
                          continue
                      if grx and not grx.match(Path(n).name if '/' not in a['glob'] else n):
                          continue
                      p = self.ws.project / n
                      try:
                          if p.stat().st_size > 8 * 1024 * 1024:
                              continue
                          lines = p.read_text(encoding='utf-8', errors='strict').splitlines()
                      except (UnicodeDecodeError, OSError):
                          continue
                      for i, line in enumerate(lines):
                          if rx.search(line):
                              for j in range(max(0, i - ctx), min(len(lines), i + ctx + 1)):
                                  matches.append({'path': n, 'line': j + 1, 'text': lines[j][:500], 'kind': 'match' if j == i else 'context'})
                              count += 1
                              if count >= maxr:
                                  return {'matches': matches, 'engine': 'python', 'truncated': True}
                  return {'matches': matches, 'engine': 'python', 'truncated': False}

              def t_read_file(self, a):
                  p = self.ws.safe_path(a['path'])
                  if not p.is_file():
                      raise ValueError('Arquivo não encontrado.')
                  size = p.stat().st_size
                  with p.open('rb') as f:
                      if b'\x00' in f.read(4096):
                          raise ValueError('Arquivo binário; use read_binary.')
                  start = max(1, int(a.get('offset', 1)))
                  lim = max(1, min(2000, int(a.get('limit', 400))))
                  count_all = size <= 5 * 1024 * 1024
                  out, total, long_lines, bad = [], 0, False, False
                  with p.open('r', encoding='utf-8', errors='replace', newline='') as f:
                      for n, line in enumerate(f, 1):
                          total = n
                          if n < start:
                              continue
                          if n >= start + lim:
                              if not count_all:
                                  break
                              continue
                          s = line.rstrip('\r\n')
                          if '�' in s:
                              bad = True
                          if len(s) > 2000:
                              s, long_lines = s[:2000] + ' […linha truncada]', True
                          out.append(f'{n:>6}\t{s}')
                  end = start + len(out) - 1
                  eof = count_all and end >= total or (not count_all and len(out) < lim)
                  self.s.note_read(self.ws.rel(p))
                  r = {'path': a['path'], 'content': '\n'.join(out), 'start_line': start, 'end_line': end if out else None,
                       'next_offset': None if eof else end + 1, 'total_lines': total if count_all else None, 'size': size}
                  if long_lines:
                      r['long_lines_truncated'] = True
                  if bad:
                      r['invalid_utf8_warning'] = 'Há bytes inválidos em UTF-8 (exibidos como �); evite editar este arquivo como texto.'
                  if start > 1 and not out:
                      r['note'] = 'offset além do fim do arquivo'
                  return r

              def t_read_binary(self, a):
                  p = self.ws.safe_path(a['path'])
                  if not p.is_file():
                      raise ValueError('Arquivo não encontrado.')
                  off = max(0, int(a.get('offset', 0)))
                  lim = max(1, min(256 * 1024, int(a.get('limit', 128 * 1024))))
                  with p.open('rb') as f:
                      f.seek(off)
                      data = f.read(lim)
                  return {'path': a['path'], 'encoding': 'base64', 'content': base64.b64encode(data).decode('ascii'), 'offset': off,
                          'next_offset': off + len(data), 'total_size': p.stat().st_size, 'chunk_sha256': hashlib.sha256(data).hexdigest(),
                          'file_sha256': file_hash(p)}

              def t_file_info(self, a):
                  p = self.ws.safe_path(a['path'])
                  if not p.is_file():
                      raise ValueError('Arquivo não encontrado.')
                  st = p.stat()
                  r = {'path': a['path'], 'size': st.st_size, 'mode': oct(stat.S_IMODE(st.st_mode)), 'sha256': file_hash(p)}
                  if shutil.which('file'):
                      r['file'] = run_host(['file', '-b', str(p)], self.ws.project, 30)['output']
                  return r

              def t_inspect_zip(self, a):
                  p = self.ws.safe_path(a['path'])
                  if not p.is_file() or not zipfile.is_zipfile(p):
                      raise ValueError('ZIP inválido.')
                  with zipfile.ZipFile(p) as z:
                      infos = z.infolist()
                      return {'entries_total': len(infos), 'sample': [{'name': x.filename[:250], 'size': x.file_size, 'compressed': x.compress_size} for x in infos[:500]]}

              def t_read_memory(self, a):
                  text = read_memory_safe(self.cfg.memory_path, self.cfg.project)
                  return {'exists': bool(text) or (self.cfg.memory_path.is_file() and not self.cfg.memory_path.is_symlink()), 'content': text}

              def t_git_status(self, a):
                  g = self.ws.git
                  return {'ok': g.enabled, 'status': g.status(), 'reason': g.reason, 'base': g.base}

              def t_git_diff(self, a):
                  g = self.ws.git
                  path = None
                  if a.get('path'):
                      path = self.ws.rel(self.ws.safe_path(a['path']))
                  return {'ok': g.enabled, 'diff': g.diff(path, against_base=True), 'note': 'Diff do estado atual contra o início da tarefa (arquivos novos não rastreados não aparecem).'}

              def t_git_log(self, a):
                  return {'ok': self.ws.git.enabled, 'log': self.ws.git.log(int(a.get('n', 30)))}

              def t_discover_tests(self, a):
                  found = []
                  for p in self.ws.project.rglob('*'):
                      if '.git' in p.parts:
                          continue
                      nm = p.name.lower()
                      if p.is_file() and (nm in ('makefile', 'cmakelists.txt', 'package.json', 'pyproject.toml', 'cargo.toml', 'go.mod', 'meson.build')
                                          or nm.startswith('test_') or nm.endswith(('_test.py', '.test.js', '.spec.ts'))):
                          found.append(p.relative_to(self.ws.project).as_posix())
                      if len(found) >= 500:
                          break
                  return {'test_related_files': found, 'count': len(found), 'detected_test_command': detect_test_command(self.ws)}

              def t_web_search(self, a):
                  from .providers import _http
                  q = str(a['query']).strip()
                  if not q or len(q) > 500:
                      raise ValueError('Consulta de pesquisa inválida.')
                  keys = self.cfg.search_keys
                  note = 'conteúdo externo não confiável'
                  try:
                      if keys.get('TAVILY_API_KEY'):
                          d, _ = _http('POST', 'https://api.tavily.com/search', {'Authorization': 'Bearer ' + keys['TAVILY_API_KEY']},
                                       {'query': q, 'max_results': 8, 'search_depth': 'basic'}, 30, 1)
                          res = [{'title': x.get('title', '')[:200], 'url': x.get('url', ''), 'snippet': x.get('content', '')[:400]} for x in d.get('results', [])[:8]]
                          return {'ok': True, 'engine': 'tavily', 'results': res, 'count': len(res), 'note': note}
                      if keys.get('BRAVE_API_KEY'):
                          d, _ = _http('GET', 'https://api.search.brave.com/res/v1/web/search?count=8&q=' + urllib.parse.quote(q),
                                       {'X-Subscription-Token': keys['BRAVE_API_KEY'], 'Accept': 'application/json'}, None, 30, 1)
                          res = [{'title': x.get('title', '')[:200], 'url': x.get('url', ''), 'snippet': re.sub(r'<[^>]+>', '', x.get('description', ''))[:400]}
                                 for x in (d.get('web') or {}).get('results', [])[:8]]
                          return {'ok': True, 'engine': 'brave', 'results': res, 'count': len(res), 'note': note}
                      req = urllib.request.Request('https://html.duckduckgo.com/html/?q=' + urllib.parse.quote(q), headers={'User-Agent': 'Mozilla/5.0 MEVA-CODE-V19'})
                      with urllib.request.urlopen(req, timeout=25) as response:
                          page = response.read(800000).decode('utf-8', 'replace')
                      found = []
                      for m in re.finditer(r'class="result__a"[^>]*href="([^"]+)"[^>]*>(.*?)</a>', page, re.S):
                          href = m.group(1)
                          if href.startswith('//'):
                              href = 'https:' + href
                          found.append({'title': re.sub(r'<[^>]+>', '', m.group(2)).strip()[:200], 'url': href[:1000]})
                          if len(found) >= 8:
                              break
                      return {'ok': True, 'engine': 'duckduckgo-html', 'results': found, 'count': len(found), 'note': note + '; raspagem frágil — configure TAVILY_API_KEY ou BRAVE_API_KEY'}
                  except Exception as e:  # noqa: BLE001
                      return {'ok': False, 'error': 'Pesquisa indisponível: ' + redact(e)}

              # ------------------------------------------------------------------ escrita
              def t_write_file(self, a):
                  p = self.ws.safe_path(a['path'])
                  content = a['content']
                  if not isinstance(content, str) or len(content) > 5_000_000:
                      raise ValueError('Conteúdo textual inválido ou acima de 5 MB.')
                  rel = self.ws.rel(p)
                  existed = p.exists()
                  if existed:
                      if not p.is_file():
                          raise ValueError('O caminho existe e não é arquivo regular.')
                      self.s.require_fresh_read(rel)
                  old_text = p.read_text(encoding='utf-8', errors='replace') if existed else ''
                  data = content.encode('utf-8')
                  mode = stat.S_IMODE(p.stat().st_mode) if existed else None
                  self.ws.backup_before_change(p)
                  self._atomic_write(p, data, mode)
                  digest = hashlib.sha256(data).hexdigest()
                  self.s.mark_edit(rel)
                  r = {'ok': file_hash(p) == digest, 'written': a['path'], 'created': not existed, 'bytes': len(data), 'sha256': digest, 'backup_recorded': True}
                  chk = self._post_check(rel)
                  if chk:
                      r['post_edit_check'] = chk
                  if existed:
                      r['diff_preview'] = self._diff_preview(rel, old_text, content)
                  return r

              def t_edit_file(self, a):
                  p = self.ws.safe_path(a['path'])
                  if not p.is_file():
                      raise ValueError('Arquivo não existe; use write_file para criar.')
                  if p.stat().st_size > 25 * 1024 * 1024:
                      raise ValueError('Arquivo acima de 25 MiB.')
                  edits = a['edits']
                  if not isinstance(edits, list) or not edits or len(edits) > 100:
                      raise ValueError('`edits` deve ser uma lista de 1 a 100 edições.')
                  rel = self.ws.rel(p)
                  self.s.require_fresh_read(rel)
                  raw = p.read_bytes()
                  try:
                      text = raw.decode('utf-8')
                  except UnicodeDecodeError:
                      raise ValueError('O arquivo não é UTF-8 válido; edite com apply_patch ou write_binary.')
                  original = text
                  crlf = '\r\n' in text and text.count('\r\n') >= 0.9 * text.count('\n')
                  for i, e in enumerate(edits, 1):
                      old, new = e.get('old'), e.get('new')
                      if not isinstance(old, str) or not old or not isinstance(new, str):
                          raise ValueError(f'edit #{i}: `old` (não vazio) e `new` precisam ser strings.')
                      if old == new:
                          raise ValueError(f'edit #{i}: `old` e `new` são idênticos.')
                      if crlf:
                          old = old.replace('\r\n', '\n').replace('\n', '\r\n')
                          new = new.replace('\r\n', '\n').replace('\n', '\r\n')
                      count = text.count(old)
                      if e.get('replace_all'):
                          if count == 0:
                              raise ValueError(f'edit #{i}: texto não encontrado.')
                      else:
                          expected = int(e.get('expected_count', 1))
                          if count != expected:
                              hint = ' Inclua mais contexto em `old` para torná-lo único.' if count > expected else ' Releia o arquivo: o texto pode ter mudado ou ter espaços/tabs diferentes.'
                              raise ValueError(f'edit #{i}: encontrados {count}, esperados {expected}.' + hint)
                      text = text.replace(old, new)
                  mode = stat.S_IMODE(p.stat().st_mode)
                  self.ws.backup_before_change(p)
                  data = text.encode('utf-8')
                  self._atomic_write(p, data, mode)
                  self.s.mark_edit(rel)
                  r = {'ok': file_hash(p) == hashlib.sha256(data).hexdigest(), 'file': a['path'], 'edits_applied': len(edits),
                       'sha256': file_hash(p), 'backup_recorded': True, 'diff_preview': self._diff_preview(rel, original, text)}
                  chk = self._post_check(rel)
                  if chk:
                      r['post_edit_check'] = chk
                  return r

              def t_write_binary(self, a):
                  p = self.ws.safe_path(a['path'])
                  raw = a['content']
                  if not isinstance(raw, str) or len(raw) > 7_000_000:
                      raise ValueError('Base64 ausente ou acima do limite por ação.')
                  rel = self.ws.rel(p)
                  if p.exists():
                      if not p.is_file():
                          raise ValueError('O caminho existe e não é arquivo regular.')
                      self.s.require_fresh_read(rel)
                  data = base64.b64decode(raw, validate=True)
                  mode = stat.S_IMODE(p.stat().st_mode) if p.exists() else None
                  self.ws.backup_before_change(p)
                  self._atomic_write(p, data, mode)
                  digest = hashlib.sha256(data).hexdigest()
                  self.s.mark_edit(rel)
                  return {'ok': file_hash(p) == digest, 'written': a['path'], 'bytes': len(data), 'sha256': digest, 'backup_recorded': True}

              def t_delete_file(self, a):
                  p = self.ws.safe_path(a['path'])
                  if not p.is_file():
                      raise ValueError('Somente arquivos regulares podem ser removidos.')
                  rel = self.ws.rel(p)
                  self.s.require_fresh_read(rel)
                  self.ws.backup_before_change(p)
                  p.unlink()
                  self.s.mark_edit(None)
                  self.s.touched.add(rel)
                  return {'ok': True, 'deleted': a['path'], 'backup_recorded': True}

              def t_move_file(self, a):
                  src, dst = self.ws.safe_path(a['source']), self.ws.safe_path(a['destination'])
                  if not src.is_file() or dst.exists():
                      raise ValueError('Origem inválida ou destino já existe.')
                  self.s.require_fresh_read(self.ws.rel(src))
                  self.ws.backup_before_change(src)
                  self.ws.backup_before_change(dst)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.move(str(src), str(dst))
                  self.s.mark_edit(self.ws.rel(dst))
                  self.s.touched.add(self.ws.rel(src))
                  return {'ok': dst.is_file() and not src.exists(), 'moved_from': a['source'], 'moved_to': a['destination'], 'backup_recorded': True}

              def t_rollback_file(self, a):
                  rel = self.ws.rel(self.ws.safe_path(a['path']))
                  r = self.ws.restore_backup(rel)
                  self.s.mark_edit(rel if (self.ws.project / rel).exists() else None)
                  return r

              def t_apply_patch(self, a):
                  patch = a['patch']
                  if not isinstance(patch, str) or not patch or len(patch) > 2_000_000:
                      raise ValueError('Patch vazio ou acima de 2 MB.')
                  if re.search(r'(?m)^(Index:|\*\*\* )', patch):
                      raise ValueError('Formato não suportado (Index:/context diff). Envie um unified diff (`diff -u` / `git diff`).')
                  if re.search(r'(?m)^((new|old|deleted) file mode|new mode|old mode) 120000|^(rename|copy) (from|to) ', patch):
                      raise ValueError('Patch com symlink, rename ou copy não é aceito; use move_file/write_file.')
                  headers = patch_targets(patch)
                  if not headers:
                      raise ValueError('Patch sem cabeçalhos Unified Diff válidos.')
                  names = [h for h in headers if h != '/dev/null']
                  prefixed = all(re.match(r'^[ab]/', h) for h in names)
                  strip = 1 if prefixed else 0
                  rels = []
                  for h in names:
                      rel = valid_rel(h[2:] if prefixed else h).as_posix()
                      target = self.ws.safe_path(rel)
                      if target.exists():
                          if not target.is_file():
                              raise ValueError('Alvo do patch não é arquivo regular: ' + rel)
                          self.s.require_fresh_read(rel)
                      self.ws.backup_before_change(target)
                      if rel not in rels:
                          rels.append(rel)
                  exe = shutil.which('patch')
                  if not exe:
                      raise RuntimeError('Utilitário patch indisponível.')
                  with tempfile.NamedTemporaryFile('w', encoding='utf-8', delete=False) as f:
                      f.write(patch)
                      pf = f.name
                  try:
                      base = [exe, '--batch', '--forward', '--no-backup-if-mismatch', '-r', '-', f'-p{strip}', '-i', pf]
                      check = run_host([base[0], '--dry-run', *base[1:]], self.ws.project, 60)
                      if not check.get('ok'):
                          return {'ok': False, 'error': 'Patch recusado na validação (nada foi alterado): ' + check.get('output', '')[-2500:]}
                      result = run_host(base, self.ws.project, 60)
                  finally:
                      Path(pf).unlink(missing_ok=True)
                  if result.get('ok'):
                      for rel in rels:
                          self.s.mark_edit(rel if (self.ws.project / rel).exists() else None)
                          self.s.touched.add(rel)
                  r = {'ok': result.get('ok', False), 'files': rels, 'output': result.get('output', '')[-1500:]}
                  for rel in rels:
                      chk = self._post_check(rel) if (self.ws.project / rel).is_file() else None
                      if chk and chk['status'] == 'FAIL':
                          r.setdefault('post_edit_check', {})[rel] = chk
                  return r

              def t_extract_zip(self, a):
                  p = self.ws.safe_path(a['path'])
                  dest = self.ws.safe_path(a.get('destination') or 'extracted')
                  if not p.is_file() or not zipfile.is_zipfile(p):
                      raise ValueError('ZIP inválido.')
                  if dest.exists() and any(dest.iterdir()):
                      raise ValueError('Destino não vazio.')
                  staging = dest.with_name(dest.name + '.meva-extract-staging')
                  if staging.exists():
                      shutil.rmtree(staging)
                  staging.mkdir(parents=True, exist_ok=True)
                  count, total, seen = 0, 0, set()
                  try:
                      with zipfile.ZipFile(p) as z:
                          if len(z.infolist()) > 10000:
                              raise ValueError('ZIP interno acima de 10000 entradas.')
                          for info in z.infolist():
                              raw = info.filename.rstrip('/')
                              if not raw:
                                  continue
                              rel = valid_rel(raw)
                              name = rel.as_posix()
                              if name in seen:
                                  raise ValueError('Entrada duplicada no ZIP interno.')
                              seen.add(name)
                              mode = (info.external_attr >> 16) & 0xffff
                              if stat.S_IFMT(mode) not in (0, stat.S_IFREG, stat.S_IFDIR):
                                  raise ValueError('ZIP interno contém link/arquivo especial.')
                              total += info.file_size
                              if total > MAX_UNPACKED or info.file_size > MAX_FILE:
                                  raise ValueError('ZIP interno acima dos limites.')
                              if info.file_size and info.compress_size and info.file_size / max(1, info.compress_size) > 500:
                                  raise ValueError('Taxa de compressão ZIP suspeita (>500:1): ' + name)
                              self.ws.backup_before_change(dest.joinpath(*rel.parts))
                              target = staging.joinpath(*rel.parts)
                              target.parent.mkdir(parents=True, exist_ok=True)
                              if info.is_dir():
                                  target.mkdir(parents=True, exist_ok=True)
                                  continue
                              n = 0
                              with z.open(info) as src, target.open('wb') as out:
                                  for b in iter(lambda: src.read(1024 * 1024), b''):
                                      n += len(b)
                                      if n > info.file_size or n > MAX_FILE:
                                          raise ValueError('Entrada ZIP excedeu o tamanho declarado.')
                                      out.write(b)
                              if n != info.file_size:
                                  raise ValueError('Entrada ZIP incompleta.')
                              count += 1
                      if dest.exists():
                          dest.rmdir()
                      staging.rename(dest)
                  except Exception:
                      shutil.rmtree(staging, ignore_errors=True)
                      raise
                  self.s.mark_exec_writable(code_edit=True)
                  return {'ok': True, 'extracted_files': count, 'unpacked_bytes': total, 'destination': a.get('destination') or 'extracted', 'atomic_promotion': True}

              def t_update_memory(self, a):
                  content = a['content']
                  if not isinstance(content, str) or len(content) > 20000:
                      raise ValueError('Memória inválida ou acima de 20 KB.')
                  m = self.cfg.memory_path
                  if m.is_symlink():
                      raise ValueError('MEVA.md é um symlink; recusado.')
                  self.ws.backup_before_change(m)
