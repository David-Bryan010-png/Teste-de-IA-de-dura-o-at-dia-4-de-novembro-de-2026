              r'^(make|gmake|cmake|ninja|meson|cargo|go|gcc|g\+\+|clang(\+\+)?|[\w.-]*-(gcc|g\+\+|ld|as)|ld(\.lld)?|as|npm|yarn|pnpm|'
              r'gradle|gradlew|mvn|tsc|bazel|dtc|bison|flex|configure|autoreconf|rustc|javac|kotlinc|ndk-build|pip3?|python3?)$')
          _TEST_TOOLS = re.compile(r'^(pytest|ctest|unittest|tox)$')


          def looks_like_build(command: str) -> bool:
              """O primeiro comando real precisa ser uma ferramenta de build (ou script build/make/compile); echo/true/exit 0 não valem."""
              import shlex
              try:
                  toks = shlex.split(command)
              except ValueError:
                  return False
              while toks and (re.match(r'^[A-Za-z_]\w*=', toks[0]) or toks[0] in ('env', 'time', 'nice')):
                  toks.pop(0)
              if not toks:
                  return False
              first = toks[0].rsplit('/', 1)[-1]
              if _BUILD_TOOLS.match(first):
                  if first.startswith('python') or first.startswith('pip'):
                      return any(t in ('build', 'setup.py', 'install', 'wheel') or t.endswith('setup.py') for t in toks[1:4])
                  return True
              return first.endswith(('.sh', '')) and bool(re.search(r'build|make|compile', first, re.I)) and first not in ('echo', 'true', 'false', 'exit')


          def looks_like_test_runner(command: str) -> bool:
              import shlex
              try:
                  toks = shlex.split(command)
              except ValueError:
                  return False
              if not toks:
                  return False
              first = toks[0].rsplit('/', 1)[-1]
              rest = ' '.join(toks[1:4])
              return bool(_TEST_TOOLS.match(first) or re.match(r'^python3?$', first) and re.search(r'-m\s+(pytest|unittest)', rest)
                          or first in ('make', 'npm', 'yarn', 'pnpm', 'cargo', 'go') and re.search(r'\b(test|check)\b', rest))


          def _obj(props: dict, required=()):
              return {'type': 'object', 'properties': props, 'required': list(required), 'additionalProperties': False}


          S = {'type': 'string'}
          INT = {'type': 'integer'}
          BOOL = {'type': 'boolean'}


          class Spec:
              def __init__(self, name, description, schema, kind, parallel=False):
                  self.name, self.description, self.schema, self.kind, self.parallel = name, description, schema, kind, parallel

              def as_tool(self) -> dict:
                  return {'name': self.name, 'description': self.description, 'input_schema': self.schema}


          def patch_targets(patch: str) -> list[str]:
              """Caminhos dos cabeçalhos ---/+++ de verdade, ignorando linhas de corpo de hunk (ex.: '--- comentario')."""
              lines, names, i = patch.split('\n'), [], 0
              while i < len(lines):
                  if lines[i].startswith('--- ') and i + 1 < len(lines) and lines[i + 1].startswith('+++ '):
                      names += [lines[i][4:].split('\t')[0].strip(), lines[i + 1][4:].split('\t')[0].strip()]
                      i += 2
                      while i < len(lines) and lines[i].startswith('@@'):
                          m = re.match(r'@@ -\d+(?:,(\d+))? \+\d+(?:,(\d+))? @@', lines[i])
                          if not m:
                              break
                          old = int(m.group(1)) if m.group(1) is not None else 1
                          new = int(m.group(2)) if m.group(2) is not None else 1
                          i += 1
                          while i < len(lines) and (old > 0 or new > 0):
                              c = lines[i][:1]
                              if c in (' ', ''):
                                  old, new = old - 1, new - 1
                              elif c == '-':
                                  old -= 1
                              elif c == '+':
                                  new -= 1
                              elif c != '\\':
                                  break
                              i += 1
                          while i < len(lines) and lines[i].startswith('\\'):
                              i += 1
                      continue
                  i += 1
              return names


          def glob_regex(pat: str) -> re.Pattern:
              i, res = 0, ''
              while i < len(pat):
                  c = pat[i]
                  if c == '*':
                      if pat[i:i + 3] == '**/':
                          res += '(?:.*/)?'
                          i += 3
                          continue
                      if pat[i:i + 2] == '**':
                          res += '.*'
                          i += 2
                          continue
                      res += '[^/]*'
                  elif c == '?':
                      res += '[^/]'
                  elif c in '.^$+{}()|\\':
                      res += '\\' + c
                  else:
                      res += c
                  i += 1
              return re.compile('^' + res + '$')


