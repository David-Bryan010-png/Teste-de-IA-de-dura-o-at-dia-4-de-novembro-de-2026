          cat > /tmp/meva-v15.py <<'PY'
          import base64, difflib, hashlib, json, os, re, shlex, shutil, stat, subprocess, sys, time, urllib.error, urllib.parse, urllib.request, zipfile
          from pathlib import Path, PurePosixPath

