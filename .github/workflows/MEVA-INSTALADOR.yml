              def test_shell_command_has_pipes_and_expansion(self):
                  r = self.tb.call('run_shell', {'command': 'cd empty && echo $((2+3)) | tr 5 X; false || echo fim'})
                  self.assertTrue(r['ok'])
                  self.assertIn('X', r['output'])
