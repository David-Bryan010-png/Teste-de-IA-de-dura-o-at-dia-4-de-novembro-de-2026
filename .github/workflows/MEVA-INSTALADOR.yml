          """Configuração do agente a partir das variáveis de ambiente do workflow."""
          from __future__ import annotations

          import os
          from dataclasses import dataclass, field
          from pathlib import Path

          KEY_ENV = {'nvidia': 'NVIDIA_API_KEY', 'claude': 'ANTHROPIC_API_KEY', 'openai': 'OPENAI_API_KEY', 'xai': 'XAI_API_KEY'}
          SEARCH_ENV = {'tavily': 'TAVILY_API_KEY', 'brave': 'BRAVE_API_KEY'}
          WRITE_MODES = ('agent', 'linux_zip', 'resume')


          @dataclass
          class Config:
              root: Path
              cid: str = 'run'
              mode: str = 'agent'
              user: str = ''
              autonomy: str = 'ask'
              requested_provider: str = 'auto'
              requested_model: str = ''
              allow_build: bool = False
              sandbox_network: bool = False
              max_actions: int = 60
              gh_repo: str = ''
              gh_token: str = ''
              attachments: str = ''
              upload_ref: str = ''
              verify: bool = True
              context_tokens: int = 120000
              api_keys: dict = field(default_factory=dict)
              search_keys: dict = field(default_factory=dict)

              def __post_init__(self):
                  self.root = Path(self.root).resolve()
                  if self.mode == 'chat':
                      self.autonomy = 'safe'
                  self.max_actions = max(1, min(80, int(self.max_actions)))

              @property
              def work(self) -> Path:
                  return self.root / 'meva-workspace'

              @property
              def project(self) -> Path:
                  return self.work / 'linux-project'

              @property
              def inbox(self) -> Path:
                  return self.work / 'incoming'

              @property
              def state_path(self) -> Path:
                  return self.root / 'meva-data' / 'conversations' / (self.cid + '.json')

              @property
              def checkpoint_path(self) -> Path:
                  return self.root / 'meva-data' / 'checkpoints' / (self.cid + '.json')

              @property
              def memory_path(self) -> Path:
                  return self.project / 'MEVA.md'

              @property
              def write_allowed(self) -> bool:
                  return self.autonomy == 'auto' and self.mode in WRITE_MODES

              @property
              def deadline_seconds(self) -> int:
                  return 105 * 60 if self.mode in WRITE_MODES else 12 * 60


          def load_config(env=None, pop_secrets: bool = True) -> Config:
              env = os.environ if env is None else env
              api_keys = {k: env.get(k, '') for k in KEY_ENV.values()}
              search_keys = {k: env.get(k, '') for k in SEARCH_ENV.values()}
              gh_token = env.get('GH_TOKEN', '')
              cfg = Config(
                  root=Path.cwd(),
                  cid=env.get('CID', 'run') or 'run',
