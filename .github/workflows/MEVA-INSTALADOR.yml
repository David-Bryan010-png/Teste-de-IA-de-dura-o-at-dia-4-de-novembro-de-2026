          def is_secret_path(parts):
              for part in parts:
                  low=part.lower()
                  if low in SECRET_NAMES or low.startswith('.env.') or low.endswith(tuple(SECRET_SUFFIXES)):
                      return True
              return False

          def clean_zip_name(name):
              if not isinstance(name,str) or not name or '\x00' in name or '\\' in name: raise ValueError('Caminho ZIP inválido.')
              q=PurePosixPath(name)
              if q.is_absolute() or re.match(r'^[A-Za-z]:',name) or any(p in ('..','.') for p in q.parts): raise ValueError('ZIP contém caminho absoluto ou traversal: '+name[:160])
              if not q.parts: raise ValueError('Entrada ZIP sem caminho.')
              return q

          def unzip_project(zip_path):
              stage=WORK/'staging'
              if stage.exists(): shutil.rmtree(stage)
              stage.mkdir(parents=True)
              with zipfile.ZipFile(zip_path) as z:
                  infos=z.infolist()
