              report=['# MEVA V15 — Relatório de engenharia Linux','',f'- Estado: {"PARCIAL / COM ERRO" if error else "EXECUÇÃO CONCLUÍDA"}',f'- Modelo: {PROVIDER}',f'- Modo: {MODE}',f'- Autonomia: {AUTONOMY}',f'- Build autorizado: {ALLOW_BUILD}',f'- Ações tentadas: {actions}',f'- Ações com erro: {len(failed)}',f'- Arquivos regulares no projeto: {len(files)}',f'- Arquivos adicionados/alterados/removidos: {len(changes)}','','## Resultado',answer]
