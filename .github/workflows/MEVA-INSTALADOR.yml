                                  raise RuntimeError('Traversal/caminho absoluto no ZIP: ' + raw[:160])
                              if strip_output:
                                  # Pacote MEVA: só o que está sob linux-project/ é projeto. Todo o resto
                                  # (MEVA-REPORT.md, MEVA-ROLLBACK/…, manifestos) é metadado e NÃO volta ao projeto.
                                  if parts[0] != 'linux-project':
                                      continue
                                  parts = parts[1:]
                                  if not parts:
                                      continue
                              if any(x.lower() in DENY_DIRS for x in parts) or secret_path(parts) or parts[-1] in ('.DS_Store', 'Thumbs.db'):
                                  continue
                              rel = PurePosixPath(*parts)
                              name = rel.as_posix()
                              if name in seen:
                                  raise RuntimeError('Entrada ZIP duplicada: ' + name)
                              seen.add(name)
