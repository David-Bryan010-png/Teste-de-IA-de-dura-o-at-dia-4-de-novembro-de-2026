name: MEVA V5 — anexos grandes, memória e agente de programação
run-name: MEVA / ${{ inputs.mode || 'install' }} / ${{ inputs.conversation_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operação da MEVA
        type: choice
        options:
          - install
          - chat
          - agent
          - self_test
        default: install
        required: true
      message:
        description: Mensagem ou tarefa para a IA (máximo 6000 caracteres)
        type: string
        required: false
        default: ''
      conversation_id:
        description: ID da conversa gerado pelo painel
        type: string
        required: false
        default: ''
      branch:
        description: Branch do projeto (vazio usa a branch selecionada)
        type: string
        required: false
        default: ''
      max_actions:
        description: Limite de ferramentas do agente (1 a 12)
        type: number
        required: false
        default: 12

permissions:
  contents: read

concurrency:
  group: meva-${{ github.repository }}-${{ inputs.conversation_id || github.run_id }}
  cancel-in-progress: false

env:
  MODEL_REPO: Qwen/Qwen2.5-Coder-3B-Instruct-GGUF
  MODEL_FILE: qwen2.5-coder-3b-instruct-q4_k_m.gguf
  MODEL_CACHE_VERSION: qwen25-coder-3b-q4km-v2
  LLAMA_CACHE_VERSION: llama-cpp-server-v2
  MODEL_ID: Qwen2.5-Coder-3B-Instruct-Q4_K_M

jobs:
  install:
    name: Gerar interface, prompts e publicar Pages
    if: ${{ inputs.mode == 'install' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Exigir branch padrão
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Execute a instalação na branch padrão: $DEFAULT_BRANCH" >&2
            exit 1
          fi

      - name: Gerar painel, instruções e documentação
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public meva-config meva-data/conversations
          touch meva-data/conversations/.gitkeep
          
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#0a1020">
            <meta name="description" content="MEVA — assistente de IA, conversa, memória e agente de programação.">
            <link rel="manifest" href="./manifest.webmanifest">
            <link rel="icon" href="./icon.svg" type="image/svg+xml">
            <link rel="stylesheet" href="./styles.css">
            <title>MEVA — Inteligência Artificial</title>
          </head>
          <body>
            <main class="app-shell">
              <header class="topbar">
                <div class="brand"><div class="brand-icon">M</div><div><div class="brand-name">MEVA</div><div class="brand-caption">INTELIGÊNCIA ARTIFICIAL · QWEN LOCAL NO RUNNER</div></div></div>
                <span id="connection" class="connection">DESCONECTADA</span>
              </header>
          
              <section id="login" class="panel login">
                <div class="eyebrow">ACESSO AO REPOSITÓRIO</div>
                <h1>Conectar à MEVA</h1>
                <p class="muted">Cada participante deve usar seu próprio Fine-grained Personal Access Token, restrito a este repositório, com <b>Actions: Read and write</b>, <b>Contents: Read and write</b> e Metadata: Read-only. O painel publica anexos como ativos de GitHub Releases e os baixa temporariamente no runner. Use somente arquivos públicos e não confidenciais. O token fica temporariamente em sessionStorage; isso não o torna invulnerável a scripts da página. Use um token restrito, não o compartilhe e desconecte ao terminar.</p>
                <form id="loginForm" class="stack">
                  <label for="token">Token pessoal do GitHub</label>
                  <input id="token" type="password" autocomplete="off" placeholder="github_pat_…" required>
                  <button class="primary" type="submit">Conectar</button>
                  <p id="loginStatus" class="status-text" role="status"></p>
                </form>
                <div class="public-warning"><b>Repositório público:</b> mensagens, respostas, memória, anexos enviados, arquivos alterados e logs podem ser vistos por outras pessoas. Os anexos são publicados em Releases públicas e não entram no histórico Git. Até 5 arquivos, 200 MB por arquivo e 500 MB por envio; apenas texto UTF-8. Não envie senhas, tokens, chaves, endereços ou dados privados.</div>
              </section>
          
              <section id="workspace" class="panel workspace hidden">
                <div class="workspace-head">
                  <div><div class="eyebrow">ASSISTENTE SOB DEMANDA</div><h1>Conversa com a MEVA</h1><p id="repoInfo" class="muted"></p></div>
                  <button id="newChat" class="secondary" type="button">＋ Nova</button>
                </div>
                <div class="controls">
                  <label for="mode">Modo</label>
                  <select id="mode"><option value="chat">Conversa normal</option><option value="agent">Agente de programação</option></select>
                  <label for="branch">Branch</label>
                  <input id="branch" value="main" autocomplete="off">
                </div>
                <div class="conversation-tools">
                  <label for="savedChats">Conversas salvas</label>
                  <select id="savedChats"><option value="">Selecione uma conversa…</option></select>
                  <button id="shareChat" class="ghost" type="button">Copiar link</button>
                </div>
                <div class="public-note"><b>Memória pública:</b> a MEVA salva o histórico no repositório. Cada mensagem inicia um workflow e pode levar alguns minutos. O modelo é baixado durante a instalação e guardado no cache do GitHub Actions; a inferência só ocorre quando você envia uma mensagem. O modelo não fica ligado continuamente.</div>
                <div id="messages" class="messages" aria-live="polite"><div class="welcome"><div class="welcome-icon">M</div><h2>Como posso ajudar?</h2><p>Faça uma pergunta ou escolha o agente para analisar e trabalhar nos arquivos do projeto.</p></div></div>
                <form id="composer" class="composer">
                  <div class="attachment-panel">
                    <label for="attachments">Anexar arquivos — até 200 MB por arquivo</label>
                    <input id="attachments" type="file" multiple accept=".txt,.md,.json,.yaml,.yml,.xml,.html,.htm,.css,.js,.mjs,.cjs,.ts,.tsx,.jsx,.py,.sh,.bash,.c,.h,.cpp,.hpp,.rs,.go,.java,.kt,.gradle,.properties,.toml,.ini,.cfg,.cmake,.sql,.csv,.svg,.log,.diff,.patch,.rb,.php,.swift,.dart,.lua,.pl,.r,.ipynb,.sln,.csproj,.cs,.xaml,.bat,.ps1,.make,.mk,.dockerfile,.gitignore,.editorconfig,.webmanifest">
                    <div id="attachmentList" class="attachment-list">Nenhum arquivo selecionado. Até 5 arquivos de texto UTF-8, 200 MB cada e 500 MB no total. Binários não são aceitos. Upload por GitHub Release; anexos não entram no Git.</div>
                  </div>
                  <textarea id="message" rows="3" maxlength="6000" placeholder="Escreva sua mensagem para a MEVA… (Enter envia, Shift+Enter quebra linha)"></textarea>
                  <div class="composer-footer"><span class="muted small">Até 6.000 caracteres</span><button id="send" class="primary send" type="submit">Enviar ↗</button></div>
                </form>
                <div id="taskStatus" class="task-status" role="status">Pronta para receber uma mensagem.</div>
                <div class="footer-actions"><button id="refresh" class="ghost" type="button">Atualizar conversa</button><a id="actionsLink" href="https://github.com" target="_blank" rel="noopener noreferrer">Ver execuções</a><button id="logout" class="ghost danger" type="button">Desconectar</button></div>
              </section>
              <footer>MEVA V5 · Qwen2.5-Coder 3B · agente de programação · GitHub Actions</footer>
            </main>
            <script src="./app.js"></script>
          </body>
          </html>
          HTML
          
          cat > public/app.js <<'JAVASCRIPT'
          "use strict";
          
          const $ = (id) => document.getElementById(id);
          const TOKEN_KEY = "meva_pat_session";
          const REPO_KEY = "meva_repo";
          const CHAT_KEY = "meva_chat_id";
          const WORKFLOW = "MEVA-INSTALADOR.yml";
          const MAX_WAIT_MS = 48 * 60 * 1000;
          let repo = "";
          let owner = "";
          let repoName = "";
          let defaultBranch = "main";
          let chatId = "";
          let chatMessages = [];
          let busy = false;
          
          function repoFromPage() {
            const cached = sessionStorage.getItem(REPO_KEY);
            if (cached && /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(cached)) return cached;
            const host = location.hostname;
            if (!host.endsWith(".github.io")) return "";
            const user = host.slice(0, -".github.io".length);
            const firstPath = location.pathname.split("/").filter(Boolean)[0];
            const project = firstPath || `${user}.github.io`;
            const found = `${user}/${project}`;
            sessionStorage.setItem(REPO_KEY, found);
            return found;
          }
          
          function parts() {
            if (!owner || !repoName) throw new Error("Repositório não identificado.");
            return [owner, repoName];
          }
          
          function status(text, kind = "") {
            const el = $("taskStatus");
            el.textContent = text;
            el.className = `task-status ${kind}`.trim();
          }
          
          function loginStatus(text, kind = "") {
            const el = $("loginStatus");
            el.textContent = text;
            el.className = `status-text ${kind}`.trim();
          }
          
          async function github(path, options = {}) {
            const token = sessionStorage.getItem(TOKEN_KEY);
            if (!token) throw new Error("Sessão desconectada. Conecte novamente.");
            const headers = {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${token}`,
              "X-GitHub-Api-Version": "2022-11-28",
              ...(options.body ? { "Content-Type": "application/json" } : {}),
              ...(options.headers || {})
            };
            const response = await fetch(`https://api.github.com${path}`, { ...options, headers });
            if (response.status === 204) return null;
            const raw = await response.text();
            if (!response.ok) {
              let detail = raw;
              try { detail = JSON.parse(raw).message || raw; } catch (_) {}
              throw new Error(`${response.status}: ${String(detail).slice(0, 240)}`);
            }
            return raw ? JSON.parse(raw) : null;
          }
          
          function render() {
            const root = $("messages");
            root.replaceChildren();
            if (!chatMessages.length) {
              const box = document.createElement("div"); box.className = "welcome";
              const icon = document.createElement("div"); icon.className = "welcome-icon"; icon.textContent = "M";
              const title = document.createElement("h2"); title.textContent = "Como posso ajudar?";
              const description = document.createElement("p"); description.textContent = "A conversa começa quando você enviar a primeira mensagem.";
              box.append(icon, title, description); root.appendChild(box); return;
            }
            for (const item of chatMessages) {
              const article = document.createElement("article");
              article.className = `bubble ${item.role === "user" ? "from-user" : "from-meva"}`;
              const role = document.createElement("div"); role.className = "bubble-role";
              role.textContent = item.role === "user" ? "VOCÊ" : "MEVA";
              const content = document.createElement("div"); content.className = "bubble-content";
              const messageText = String(item.content || "");
              const urlPattern = /https:\/\/[^\s<>"']+/g;
              let cursor = 0;
              for (const match of messageText.matchAll(urlPattern)) {
                const rawUrl = match[0];
                const cleanUrl = rawUrl.replace(/[.,;:!?)}\]]+$/, "");
                const start = match.index;
                if (start > cursor) content.appendChild(document.createTextNode(messageText.slice(cursor, start)));
                try {
                  const parsedUrl = new URL(cleanUrl);
                  if (parsedUrl.protocol === "https:") {
                    const link = document.createElement("a");
                    link.href = parsedUrl.href; link.target = "_blank"; link.rel = "noopener noreferrer";
                    link.textContent = cleanUrl; content.appendChild(link);
                    content.appendChild(document.createTextNode(rawUrl.slice(cleanUrl.length)));
                  } else content.appendChild(document.createTextNode(rawUrl));
                } catch (_) { content.appendChild(document.createTextNode(rawUrl)); }
                cursor = start + rawUrl.length;
              }
              if (cursor < messageText.length) content.appendChild(document.createTextNode(messageText.slice(cursor)));
              article.append(role, content); root.appendChild(article);
            }
            root.scrollTop = root.scrollHeight;
          }
          
          function validChatId(value) { return /^[A-Za-z0-9_-]{8,80}$/.test(value); }
          function newConversation() {
            chatId = crypto.randomUUID();
            localStorage.setItem(CHAT_KEY, chatId);
            const url = new URL(location.href);
            url.searchParams.set("conversation", chatId);
            history.replaceState({}, "", url);
            chatMessages = [];
            render();
            status("Nova conversa criada. Envie uma mensagem para começar.");
          }
          
          async function loadConversationList() {
            const [o, r] = parts();
            const branch = $("branch").value.trim() || defaultBranch;
            const select = $("savedChats");
            const current = chatId;
            const data = await github(`/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}/contents/meva-data/conversations?ref=${encodeURIComponent(branch)}`);
            select.replaceChildren();
            const first = document.createElement("option"); first.value = ""; first.textContent = "Selecione uma conversa…"; select.appendChild(first);
            const files = Array.isArray(data) ? data.filter(x => x.type === "file" && /^[-A-Za-z0-9_]{8,80}\.json$/.test(x.name)).slice(0, 100) : [];
            for (const file of files) {
              const option = document.createElement("option");
              option.value = file.name.slice(0, -5);
              option.textContent = file.name.slice(0, -5);
              select.appendChild(option);
            }
            select.value = current;
          }
          
          function decodeBase64Utf8(value) {
            const binary = atob(String(value || "").replace(/\s/g, ""));
            const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
            return new TextDecoder().decode(bytes);
          }
          
          async function loadConversation() {
            if (!validChatId(chatId)) { chatMessages = []; render(); return; }
            const [o, r] = parts();
            const branch = $("branch").value.trim() || defaultBranch;
            const path = `meva-data/conversations/${chatId}.json`;
            let data;
            try {
              data = await github(`/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}/contents/${path}?ref=${encodeURIComponent(branch)}`);
            } catch (error) {
              if (String(error.message).startsWith("404:")) {
                chatMessages = [];
                render();
                return;
              }
              throw error;
            }
            const parsed = JSON.parse(decodeBase64Utf8(data.content));
            chatMessages = Array.isArray(parsed.messages) ? parsed.messages.filter(x => x && ["user", "assistant"].includes(x.role) && typeof x.content === "string") : [];
            render();
            await loadConversationList().catch(() => {});
          }
          
          async function connect() {
            const [o, r] = parts();
            const info = await github(`/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}`);
            defaultBranch = info.default_branch || "main";
            repo = info.full_name;
            owner = info.owner.login;
            repoName = info.name;
            $("repoInfo").textContent = `${repo} · branch padrão: ${defaultBranch}`;
            const query = new URLSearchParams(location.search);
            const shared = query.get("conversation");
            chatId = validChatId(shared) ? shared : (localStorage.getItem(CHAT_KEY) || "");
            if (!validChatId(chatId)) newConversation(); else localStorage.setItem(CHAT_KEY, chatId);
            $("branch").value = query.get("branch") || defaultBranch;
            $("actionsLink").href = `https://github.com/${owner}/${repo}/actions/workflows/${WORKFLOW}`;
            $("connection").textContent = "CONECTADA";
            $("connection").classList.add("online");
            $("login").classList.add("hidden");
            $("workspace").classList.remove("hidden");
            await loadConversation().catch(error => status(`Histórico ainda não disponível: ${error.message}`));
            await loadConversationList().catch(() => {});
          }
          
          $("loginForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const button = event.submitter;
            const token = $("token").value.trim();
            if (!token) return;
            button.disabled = true; button.textContent = "Verificando…";
            sessionStorage.setItem(TOKEN_KEY, token);
            try { await connect(); $("token").value = ""; }
            catch (error) { sessionStorage.removeItem(TOKEN_KEY); loginStatus(`Falha na conexão: ${error.message}`, "error"); }
            finally { button.disabled = false; button.textContent = "Conectar"; }
          });
          
          async function getRuns() {
            const [o, r] = parts();
            const result = await github(`/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}/actions/workflows/${encodeURIComponent(WORKFLOW)}/runs?event=workflow_dispatch&per_page=50`);
            return result.workflow_runs || [];
          }
          
          const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
          async function waitForCurrentRun(previousIds, startedAt) {
            const [o, r] = parts();
            const end = Date.now() + MAX_WAIT_MS;
            let run = null;
            while (Date.now() < end) {
              const runs = await getRuns();
              const targetBranch = $("branch").value.trim() || defaultBranch;
              run = runs.find(item => !previousIds.has(item.id) && item.head_branch === targetBranch && Date.parse(item.created_at) >= startedAt - 20000 && String(item.display_title || "").includes(chatId));
              if (run) {
                const detail = await github(`/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}/actions/runs/${run.id}`);
                status(`MEVA está trabalhando · execução #${run.run_number} · ${detail.status}${detail.status === "completed" ? ` / ${detail.conclusion}` : ""}`);
                if (detail.status === "completed") {
                  if (detail.conclusion !== "success") throw new Error(`Execução #${run.run_number} terminou com ${detail.conclusion}. Abra os logs em GitHub → Actions.`);
                  return run;
                }
              } else status("Solicitação enviada. Esperando o GitHub iniciar o modelo…");
              await wait(9000);
            }
            throw new Error("O painel deixou de esperar. A execução pode continuar; use Atualizar conversa ou Ver execuções.");
          }
          
          const MAX_ATTACHMENT_BYTES = 200 * 1024 * 1024;
          const MAX_TOTAL_ATTACHMENT_BYTES = 500 * 1024 * 1024;
          const ALLOWED_ATTACHMENT = /\.(txt|md|json|ya?ml|xml|html?|css|m?js|cjs|tsx?|jsx|py|sh|bash|c|h|cpp|hpp|rs|go|java|kt|gradle|properties|toml|ini|cfg|cmake|sql|csv|svg|log|diff|patch|rb|php|swift|dart|lua|pl|r|ipynb|sln|csproj|cs|xaml|bat|ps1|mk|webmanifest|gitignore|editorconfig)$/i;

          function safeAttachmentName(name) {
            const cleaned = String(name || "arquivo.txt").normalize("NFKC")
              .replace(/[/\\]/g, "_").replace(/[^A-Za-z0-9._-]/g, "_")
              .replace(/^\.+/, "").slice(0, 100);
            if (!cleaned || cleaned === "." || cleaned === ".." || !ALLOWED_ATTACHMENT.test(cleaned))
              throw new Error(`Tipo de arquivo não aceito: ${name}. Envie arquivos de texto/código suportados.`);
            return cleaned;
          }

          async function createAttachmentRelease(files) {
            const [o, r] = parts();
            const stamp = Date.now();
            const tag = `meva-upload-${chatId}-${stamp}`;
            const release = await github(`/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}/releases`, {
              method: "POST",
              body: JSON.stringify({
                tag_name: tag,
                name: `MEVA anexos ${chatId} ${new Date(stamp).toISOString()}`,
                body: "Anexos enviados pelo painel MEVA. Arquivos públicos; não incluir segredos.",
                draft: false,
                prerelease: true
              })
            });
            const uploaded = [];
            for (let index = 0; index < files.length; index++) {
              const file = files[index];
              const name = `${String(index + 1).padStart(2, "0")}-${safeAttachmentName(file.name)}`;
              const uploadBase = String(release.upload_url || "").replace(/\{\?name,label\}$/, "");
              if (!uploadBase.startsWith("https://uploads.github.com/"))
                throw new Error("GitHub não retornou um endereço válido para enviar os anexos.");
              const uploadUrl = `${uploadBase}?name=${encodeURIComponent(name)}`;
              const token = sessionStorage.getItem(TOKEN_KEY);
              const raw = await new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open("POST", uploadUrl, true);
                xhr.setRequestHeader("Accept", "application/vnd.github+json");
                xhr.setRequestHeader("Authorization", `Bearer ${token}`);
                xhr.setRequestHeader("X-GitHub-Api-Version", "2022-11-28");
                xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");
                xhr.upload.addEventListener("progress", event => {
                  if (event.lengthComputable) {
                    const percent = Math.round((event.loaded / event.total) * 100);
                    status(`Enviando ${index + 1}/${files.length}: ${file.name} · ${percent}%`);
                  }
                });
                xhr.onload = () => {
                  if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.responseText);
                  else {
                    let detail = xhr.responseText;
                    try { detail = JSON.parse(detail).message || detail; } catch (_) {}
                    reject(new Error(`HTTP ${xhr.status} — ${String(detail).slice(0, 220)}`));
                  }
                };
                xhr.onerror = () => reject(new Error("Falha de rede ou CORS ao enviar o anexo para o GitHub."));
                xhr.onabort = () => reject(new Error("Envio do anexo cancelado."));
                xhr.send(file);
              }).catch(error => { throw new Error(`Falha ao enviar ${file.name}: ${error.message}`); });
              const asset = JSON.parse(raw);
              uploaded.push({
                name,
                original_name: file.name,
                size: file.size,
                url: asset.browser_download_url
              });
              status(`Anexando ${index + 1}/${files.length}: ${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB).`);
            }
            return { tag, assets: uploaded };
          }

          $("attachments").addEventListener("change", () => {
            const files = Array.from($("attachments").files || []);
            const list = $("attachmentList");
            if (!files.length) { list.textContent = "Nenhum arquivo selecionado. Até 5 arquivos de texto UTF-8, 200 MB cada (500 MB por envio)."; return; }
            const total = files.reduce((sum, file) => sum + file.size, 0);
            list.textContent = files.slice(0, 5).map(file => `${file.name} · ${(file.size / 1024 / 1024).toFixed(2)} MB`).join("\n");
            list.textContent += `\nTotal: ${(total / 1024 / 1024).toFixed(2)} MB`;
            if (files.length > 5) list.textContent += "\nSomente os primeiros 5 serão enviados.";
            if (files.some(file => file.size > MAX_ATTACHMENT_BYTES)) list.textContent += "\nERRO: cada arquivo deve ter no máximo 200 MB.";
            if (total > MAX_TOTAL_ATTACHMENT_BYTES) list.textContent += "\nERRO: o total por envio deve ser de no máximo 500 MB.";
          });

          async function uploadAttachments() {
            const files = Array.from($("attachments").files || []).slice(0, 5);
            if (!files.length) return null;
            const total = files.reduce((sum, file) => sum + file.size, 0);
            if (files.length > 5) throw new Error("Limite de 5 arquivos por envio.");
            if (total > MAX_TOTAL_ATTACHMENT_BYTES) throw new Error("O total dos anexos ultrapassa 500 MB por envio.");
            for (const file of files) {
              safeAttachmentName(file.name);
              if (!file.size || file.size > MAX_ATTACHMENT_BYTES)
                throw new Error(`${file.name}: arquivo vazio ou maior que 200 MB.`);
              // O upload é binário em streaming pelo navegador; a validação UTF-8 ocorre no runner.
            }
            const result = await createAttachmentRelease(files);
            $("attachments").value = "";
            $("attachmentList").textContent = `Anexos enviados para a Release ${result.tag}. A MEVA vai baixá-los no runner.`;
            return result;
          }

          $("composer").addEventListener("submit", async (event) => {
            event.preventDefault();
            if (busy) return;
            const text = $("message").value.trim();
            const selectedFiles = Array.from($("attachments").files || []);
            if (!text && !selectedFiles.length) return;
            if (selectedFiles.length && !text) return status("Diga o que a MEVA deve fazer com os arquivos anexados.", "error");
            if (text.length > 6000) return status("A mensagem excede 6.000 caracteres.", "error");
            if (selectedFiles.length && text.length > 5200) return status("Com anexos, limite a instrução a 5.200 caracteres para incluir os caminhos dos arquivos.", "error");
            const branch = $("branch").value.trim() || defaultBranch;
            if (!/^[A-Za-z0-9._/-]+$/.test(branch) || branch.includes("..")) return status("Nome de branch inválido.", "error");
            const mode = selectedFiles.length ? "agent" : $("mode").value;
            if (selectedFiles.length) $("mode").value = "agent";
            const button = $("send");
            busy = true; button.disabled = true; button.textContent = "Executando…";
            const startedAt = Date.now();
            try {
              const before = await getRuns();
              const previousIds = new Set(before.map(run => run.id));
              status(selectedFiles.length ? "Enviando anexos ao repositório…" : (mode === "agent" ? "Agente de programação iniciado…" : "Preparando Qwen…"));
              const uploadedRelease = await uploadAttachments();
              const attachmentManifest = uploadedRelease ? "\n\nMEVA_ATTACHMENT_MANIFEST: " + JSON.stringify(uploadedRelease.assets) : "";
              const taskText = [text, attachmentManifest].join("").trim();
              if (!taskText) throw new Error("Escreva uma instrução para os arquivos anexados.");
              if (taskText.length > 6000) throw new Error("A instrução e os caminhos dos anexos ultrapassaram 6.000 caracteres.");
              $("message").value = "";
              chatMessages.push({ role: "user", content: taskText }); render();
              status(mode === "agent" ? "Agente iniciado. Ele vai baixar os anexos da Release, analisar e editar os arquivos permitidos." : "Preparando Qwen e gerando sua resposta…");
              const [o, r] = parts();
              await github(`/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}/actions/workflows/${encodeURIComponent(WORKFLOW)}/dispatches`, {
                method: "POST",
                body: JSON.stringify({ ref: branch, inputs: { mode, message: taskText, conversation_id: chatId, branch, max_actions: "12" } })
              });
              await waitForCurrentRun(previousIds, startedAt);
              await loadConversation();
              status("Resposta concluída. O histórico foi salvo no repositório público.", "success");
            } catch (error) {
              status(`Não foi possível concluir: ${error.message}`, "error");
              await loadConversation().catch(() => {});
            } finally {
              busy = false; button.disabled = false; button.textContent = "Enviar ↗";
            }
          });
          
          $("newChat").addEventListener("click", async () => { newConversation(); await loadConversationList().catch(() => {}); });
          $("savedChats").addEventListener("change", async () => {
            const selected = $("savedChats").value;
            if (!validChatId(selected)) return;
            chatId = selected; localStorage.setItem(CHAT_KEY, chatId);
            const url = new URL(location.href); url.searchParams.set("conversation", chatId); history.replaceState({}, "", url);
            try { await loadConversation(); status("Conversa aberta.", "success"); }
            catch (error) { status(error.message, "error"); }
          });
          $("shareChat").addEventListener("click", async () => {
            const url = new URL(location.href); url.searchParams.set("conversation", chatId); url.searchParams.set("branch", $("branch").value.trim() || defaultBranch);
            try { await navigator.clipboard.writeText(url.href); status("Link público da conversa copiado.", "success"); }
            catch (_) { status(url.href); }
          });
          $("refresh").addEventListener("click", async () => {
            try { await loadConversation(); status("Histórico atualizado.", "success"); }
            catch (error) { status(`Não foi possível atualizar: ${error.message}`, "error"); }
          });
          $("logout").addEventListener("click", () => { sessionStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(REPO_KEY); location.reload(); });
          $("message").addEventListener("keydown", event => { if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); $("composer").requestSubmit(); } });
          
          async function init() {
            const detected = repoFromPage();
            if (!detected) { loginStatus("Não consegui identificar o repositório a partir do endereço do Pages.", "error"); return; }
            [owner, repoName] = detected.split("/");
            if (sessionStorage.getItem(TOKEN_KEY)) {
              try { await connect(); }
              catch (error) { sessionStorage.removeItem(TOKEN_KEY); loginStatus(`Sessão inválida: ${error.message}`, "error"); }
            }
          }
          init();
