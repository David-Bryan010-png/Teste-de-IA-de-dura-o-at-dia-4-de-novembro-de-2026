          def xwt_static_audit():
              names=set(inventory(0,MAX_FILES));report={'scope':'static-only; no physical Xbox boot claimed','checks':[]}
              def add(name,status,detail): report['checks'].append({'check':name,'status':status,'detail':detail})
              by_lower={Path(n).name.lower():n for n in names}
              elf_candidates=[n for n in names if Path(n).name in ('xenon.elf','vmlinux','zImage.xenon')]
              for name in elf_candidates:
                  p=PROJECT/name
                  try:
                      size=p.stat().st_size
                      with p.open('rb') as f: head=f.read(64)
                      if len(head)<20 or head[:4]!=b'\x7fELF':
                          add(name,'UNKNOWN','Não é ELF reconhecível. zImage.xenon pode ser imagem raw; não foi tratada como ELF.')
