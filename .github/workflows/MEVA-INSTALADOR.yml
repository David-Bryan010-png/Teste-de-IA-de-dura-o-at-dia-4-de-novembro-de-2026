                      q=PurePosixPath(i.filename);mode=i.external_attr>>16
                      if q.is_absolute() or '..' in q.parts or '\\' in i.filename or stat.S_ISLNK(mode):unsafe.append(i.filename[:200]);continue
                      if i.is_dir():continue
                      total+=i.file_size
                      if i.file_size>256*1024*1024:unsafe.append(i.filename[:200]);continue
                      if Path(i.filename).name.lower() in {'readme','readme.md','readme.txt','package.json','pyproject.toml','cargo.toml','cmakelists.txt','makefile','go.mod','pom.xml'}:man.append(i.filename)
