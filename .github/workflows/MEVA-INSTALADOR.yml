              def loaded(self) -> bool:
                  return self.project.is_dir() and any(x.is_file() for x in self.project.rglob('*'))

              def inventory(self, offset: int = 0, limit: int = 1000) -> list[str]:
                  out: list[str] = []
                  if not self.project.exists():
                      return out
                  for cur, dirs, files in os.walk(self.project, followlinks=False):
                      dirs[:] = sorted(x for x in dirs if x.lower() not in DENY_DIRS and not (Path(cur) / x).is_symlink())
                      for name in sorted(files):
                          p = Path(cur) / name
                          try:
                              rel = p.relative_to(self.project).as_posix()
                              if not p.is_symlink() and not secret_path(PurePosixPath(rel).parts):
                                  out.append(rel)
                          except OSError:
                              pass
                          if len(out) >= MAX_FILES:
                              break
                      if len(out) >= MAX_FILES:
                          break
                  out.sort()
                  return out[max(0, offset):max(0, offset) + max(1, limit)]

              def project_info(self) -> dict:
                  names = self.inventory(0, MAX_FILES)
                  markers = {
                      'README', 'README.md', 'Kconfig', 'Makefile', 'CMakeLists.txt', 'Config.in', '.config',
                      'buildroot.config', 'defconfig', 'rootfs.cpio.gz', 'zImage', 'zImage.xenon', 'vmlinux',
                      'xenon.elf', 'package.json', 'pyproject.toml', 'Cargo.toml', 'go.mod', 'build.gradle',
                  }
                  important = [x for x in names if Path(x).name in markers or Path(x).name.endswith(('.defconfig', '.config'))]
                  exts = {
                      '.c': 'C', '.h': 'C headers', '.cpp': 'C++', '.hpp': 'C++ headers', '.py': 'Python',
                      '.sh': 'Shell', '.js': 'JavaScript', '.ts': 'TypeScript', '.rs': 'Rust', '.go': 'Go',
                      '.kt': 'Kotlin', '.java': 'Java', '.mk': 'Make/Buildroot', '.dts': 'Device Tree', '.dtsi': 'Device Tree',
                  }
                  langs: dict[str, int] = {}
                  total = 0
                  largest = []
                  top = {}
                  for n in names:
                      e = Path(n).suffix.lower()
                      if e in exts:
                          langs[exts[e]] = langs.get(exts[e], 0) + 1
                      first = n.split('/')[0] if '/' in n else '.'
                      top[first] = top.get(first, 0) + 1
                      try:
                          size = (self.project / n).stat().st_size
                          total += size
                          largest.append({'path': n, 'size': size})
                      except OSError:
                          pass
                  largest = sorted(largest, key=lambda x: x['size'], reverse=True)[:20]
                  return {
                      'root': 'meva-workspace/linux-project', 'file_count': len(names), 'total_bytes': total,
                      'top_level': dict(sorted(top.items(), key=lambda kv: -kv[1])[:60]),
                      'largest_files': largest, 'sample_files': names[:1200], 'important_files': important[:350],
                      'languages': langs, 'symlink_count': len(self.symlinks), 'inventory_limit': MAX_FILES,
                      'git': {'enabled': self.git.enabled, 'reason': self.git.reason},
                  }

              # ---------------------------------------------------------------- snapshot
              def snapshot(self) -> dict[str, dict]:
                  out = {}
                  for n in self.inventory(0, MAX_FILES):
                      p = self.project / n
                      try:
                          st = p.stat()
                          out[n] = {'sha256': file_hash(p), 'size': st.st_size, 'mode': stat.S_IMODE(st.st_mode)}
                      except OSError:
                          pass
                  return out

              def changes_since(self, before: dict[str, dict]) -> list[dict]:
                  after = set(self.inventory(0, MAX_FILES))
                  old = set(before)
                  changes = []
                  for n in sorted(old | after):
                      p = self.project / n
                      if n not in after:
                          changes.append({'path': n, 'status': 'deleted'})
                          continue
                      try:
                          h = file_hash(p)
                          st = p.stat()
                      except OSError:
                          continue
                      if n not in old:
                          changes.append({'path': n, 'status': 'added', 'sha256': h, 'size': st.st_size})
                      elif before[n]['sha256'] != h or before[n].get('mode') != stat.S_IMODE(st.st_mode):
                          changes.append({'path': n, 'status': 'modified', 'sha256': h, 'size': st.st_size, 'mode': oct(stat.S_IMODE(st.st_mode))})
                  return changes

              # ---------------------------------------------------------------- caminhos
              def safe_path(self, raw, allow_root: bool = False) -> Path:
                  if allow_root and raw in ('', None, '.'):
                      return self.project
                  rel = valid_rel(raw)
                  for i in range(1, len(rel.parts) + 1):
                      if PurePosixPath(*rel.parts[:i]).as_posix() in self.symlinks:
                          raise ValueError('Caminho passa por symlink preservado; não será seguido.')
                  p = self.project.joinpath(*rel.parts)
                  for parent in [p, *p.parents]:
                      if parent == self.project.parent:
                          break
                      if parent.is_symlink():
                          raise ValueError('Links simbólicos não podem ser seguidos.')
                      if parent == self.project:
                          break
                  resolved = p.resolve(strict=False)
                  root = self.project.resolve()
                  if resolved != root and root not in resolved.parents:
                      raise ValueError('Caminho escapou do workspace.')
                  return p

              def rel(self, p: Path) -> str:
                  return p.relative_to(self.project).as_posix()

              # ---------------------------------------------------------------- symlinks
              def materialize_symlinks(self) -> list[Path]:
                  created = []
                  root = self.project.resolve()
                  for name, target in sorted(self.symlinks.items()):
                      link = self.project.joinpath(*PurePosixPath(name).parts)
                      if link.exists() or link.is_symlink() or not safe_link_target(PurePosixPath(name).parts, target):
                          continue
                      resolved = (link.parent / target).resolve(strict=False)
                      if resolved != root and root not in resolved.parents:
                          continue
                      link.parent.mkdir(parents=True, exist_ok=True)
                      try:
                          os.symlink(target, link)
                          created.append(link)
                      except OSError:
                          pass
                  return created

              def remove_materialized_symlinks(self, created) -> None:
                  for link in reversed(created):
                      try:
                          if link.is_symlink():
                              link.unlink()
                      except OSError:
                          pass

              # ---------------------------------------------------------------- backups
              def backup_before_change(self, path) -> dict:
                  p = Path(path)
                  try:
                      rel = p.relative_to(self.project).as_posix()
                  except ValueError:
                      raise ValueError('Backup só permite arquivos dentro do projeto.')
                  if rel in self.backup_index:
                      return self.backup_index[rel]
                  if p.is_symlink():
                      raise ValueError('Backup de symlink não é permitido.')
                  if p.exists():
                      if not p.is_file():
                          raise ValueError('Backup automático aceita somente arquivos regulares: ' + rel)
                      size = p.stat().st_size
                      if self.backup_total + size > MAX_BACKUP_TOTAL:
                          raise RuntimeError('Limite de 512 MiB de backups originais atingido; alteração bloqueada para preservar dados.')
                      target = self.backup_dir / rel
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(p, target)
                      digest = file_hash(target)
                      self.backup_total += size
                      meta = {'exists': True, 'size': size, 'sha256': digest, 'mode': stat.S_IMODE(p.stat().st_mode)}
                  else:
                      meta = {'exists': False, 'size': 0, 'sha256': None, 'mode': None}
                  self.backup_index[rel] = meta
                  self.save_backup_index()
                  return meta

              def save_backup_index(self) -> None:
                  atomic_json(self.work / 'MEVA-BACKUPS.json', {'version': 1, 'total_bytes': self.backup_total, 'files': self.backup_index})

              def restore_backup(self, rel: str) -> dict:
                  if rel not in self.backup_index:
                      raise ValueError('Nenhum backup desta execução existe para: ' + rel)
                  p = self.safe_path(rel)
                  meta = self.backup_index[rel]
                  if meta.get('exists'):
                      src = self.backup_dir / rel
                      if not src.is_file() or file_hash(src) != meta.get('sha256'):
                          raise RuntimeError('Backup ausente ou com SHA-256 divergente: ' + rel)
                      p.parent.mkdir(parents=True, exist_ok=True)
                      tmp = p.with_name(p.name + '.meva-restore-tmp')
                      shutil.copy2(src, tmp)
                      tmp.replace(p)
                      if meta.get('mode') is not None:
                          p.chmod(meta['mode'])
                      if file_hash(p) != meta['sha256']:
                          raise RuntimeError('Restauração não passou na verificação de SHA-256: ' + rel)
                      return {'ok': True, 'restored': rel, 'sha256': meta['sha256']}
                  if p.exists():
                      if not p.is_file() or p.is_symlink():
                          raise RuntimeError('Rollback recusado: destino deixou de ser arquivo regular.')
                      p.unlink()
                  return {'ok': True, 'removed_created_file': rel}

              def write_symlink_index(self) -> None:
                  (self.work / 'project-symlinks.json').write_text(json.dumps(self.symlinks, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')


          def environment_info(ws_or_path=None) -> dict:
              base = Path(ws_or_path) if ws_or_path else Path.cwd()
              probe = base if base.exists() else Path.cwd()
              disk = shutil.disk_usage(probe)
              try:
                  mem_kb = int(Path('/proc/meminfo').read_text().split('MemTotal:')[1].split()[0])
              except Exception:  # noqa: BLE001
                  mem_kb = None
              return {
                  'platform': platform.platform(), 'python': platform.python_version(), 'machine': platform.machine(),
                  'cpu_count': os.cpu_count(), 'memory_total_kib': mem_kb, 'workspace_disk_free_bytes': disk.free,
                  'workspace_disk_total_bytes': disk.total, 'runner_os': os.getenv('RUNNER_OS', 'unknown'),
                  'runner_arch': os.getenv('RUNNER_ARCH', 'unknown'),
              }
