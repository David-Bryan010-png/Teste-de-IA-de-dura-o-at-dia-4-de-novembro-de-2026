name: MEVA — instalação completa (GitHub Pages)
run-name: MEVA Pages — ${{ github.repository }}

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Substituir arquivos existentes"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: meva-pages-installer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  install:
    name: Instalar MEVA no GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Garantir branch padrão
        run: |
          if [[ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]]; then
            echo "Execute na branch padrão" >&2
            exit 1
          fi

      - name: Criar pastas necessárias
        run: |
          mkdir -p public .github/workflows

      - name: Criar arquivo index.html
        run: |
          cat > 'public/index.html' << 'EOF'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
            <meta name="theme-color" content="#0b1220">
            <meta name="description" content="MEVA — agente local de programação via GitHub Actions.">
            <link rel="manifest" href="manifest.webmanifest">
            <link rel="icon" href="icon.svg" type="image/svg+xml">
            <link rel="stylesheet" href="styles.css">
            <title>MEVA — Agente de programação</title>
          </head>
          <body>
            <main class="shell">
              <header class="brand">
                <div class="brand-mark" aria-hidden="true">M</div>
                <div>
                  <div class="brand-name">MEVA</div>
                  <div class="brand-subtitle">Agente local · GitHub Pages</div>
                </div>
              </header>
          
              <section id="tokenPanel" class="panel">
                <span class="eyebrow">CONFIGURAÇÃO</span>
                <h1>Token do GitHub</h1>
                <p class="muted">Crie um Fine-grained Personal Access Token com permissão <strong>Actions: Read and write</strong> apenas neste repositório. O token fica só no seu navegador (localStorage) e nunca é enviado para outro lugar.</p>
                <form id="tokenForm" class="form-stack">
                  <label for="tokenInput">Token (ghp_… ou github_pat_…)</label>
                  <input id="tokenInput" type="password" autocomplete="off" placeholder="Cole o token aqui" required>
                  <button class="primary" type="submit">Salvar e conectar</button>
                  <p id="tokenMessage" class="form-message" role="alert"></p>
                </form>
              </section>
          
              <section id="appPanel" class="panel hidden">
                <span class="eyebrow">PAINEL</span>
                <h1>Nova tarefa</h1>
                <form id="taskForm" class="form-stack">
                  <label for="taskInput">O que a MEVA deve fazer?</label>
                  <textarea id="taskInput" rows="4" placeholder="Ex.: adicione um README com instruções de uso" required></textarea>
                  <label for="branchInput">Branch (vazio = padrão)</label>
                  <input id="branchInput" placeholder="main">
                  <label for="stepsInput">Máximo de passos</label>
                  <input id="stepsInput" type="number" min="8" max="20" value="14">
                  <label class="check">
                    <input id="commitInput" type="checkbox" checked>
                    Commitar as alterações automaticamente
                  </label>
                  <button class="primary" type="submit">Executar MEVA</button>
                  <p id="taskMessage" class="form-message" role="alert"></p>
                </form>
          
                <h2>Execuções recentes</h2>
                <div id="jobsList" class="jobs"></div>
                <button id="refreshBtn" class="secondary" type="button">Atualizar lista</button>
                <button id="logoutBtn" class="link-button" type="button">Remover token deste dispositivo</button>
              </section>
            </main>
            <script src="app.js"></script>
          </body>
          </html>
          EOF

      - name: Criar arquivo app.js
        run: |
          cat > 'public/app.js' << 'EOF'
          const TOKEN_KEY = "meva_gh_token";
          const REPO = location.hostname.endsWith(".github.io")
            ? location.pathname.split("/").filter(Boolean)[0] || ""
            : "";
          
          function repoFull() {
            const host = location.hostname;
            if (host.endsWith(".github.io")) {
              const owner = host.replace(".github.io", "");
              const parts = location.pathname.split("/").filter(Boolean);
              const repo = parts[0] || owner + ".github.io";
              return `${owner}/${repo}`;
            }
            return prompt("Informe owner/repo (ex.: David-Bryan010-png/meu-repo)") || "";
          }
          
          async function gh(path, options = {}) {
            const token = localStorage.getItem(TOKEN_KEY);
            if (!token) throw new Error("Token não configurado");
            const res = await fetch(`https://api.github.com${path}`, {
              ...options,
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
                ...(options.headers || {})
              }
            });
            if (!res.ok) {
              const text = await res.text();
              throw new Error(`${res.status} ${text.slice(0, 200)}`);
            }
            return res.status === 204 ? null : res.json();
          }
          
          function show(id) { document.getElementById(id).classList.remove("hidden"); }
          function hide(id) { document.getElementById(id).classList.add("hidden"); }
          function msg(id, text, ok = false) {
            const el = document.getElementById(id);
            el.textContent = text;
            el.style.color = ok ? "#4ade80" : "#f87171";
          }
          
          document.getElementById("tokenForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const token = document.getElementById("tokenInput").value.trim();
            if (!token) return;
            localStorage.setItem(TOKEN_KEY, token);
            try {
              const user = await gh("/user");
              msg("tokenMessage", `Conectado como ${user.login}`, true);
              hide("tokenPanel");
              show("appPanel");
              loadJobs();
            } catch (err) {
              localStorage.removeItem(TOKEN_KEY);
              msg("tokenMessage", "Token inválido: " + err.message);
            }
          });
          
          document.getElementById("taskForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const task = document.getElementById("taskInput").value.trim();
            const branch = document.getElementById("branchInput").value.trim();
            const max_steps = Number(document.getElementById("stepsInput").value) || 14;
            const commit_changes = document.getElementById("commitInput").checked;
            const [owner, repo] = repoFull().split("/");
            if (!owner || !repo) return msg("taskMessage", "Repositório não identificado");
            try {
              await gh(`/repos/${owner}/${repo}/actions/workflows/meva-agent.yml/dispatches`, {
                method: "POST",
                body: JSON.stringify({
                  ref: branch || "main",
                  inputs: {
                    task,
                    branch,
                    max_steps: String(max_steps),
                    commit_changes: String(commit_changes),
                    request_id: "web-" + Date.now()
                  }
                })
              });
              msg("taskMessage", "Tarefa enviada. A execução aparece em Actions em alguns segundos.", true);
              document.getElementById("taskInput").value = "";
              setTimeout(loadJobs, 3000);
            } catch (err) {
              msg("taskMessage", "Erro ao disparar: " + err.message);
            }
          });
          
          async function loadJobs() {
            const list = document.getElementById("jobsList");
            list.innerHTML = "Carregando…";
            try {
              const [owner, repo] = repoFull().split("/");
              const data = await gh(`/repos/${owner}/${repo}/actions/workflows/meva-agent.yml/runs?per_page=8`);
              if (!data.workflow_runs.length) {
                list.innerHTML = "<p class='muted'>Nenhuma execução ainda.</p>";
                return;
              }
              list.innerHTML = data.workflow_runs.map(r => `
                <a class="job" href="${r.html_url}" target="_blank" rel="noopener">
                  <strong>#${r.run_number}</strong> ${r.display_title || r.name}
                  <span class="status ${r.conclusion || r.status}">${r.conclusion || r.status}</span>
                </a>
              `).join("");
            } catch (err) {
              list.innerHTML = `<p class='muted'>Erro: ${err.message}</p>`;
            }
          }
          
          document.getElementById("refreshBtn").addEventListener("click", loadJobs);
          document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.removeItem(TOKEN_KEY);
            location.reload();
          });
          
          if (localStorage.getItem(TOKEN_KEY)) {
            hide("tokenPanel");
            show("appPanel");
            loadJobs();
          }
          EOF

      - name: Criar arquivo styles.css
        run: |
          cat > 'public/styles.css' << 'EOF'
          :root {
            color-scheme: dark;
            --bg: #0b1220;
            --surface: #111c2e;
            --border: rgba(159, 184, 218, .16);
            --text: #edf4ff;
            --muted: #9aacc4;
            --accent: #73a9ff;
            --accent-2: #9bc3ff;
            --good: #62d7aa;
            --danger: #ff8f9b;
            --shadow: 0 22px 60px rgba(0, 0, 0, .22);
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
          }
          * { box-sizing: border-box; }
          body { margin: 0; min-height: 100vh; background: var(--bg); }
          .hidden { display: none !important; }
          .shell { width: min(1160px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0; }
          .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
          .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; color: #081322; background: linear-gradient(145deg, #9bc5ff, #4b8ae8); font-size: 23px; font-weight: 900; }
          .brand-name { font-size: 18px; font-weight: 850; letter-spacing: .16em; }
          .brand-subtitle { color: var(--muted); font-size: 12px; }
          .panel { border: 1px solid var(--border); border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); padding: 25px; margin-bottom: 20px; }
          .eyebrow { color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .17em; }
          h1 { font-size: 26px; margin: 5px 0 15px; }
          .muted { color: var(--muted); font-size: 14px; line-height: 1.6; }
          .form-stack { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
          label { color: #cbd9ed; font-size: 12px; font-weight: 700; }
          input, textarea { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: var(--text); background: #0b1627; outline: none; }
          input:focus, textarea:focus { border-color: var(--accent); }
          .primary { padding: 12px 18px; border: 0; border-radius: 12px; color: #081526; background: linear-gradient(115deg, #a6cbff, #73a9ff); font-weight: 850; cursor: pointer; }
          .form-message { min-height: 18px; color: var(--danger); font-size: 12px; }
          .link-button { border: 0; background: transparent; color: var(--accent-2); font-weight: 700; cursor: pointer; padding: 5px 0; }
          .jobs { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
          .job { display: flex; justify-content: space-between; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: #0e192a; color: var(--text); text-decoration: none; }
          .status { font-weight: bold; }
          .status.success, .status.completed { color: var(--good); }
          .status.failure { color: var(--danger); }
          EOF

      - name: Criar arquivos de suporte e workflow do agente
        run: |
          cat > 'public/manifest.webmanifest' << 'EOF'
          {
            "name": "MEVA — Agente de Programação",
            "short_name": "MEVA",
            "start_url": "/",
            "display": "standalone",
            "background_color": "#0b1220",
            "theme_color": "#0b1220",
            "icons": []
          }
          EOF

          cat > '.github/workflows/deploy-pages.yml' << 'EOF'
          name: Deploy MEVA to GitHub Pages
          on:
            push:
              branches: [main, master]
              paths: ['public/**']
            workflow_dispatch:
          permissions:
            contents: read
            pages: write
            id-token: write
          jobs:
            deploy:
              runs-on: ubuntu-24.04
              steps:
                - uses: actions/checkout@v4
                - uses: actions/configure-pages@v5
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: public
                - id: deployment
                  uses: actions/deploy-pages@v4
          EOF

      - name: Commit e push dos arquivos gerados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public .github/workflows/deploy-pages.yml
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "MEVA: atualizar instalador e painel Pages"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
            echo "Commit enviado com sucesso."
          fi
