      - name: Enviar artefato do projeto
        if: ${{ inputs.mode == 'agent' }}
        uses: actions/upload-artifact@v7
        with:
          name: meva-v9-result-${{ github.run_id }}
          path: /tmp/MEVA-V9-RESULT.zip
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

      - name: Publicar Release do resultado
        if: ${{ inputs.mode == 'agent' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CID: ${{ inputs.conversation_id }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -s /tmp/MEVA-V9-RESULT.zip ]]; then
            TAG="meva-v9-result-${CID:-run}-${RUN_ID}"
            gh release create "$TAG" /tmp/MEVA-V9-RESULT.zip --repo "$GH_REPO" --title 'MEVA V9 — projeto e artefatos' --notes "Saída da execução ${RUN_ID}." --prerelease
            URL=$(gh release view "$TAG" --repo "$GH_REPO" --json url --jq .url)
            python3 - "$CID" "$URL" <<'PY'
          import json,sys
          from pathlib import Path
          cid,url=sys.argv[1:]; p=Path('meva-data/conversations')/(cid+'.json')
          if p.is_file():
              d=json.loads(p.read_text())
              for m in reversed(d.get('messages',[])):
                  if m.get('role')=='assistant': m['content']+='\n\nProjeto/artefatos: '+url; break
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          fi
          if [[ -n "$CID" ]]; then
            for tag in $(gh release list --repo "$GH_REPO" --limit 30 --json tagName --jq '.[].tagName'); do
              [[ "$tag" == meva-v9-upload-"$CID"-* ]] && gh release delete "$tag" --repo "$GH_REPO" --cleanup-tag --yes || true
            done
          fi

      - name: Persistir memória e alterações
        env:
          TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A -- . ':(exclude).github/**' ':(exclude)meva-inbox/**' ':(exclude)meva-workspace/**' ':(exclude)**/node_modules/**' ':(exclude)**/.venv/**' ':(exclude)**/venv/**' ':(exclude)**/.cache/**' ':(exclude)**/.gradle/**' ':(exclude)**/.pytest_cache/**' ':(exclude)**/__pycache__/**' ':(exclude)**/target/**' ':(exclude)**/build-meva/**' ':(exclude)**/bin/**' ':(exclude)**/obj/**'
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'MEVA V9: memória e alterações do agente'
            AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Diagnóstico em caso de falha
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/meva-v9-diagnostics
          cp /tmp/meva-llama.log /tmp/meva-v9-diagnostics/ 2>/dev/null || true
          cp /tmp/meva-response.txt /tmp/meva-v9-diagnostics/ 2>/dev/null || true
          { df -h; tail -n 120 /tmp/meva-llama.log 2>/dev/null || true; } >> "$GITHUB_STEP_SUMMARY"

      - name: Enviar diagnóstico
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: meva-v9-diagnostics-${{ github.run_id }}
          path: /tmp/meva-v9-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Resumo
        if: always()
        env:
          MODE: ${{ inputs.mode }}
          CID: ${{ inputs.conversation_id }}
          ACCEL: ${{ steps.llama.outputs.backend }}
        shell: bash
        run: |
          {
