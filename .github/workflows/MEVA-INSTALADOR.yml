                                      raise RuntimeError('Bloco não pertence ao upload_id: ' + name)
                                  relative_path = full_path[len(prefix):]
                                  if not re.fullmatch(r'part-[0-9]{6}\.bin', relative_path):
                                      raise RuntimeError('Caminho relativo de bloco inválido: ' + name)
                                  if relative_path in seen_chunks:
                                      raise RuntimeError('Bloco duplicado no manifesto: ' + relative_path)
                                  seen_chunks.add(relative_path)
                                  blob_sha = str(ch.get('blob_sha', '')).lower()
                                  chunk_size = ch.get('size')
                                  chunk_hash = str(ch.get('sha256', '')).lower()
                                  if not re.fullmatch(r'[0-9a-f]{40}', blob_sha) or committed.get(relative_path) != blob_sha:
                                      raise RuntimeError('Bloco não pertence ao commit do upload: ' + name)
                                  if isinstance(chunk_size, bool) or not isinstance(chunk_size, int) or chunk_size < 0 or chunk_size > CHUNK_SIZE:
                                      raise RuntimeError('Tamanho de bloco inválido: ' + name)
                                  if not re.fullmatch(r'[0-9a-f]{64}', chunk_hash):
                                      raise RuntimeError('SHA-256 de bloco inválido: ' + name)
                                  data = gh.download_blob(blob_sha, chunk_size, chunk_hash)
