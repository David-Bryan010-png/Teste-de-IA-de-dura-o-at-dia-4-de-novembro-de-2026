          """Loop do agente com tool calling nativo, execução paralela, portão de conclusão e subagentes.

          Loop de correção forçado pelo runtime (não depende do modelo "lembrar"):
            editou → valida arquivos alterados → (build/teste, se autorizado e pedido) → devolve o erro real → corrige → repete,
          até passar ou estourar os limites. Só então o verificador independente revisa.
          """
          from __future__ import annotations

          import hashlib
          import json
          import time
          from concurrent.futures import ThreadPoolExecutor
          from dataclasses import dataclass, field

          from . import prompts
          from .context import ContextManager, format_result
          from .intents import compile_requested, tests_requested
          from .tools import Toolbox
          from .util import log, redact
          from .validate import detect_build_command, validate_project

          MAX_PARALLEL_CALLS = 8
          MAX_NUDGES = 6
          POOL_WORKERS = 4


          @dataclass
          class LoopResult:
              text: str = ''
              finished: bool = False
              reason: str = ''
              messages: list = field(default_factory=list)


          class AgentLoop:
              def __init__(self, session, router, toolbox, system, *, role='main', max_actions=60, deadline_s=3600,
                           on_finish=None, ctx=None, count_session=True):
                  self.s, self.router, self.tb, self.system = session, router, toolbox, system
                  self.role, self.max_actions, self.on_finish = role, max_actions, on_finish
                  self.deadline = time.time() + deadline_s
                  self.ctx = ctx
                  self.count_session = count_session
                  self.actions = 0
                  self.step = 0

              # ------------------------------------------------------------------ contagem de ações
              def _used(self) -> int:
                  return self.s.done if self.count_session else self.actions

              def _bump(self) -> None:
                  if self.count_session:
                      self.s.done += 1
                  self.actions += 1

              # ------------------------------------------------------------------ execução de uma chamada
              def _fingerprint(self, call) -> str:
                  raw = json.dumps([call.name, call.args], sort_keys=True, ensure_ascii=False, default=str)
                  return hashlib.sha256((raw + '|' + str(self.s.state_version)).encode()).hexdigest()

              def _one(self, call) -> dict:
                  s = self.s
                  target = ''
                  if isinstance(call.args, dict):
                      target = str(call.args.get('path') or call.args.get('command') or call.args.get('query') or call.args.get('pattern') or call.args.get('plan') or '')[:240]

                  def block(content, is_error=False):
                      return {'type': 'tool_result', 'tool_use_id': call.id, 'content': content, 'is_error': is_error}

                  def fail(msg, fp=None):
                      s.record_event(call.name, target, 'error', error=msg, agent=self.role)
                      if fp:
                          with s.lock:
                              s.failed.add(fp)
                      return block(json.dumps({'error': msg}, ensure_ascii=False), True)

                  if call.error or call.args is None:
                      self._bump()
                      return fail('Argumentos inválidos: ' + (call.error or 'ausentes') + '. Reenvie a chamada com JSON válido (se o conteúdo é grande, divida em partes).')
                  if self._used() >= self.max_actions:
                      return fail('Limite de ações atingido; resuma o estado e encerre.')
                  fp = self._fingerprint(call)
                  with s.lock:
                      if fp in s.failed:
                          repeated = True
                      else:
                          repeated = False
                  if repeated:
                      self._bump()
                      return fail('Ação idêntica já falhou e nada mudou no workspace desde então. Mude a estratégia ou os parâmetros.')
                  self._bump()
                  try:
                      result = self.tb.call(call.name, call.args)
                  except Exception as e:  # noqa: BLE001
                      return fail(redact(e), fp)
                  if isinstance(result, dict) and result.get('status') == 'NOT_RUN':
                      st = 'not_run'
                  elif isinstance(result, dict) and result.get('ok') is False:
                      st = 'failed'
                      with s.lock:
                          s.failed.add(self._fingerprint(call))
                  else:
                      st = 'success'
                  s.record_event(call.name, target, st, result=result, agent=self.role)
                  return block(format_result(result))

              def _parallel(self, call) -> bool:
                  spec = self.tb.spec(call.name)
                  return bool(spec and spec.parallel)

              def _execute(self, calls) -> list:
                  calls = list(calls)
                  results = [None] * len(calls)
                  i = 0
                  while i < len(calls):
                      if self._parallel(calls[i]):
                          j = i
                          while j < len(calls) and self._parallel(calls[j]):
                              j += 1
                          group = calls[i:j]
                          if len(group) == 1:
                              results[i] = self._one(group[0])
                          else:
                              with ThreadPoolExecutor(max_workers=POOL_WORKERS) as pool:
                                  for k, r in enumerate(pool.map(self._one, group)):
                                      results[i + k] = r
                          i = j
                      else:
                          results[i] = self._one(calls[i])
                          i += 1
                  return results

              def _checkpoint(self) -> None:
                  if self.role != 'main':
                      return
                  paths, dirty = self.s.drain_pending()
                  if paths or dirty:
                      self.step += 1
                      sha = self.s.ws.git.checkpoint(f'meva: etapa {self.step}', paths, include_untracked=dirty)
                      if sha:
                          log(f'git checkpoint {sha} (etapa {self.step})')

              # ------------------------------------------------------------------ loop
              def run(self, messages: list) -> LoopResult:
                  msgs = messages
                  nudges = 0
                  tools = self.tb.tool_defs()
                  last_text = ''
                  while True:
                      if time.time() > self.deadline:
                          return LoopResult(last_text, False, 'tempo limite', msgs)
                      if self._used() >= self.max_actions:
                          return LoopResult(last_text, False, 'limite de ações', msgs)
                      if self.ctx is not None:
                          msgs = self.ctx.maybe_compact(self.system, msgs, tools)
                      turn = self.router.complete(self.system, msgs, tools)
                      if turn.text:
                          last_text = turn.text
                      if turn.blocks:
                          msgs.append({'role': 'assistant', 'content': turn.blocks})
                      if turn.tool_calls:
                          calls = turn.tool_calls[:MAX_PARALLEL_CALLS]
                          extra = turn.tool_calls[MAX_PARALLEL_CALLS:]
                          results = self._execute(calls)
                          for c in extra:  # todo tool_use precisa de um tool_result
                              results.append({'type': 'tool_result', 'tool_use_id': c.id, 'is_error': True,
                                              'content': json.dumps({'error': f'No máximo {MAX_PARALLEL_CALLS} chamadas por rodada; repita esta.'}, ensure_ascii=False)})
                          self._checkpoint()
                          if self.role == 'verifier' and self.tb.verdict:
                              msgs.append({'role': 'user', 'content': results})
                              return LoopResult(last_text, True, 'veredito', msgs)
                          msgs.append({'role': 'user', 'content': results})
                          continue
                      # sem chamadas de ferramenta: o modelo quer encerrar
                      nudge = []
                      if not turn.blocks:
                          nudge.append('Sua resposta veio vazia. Continue a tarefa ou entregue o resumo final.')
                      elif turn.stop_reason == 'max_tokens':
                          nudge.append('Sua resposta foi cortada por limite de tokens. Continue de onde parou, em partes menores.')
                      elif self.on_finish is not None:
                          nudge = self.on_finish() or []
                      if nudge and nudges < MAX_NUDGES:
                          nudges += 1
                          if not turn.blocks:
                              msgs.append({'role': 'assistant', 'content': [{'type': 'text', 'text': '(sem resposta)'}]})
                          msgs.append({'role': 'user', 'content': [{'type': 'text', 'text': '\n\n'.join(nudge)}]})
                          continue
                      if nudge:
                          return LoopResult(last_text, False, 'correções esgotadas: ' + ' | '.join(nudge)[:600], msgs)
                      return LoopResult(last_text, True, 'concluído', msgs)


          class Agent:
              """Orquestra o agente principal, o portão de conclusão, os subagentes e o verificador."""

              def __init__(self, session, router_factory):
                  self.s = session
                  self.cfg = session.cfg
                  self.router_factory = router_factory  # (cheap: bool) -> Router
                  self._routers: dict = {}
                  self.toolbox = Toolbox(session, 'main')
                  self.verified_seq = None
                  self.verify_rounds = 0
                  self.norunner_nudged = False
                  self.session_user = ''
                  session.subagent_runner = self.run_subagent

              def _router(self, cheap: bool):
                  if cheap not in self._routers:
                      self._routers[cheap] = self.router_factory(cheap)
                  return self._routers[cheap]

              # ------------------------------------------------------------------ principal
              def run_main(self, system: str, history: list, user_text: str) -> LoopResult:
                  self.session_user = user_text
                  ctx = ContextManager(self.cfg, lambda: self._router(True), self.s)
                  msgs = [dict(m) for m in history] + [{'role': 'user', 'content': user_text}]
                  loop = AgentLoop(self.s, self._router(False), self.toolbox, system, role='main', max_actions=self.cfg.max_actions,
                                   deadline_s=self.cfg.deadline_seconds, on_finish=self.gate, ctx=ctx)
                  return loop.run(msgs)

              # ------------------------------------------------------------------ auto-execução do runtime
              def _auto(self, tool: str, args: dict) -> dict:
                  try:
                      r = self.toolbox.call(tool, args)
                  except Exception as e:  # noqa: BLE001
                      r = {'ok': False, 'error': redact(e)}
                  st = 'not_run' if r.get('status') == 'NOT_RUN' else ('failed' if r.get('ok') is False else 'success')
                  self.s.record_event('auto_' + tool, args.get('command', ''), st, result=r, agent='runtime')
                  return r

              def gate(self) -> list[str]:
                  """Chamado quando o modelo quer encerrar. Devolve mensagens que o forçam a continuar (lista vazia = pode encerrar)."""
                  s, cfg = self.s, self.cfg
                  msgs: list[str] = []
                  if not (cfg.write_allowed and s.edit_seq > 0):
                      return msgs
                  # 1) validar arquivos alterados
                  if s.validated_seq != s.edit_seq:
                      changed = s.changed_for_validation()
                      v = validate_project(s.ws, only=changed)
                      s.last_validation = v
                      s.record_event('auto_validate_project', f'{len(changed)} arquivos alterados', 'success' if v['ok'] else 'failed', result=v, agent='runtime')
                      if v['ok']:
                          s.validated_seq = s.edit_seq
                      else:
                          bad = [f"{c['path']}: {c['detail'][:300]}" for c in v['checks'] if c['status'] == 'FAIL'][:10]
                          msgs.append('Validação automática dos arquivos que você alterou FALHOU. Corrija antes de encerrar:\n- ' + '\n- '.join(bad))
                  # 2) build / testes (somente se autorizado e pedido pelo usuário)
                  if cfg.allow_build and not msgs:
                      user = self.session_user
                      if tests_requested(user) and not s.tests_ok_current:
                          r = self._auto('run_tests', {})
                          if r.get('status') == 'NOT_RUN':
                              if not self.norunner_nudged:
                                  self.norunner_nudged = True
                                  msgs.append('Os testes foram pedidos, mas o runtime não executou nenhum: ' + str(r.get('reason', ''))
                                              + ' Execute run_tests com o comando correto, crie os testes necessários, ou declare explicitamente que não foram executados.')
                          elif r.get('ok') is not True:
                              msgs.append('Os testes FALHARAM depois da sua última edição (exit ' + str(r.get('exit_code')) + '). Saída:\n' + str(r.get('output', ''))[-5000:] + '\nCorrija a causa real e rode de novo.')
                      if compile_requested(user) and not s.build_ok_current and not msgs:
                          cmd = detect_build_command(s.ws)
                          if cmd:
                              r = self._auto('run_build', {'command': cmd})
                              if r.get('ok') is not True and r.get('status') != 'NOT_RUN':
                                  msgs.append('O build FALHOU (`' + cmd + '`, exit ' + str(r.get('exit_code')) + '). Saída:\n' + str(r.get('output', ''))[-5000:] + '\nCorrija a causa real e rode o build de novo.')
                          else:
                              msgs.append('A compilação foi pedida e nenhum build passou depois da sua última edição. Execute run_build com o comando correto do projeto.')
                  # 3) verificador independente
                  if not msgs and cfg.verify and self.verified_seq != s.edit_seq and self.verify_rounds < 2:
                      verdict = self.run_verifier()
                      self.verified_seq = s.edit_seq
                      self.verify_rounds += 1
                      serious = [f for f in verdict.get('findings', []) if f.get('severity') in ('blocker', 'major')]
                      if verdict.get('verdict') == 'FAIL' and serious and self.verify_rounds < 2:
                          lines = [f"[{f['severity']}] {f.get('file', '')}: {f['issue']}" for f in serious[:10]]
                          msgs.append('O VERIFICADOR INDEPENDENTE reprovou o resultado. Confirme cada achado no código (pode haver falso positivo), corrija o que for real e responda:\n- ' + '\n- '.join(lines))
                  return msgs

              # ------------------------------------------------------------------ subagentes
              def _sub_loop(self, role: str, system: str, task: str, max_actions: int, deadline_s: int, cheap: bool, on_finish=None):
                  tb = Toolbox(self.s, role)
                  loop = AgentLoop(self.s, self._router(cheap), tb, system, role=role, max_actions=max_actions, deadline_s=deadline_s,
                                   on_finish=on_finish, count_session=False)
                  res = loop.run([{'role': 'user', 'content': task}])
                  return tb, res

              def run_subagent(self, role: str, task: str) -> str:
                  system = prompts.EXPLORER_SYSTEM if role == 'explorer' else prompts.PLANNER_SYSTEM
                  try:
                      _, res = self._sub_loop(role, system, task, 16, 6 * 60, cheap=True)
                      text = res.text or '(subagente sem resposta)'
                      if not res.finished:
                          text += f'\n[subagente interrompido: {res.reason}]'
                      return text[:6000]
                  except Exception as e:  # noqa: BLE001
                      return 'Subagente falhou: ' + redact(e)

              def run_verifier(self) -> dict:
                  s = self.s
                  s.ws.git.checkpoint('meva: antes da verificação', include_untracked=True)
                  diff = s.ws.git.diff_base_to_head(cap=40000) if s.ws.git.enabled else ''
                  changes = s.ws.changes_since(s.ws.snapshot_before)
                  task = '\n'.join([
                      'TAREFA ORIGINAL DO USUÁRIO:', self.session_user[:6000], '',
                      'ARQUIVOS ALTERADOS: ' + ', '.join(f"{c['status']}:{c['path']}" for c in changes[:80]),
                      '', 'EVIDÊNCIAS REGISTRADAS PELO RUNTIME:',
                      'validação: ' + json.dumps((s.last_validation or {}).get('counts', 'não executada'), ensure_ascii=False),
                      'último build: ' + json.dumps(s.last_build, ensure_ascii=False) + ' (válido após a última edição: ' + str(s.build_ok_current) + ')',
                      'últimos testes: ' + json.dumps(s.last_tests, ensure_ascii=False) + ' (válidos após a última edição: ' + str(s.tests_ok_current) + ')',
                      '', 'DIFF (início da tarefa → agora' + (', truncado' if len(diff) >= 40000 else '') + '):', diff or '(git indisponível; use read_file nos arquivos alterados)',
                  ])
                  asked = {'n': 0}
                  try:
                      tb = Toolbox(s, 'verifier')

                      def ask_verdict() -> list[str]:
                          if tb.verdict is None and asked['n'] < 2:
                              asked['n'] += 1
                              return ['Chame submit_verdict agora com o seu veredito.']
                          return []

                      loop = AgentLoop(s, self._router(False), tb, prompts.VERIFIER_SYSTEM, role='verifier', max_actions=14,
                                       deadline_s=8 * 60, on_finish=ask_verdict, count_session=False)
                      loop.run([{'role': 'user', 'content': task}])
                      verdict = tb.verdict or {'verdict': 'INCONCLUSIVE', 'summary': 'O verificador não emitiu veredito.', 'findings': []}
                  except Exception as e:  # noqa: BLE001
                      verdict = {'verdict': 'INCONCLUSIVE', 'summary': 'Verificador falhou: ' + redact(e), 'findings': []}
                  verdict['edit_seq'] = s.edit_seq
                  s.verify_result = verdict
                  s.record_event('verifier', verdict['verdict'], 'success' if verdict['verdict'] != 'FAIL' else 'failed',
                                 result={'verdict': verdict['verdict'], 'findings': verdict.get('findings', [])}, agent='verifier')
                  return verdict
