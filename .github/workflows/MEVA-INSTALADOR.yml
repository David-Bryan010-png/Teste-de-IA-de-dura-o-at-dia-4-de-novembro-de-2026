              except Exception: shutil.rmtree(dest,ignore_errors=True); raise
              return {'archive':label,'destination':label2,'count':len(files),'expanded_bytes':total,'files':files[:700]}
          def file_info(path):
              p,n=safe(path); h=hashlib.sha256()
