                  command = str(a.get('command') or '').strip() or detect_test_command(self.ws)
                  if not command:
                      return self._notready('run_tests', 'Nenhum runner de testes reconhecido; não foi declarado sucesso.')
                  writable = self.cfg.write_allowed and self.role == 'main'
                  b = dict(a)
                  b['command'] = command
                  r = self._exec(b, 'run_tests', writable, 600, 1800)
                  if r.get('status') == 'NOT_RUN':
