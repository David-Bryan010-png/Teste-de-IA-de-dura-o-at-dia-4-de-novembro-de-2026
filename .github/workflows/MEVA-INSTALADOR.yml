            meva-workspace/MEVA-CHANGES.diff
            meva-workspace/MEVA-MANIFEST.json
            meva-workspace/MEVA-ACTIONS.json
            meva-workspace/MEVA-VALIDATION.json
            meva-workspace/MEVA-BACKUPS.json
            meva-workspace/backups/**
            meva-workspace/MEVA-ENVIRONMENT.json
            meva-workspace/MEVA-PLAN.json
