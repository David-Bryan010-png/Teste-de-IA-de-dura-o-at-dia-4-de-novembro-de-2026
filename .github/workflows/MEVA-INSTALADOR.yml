              except Exception as keep_error:log('ERRO AO PRESERVAR ESTADO: '+redact(keep_error))
              log('MEVA_FATAL: '+error);raise
          PY
          python3 -m py_compile /tmp/meva-v16.py
          python3 /tmp/meva-v16.py | tee /tmp/meva-v16-output.txt

      - name: Salvar diagnóstico e pacote mesmo quando houver falha
        if: ${{ always() && (failure() || cancelled()) }}
        uses: actions/upload-artifact@v4
        with:
          name: MEVA-V16-DIAGNOSTICO-${{ github.run_id }}
          path: |
            /tmp/meva-v16-output.txt
            /tmp/MEVA-LINUX-PROJECT-V16.zip
            meva-workspace/MEVA-REPORT.md
            meva-workspace/MEVA-ACTIONS.json
            meva-data/checkpoints/${{ inputs.conversation_id || format('run-{0}', github.run_id) }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar ZIP de resultado no Release (inclusive parcial)
        id: publish
        if: ${{ always() && (inputs.mode == 'agent' || inputs.mode == 'linux_zip' || inputs.mode == 'resume') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CID: ${{ inputs.conversation_id || format('run-{0}', github.run_id) }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -s /tmp/MEVA-LINUX-PROJECT-V16.zip ]] || { echo 'Nenhum ZIP foi produzido; estado parcial permanece no checkpoint.'; exit 0; }
          TAG="meva-v16-${CID}-${RUN_ID}"; NAME="MEVA-LINUX-PROJECT-V16-${RUN_ID}.zip"; cp /tmp/MEVA-LINUX-PROJECT-V16.zip "/tmp/${NAME}"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "/tmp/${NAME}" --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" "/tmp/${NAME}" --repo "$GH_REPO" --target "$BRANCH" --title "MEVA V16 — Projeto atualizado (${RUN_ID})" --notes 'Pacote do projeto MEVA V16. Consulte MEVA-REPORT.md, MEVA-CHANGES.diff, MEVA-MANIFEST.json e MEVA-ACTIONS.json.' --prerelease
          fi
          gh api "repos/${GH_REPO}/releases/tags/${TAG}" > /tmp/meva-v16-release.json
          python3 - <<'PYREL'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/meva-v16-release.json').read_text(encoding='utf-8'))
          a=next((x for x in d.get('assets',[]) if x.get('name','')=='MEVA-LINUX-PROJECT-V16-'+str(__import__('os').environ.get('RUN_ID',''))+'.zip'),None)
          if not a: raise SystemExit('Asset final não localizado no Release.')
          if not isinstance(d.get('id'),int) or not isinstance(a.get('id'),int): raise SystemExit('API REST não retornou IDs numéricos.')
          if int(a.get('size',0))<=0 or not a.get('browser_download_url'): raise SystemExit('Asset sem tamanho/URL válidos.')
          Path('/tmp/meva-v16-published.json').write_text(json.dumps({'release_id':d['id'],'release_url':d.get('html_url',''),'asset_id':a['id'],'asset_name':a['name'],'asset_size':a['size'],'asset_url':a['browser_download_url']},ensure_ascii=False),encoding='utf-8')
          print('Release/asset verificados:',a['name'],a['size'])
          PYREL
          echo 'published=true' >> "$GITHUB_OUTPUT"

      - name: Persistir conversa e checkpoint
        id: persist
        if: ${{ always() && steps.agent.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
          CID: ${{ inputs.conversation_id || format('run-{0}', github.run_id) }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p meva-data/conversations meva-data/checkpoints
          if [[ -s /tmp/meva-v16-published.json ]]; then
            python3 - "$CID" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path('meva-data/conversations')/(sys.argv[1]+'.json')
          if p.is_file():
              d=json.loads(p.read_text(encoding='utf-8'));r=json.loads(Path('/tmp/meva-v16-published.json').read_text(encoding='utf-8'))
              d['last_release']=r['release_url'];d['last_asset_url']=r['asset_url'];d['project_archive']={'release_id':r['release_id'],'asset_id':r['asset_id'],'name':r['asset_name'],'size':r['asset_size']};d.pop('pending_upload',None)
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          fi
          cp -a meva-data /tmp/meva-v16-data
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git checkout -f -B "$BRANCH" "origin/${BRANCH}"
          mkdir -p meva-data; cp -a /tmp/meva-v16-data/. meva-data/
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- meva-data
          if ! git diff --cached --quiet; then git commit -m "MEVA V16: persistir conversa ${CID}"; git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:${BRANCH}"; fi

      - name: Remover branch temporária após persistência confirmada
        if: ${{ always() && (inputs.upload_ref != '' || steps.agent.outputs.upload_ref != '') && steps.publish.outputs.published == 'true' && steps.persist.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPLOAD_REF: ${{ steps.agent.outputs.upload_ref || inputs.upload_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$UPLOAD_REF" =~ ^meva-upload-[a-z0-9-]{8,80}$ ]] || { echo 'Ref inválida; limpeza ignorada.'; exit 0; }
          if gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${UPLOAD_REF}"; then echo 'Branch temporária removida.'; else echo 'Branch já ausente ou sem permissão de remoção; resultado preservado.'; fi

      - name: Resumo da execução
        if: always()
        env:
          MODE: ${{ inputs.mode }}
          CID: ${{ inputs.conversation_id || format('run-{0}', github.run_id) }}
          PROVIDER: ${{ inputs.model_provider }}
          MODEL_ID: ${{ inputs.model_id }}
          AUTONOMY: ${{ inputs.autonomy }}
          ALLOW_BUILD: ${{ inputs.allow_build }}
        shell: bash
        run: |
          {
            echo '## MEVA CODE V16'
            echo "- Modo: ${MODE}"
            echo "- Conversa: ${CID}"
            echo "- Provedor solicitado: ${PROVIDER}"
            echo "- Modelo solicitado: ${MODEL_ID:-padrão do provedor}"
            echo "- Autonomia: ${AUTONOMY}"
            echo "- Build autorizado: ${ALLOW_BUILD}"
            echo '- Upload: arquivos, múltiplos arquivos, diretórios e ZIP; blocos de 2 MiB com SHA-256.'
            echo '- Persistência: checkpoint, histórico e Release verificado.'
            echo '- Estado: concluído somente após finalização real; limites produzem resultado parcial.'
          } >> "$GITHUB_STEP_SUMMARY"
