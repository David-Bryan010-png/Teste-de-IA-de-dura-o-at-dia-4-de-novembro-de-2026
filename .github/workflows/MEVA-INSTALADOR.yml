                              if len(h) != 110 or h[:6] not in (b'070701', b'070702'):
                                  raise RuntimeError('Cabeçalho CPIO newc inválido/truncado.')
                              fields = [int(h[6 + i * 8:14 + i * 8], 16) for i in range(13)]
                              mode, size, namesz, expected_check = fields[1], fields[6], fields[11], fields[12]
                              if namesz < 1 or namesz > 4096 or size > MAX_UNPACKED:
                                  raise RuntimeError('Entrada CPIO fora dos limites.')
                              name_b = f.read(namesz)
                              if len(name_b) != namesz or not name_b.endswith(b'\0'):
                                  raise RuntimeError('Nome CPIO truncado ou sem terminador NUL.')
                              rawname = name_b[:-1].decode('utf-8', 'strict')
                              pad = (4 - ((110 + namesz) % 4)) % 4
                              if pad and len(f.read(pad)) != pad:
                                  raise RuntimeError('Padding de nome CPIO truncado.')
                              checksum = 0
                              remaining = size
                              while remaining:
                                  block = f.read(min(1024 * 1024, remaining))
                                  if not block:
                                      raise RuntimeError('Conteúdo CPIO truncado.')
                                  if h[:6] == b'070702':
                                      checksum = (checksum + sum(block)) & 0xffffffff
                                  remaining -= len(block)
                              pad = (4 - (size % 4)) % 4
                              if pad and len(f.read(pad)) != pad:
                                  raise RuntimeError('Padding de dados CPIO truncado.')
                              if h[:6] == b'070702' and checksum != expected_check:
                                  raise RuntimeError('Checksum CPIO CRC divergente em ' + rawname)
                              if rawname == 'TRAILER!!!':
                                  trailer = True
