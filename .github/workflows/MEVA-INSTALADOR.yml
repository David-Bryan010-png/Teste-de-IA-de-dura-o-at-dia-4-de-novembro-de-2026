              return p,q.as_posix()
          def clean_env():
              e=os.environ.copy(); bad=re.compile(r'(TOKEN|SECRET|PASSWORD|CREDENTIAL|PRIVATE_KEY)',re.I)
              for k in list(e):
                  if k.startswith(('GITHUB_','ACTIONS_','RUNNER_')) or bad.search(k): e.pop(k,None)
