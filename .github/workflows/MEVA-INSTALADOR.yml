                  if not self.cfg.write_allowed:
                      return self._notready('run_build', 'Requer autonomia auto.')
                  if not looks_like_build(str(a['command'])):
                      raise ValueError('O comando não parece um build (make, cmake, cargo, npm run build, gcc…). Use run_shell para outros comandos.')
                  r = self._exec(a, 'run_build', True, 1200, 3000)
                  if r.get('status') == 'NOT_RUN':
                      return r
                  self.s.mark_exec_writable(code_edit=False)
                  r['build_invocation'] = True
                  r['edit_seq'] = self.s.edit_seq
                  self.s.last_build = {'command': a['command'], 'ok': r['ok'], 'exit_code': r.get('exit_code'), 'edit_seq': self.s.edit_seq}
                  if r['ok']:
                      self.s.build_ok_seq = self.s.edit_seq
                  return r

