                const manifestData=manifest?JSON.parse(manifest):null;const uploadRef=manifestData?.upload_ref||'';pendingUploadRef=uploadRef;const runRef=br;const payload={ref:runRef,inputs:{mode,message:task,conversation_id:cid,branch:br,upload_ref:uploadRef,max_actions:String($('maxActions').value),attachments:manifest,autonomy:$('autonomy').value,model_provider:$('provider').value,allow_build:$('allowBuild').checked?'true':'false'}};
