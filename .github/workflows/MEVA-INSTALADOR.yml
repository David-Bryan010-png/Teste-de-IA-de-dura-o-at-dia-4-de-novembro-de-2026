          nohup "$SERVER" --model "$MODEL_PATH" --alias "$MODEL_ID" --ctx-size "$MODEL_CONTEXT" --threads "$THREADS" --threads-batch "$THREADS" --batch-size 512 --ubatch-size 256 --parallel 1 --flash-attn auto --cache-prompt --n-gpu-layers "$GPU_LAYERS" --host 127.0.0.1 --port 8080 > /tmp/meva-llama.log 2>&1 &
