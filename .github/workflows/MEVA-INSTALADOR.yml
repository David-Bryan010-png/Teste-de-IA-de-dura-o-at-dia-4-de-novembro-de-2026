          _COMPILE = re.compile(
              r"""(?ix)
              \b(?:compil\w*|recompil\w*)\b
            | \b(?:rod(?:ar|e|a)|execut(?:ar|e|a)|fa(?:z|ça|zer)|ger(?:ar|e)|run|trigger)\s+(?:o\s+|a\s+|um\s+|the\s+|a\s+)?(?:build|make)\b
