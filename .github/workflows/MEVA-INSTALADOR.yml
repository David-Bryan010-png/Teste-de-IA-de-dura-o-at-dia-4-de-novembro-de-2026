                  clean = []
                  for t in todos:
                      if not isinstance(t, dict) or not isinstance(t.get('content'), str) or t.get('status') not in ('pending', 'in_progress', 'done'):
                          raise ValueError('Cada item precisa de content (texto) e status (pending|in_progress|done).')
                      clean.append({'content': t['content'][:300], 'status': t['status']})
                  self.s.todos = clean
                  return {'ok': True, 'todos': clean, 'open': sum(1 for t in clean if t['status'] != 'done')}

