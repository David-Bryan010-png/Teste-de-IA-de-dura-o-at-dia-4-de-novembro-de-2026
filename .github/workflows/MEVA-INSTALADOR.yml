            case "$ACCEL_BACKEND" in cuda) FLAGS+=(-DGGML_CUDA=ON -DGGML_NATIVE=OFF);; hip) FLAGS+=(-DGGML_HIP=ON -DGGML_NATIVE=ON);; vulkan) FLAGS+=(-DGGML_VULKAN=ON -DGGML_NATIVE=ON);; *) FLAGS+=(-DGGML_NATIVE=ON -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS);; esac
