                  if _NEGATION.search(' '.join(window.split()[-4:])):
                      continue
                  return True
              return False


          def compile_requested(text: str) -> bool:
              return _requested(_COMPILE, text)


          def tests_requested(text: str) -> bool:
              return _requested(_TESTS, text)
