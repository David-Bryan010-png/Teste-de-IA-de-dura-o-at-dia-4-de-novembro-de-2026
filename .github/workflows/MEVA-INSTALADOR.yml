                              rel = _norm(rawname)
                              if rel.startswith('/') or any(part == '..' for part in rel.split('/')):
                                  raise RuntimeError('Caminho absoluto/traversal em entrada CPIO: ' + rel[:160])
                              if rel in entries:
                                  raise RuntimeError('Entrada CPIO duplicada: ' + rel)
                              entries[rel] = mode
                              if len(entries) > MAX_FILES * 20:
                                  raise RuntimeError('CPIO contém número excessivo de entradas.')
                          if not trailer:
                              raise RuntimeError('Trailer TRAILER!!! ausente no CPIO.')
                          while True:  # drena até o EOF do gzip para verificar CRC/ISIZE de verdade
