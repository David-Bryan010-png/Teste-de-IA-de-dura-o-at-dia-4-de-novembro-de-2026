name: MEVA V8 — IA otimizada, terminal, ZIP e navegador
run-name: MEVA V8 / ${{ inputs.mode || 'install' }} / ${{ inputs.conversation_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operação da MEVA
        type: choice
        options: [install, chat, agent, self_test]
        default: install
        required: true
      message:
        description: Mensagem ou tarefa para a IA
        type: string
        required: false
        default: ''
      conversation_id:
        description: ID da conversa
        type: string
        required: false
        default: ''
      branch:
        description: Branch do projeto
        type: string
        required: false
        default: ''
      max_actions:
        description: Limite de ações do agente (1 a 24)
        type: number
        required: false
        default: 20
      attachments:
        description: Manifesto interno dos anexos
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: meva-v8-${{ github.repository }}-${{ inputs.conversation_id || github.run_id }}
  cancel-in-progress: false

env:
  CHAT_MODEL_REPO: Qwen/Qwen2.5-0.5B-Instruct-GGUF
  CHAT_MODEL_FILE: qwen2.5-0.5b-instruct-q4_k_m.gguf
  CHAT_MODEL_ID: Qwen2.5-0.5B-Instruct-Q4_K_M
  CHAT_MODEL_CACHE_VERSION: qwen25-instruct-05b-q4km-v2
  AGENT_MODEL_REPO: Qwen/Qwen2.5-Coder-3B-Instruct-GGUF
  AGENT_MODEL_FILE: qwen2.5-coder-3b-instruct-q4_k_m.gguf
  AGENT_MODEL_ID: Qwen2.5-Coder-3B-Instruct-Q4_K_M
  AGENT_MODEL_CACHE_VERSION: qwen25-coder-3b-q4km-v2
  LLAMA_CACHE_VERSION: llama-cpp-v8-openblas-gpu-fallback-v1
  LLAMA_CPP_REPO: https://github.com/ggml-org/llama.cpp.git

jobs:
  install:
    name: Instalar painel MEVA V8
    if: ${{ inputs.mode == 'install' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Exigir branch padrão
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" || { echo "Execute na branch padrão: $DEFAULT_BRANCH" >&2; exit 1; }

      - name: Gerar painel web da MEVA V8
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p public meva-config meva-data/conversations
          touch meva-data/conversations/.gitkeep
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR"><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#080e1b"><title>MEVA V8</title><link rel="manifest" href="./manifest.webmanifest">
          <style>
          :root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif;background:#080e1b;color:#edf4ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1b365f,transparent 55%),#080e1b}.app{width:min(980px,calc(100% - 18px));margin:auto;padding:16px 0 24px}.top,.head,.foot,.sendrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin:4px 2px 18px}.brand{font-weight:950;letter-spacing:.2em}.state,.muted{color:#9aacc4;font-size:11px}.panel{border:1px solid #263650;border-radius:18px;background:linear-gradient(145deg,#121e32,#0b1628);padding:19px;box-shadow:0 20px 60px #0005}.hidden{display:none!important}h1{font-size:25px;margin:5px 0 12px}.eyebrow{font-size:9px;letter-spacing:.15em;color:#91bcff;font-weight:900}input,textarea,select{width:100%;padding:12px;border:1px solid #263650;border-radius:10px;background:#081426;color:#edf4ff;font:inherit;min-width:0}label{display:block;font-size:11px;font-weight:750;margin:10px 0 6px}button{border:1px solid #344d6c;border-radius:10px;padding:10px 14px;background:#11233b;color:#eaf3ff;font-weight:800;cursor:pointer}.primary{background:linear-gradient(110deg,#bad8ff,#79aefb);color:#081426;border:0}.warning,.cap{padding:11px;border:1px solid #66552f;border-radius:10px;background:#251f15;color:#e7d5aa;font-size:10px;line-height:1.55;margin-top:13px}.cap{border-color:#29486d;background:#10223a;color:#c5dafa}.grid{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px;align-items:center}.grid label{margin:0}.messages{height:54vh;min-height:280px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:14px;margin:12px 0;background:#071222;border:1px solid #263650;border-radius:12px}.bubble{max-width:92%;padding:12px;border:1px solid #263650;border-radius:12px;background:#101f34;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.65}.user{align-self:flex-end;background:#182f4d}.role{font-size:9px;font-weight:900;color:#91bcff;letter-spacing:.12em;margin-bottom:5px}.attachments{border:1px dashed #344d6c;border-radius:10px;padding:10px;margin:10px 0}.attachment-list{white-space:pre-wrap;color:#9aacc4;font-size:10px}.status{min-height:20px;font-size:11px;color:#9aacc4;overflow-wrap:anywhere}.ok{color:#65d8a9}.err{color:#ff8e9a}.small{font-size:10px;color:#9aacc4}a{color:#91bcff}footer{text-align:center;color:#71839d;font-size:10px;padding:18px}@media(max-width:620px){.panel{padding:14px}.grid{grid-template-columns:1fr 1fr}.grid label{margin-bottom:-4px}.messages{height:52vh}.bubble{max-width:98%}}
          </style></head><body><main class="app">
          <header class="top"><div class="brand">◆ MEVA V8</div><span id="connection" class="state">DESCONECTADA</span></header>
          <section id="login" class="panel"><div class="eyebrow">ASSISTENTE DE IA</div><h1>Conectar à MEVA</h1><p class="muted">Use um Fine-grained Personal Access Token restrito a este repositório: Actions Read and write, Contents Read and write, Metadata Read-only. O token fica somente na sessão desta aba.</p><form id="loginForm"><label for="token">Token do GitHub</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_…" required><button class="primary" type="submit">Conectar</button><div id="loginStatus" class="status"></div></form><div class="warning">Este repositório é público. Anexos enviados por Release, histórico e resultados podem ficar visíveis publicamente. Não envie senhas, tokens, chaves privadas ou dados pessoais.</div></section>
          <section id="workspace" class="panel hidden"><div class="head"><div><div class="eyebrow">ASSISTENTE SOB DEMANDA</div><h1>Conversa com a MEVA</h1><div id="repoInfo" class="muted"></div></div><button id="newChat">＋ Nova</button></div>
          <div class="grid"><label for="mode">Modo</label><select id="mode"><option value="chat">Conversa rápida</option><option value="agent">Agente completo</option></select><label for="branch">Branch</label><input id="branch" value="main"></div>
          <div class="cap"><b>V8:</b> modelo de chat leve, detecção automática de acelerador real, CPU OpenBLAS, leitura de ZIP por dentro, Bash completo, navegador Playwright, criação de arquivos, compilação e testes.</div>
          <div id="messages" class="messages"></div><form id="composer"><div class="attachments"><label for="files">Arquivos e projetos (ZIP/PDF/binários/código)</label><input id="files" type="file" multiple><div id="fileInfo" class="attachment-list">Até 5 arquivos; 200 MB por arquivo; 500 MB no total.</div></div><textarea id="message" rows="3" maxlength="5500" placeholder="Escreva sua mensagem… (Enter envia)"></textarea><div class="sendrow"><span class="small">Ações do agente: até 24 por execução</span><button id="send" class="primary" type="submit">Enviar ↗</button></div></form><div id="status" class="status">Pronta.</div><div class="foot"><button id="refresh">Atualizar</button><a id="runs" target="_blank" rel="noopener">Execuções</a><button id="logout">Desconectar</button></div></section><footer>MEVA V8 · Qwen · llama.cpp · terminal · ZIP · Chromium</footer></main>
          <script>
          (()=>{'use strict';const $=id=>document.getElementById(id),K='meva_v8_pat',R='meva_v8_repo',C='meva_v8_chat',W='MEVA-INSTALADOR.yml',MAX=500*1024*1024;let owner='',repo='',branch='main',cid='',busy=false,messages=[];
          const say=(t,k='')=>{$('status').textContent=t;$('status').className='status '+k};const api=async(path,opt={})=>{const token=sessionStorage.getItem(K);if(!token)throw Error('Sessão desconectada');const h={Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})};const r=await fetch('https://api.github.com'+path,{...opt,headers:h});if(r.status===204)return null;const t=await r.text();if(!r.ok)throw Error(r.status+': '+(JSON.parse(t||'{}').message||t).slice(0,220));return t?JSON.parse(t):null};const parts=()=>`/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;const valid=x=>typeof x==='string'&&/^[A-Za-z0-9_-]{8,80}$/.test(x);
          function render(){const root=$('messages');root.replaceChildren();if(!messages.length){const p=document.createElement('div');p.className='muted';p.textContent='Como posso ajudar?';root.append(p)}for(const m of messages){const d=document.createElement('div');d.className='bubble '+(m.role==='user'?'user':'');const r=document.createElement('div');r.className='role';r.textContent=m.role==='user'?'VOCÊ':'MEVA';const c=document.createElement('div');c.textContent=m.content||'';d.append(r,c);root.append(d)}root.scrollTop=root.scrollHeight}
          async function loadConversation(){if(!valid(cid))return;try{const d=await api(parts()+'/contents/meva-data/conversations/'+cid+'.json?ref='+encodeURIComponent($('branch').value||branch));const raw=Uint8Array.from(atob(d.content.replace(/\s/g,'')),c=>c.charCodeAt(0));const obj=JSON.parse(new TextDecoder().decode(raw));messages=Array.isArray(obj.messages)?obj.messages:[];render()}catch(e){if(!String(e.message).startsWith('404:'))throw e}}
          async function connect(){const info=await api(parts());owner=info.owner.login;repo=info.name;branch=info.default_branch||'main';$('repoInfo').textContent=owner+'/'+repo+' · '+branch;const q=new URLSearchParams(location.search).get('conversation');cid=valid(q)?q:(localStorage.getItem(C)||crypto.randomUUID());localStorage.setItem(C,cid);$('branch').value=branch;$('runs').href='https://github.com/'+owner+'/'+repo+'/actions/workflows/'+W;$('connection').textContent='CONECTADA';$('connection').className='state ok';$('login').classList.add('hidden');$('workspace').classList.remove('hidden');await loadConversation()}
          $('loginForm').addEventListener('submit',async e=>{e.preventDefault();sessionStorage.setItem(K,$('token').value.trim());try{await connect();$('token').value=''}catch(x){sessionStorage.removeItem(K);$('loginStatus').textContent=x.message}});
          $('files').addEventListener('change',()=>{const f=[...$('files').files],total=f.reduce((a,b)=>a+b.size,0);$('fileInfo').textContent=f.map(x=>x.name+' · '+(x.size/1048576).toFixed(1)+' MB').join('\n')+'\nTotal: '+(total/1048576).toFixed(1)+' MB'+(f.length>5||f.some(x=>x.size>200*1048576)||total>MAX?'\nLIMITE EXCEDIDO':'')});
          async function upload(){const fs=[...$('files').files];if(!fs.length)return '';if(fs.length>5||fs.some(x=>x.size>200*1048576)||fs.reduce((a,b)=>a+b.size,0)>MAX)throw Error('Limite de anexos excedido.');const rel=await api(parts()+'/releases',{method:'POST',body:JSON.stringify({tag_name:'meva-upload-'+cid+'-'+Date.now(),name:'MEVA V8 input',body:'Anexos de entrada; repositório público.',draft:false,prerelease:true})});const base=rel.upload_url.replace(/\{\?name,label\}$/,'');const assets=[];for(let i=0;i<fs.length;i++){const file=fs[i],name=String(i+1).padStart(2,'0')+'-'+file.name.replace(/[^A-Za-z0-9._-]/g,'_').slice(0,90);const response=await fetch(base+'?name='+encodeURIComponent(name),{method:'POST',headers:{Authorization:'Bearer '+sessionStorage.getItem(K),Accept:'application/vnd.github+json','Content-Type':file.type||'application/octet-stream'},body:file});if(!response.ok)throw Error('Upload falhou: HTTP '+response.status);const a=await response.json();assets.push({name,size:file.size,url:a.browser_download_url})}return JSON.stringify(assets)}
          async function runs(){const d=await api(parts()+'/actions/workflows/'+W+'/runs?event=workflow_dispatch&per_page=30');return d.workflow_runs||[]}
          async function poll(previous){const start=Date.now(),end=start+110*60*1000;while(Date.now()<end){const all=await runs(),r=all.find(x=>!previous.has(x.id)&&String(x.display_title||'').includes(cid));if(r){const d=await api(parts()+'/actions/runs/'+r.id);say('MEVA · execução #'+r.run_number+' · '+d.status);if(d.status==='completed'){if(d.conclusion!=='success')throw Error('Execução terminou em '+d.conclusion+'. Veja os logs.');return}}else say('Solicitação enviada; aguardando o runner…');await new Promise(x=>setTimeout(x,5000))}throw Error('Tempo de espera do painel excedido; a execução pode continuar no GitHub Actions.')}
          $('composer').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const msg=$('message').value.trim(),files=[...$('files').files];if(!msg&&!files.length)return;const branch=$('branch').value.trim()||'main';if(!/^[A-Za-z0-9._/-]+$/.test(branch)||branch.includes('..'))return say('Branch inválida.','err');busy=true;$('send').disabled=true;try{const old=await runs(),ids=new Set(old.map(x=>x.id));say(files.length?'Enviando anexos…':'Iniciando MEVA…');const attachments=await upload();const mode=files.length?'agent':$('mode').value;const task=msg||'Inspecione todos os anexos; identifique e explique a estrutura e o conteúdo.';messages.push({role:'user',content:task});render();$('message').value='';$('files').value='';const response=await api(parts()+'/actions/workflows/'+W+'/dispatches',{method:'POST',body:JSON.stringify({ref:branch,inputs:{mode,message:task,conversation_id:cid,branch,max_actions:'24',attachments}})});await poll(ids);await loadConversation();say('Resposta recebida.','ok')}catch(x){say(x.message,'err');await loadConversation().catch(()=>{})}finally{busy=false;$('send').disabled=false}});
          $('newChat').onclick=()=>{cid=crypto.randomUUID();localStorage.setItem(C,cid);messages=[];window.history.replaceState({},'',location.pathname+'?conversation='+cid);render();say('Nova conversa criada.')};$('refresh').onclick=()=>loadConversation().then(()=>say('Atualizado.','ok')).catch(e=>say(e.message,'err'));$('logout').onclick=()=>{sessionStorage.removeItem(K);location.reload()};if(sessionStorage.getItem(K)){const p=location.hostname.endsWith('.github.io')?location.hostname.replace('.github.io','')+'/'+(location.pathname.split('/').filter(Boolean)[0]||''):'';if(p){[owner,repo]=p.split('/');connect().catch(e=>{sessionStorage.removeItem(K);$('loginStatus').textContent=e.message})}}
          })();</script></body></html>
          HTML
          cat > public/manifest.webmanifest <<'JSON'
          {"name":"MEVA V8","short_name":"MEVA","lang":"pt-BR","start_url":"./","scope":"./","display":"standalone","background_color":"#080e1b","theme_color":"#080e1b"}
          JSON
          touch public/.nojekyll
          for f in IDENTITY.md RESPONSE_RULES.md AGENT_RULES.md PROJECT_CONTEXT.md; do
            test -s "meva-config/$f" || printf '%s\n' "# $f" > "meva-config/$f"
          done
          cat > MEVA-LEIA-ME.md <<'DOC'
          # MEVA V8
          - Chat leve: Qwen2.5-0.5B-Instruct Q4_K_M (~491 MB), qualidade menor que modelos maiores.
          - Programação: Qwen2.5-Coder-3B-Instruct Q4_K_M.
          - llama.cpp com backend detectado automaticamente: CUDA, HIP/ROCm, Vulkan ou CPU/OpenMP/OpenBLAS.
          - Inspeção de ZIP sem extração, leitura de entradas e extração segura com limites.
          - Terminal Bash integral sob demanda no runner efêmero, sem variáveis de segredo do GitHub no subprocesso.
          - Chromium/Playwright headless sob demanda; ler, clicar, preencher, screenshot e download.
          - Criação, leitura, edição, busca, compilação, testes, pesquisa web e exportação de projeto.
          ## Instalação
          Execute este workflow na branch padrão com mode=install.
          ## Token
          Fine-grained PAT restrito a este repositório: Actions Read and write, Contents Read and write, Metadata Read-only.
          ## Limites e privacidade
          Até 5 anexos, 200 MB por arquivo, 500 MB por envio; ZIP até 1 GB expandido. Este repositório é público: Releases, histórico e arquivos anexados podem ficar públicos. Nunca envie segredos.
          ## Acelerador
          Runner padrão ubuntu-24.04 normalmente não tem GPU. A V8 detecta dispositivos realmente expostos; sem GPU, usa CPU. OpenBLAS pode acelerar processamento de prompt, mas não garante aumento de tokens/segundo. GPU requer runner e driver compatíveis.
          ## Terminal e navegador
          Comandos rodam na VM temporária do GitHub Actions, não no celular/PC do usuário. Browser usa Chromium headless e não herda logins do seu navegador. Não contorna CAPTCHA/MFA.
          DOC
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('public/index.html').read_text(encoding='utf-8')
          match=re.search(r'<script>(.*?)</script>',html,re.S)
          if not match: raise SystemExit('Script do painel ausente.')
          Path('/tmp/meva-ui.js').write_text(match.group(1),encoding='utf-8')
          PY
          node --check /tmp/meva-ui.js

      - name: Publicar painel e memória inicial
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public meva-config MEVA-LEIA-ME.md meva-data/conversations/.gitkeep
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "MEVA V8: painel e configurações"
            AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:${DEFAULT_BRANCH}"
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Criar artefato Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  prepare-runtime:
    name: Preparar modelo leve e llama.cpp
    if: ${{ inputs.mode == 'install' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Detectar acelerador físico
        id: accel
        shell: bash
        run: |
          set -Eeuo pipefail
          B=cpu
          if command -v nvidia-smi >/dev/null 2>&1 && command -v nvcc >/dev/null 2>&1 && nvidia-smi -L >/dev/null 2>&1; then B=cuda
          elif [[ -e /dev/kfd ]] && command -v rocminfo >/dev/null 2>&1 && command -v hipcc >/dev/null 2>&1 && rocminfo >/dev/null 2>&1; then B=hip
          elif compgen -G '/dev/dri/renderD*' >/dev/null && command -v vulkaninfo >/dev/null 2>&1 && command -v glslc >/dev/null 2>&1; then
            V="$(vulkaninfo --summary 2>/dev/null || true)"
            if grep -Eiq 'deviceName.*(nvidia|amd|radeon|intel|arc)' <<<"$V" && ! grep -Eiq 'llvmpipe|lavapipe|software rasterizer' <<<"$V"; then B=vulkan; fi
          fi
          L=0; [[ "$B" == cpu ]] || L=999
          echo "backend=$B" >> "$GITHUB_OUTPUT"; echo "layers=$L" >> "$GITHUB_OUTPUT"
          echo "Acelerador real: $B"

      - name: Cache do llama.cpp
        uses: actions/cache@v4
        with:
          path: ~/.cache/meva/llama.cpp
          key: meva-v8-llama-${{ runner.os }}-${{ steps.accel.outputs.backend }}-${{ env.LLAMA_CACHE_VERSION }}

      - name: Cache do modelo de chat
        uses: actions/cache@v4
        with:
          path: ~/.cache/meva/models/chat
          key: meva-v8-chat-${{ runner.os }}-${{ env.CHAT_MODEL_CACHE_VERSION }}

      - name: Compilar runtime otimizado com fallback seguro
        env:
          ACCEL_BACKEND: ${{ steps.accel.outputs.backend }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libopenblas-dev
          CACHE="$HOME/.cache/meva/llama.cpp"; SERVER="$CACHE/build/bin/llama-server"
          if [[ ! -x "$SERVER" ]]; then
            rm -rf "$CACHE"; git clone --depth 1 "$LLAMA_CPP_REPO" "$CACHE"
            FLAGS=(-DGGML_OPENMP=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF)
            case "$ACCEL_BACKEND" in
              cuda) FLAGS+=(-DGGML_CUDA=ON -DGGML_NATIVE=OFF) ;;
              hip) FLAGS+=(-DGGML_HIP=ON -DGGML_NATIVE=ON) ;;
              vulkan) FLAGS+=(-DGGML_VULKAN=ON -DGGML_NATIVE=ON) ;;
              *) FLAGS+=(-DGGML_NATIVE=ON -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS) ;;
            esac
            if ! cmake -S "$CACHE" -B "$CACHE/build" -G Ninja -DCMAKE_BUILD_TYPE=Release "${FLAGS[@]}" || ! cmake --build "$CACHE/build" --parallel 4 --target llama-server; then
              if [[ "$ACCEL_BACKEND" == cpu ]]; then exit 1; fi
              echo "Backend $ACCEL_BACKEND falhou; recompilando CPU/OpenBLAS."
              ACCEL_BACKEND=cpu
              rm -rf "$CACHE/build"
              cmake -S "$CACHE" -B "$CACHE/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DGGML_OPENMP=ON -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
              cmake --build "$CACHE/build" --parallel 4 --target llama-server
            fi
            printf '%s\n' "$ACCEL_BACKEND" > "$CACHE/build/meva-backend"
          fi
          test -x "$SERVER"; "$SERVER" --version

      - name: Baixar Qwen leve
        shell: bash
        run: |
          set -Eeuo pipefail
          MODEL="$HOME/.cache/meva/models/chat/$CHAT_MODEL_FILE"; mkdir -p "$(dirname "$MODEL")"
          if [[ ! -s "$MODEL" ]] || (( $(stat -c%s "$MODEL") < 450000000 )); then
            rm -f "$MODEL"
            curl --fail --location --retry 8 --retry-all-errors --connect-timeout 30 --output "$MODEL" "https://huggingface.co/${CHAT_MODEL_REPO}/resolve/main/${CHAT_MODEL_FILE}?download=true"
          fi
          SIZE=$(stat -c%s "$MODEL"); (( SIZE >= 450000000 && SIZE <= 620000000 )) || { echo "Tamanho de modelo inválido: $SIZE"; exit 1; }
          head -c 4 "$MODEL" | grep -q GGUF

  deploy-pages:
    name: Publicar painel
    if: ${{ inputs.mode == 'install' }}
    needs: [install]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  ai:
    name: Executar MEVA V8
    if: ${{ inputs.mode == 'chat' || inputs.mode == 'agent' || inputs.mode == 'self_test' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar entrada e detectar saudação
        id: request
        env:
          MODE: ${{ inputs.mode }}
          MESSAGE: ${{ inputs.message }}
          CID: ${{ inputs.conversation_id }}
          TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
          MAX_ACTIONS: ${{ inputs.max_actions }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$MODE" == self_test || -n "${MESSAGE//[[:space:]]/}" ]] || { echo 'Mensagem vazia.'; exit 1; }
          (( ${#MESSAGE} <= 5500 )) || { echo 'Mensagem acima de 5.500 caracteres.'; exit 1; }
          [[ -z "$CID" || "$CID" =~ ^[A-Za-z0-9_-]{8,80}$ ]] || { echo 'conversation_id inválido.'; exit 1; }
          [[ "$MAX_ACTIONS" =~ ^[0-9]+$ ]] && (( MAX_ACTIONS >= 1 && MAX_ACTIONS <= 24 )) || { echo 'max_actions precisa ser 1..24.'; exit 1; }
          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null
          FAST=false
          if [[ "$MODE" == chat ]]; then
            N=$(printf '%s' "$MESSAGE" | tr '[:upper:]' '[:lower:]' | xargs)
            case "$N" in oi|olá|ola|"oi meva"|"olá meva"|"bom dia"|"boa tarde"|"boa noite"|"tudo bem"|valeu|obrigado|obrigada|ok) FAST=true;; esac
          fi
          echo "fast=$FAST" >> "$GITHUB_OUTPUT"

      - name: Detectar acelerador real
        id: accelerator
        if: ${{ steps.request.outputs.fast != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          B=cpu
          if command -v nvidia-smi >/dev/null 2>&1 && command -v nvcc >/dev/null 2>&1 && nvidia-smi -L >/dev/null 2>&1; then B=cuda
          elif [[ -e /dev/kfd ]] && command -v rocminfo >/dev/null 2>&1 && command -v hipcc >/dev/null 2>&1 && rocminfo >/dev/null 2>&1; then B=hip
          elif compgen -G '/dev/dri/renderD*' >/dev/null && command -v vulkaninfo >/dev/null 2>&1 && command -v glslc >/dev/null 2>&1; then
            V="$(vulkaninfo --summary 2>/dev/null || true)"
            if grep -Eiq 'deviceName.*(nvidia|amd|radeon|intel|arc)' <<<"$V" && ! grep -Eiq 'llvmpipe|lavapipe|software rasterizer' <<<"$V"; then B=vulkan; fi
          fi
          L=0; [[ "$B" == cpu ]] || L=999
          echo "backend=$B" >> "$GITHUB_OUTPUT"; echo "layers=$L" >> "$GITHUB_OUTPUT"
          echo "Acelerador: $B"

      - name: Cache llama.cpp
        if: ${{ steps.request.outputs.fast != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/meva/llama.cpp
          key: meva-v8-llama-${{ runner.os }}-${{ steps.accelerator.outputs.backend }}-${{ env.LLAMA_CACHE_VERSION }}

      - name: Cache modelo chat
        if: ${{ inputs.mode == 'chat' && steps.request.outputs.fast != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/meva/models/chat
          key: meva-v8-chat-${{ runner.os }}-${{ env.CHAT_MODEL_CACHE_VERSION }}

      - name: Cache modelo agente
        if: ${{ inputs.mode == 'agent' || inputs.mode == 'self_test' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/meva/models/agent
          key: meva-v8-agent-${{ runner.os }}-${{ env.AGENT_MODEL_CACHE_VERSION }}

      - name: Cache Chromium Playwright
        if: ${{ inputs.mode == 'agent' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: meva-v8-playwright-${{ runner.os }}-chromium-v1

      - name: Preparar ferramentas do agente
        if: ${{ inputs.mode == 'agent' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc g++ clang make cmake ninja-build pkg-config libopenblas-dev libopenblas0-pthread git curl wget zip unzip p7zip-full file python3-dev python3-venv python3-pip poppler-utils libssl-dev zlib1g-dev libffi-dev libsqlite3-dev libxml2-dev maven gradle php-cli ruby-full lua5.4 perl iproute2 iputils-ping dnsutils traceroute netcat-openbsd
          python -m pip install --disable-pip-version-check pytest

      - name: Preparar Node sem cache de lockfile obrigatório
        if: ${{ inputs.mode == 'agent' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Go
        if: ${{ inputs.mode == 'agent' }}
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Preparar Java
        if: ${{ inputs.mode == 'agent' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar .NET
        if: ${{ inputs.mode == 'agent' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Baixar e validar modelo GGUF
        if: ${{ steps.request.outputs.fast != 'true' }}
        id: model
        env:
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$MODE" == chat ]]; then REPO="$CHAT_MODEL_REPO"; FILE="$CHAT_MODEL_FILE"; DIR="$HOME/.cache/meva/models/chat"; MIN=450000000; MAX=620000000; ID="$CHAT_MODEL_ID"; CTX=4096
          else REPO="$AGENT_MODEL_REPO"; FILE="$AGENT_MODEL_FILE"; DIR="$HOME/.cache/meva/models/agent"; MIN=1800000000; MAX=2800000000; ID="$AGENT_MODEL_ID"; CTX=12288; fi
          mkdir -p "$DIR"; MODEL="$DIR/$FILE"
          if [[ ! -s "$MODEL" ]] || (( $(stat -c%s "$MODEL") < MIN )); then
            rm -f "$MODEL"; curl --fail --location --retry 8 --retry-all-errors --connect-timeout 30 --output "$MODEL" "https://huggingface.co/${REPO}/resolve/main/${FILE}?download=true"
          fi
          SIZE=$(stat -c%s "$MODEL"); (( SIZE >= MIN && SIZE <= MAX )) || { echo "GGUF com tamanho inesperado: $SIZE"; exit 1; }
          head -c 4 "$MODEL" | grep -q GGUF
          echo "model_path=$MODEL" >> "$GITHUB_OUTPUT"; echo "model_id=$ID" >> "$GITHUB_OUTPUT"; echo "context=$CTX" >> "$GITHUB_OUTPUT"

      - name: Compilar llama.cpp se necessário
        id: llama_runtime
        if: ${{ steps.request.outputs.fast != 'true' }}
        env:
          ACCEL_BACKEND: ${{ steps.accelerator.outputs.backend }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libopenblas-dev libopenblas0-pthread
