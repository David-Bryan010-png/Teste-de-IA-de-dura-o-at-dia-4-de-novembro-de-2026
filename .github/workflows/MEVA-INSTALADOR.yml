          """Provedores de IA com tool calling NATIVO, prompt caching e validação de modelos.

          Formato canônico de mensagens (igual ao da Anthropic): cada mensagem é
          {'role': 'user'|'assistant', 'content': str | [blocos]}, com blocos
            {'type':'text','text'} | {'type':'tool_use','id','name','input'} |
            {'type':'tool_result','tool_use_id','content','is_error'}
          O adaptador de cada provedor converte desse formato. Assim o Router pode trocar de provedor
          no meio da tarefa (fallback em AUTO) sem perder o histórico.
          """
          from __future__ import annotations

          import copy
          import difflib
          import json
          import random
          import socket
          import time
          import urllib.error
          import urllib.request
          from dataclasses import dataclass, field

          from .config import KEY_ENV
          from .util import log, redact

          # Cadeias de modelos padrão. IDs de claude-* são os atuais da Anthropic; os demais preservam a V16.
          # A disponibilidade REAL é verificada em /v1/models antes de usar (ver resolve_model).
          DEFAULT_MODELS = {
              'nvidia': ['nvidia/nemotron-3.5-lightning-30b-a3b'],
              'claude': ['claude-sonnet-5-5', 'claude-opus-5-5', 'claude-haiku-5-5', 'claude-fable-5-2',
                         'claude-sonnet-5', 'claude-opus-5', 'claude-fable-5'],
              'openai': ['gpt-6.1-sol'],
              'xai': ['grok-4.7'],
          }
          CHEAP_MODELS = {'claude': ['claude-haiku-5-5']}
          BASE_URLS = {
              'nvidia': 'https://integrate.api.nvidia.com/v1',
              'openai': 'https://api.openai.com/v1',
              'xai': 'https://api.x.ai/v1',
          }
          ANTHROPIC_URL = 'https://api.anthropic.com/v1'


          class ProviderError(RuntimeError):
              def __init__(self, message, status=None, transient=False):
                  super().__init__(message)
                  self.status = status
                  self.transient = transient


          @dataclass
          class ToolCall:
              id: str
              name: str
              args: dict | None
              error: str | None = None


          @dataclass
          class Turn:
              text: str = ''
              tool_calls: list = field(default_factory=list)
              stop_reason: str = 'end_turn'
              usage: dict = field(default_factory=dict)
              blocks: list = field(default_factory=list)  # blocos canônicos do assistente (para o histórico)
              provider: str = ''
              model: str = ''


          # ---------------------------------------------------------------------------------- HTTP
          def _http(method: str, url: str, headers: dict, payload=None, timeout: int = 600, retries: int = 3):
              """Só repete quando o provedor REJEITOU a requisição antes de processá-la (429/502/503/529).
              Timeout/queda de rede NUNCA repete: o POST pode ter sido processado e cobrado."""
              data = json.dumps(payload, ensure_ascii=False).encode('utf-8') if payload is not None else None
              for attempt in range(retries + 1):
                  req = urllib.request.Request(url, data=data, method=method,
                                               headers={**headers, 'Content-Type': 'application/json', 'User-Agent': 'MEVA-CODE-V19'})
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return json.loads(r.read().decode('utf-8')), dict(r.headers)
                  except urllib.error.HTTPError as e:
                      body = e.read(3000).decode('utf-8', 'replace')
                      if e.code in (429, 502, 503, 529) and attempt < retries:
                          try:
                              delay = float((e.headers or {}).get('Retry-After') or 0)
                          except (TypeError, ValueError):
                              delay = 0
                          delay = max(delay, min(30, 2 ** attempt)) + random.uniform(0, 0.75)
                          log(f'Provedor respondeu HTTP {e.code} (requisição rejeitada); nova tentativa em {delay:.1f}s.')
                          time.sleep(min(delay, 60))
                          continue
                      raise ProviderError('API HTTP ' + str(e.code) + ': ' + redact(body), e.code,
                                          transient=e.code in (408, 425, 429, 500, 502, 503, 504, 529))
                  except (urllib.error.URLError, TimeoutError, ConnectionError, socket.timeout) as e:
                      raise ProviderError('Falha de rede/timeout sem retry automático (a chamada pode ter sido processada): ' + redact(e), None, True)
                  except json.JSONDecodeError as e:
                      raise ProviderError('Resposta da API não é JSON: ' + redact(e), None, False)
              raise ProviderError('Falha de API após novas tentativas.', None, True)


          # ---------------------------------------------------------------------------------- catálogo
          def provider_for_model(model: str):
              low = model.lower()
              if low.startswith(('nvidia/', 'z-ai/')):
                  return 'nvidia'
              if low.startswith('claude-'):
                  return 'claude'
              if low.startswith('gpt-'):
                  return 'openai'
              if low.startswith('grok-'):
                  return 'xai'
              return None


          def list_models(provider: str, key: str):
              """IDs disponíveis para esta chave, ou None se o catálogo não pôde ser lido."""
              try:
                  if provider == 'claude':
                      d, _ = _http('GET', ANTHROPIC_URL + '/models?limit=1000',
                                   {'x-api-key': key, 'anthropic-version': '2023-06-01'}, None, 30, 1)
                  else:
                      d, _ = _http('GET', BASE_URLS[provider] + '/models', {'Authorization': 'Bearer ' + key}, None, 30, 1)
                  ids = {m.get('id') for m in d.get('data', []) if isinstance(m, dict) and m.get('id')}
                  return ids or None
              except Exception as e:  # noqa: BLE001
                  log(f'Catálogo de modelos indisponível em {provider}: {redact(e, 200)}')
                  return None


          def model_in_catalog(model: str, catalog) -> bool:
              if model in catalog:
                  return True
              # aliases sem data (claude-sonnet-5-5) aparecem no catálogo como claude-sonnet-5-5-YYYYMMDD
              return any(c.startswith(model + '-') and c[len(model) + 1:].isdigit() for c in catalog)


          def resolve_model(provider: str, requested: str, catalog):
              """Escolhe o modelo. Pedido explícito inexistente FALHA (com sugestões); nunca troca em silêncio."""
              if requested:
                  if catalog is None:
                      return requested, 'catálogo indisponível; ID usado sem validação'
                  if model_in_catalog(requested, catalog):
                      return requested, ''
                  close = difflib.get_close_matches(requested, sorted(catalog), n=6, cutoff=0.5)
                  raise RuntimeError(f"Modelo '{requested}' não existe em {provider} para esta chave. "
                                     f"Parecidos: {', '.join(close) if close else '(nenhum)'}. Deixe model_id vazio para usar o padrão.")
              for m in DEFAULT_MODELS[provider]:
                  if catalog is None or model_in_catalog(m, catalog):
                      return m, ('' if catalog is not None else 'catálogo indisponível; padrão usado sem validação')
              sample = ', '.join(sorted(catalog)[:12]) if catalog else ''
              raise RuntimeError(f'Nenhum modelo padrão de {provider} está disponível para esta chave. Informe model_id. Exemplos: {sample}')


          # ---------------------------------------------------------------------------------- Anthropic
          def _blocks(content):
              return [{'type': 'text', 'text': content}] if isinstance(content, str) else copy.deepcopy(content)


          class AnthropicProvider:
              name = 'claude'

              def __init__(self, key: str, model: str, max_tokens: int = 16000):
                  self.key, self.model, self.max_tokens = key, model, max_tokens

              def complete(self, system: str, messages: list, tools: list, max_tokens: int | None = None) -> Turn:
                  msgs = [{'role': m['role'], 'content': _blocks(m['content'])} for m in messages]
                  # Prompt caching: cache do prefixo (tools + system) e de dois pontos móveis do histórico.
                  marks = 0
                  for m in reversed(msgs):
                      if m['role'] == 'user' and m['content'] and marks < 2:
                          m['content'][-1]['cache_control'] = {'type': 'ephemeral'}
                          marks += 1
                  payload = {
                      'model': self.model, 'max_tokens': max_tokens or self.max_tokens,
                      'system': [{'type': 'text', 'text': system, 'cache_control': {'type': 'ephemeral'}}],
                      'messages': msgs,
                  }
                  if tools:
                      payload['tools'] = [{'name': t['name'], 'description': t['description'], 'input_schema': t['input_schema']} for t in tools]
                  data, _ = _http('POST', ANTHROPIC_URL + '/messages',
                                  {'x-api-key': self.key, 'anthropic-version': '2023-06-01'}, payload, 600)
                  text, calls, blocks = [], [], []
                  for b in data.get('content', []):
                      if b.get('type') == 'text' and (b.get('text') or '').strip():
                          text.append(b['text'])
                          blocks.append({'type': 'text', 'text': b['text'].strip()})
                      elif b.get('type') == 'tool_use':
                          inp = b.get('input') if isinstance(b.get('input'), dict) else {}
                          calls.append(ToolCall(b['id'], b['name'], inp))
                          blocks.append({'type': 'tool_use', 'id': b['id'], 'name': b['name'], 'input': inp})
                  u = data.get('usage') or {}
                  usage = {'input': u.get('input_tokens', 0), 'output': u.get('output_tokens', 0),
                           'cache_read': u.get('cache_read_input_tokens', 0), 'cache_write': u.get('cache_creation_input_tokens', 0)}
                  stop = {'tool_use': 'tool_use', 'max_tokens': 'max_tokens'}.get(data.get('stop_reason'), 'end_turn')
                  return Turn(''.join(text).strip(), calls, stop, usage, blocks, self.name, self.model)


          # ---------------------------------------------------------------------------------- OpenAI-compatível
          def to_openai_messages(system: str, messages: list) -> list:
              out = [{'role': 'system', 'content': system}]
              for m in messages:
                  c = m['content']
                  if isinstance(c, str):
                      out.append({'role': m['role'], 'content': c})
                      continue
                  if m['role'] == 'assistant':
                      text = ''.join(b.get('text', '') for b in c if b.get('type') == 'text')
                      calls = [{'id': b['id'], 'type': 'function',
                                'function': {'name': b['name'], 'arguments': json.dumps(b.get('input') or {}, ensure_ascii=False)}}
                               for b in c if b.get('type') == 'tool_use']
                      msg = {'role': 'assistant', 'content': text or None}
                      if calls:
                          msg['tool_calls'] = calls
                      out.append(msg)
                  else:
                      for b in c:  # resultados de ferramenta primeiro, depois texto livre
                          if b.get('type') == 'tool_result':
                              out.append({'role': 'tool', 'tool_call_id': b['tool_use_id'], 'content': b.get('content', '')})
                      text = ''.join(b.get('text', '') for b in c if b.get('type') == 'text')
                      if text:
                          out.append({'role': 'user', 'content': text})
              return out


          class OpenAICompatProvider:
              def __init__(self, name: str, key: str, model: str, base_url: str, token_param: str = 'max_tokens',
                           temperature: float | None = None, extra_headers=None, extra_body=None, max_tokens: int = 14000):
                  self.name, self.key, self.model = name, key, model
                  self.base_url, self.token_param, self.temperature = base_url, token_param, temperature
                  self.extra_headers, self.extra_body, self.max_tokens = extra_headers or {}, extra_body or {}, max_tokens

              def complete(self, system: str, messages: list, tools: list, max_tokens: int | None = None) -> Turn:
                  payload = {'model': self.model, 'messages': to_openai_messages(system, messages),
                             self.token_param: max_tokens or self.max_tokens, **self.extra_body}
                  if self.temperature is not None:
                      payload['temperature'] = self.temperature
                  if tools:
                      payload['tools'] = [{'type': 'function', 'function': {'name': t['name'], 'description': t['description'],
                                                                             'parameters': t['input_schema']}} for t in tools]
                  data, _ = _http('POST', self.base_url + '/chat/completions',
                                  {'Authorization': 'Bearer ' + self.key, **self.extra_headers}, payload, 900)
                  choices = data.get('choices') or []
                  if not choices:
                      raise ProviderError('API não retornou choices: ' + json.dumps(data, ensure_ascii=False)[:800])
                  ch = choices[0]
                  msg = ch.get('message') or {}
                  content = msg.get('content') or ''
                  if isinstance(content, list):
                      content = ''.join(x.get('text', '') for x in content if isinstance(x, dict))
                  calls, blocks = [], []
                  if content.strip():
                      blocks.append({'type': 'text', 'text': content})
                  for i, tc in enumerate(msg.get('tool_calls') or []):
                      fn = tc.get('function') or {}
                      cid = tc.get('id') or f'call_{int(time.time() * 1000)}_{i}'
                      raw = fn.get('arguments') or '{}'
                      try:
                          args = json.loads(raw) if isinstance(raw, str) else raw
                          err = None if isinstance(args, dict) else 'argumentos não são um objeto JSON'
                      except json.JSONDecodeError as e:
                          args, err = None, 'argumentos JSON inválidos (resposta truncada?): ' + str(e)
                      calls.append(ToolCall(cid, fn.get('name', ''), args if isinstance(args, dict) else None, err))
                      blocks.append({'type': 'tool_use', 'id': cid, 'name': fn.get('name', ''), 'input': args if isinstance(args, dict) else {}})
                  u = data.get('usage') or {}
                  cached = ((u.get('prompt_tokens_details') or {}).get('cached_tokens')) or 0
                  usage = {'input': u.get('prompt_tokens', 0), 'output': u.get('completion_tokens', 0), 'cache_read': cached, 'cache_write': 0}
                  fr = ch.get('finish_reason')
                  stop = 'max_tokens' if fr == 'length' else ('tool_use' if calls else 'end_turn')
                  return Turn(content.strip(), calls, stop, usage, blocks, self.name, self.model)


          def make_provider(name: str, key: str, model: str, cid: str):
              if name == 'claude':
                  return AnthropicProvider(key, model)
              if name == 'nvidia':
                  return OpenAICompatProvider('nvidia', key, model, BASE_URLS['nvidia'], 'max_tokens', temperature=0.2)
              if name == 'openai':
                  return OpenAICompatProvider('openai', key, model, BASE_URLS['openai'], 'max_completion_tokens',
                                              extra_body={'prompt_cache_key': cid})
              if name == 'xai':
                  return OpenAICompatProvider('xai', key, model, BASE_URLS['xai'], 'max_completion_tokens',
                                              extra_headers={'x-grok-conv-id': cid})
              raise RuntimeError('Provedor desconhecido: ' + name)


          # ---------------------------------------------------------------------------------- Router
          def provider_candidates(cfg) -> list:
              req, model, keys = cfg.requested_provider, cfg.requested_model, cfg.api_keys
              if req != 'auto':
                  if not keys.get(KEY_ENV.get(req, '')):
                      raise RuntimeError('Chave ausente para provedor manual ' + req + '.')
                  if model:
                      detected = provider_for_model(model)
                      if detected and detected != req:
                          raise RuntimeError('ID do modelo parece pertencer a ' + detected + ', provedor selecionado é ' + req + '.')
                  return [req]
              if model:
                  detected = provider_for_model(model)
                  if not detected:
                      raise RuntimeError('ID personalizado sem prefixo reconhecido; selecione o provedor manualmente.')
                  if not keys.get(KEY_ENV[detected]):
                      raise RuntimeError('O modelo selecionado requer chave ' + KEY_ENV[detected] + '.')
                  return [detected]
              return [p for p in ('nvidia', 'claude', 'openai', 'xai') if keys.get(KEY_ENV[p])]


          class Router:
              """Chama o provedor atual; em AUTO, falha transitória passa para o próximo (sem repetir o POST)."""

              def __init__(self, cfg, prefer_cheap: bool = False, candidates=None, factory=None):
                  self.cfg = cfg
                  self.prefer_cheap = prefer_cheap
                  self.candidates = candidates if candidates is not None else provider_candidates(cfg)
                  if not self.candidates:
                      raise RuntimeError('Nenhuma chave de IA configurada nos GitHub Secrets.')
                  self.fixed = cfg.requested_provider != 'auto' or bool(cfg.requested_model)
                  self.idx = 0
                  self._providers: dict = {}
                  self._factory = factory or self._default_factory
                  self.provider = ''
                  self.model = ''
                  self.usage = {'input': 0, 'output': 0, 'cache_read': 0, 'cache_write': 0, 'calls': 0}

              def _default_factory(self, name):
                  key = self.cfg.api_keys[KEY_ENV[name]]
                  catalog = list_models(name, key)
                  if self.prefer_cheap and catalog is not None:
                      # subagentes de leitura usam o modelo barato só se ele existir; senão, o mesmo modelo do agente principal
                      for m in CHEAP_MODELS.get(name, []):
                          if model_in_catalog(m, catalog):
                              log(f'Subagentes: provedor {name} / modelo {m}')
                              return make_provider(name, key, m, self.cfg.cid)
                  model, note = resolve_model(name, self.cfg.requested_model, catalog)
                  if note:
                      log(f'{name}: {note}')
                  log(f'Provedor {name} / modelo {model}')
                  return make_provider(name, key, model, self.cfg.cid)

              def _get(self, i):
                  name = self.candidates[i]
                  if name not in self._providers:
                      self._providers[name] = self._factory(name)
                  return self._providers[name]

              def complete(self, system: str, messages: list, tools: list, max_tokens: int | None = None) -> Turn:
                  errors = []
                  while True:
                      name = self.candidates[self.idx]
                      try:
                          prov = self._get(self.idx)
                          turn = prov.complete(system, messages, tools, max_tokens)
                          self.provider, self.model = turn.provider or prov.name, turn.model or prov.model
                          for k in ('input', 'output', 'cache_read', 'cache_write'):
                              self.usage[k] += int(turn.usage.get(k, 0) or 0)
                          self.usage['calls'] += 1
                          return turn
                      except ProviderError as e:
                          msg = redact(e)
                          errors.append(name + ': ' + msg)
                          if self.fixed or not e.transient or self.idx == len(self.candidates) - 1:
                              raise RuntimeError('Falha no provedor ' + name + ': ' + msg)
                          log('Fallback AUTO por erro transitório em ' + name + '; nenhuma repetição do mesmo POST.')
                          self.idx += 1
