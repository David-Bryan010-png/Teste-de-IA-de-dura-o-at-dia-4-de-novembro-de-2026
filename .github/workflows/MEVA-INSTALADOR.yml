                  r = interpret_test_result(r)
                  r['test_command'] = command
                  if self.role == 'main':
                      self.s.last_tests = {'command': command, 'ok': r.get('ok'), 'status': r.get('status'), 'exit_code': r.get('exit_code'), 'edit_seq': self.s.edit_seq}
                      if r.get('ok') is True and looks_like_test_runner(command):
