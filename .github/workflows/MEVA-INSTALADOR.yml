              def detect(self, names, user_text: str) -> bool:
                  if _TRIGGER_TEXT.search(user_text or ''):
                      return True
                  return any(Path(n).name.lower() in _TRIGGER_FILES for n in names)

              def prompt_hint(self) -> str:
                  return ('Plugin XWT ativo: Xbox 360 usa Xenon PowerPC 32-bit big-endian, Xenos, cadeia de boot (XeLL/kboot), '
                          'USB e rootfs. Diferencie ELF PowerPC de kernel raw. Use analyze_architecture para a auditoria estática. '
                          'Não declare que inicializa no Xbox sem evidência física.')

              # ------------------------------------------------------------------ auditoria
              def audit(self, ws) -> dict:
                  names = set(ws.inventory(0, MAX_FILES))
                  project = ws.project
                  report = {'scope': 'static-only; no physical Xbox boot claimed', 'checks': []}

                  def add(name, status, detail):
                      report['checks'].append({'check': name, 'status': status, 'detail': detail})

                  by_lower = {Path(n).name.lower(): n for n in names}
                  elf_candidates = [n for n in names if Path(n).name in ('xenon.elf', 'vmlinux', 'zImage.xenon')]
                  for name in elf_candidates:
                      p = project / name
                      try:
                          size = p.stat().st_size
                          with p.open('rb') as f:
