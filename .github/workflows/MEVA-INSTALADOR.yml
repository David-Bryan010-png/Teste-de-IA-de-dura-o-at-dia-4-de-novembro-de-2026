                      dev_null = 'dev/null' in entries
                      add(name, 'PASS' if init_found and init_exec else 'WARN',
                          'Gzip CRC/ISIZE e CPIO newc verificados; ' + str(len(entries)) + ' entradas; trailer presente; init='
                          + str(init_found or 'não encontrado') + '; executável=' + str(init_exec) + '; /dev/console=' + str(dev_console)
                          + '; /dev/null=' + str(dev_null) + '; dados após trailer não zero=' + str(trailing_nonzero) + '.')
                      if not dev_console or not dev_null:
