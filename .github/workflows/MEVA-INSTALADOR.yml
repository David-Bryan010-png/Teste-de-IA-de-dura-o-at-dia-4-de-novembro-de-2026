          )

          API = "http://127.0.0.1:8080/v1/chat/completions"
          MODEL_ID = os.environ.get(
              "MODEL_ID",
              "Qwen2.5-Coder-3B-Instruct-Q4_K_M"
          )

          STATE_DIR = ROOT / "meva-data" / "conversations"
          STATE_PATH = STATE_DIR / f"{CID}.json"
          INBOX = ROOT / "meva-inbox" / CID
          EXPORT_DIR = Path("/tmp/meva-exports")

          STATE_DIR.mkdir(parents=True, exist_ok=True)
          EXPORT_DIR.mkdir(parents=True, exist_ok=True)

          READ_FILES = set()
          EXPORTED_FILES = set()

          MARKER = "MEVA_ATTACHMENT_MANIFEST: "

          USER_TEXT = "\n".join(
              line for line in RAW_MESSAGE.splitlines()
              if not line.startswith(MARKER)
          ).strip()

          def call_model(
              messages,
              max_tokens=1000,
              json_mode=False,
              temperature=0.35
          ):
              body = {
                  "model": MODEL_ID,
                  "messages": messages,
                  "temperature": temperature,
                  "top_p": 0.88,
                  "max_tokens": max_tokens,
                  "stream": False
              }

              if json_mode:
                  body["response_format"] = {"type": "json_object"}

              request = urllib.request.Request(
                  API,
                  data=json.dumps(
                      body,
                      ensure_ascii=False
                  ).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=900) as response:
                      result = json.loads(response.read().decode("utf-8"))

                  content = result["choices"][0]["message"].get("content", "")

                  return content.strip() if isinstance(content, str) else ""

              except (
                  HTTPError,
                  URLError,
                  TimeoutError,
                  KeyError,
                  IndexError,
                  json.JSONDecodeError
              ) as exc:
                  raise RuntimeError(
                      f"Falha ao consultar o modelo: {exc}"
                  ) from exc

          def read_config(name, limit=8000):
              path = ROOT / "meva-config" / name

              if not path.is_file():
                  return ""

              try:
                  return path.read_text(encoding="utf-8")[:limit].strip()
              except (OSError, UnicodeError):
                  return ""

          CORE_PROMPT = """
          Você é MEVA, uma assistente de inteligência artificial baseada no
          Qwen2.5-Coder-3B-Instruct.

          IDENTIDADE:
          Você não é uma pessoa, não é consciente e não é AGI. Não finja
          possuir capacidades inexistentes. Seu objetivo é resolver
          solicitações de forma concreta.

          COMUNICAÇÃO:
          Responda em português brasileiro por padrão. Seja direta, clara,
          precisa e natural. Não repita saudações. Não comece todas as
          respostas com "Olá" ou "Como posso ajudar?". Continue a conversa
