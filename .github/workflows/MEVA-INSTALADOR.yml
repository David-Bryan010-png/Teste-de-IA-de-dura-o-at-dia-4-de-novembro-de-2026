                  except Exception as e:  # noqa: BLE001
                      raise RuntimeError('Manifesto JSON inválido: ' + redact(e))
                  if not isinstance(manifest, dict) or manifest.get('version') != 1 or manifest.get('upload_id') != meta['upload_id']:
                      raise RuntimeError('Manifesto incompatível com o upload_id.')
                  files = manifest.get('files')
                  declared = manifest.get('total_size')
                  if not isinstance(files, list) or not files or len(files) > MAX_UPLOAD_FILES:
                      raise RuntimeError('Lista de arquivos ausente ou acima do limite de upload.')
                  if isinstance(declared, bool) or not isinstance(declared, int) or not 0 < declared <= MAX_INPUT:
                      raise RuntimeError('Tamanho total do manifesto inválido.')
                  commit = gh.get('/git/commits/' + meta['commit_sha'])
