          def safe_path(raw,allow_root=False):
              if allow_root and raw in ('',None,'.'): return PROJECT
              rel=valid_rel(raw)
              if secret_path(rel.parts): raise ValueError('Arquivo sensível protegido.')
              for i in range(1,len(rel.parts)+1):
                  part=PurePosixPath(*rel.parts[:i]).as_posix()
                  if part in SYMLINKS: raise ValueError('Caminho passa por symlink preservado; não será seguido.')
              p=PROJECT.joinpath(*rel.parts)
              for parent in [p,*p.parents]:
                  if parent==PROJECT.parent: break
                  if parent.is_symlink(): raise ValueError('Links simbólicos não podem ser seguidos.')
                  if parent==PROJECT: break
              resolved=p.resolve(strict=False)
              if resolved!=PROJECT.resolve() and PROJECT.resolve() not in resolved.parents: raise ValueError('Caminho escapou do workspace.')
              return p
          def materialize_symlinks():
              created=[];root=PROJECT.resolve()
              for name,target in sorted(SYMLINKS.items()):
                  link=PROJECT.joinpath(*PurePosixPath(name).parts)
                  if link.exists() or link.is_symlink() or not safe_link_target(PurePosixPath(name).parts,target): continue
                  resolved=(link.parent/target).resolve(strict=False)
                  if resolved!=root and root not in resolved.parents: continue
                  link.parent.mkdir(parents=True,exist_ok=True)
                  try: os.symlink(target,link);created.append(link)
                  except OSError: pass
              return created
          def remove_materialized_symlinks(created):
              for link in reversed(created):
