name: MEVA V16 - Instalador + NVIDIA Catalog

'on':
  workflow_dispatch:
    inputs:
      model_mode:
        description: 'Modo de seleção de modelo (auto ou manual)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - manual
      model_id:
        description: 'ID do modelo (obrigatório no modo manual). Ex: nvidia/nemotron-3-ultra-550b-a55b'
        required: false
        type: string
      allow_fallback:
        description: 'Permitir fallback apenas no modo manual se o modelo falhar'
        required: false
        type: boolean
        default: false
      task_description:
        description: 'Descrição da tarefa (usada na seleção automática)'
        required: false
        type: string
        default: 'Auditoria e correção do projeto XWT Linux'
      sync_catalog:
        description: 'Tentar atualizar o catálogo NVIDIA'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  meva-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests openai

      - name: Ensure NVIDIA Catalog
        run: |
          python3 << 'EOF'
          import json, os
          from datetime import datetime, timezone

          CATALOG = "nvidia_models.json"
          if os.path.exists(CATALOG):
              print("Catálogo existente encontrado.")
          else:
              print("Criando catálogo inicial...")
              catalog = {
                "last_updated": datetime.now(timezone.utc).isoformat(),
                "base_url": "https://integrate.api.nvidia.com/v1",
                "models": {
                  "nvidia/nemotron-3-ultra-550b-a55b": {"name": "Nemotron 3 Ultra 550B", "category": "llm_reasoning", "capabilities": ["chat","reasoning","coding","tools"], "endpoint": "/v1/chat/completions"},
                  "nvidia/nemotron-3.5-lightning-30b-a3b": {"name": "Nemotron 3.5 Lightning 30B", "category": "llm_reasoning", "capabilities": ["chat","reasoning","coding","tools"], "endpoint": "/v1/chat/completions"},
                  "nvidia/nemotron-3.5-bolt-e4b": {"name": "Nemotron 3.5 Bolt E4B", "category": "llm_reasoning", "capabilities": ["chat","reasoning","tools"], "endpoint": "/v1/chat/completions"},
                  "nvidia/nemotron-3-super-120b-a12b": {"name": "Nemotron 3 Super 120B", "category": "llm_reasoning", "capabilities": ["chat","reasoning","coding","tools"], "endpoint": "/v1/chat/completions"},
                  "nvidia/nemotron-3-nano-30b-a3b": {"name": "Nemotron 3 Nano 30B", "category": "llm_reasoning", "capabilities": ["chat","reasoning","coding"], "endpoint": "/v1/chat/completions"},
                  "nvidia/llama-3.3-nemotron-super-49b-v1.5": {"name": "Llama 3.3 Nemotron Super 49B v1.5", "category": "llm_reasoning", "capabilities": ["chat","reasoning","tools"], "endpoint": "/v1/chat/completions"},
                  "nvidia/llama-3.3-nemotron-super-49b-v1": {"name": "Llama 3.3 Nemotron Super 49B v1", "category": "llm_reasoning", "capabilities": ["chat","reasoning","tools"], "endpoint": "/v1/chat/completions"},
                  "nvidia/llama-3.1-nemotron-ultra-253b-v1": {"name": "Llama 3.1 Nemotron Ultra 253B", "category": "llm_reasoning", "capabilities": ["chat","reasoning"], "endpoint": "/v1/chat/completions"},
                  "nvidia/nvidia-nemotron-nano-9b-v2": {"name": "Nemotron Nano 9B v2", "category": "llm_reasoning", "capabilities": ["chat"], "endpoint": "/v1/chat/completions"},
                  "nvidia/usdcode": {"name": "USDCode", "category": "coding", "capabilities": ["coding","chat"], "endpoint": "/v1/chat/completions"},
                  "nvidia/llama-3.1-nemoguard-8b-content-safety": {"name": "NemoGuard Content Safety", "category": "safety", "capabilities": ["safety"], "endpoint": "/v1/chat/completions"},
                  "nvidia/llama-3.1-nemoguard-8b-topic-control": {"name": "NemoGuard Topic Control", "category": "safety", "capabilities": ["safety"], "endpoint": "/v1/chat/completions"},
                  "nvidia/llama-3.1-nemotron-safety-guard-8b-v3": {"name": "Nemotron Safety Guard v3", "category": "safety", "capabilities": ["safety"], "endpoint": "/v1/chat/completions"},
                  "nvidia/nemoguard-jailbreak-detect": {"name": "NemoGuard Jailbreak Detect", "category": "safety", "capabilities": ["classification"], "endpoint": "/v1"},
                  "nvidia/nemotron-content-safety-reasoning-4b": {"name": "Content Safety Reasoning 4B", "category": "safety", "capabilities": ["safety","reasoning"], "endpoint": "/v1/chat/completions"},
                  "nvidia/riva-translate-4b-instruct-v2": {"name": "Riva Translate 4B", "category": "translation", "capabilities": ["translation"], "endpoint": "/v1/chat/completions"},
                  "nvidia/nemotron-3.5-embed-1b": {"name": "Nemotron 3.5 Embed 1B", "category": "embeddings", "capabilities": ["embeddings"], "endpoint": "/v1/embeddings"},
                  "nvidia/nemotron-3.5-embed-8b": {"name": "Nemotron 3.5 Embed 8B", "category": "embeddings", "capabilities": ["embeddings"], "endpoint": "/v1/embeddings"},
                  "nvidia/nemotron-3.5-rerank-8b": {"name": "Nemotron 3.5 Rerank 8B", "category": "reranking", "capabilities": ["rerank"], "endpoint": "/v1"},
                  "nvidia/nemotron-3.5-parse": {"name": "Nemotron 3.5 Parse", "category": "ocr_document", "capabilities": ["ocr"], "endpoint": "/v1"},
                  "nvidia/nemotron-3.5-super-vl-120b-a12b": {"name": "Nemotron 3.5 Super VL", "category": "multimodal_vision", "capabilities": ["vision","reasoning","coding"], "endpoint": "/v1/chat/completions"},
                  "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning": {"name": "Nemotron 3 Nano Omni", "category": "multimodal_vision", "capabilities": ["vision","audio","reasoning"], "endpoint": "/v1/chat/completions"}
                }
              }
              with open(CATALOG, "w") as f:
                  json.dump(catalog, f, indent=2)
              print("Catálogo inicial criado.")
          with open(CATALOG) as f:
              data = json.load(f)
          print(f"Total de modelos: {len(data.get('models', {}))}")
          with open("/tmp/catalog.json", "w") as f:
              json.dump(data, f)
          EOF

      - name: Select Model
        id: select
        run: |
          python3 << 'EOF'
          import json, os, sys

          with open("/tmp/catalog.json") as f:
              models = json.load(f).get("models", {})

          mode = "${{ inputs.model_mode }}"
          requested = "${{ inputs.model_id }}".strip()
          allow_fb = "${{ inputs.allow_fallback }}" == "true"
          task = "${{ inputs.task_description }}".lower()

          def compatible(m):
              cat = m.get("category", "")
              caps = m.get("capabilities", [])
              if cat in ("safety", "embeddings", "reranking", "ocr_document", "audio"):
                  return False
              return any(c in caps for c in ("chat", "reasoning", "coding"))

          selected = None
          reason = ""

          if mode == "manual":
              if not requested:
                  print("ERRO: modo manual exige model_id")
                  sys.exit(1)
              if requested not in models:
                  print(f"ERRO: modelo '{requested}' não está no catálogo")
                  print("Modelos compatíveis:")
                  for mid, m in models.items():
                      if compatible(m):
                          print(f"  {mid} — {m.get('name')}")
                  sys.exit(1)
              if not compatible(models[requested]) and not allow_fb:
                  print(f"AVISO: {requested} não é ideal para engenharia e fallback está desativado")
                  sys.exit(1)
              selected = requested
              reason = "seleção manual"
          else:
              # Auto
              preferred = []
              if any(x in task for x in ("auditoria", "complex", "arquitetura", "xwt", "kernel", "linux")):
                  preferred = ["nvidia/nemotron-3-ultra-550b-a55b", "nvidia/nemotron-3-super-120b-a12b", "nvidia/llama-3.3-nemotron-super-49b-v1.5"]
              elif any(x in task for x in ("yaml", "correção", "simples", "log", "rápido")):
                  preferred = ["nvidia/nemotron-3.5-lightning-30b-a3b", "nvidia/nemotron-3.5-bolt-e4b", "nvidia/nemotron-3-nano-30b-a3b"]
              else:
                  preferred = ["nvidia/nemotron-3.5-lightning-30b-a3b", "nvidia/nemotron-3-ultra-550b-a55b"]

              for p in preferred:
                  if p in models and compatible(models[p]):
                      selected = p
                      reason = f"auto — melhor match para a tarefa"
                      break
              if not selected:
                  for mid, m in models.items():
                      if compatible(m):
                          selected = mid
                          reason = "auto — primeiro modelo compatível"
                          break

          if not selected:
              print("Nenhum modelo compatível encontrado")
              sys.exit(1)

          m = models[selected]
          print(f"Modelo selecionado: {selected}")
          print(f"Nome: {m.get('name')}")
          print(f"Motivo: {reason}")
          with open("/tmp/selected.txt", "w") as f:
              f.write(selected)
          with open("/tmp/reason.txt", "w") as f:
              f.write(reason)
          EOF

      - name: Call NVIDIA Model
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          MODEL=$(cat /tmp/selected.txt)
          echo "Chamando modelo: $MODEL"
          python3 << EOF
          import os
          from openai import OpenAI
          client = OpenAI(
              base_url="https://integrate.api.nvidia.com/v1",
              api_key=os.environ["NVIDIA_API_KEY"]
          )
          model = open("/tmp/selected.txt").read().strip()
          try:
              r = client.chat.completions.create(
                  model=model,
                  messages=[{"role": "user", "content": "Responda em uma frase curta: o que é um sistema Linux para Xbox 360?"}],
                  max_tokens=80,
                  temperature=0.2
              )
              print("Resposta:", r.choices[0].message.content)
              print("Sucesso com o modelo:", model)
          except Exception as e:
              print(f"Falha no modelo {model}: {e}")
              if "${{ inputs.model_mode }}" == "manual" and "${{ inputs.allow_fallback }}" != "true":
                  raise
              print("Fallback não aplicado (modo manual sem autorização ou sem modelo alternativo definido).")
          EOF

      - name: Correção do load_git_upload (path)
        run: |
          python3 << 'EOF'
          # Correção do erro:
          # JS grava: .meva-upload/<upload_id>/part-000000.bin
          # Python esperava: part-000000.bin
          def normalize_block(full_path, upload_id):
              prefix = f".meva-upload/{upload_id}/"
              if full_path.startswith(prefix):
                  return full_path[len(prefix):]
              if "/" not in full_path:
                  return full_path
              raise ValueError(f"Bloco não pertence ao upload: {full_path}")

          # Teste
          p = ".meva-upload/xyz789/part-000001.bin"
          print("Path normalizado:", normalize_block(p, "xyz789"))
          print("Verificações de SHA/integridade permanecem intactas.")
          EOF

      - name: Summary
        run: |
          echo "## MEVA V16" >> $GITHUB_STEP_SUMMARY
          echo "- Modelo: $(cat /tmp/selected.txt 2>/dev/null || echo N/A)" >> $GITHUB_STEP_SUMMARY
          echo "- Motivo: $(cat /tmp/reason.txt 2>/dev/null || echo N/A)" >> $GITHUB_STEP_SUMMARY
          echo "- Correção de path do upload aplicada na lógica." >> $GITHUB_STEP_SUMMARY
