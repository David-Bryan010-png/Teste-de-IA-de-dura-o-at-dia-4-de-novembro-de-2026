                  # corte numa mensagem do assistente (preserva pares tool_use/tool_result)
                  keep = KEEP_RECENT
                  cut = None
                  while keep >= 2:
                      i = len(messages) - keep
                      while i > 1 and messages[i]['role'] != 'assistant':
                          i -= 1
                      if i > 1:
                          cut = i
                          break
                      keep -= 2
                  if cut is None:
                      return messages
                  first, old, recent = messages[0], messages[1:cut], messages[cut:]
                  summary = None
                  try:
                      r = self.router_factory()
                      t = r.complete(SUMMARY_SYSTEM, [{'role': 'user', 'content': render_transcript(old)}], [], 3000)
                      summary = t.text.strip() or None
                  except Exception as e:  # noqa: BLE001
                      log('Resumo de contexto por IA falhou: ' + redact(e, 300))
                  if not summary:
