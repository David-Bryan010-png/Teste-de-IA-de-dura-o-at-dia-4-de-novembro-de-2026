                  self.cfg.inbox.mkdir(parents=True, exist_ok=True)
                  archive = self.cfg.inbox / 'resume.zip'
                  n = self.gh.download_asset(asset, archive)
                  if n != int(asset.get('size', -1)) or not zipfile.is_zipfile(archive):
                      raise RuntimeError('ZIP anterior incompleto/inválido.')
                  self.zip_safe_extract(archive, self.cfg.project, strip_output=True)
