  deploy-pages:
    name: Publicar interface MEVA Pages (3 tentativas)
    if: ${{ inputs.mode == 'install' }}
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy_1.outputs.page_url || steps.deploy_2.outputs.page_url || steps.deploy_3.outputs.page_url }}
    steps:
      - name: Publicar MEVA CODE V18 — tentativa 1/3
        id: deploy_1
        continue-on-error: true
        uses: actions/deploy-pages@v5.0.1
        with:
          timeout: 300000
          error_count: 20

      - name: Aguardar antes da segunda tentativa
        if: ${{ steps.deploy_1.outcome == 'failure' }}
        shell: bash
        run: sleep 15

      - name: Publicar MEVA CODE V18 — tentativa 2/3
        id: deploy_2
        if: ${{ steps.deploy_1.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/deploy-pages@v5.0.1
        with:
          timeout: 300000
          error_count: 20

      - name: Aguardar antes da terceira tentativa
        if: ${{ steps.deploy_2.outcome == 'failure' }}
        shell: bash
        run: sleep 30

      - name: Publicar MEVA CODE V18 — tentativa 3/3
        id: deploy_3
        if: ${{ steps.deploy_2.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/deploy-pages@v5.0.1
        with:
          timeout: 300000
          error_count: 20

      - name: Confirmar que pelo menos uma implantação terminou com sucesso
        id: deploy_gate
        if: always()
        env:
          DEPLOY_1: ${{ steps.deploy_1.outcome }}
          DEPLOY_2: ${{ steps.deploy_2.outcome }}
          DEPLOY_3: ${{ steps.deploy_3.outcome }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Tentativa 1: ${DEPLOY_1:-não executada}"
          echo "Tentativa 2: ${DEPLOY_2:-não executada}"
          echo "Tentativa 3: ${DEPLOY_3:-não executada}"
          if [[ "$DEPLOY_1" == success || "$DEPLOY_2" == success || "$DEPLOY_3" == success ]]; then
            echo 'deployed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'deployed=false' >> "$GITHUB_OUTPUT"
          echo 'Todas as três tentativas de GitHub Pages falharam. O artefato continua disponível no job install.'
          exit 1

      - name: Verificar a página publicada por HTTP
        if: ${{ steps.deploy_gate.outputs.deployed == 'true' }}
        env:
          PAGE_URL: ${{ steps.deploy_1.outputs.page_url || steps.deploy_2.outputs.page_url || steps.deploy_3.outputs.page_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$PAGE_URL" == https://* ]] || { echo 'URL HTTPS de Pages ausente ou inválida.'; exit 1; }
          ok=0
          for attempt in $(seq 1 12); do
            code="$(curl --connect-timeout 10 --max-time 25 -sS -L -o /tmp/meva-v18-page.html -w '%{http_code}' "$PAGE_URL" || true)"
            if [[ "$code" == 200 ]] && grep -q 'MEVA CODE V18' /tmp/meva-v18-page.html; then
              echo "Página HTTP verificada: ${PAGE_URL} (HTTP ${code})"
              ok=1
              break
            fi
            echo "Aguardando propagação do Pages (${attempt}/12; HTTP ${code:-sem resposta})…"
            sleep 10
          done
          [[ "$ok" == 1 ]] || { echo 'O deployment reportou sucesso, mas a página não passou na verificação HTTP/conteúdo.'; exit 1; }

      - name: Diagnosticar GitHub Pages quando houver falha
        if: ${{ failure() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/meva-v18-pages-diagnostic
          curl --connect-timeout 10 --max-time 20 -fsSL https://www.githubstatus.com/api/v2/status.json -o /tmp/meva-v18-pages-diagnostic/status.json || true
          curl --connect-timeout 10 --max-time 20 -fsSL https://www.githubstatus.com/api/v2/components.json -o /tmp/meva-v18-pages-diagnostic/components.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/meva-v18-pages-diagnostic')
          for name in ('status.json','components.json'):
              f=p/name
              if not f.is_file():
                  print(name+': indisponível')
                  continue
              try:
                  d=json.loads(f.read_text(encoding='utf-8'))
                  if name=='status.json': print('GitHub Status:',(d.get('status') or {}).get('description','indisponível'))
                  else:
                      items=[x for x in d.get('components',[]) if 'pages' in x.get('name','').lower()]
                      print('Componentes Pages:',json.dumps(items,ensure_ascii=False)[:5000])
              except Exception as e: print(name+': JSON inválido:',type(e).__name__)
          PY
          echo 'Consulte Settings → Pages e confirme Source = GitHub Actions. O workflow não altera a configuração administrativa do repositório automaticamente.'

      - name: Enviar diagnóstico de Pages
        if: ${{ always() && failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MEVA-V18-PAGES-DIAGNOSTICO-${{ github.run_id }}
          path: /tmp/meva-v18-pages-diagnostic/
          if-no-files-found: warn
          retention-days: 7

