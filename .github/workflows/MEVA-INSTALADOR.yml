                      c = self._git('commit', '-q', '--allow-empty', '-m', 'meva: baseline do projeto importado')
                      if c.returncode != 0:
                          self.reason = 'commit baseline falhou: ' + redact((c.stderr or b'').decode('utf-8', 'replace'))
                          return
