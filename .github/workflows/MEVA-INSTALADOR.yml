          """Shell real dentro de um sandbox bubblewrap.

          Contrato de segurança (falha fechada: se o sandbox não funcionar, NADA é executado):
          - sem segredos: ambiente limpo (`--clearenv`) e o processo da MEVA já descartou as chaves;
          - rede desligada por padrão (`--unshare-net`); só liga se o workflow autorizar (sandbox_network);
          - host somente-leitura (/usr, /etc, /opt); só o projeto é gravável, e `.git` é somente-leitura;
          - namespaces de PID/IPC/UTS próprios, `--die-with-parent`, `--new-session`.
          """
          from __future__ import annotations

          import os
          import shutil
          import signal
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          from .util import redact

          _SAFE_PATH_PREFIXES = ('/usr', '/opt', '/bin', '/sbin')


          class SandboxUnavailable(RuntimeError):
              pass


          class BwrapSandbox:
              name = 'bwrap'

              def __init__(self, ws, cfg):
                  self.ws = ws
                  self.cfg = cfg
                  self.available = False
                  self.reason = 'não verificado'

              # ------------------------------------------------------------------ montagem do comando
              def _path_env(self) -> str:
                  parts = ['/usr/local/sbin', '/usr/local/bin', '/usr/sbin', '/usr/bin', '/sbin', '/bin']
                  for d in os.environ.get('PATH', '').split(':'):
                      if d and d.startswith('/opt') and os.path.isdir(d) and d not in parts:
                          parts.append(d)
                  return ':'.join(parts)

              def build_argv(self, command: str, cwd_rel: str = '.', writable: bool = True, network: bool = False,
                             project: Path | None = None) -> list[str]:
                  bwrap = shutil.which('bwrap') or 'bwrap'
                  project = Path(project or self.ws.project)
                  a = [bwrap, '--die-with-parent', '--new-session', '--unshare-pid', '--unshare-ipc', '--unshare-uts']
                  if not network:
                      a.append('--unshare-net')
                  a.append('--clearenv')
                  for d in ('/usr', '/opt', '/etc'):
                      if os.path.isdir(d):
                          a += ['--ro-bind', d, d]
                  for link in ('/bin', '/sbin', '/lib', '/lib32', '/lib64', '/libx32'):
                      if os.path.islink(link):
                          a += ['--symlink', os.readlink(link), link]
                      elif os.path.isdir(link):
                          a += ['--ro-bind', link, link]
                  if network and os.path.isdir('/run/systemd/resolve'):
                      a += ['--ro-bind', '/run/systemd/resolve', '/run/systemd/resolve']
                  a += ['--proc', '/proc', '--dev', '/dev', '--tmpfs', '/tmp', '--dir', '/tmp/home']
                  a += ['--bind' if writable else '--ro-bind', str(project), '/work']
                  if writable and (project / '.git').is_dir():
                      a += ['--ro-bind', str(project / '.git'), '/work/.git']
                  workdir = '/work' if cwd_rel in ('', '.') else '/work/' + cwd_rel.strip('/')
                  a += ['--chdir', workdir]
                  env = {
                      'PATH': self._path_env(), 'HOME': '/tmp/home', 'TMPDIR': '/tmp', 'LANG': 'C.UTF-8', 'LC_ALL': 'C.UTF-8',
                      'CI': '1', 'TERM': 'dumb', 'PYTHONDONTWRITEBYTECODE': '1', 'PYTHONNOUSERSITE': '1',
                      'GIT_OPTIONAL_LOCKS': '0', 'GIT_CONFIG_NOSYSTEM': '1', 'GIT_TERMINAL_PROMPT': '0',
                  }
                  for k, v in env.items():
                      a += ['--setenv', k, v]
                  a += ['--', '/bin/bash', '--noprofile', '--norc', '-o', 'pipefail', '-c', command]
                  return a

              # ------------------------------------------------------------------ verificação
              def probe(self) -> bool:
                  if not shutil.which('bwrap'):
                      self.available, self.reason = False, 'bubblewrap (bwrap) não está instalado no runner'
                      return False
                  with tempfile.TemporaryDirectory() as tmp:
                      argv = self.build_argv('true', '.', writable=False, network=False, project=Path(tmp))
                      try:
                          p = subprocess.run(argv, capture_output=True, timeout=30, stdin=subprocess.DEVNULL)
                      except Exception as e:  # noqa: BLE001
                          self.available, self.reason = False, 'bwrap falhou ao iniciar: ' + redact(e)
                          return False
                  if p.returncode != 0:
                      err = (p.stderr or b'').decode('utf-8', 'replace').strip()[:300]
                      self.available, self.reason = False, 'bwrap não conseguiu criar o sandbox (userns bloqueado?): ' + redact(err)
                      return False
                  self.available, self.reason = True, 'ok'
                  return True

              # ------------------------------------------------------------------ execução
              def run(self, command: str, cwd: str = '.', timeout: int = 600, writable: bool = True,
                      network: bool = False, limit: int = 30000) -> dict:
                  if not self.available:
                      raise SandboxUnavailable('Sandbox indisponível — comando NÃO executado: ' + self.reason)
                  if not isinstance(command, str) or not command.strip() or len(command) > 20000:
                      raise ValueError('Comando vazio ou excessivamente longo.')
                  cwd_path = self.ws.safe_path(cwd, allow_root=True)
                  if not cwd_path.is_dir():
                      raise ValueError('Diretório inexistente.')
                  cwd_rel = '.' if cwd_path == self.ws.project else self.ws.rel(cwd_path)
                  network = bool(network and self.cfg.sandbox_network)
                  argv = self.build_argv(command, cwd_rel, writable, network)
                  links = self.ws.materialize_symlinks()
                  started = time.time()
                  timed_out = False
                  try:
                      with tempfile.TemporaryFile() as out:
                          proc = subprocess.Popen(argv, stdout=out, stderr=subprocess.STDOUT, stdin=subprocess.DEVNULL, start_new_session=True)
                          try:
                              proc.wait(timeout=timeout)
                          except subprocess.TimeoutExpired:
                              timed_out = True
                              try:
                                  os.killpg(proc.pid, signal.SIGKILL)
                              except OSError:
                                  proc.kill()
                              proc.wait()
                          size = out.seek(0, 2)
                          out.seek(max(0, size - limit))
                          text = out.read().decode('utf-8', 'replace')
                  finally:
                      self.ws.remove_materialized_symlinks(links)
                  code = proc.returncode
                  result = {
                      'ok': (code == 0) and not timed_out, 'exit_code': code, 'timeout': timed_out,
                      'output': text, 'output_truncated': size > limit,
                      'output_bytes': size, 'duration_s': round(time.time() - started, 1),
                      'sandbox': self.name, 'writable': writable, 'network': network,
                  }
                  if network is False and self.cfg.sandbox_network is False:
                      result['network_note'] = 'rede desligada no sandbox'
                  return result
