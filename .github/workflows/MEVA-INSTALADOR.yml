      - name: Empacotar arquivos de saída
        if: ${{ inputs.mode == 'agent' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          root=Path.cwd(); changed=json.loads(Path('/tmp/meva-changed.json').read_text()); exported=json.loads(Path('/tmp/meva-export.json').read_text())
          selected={('changes/'+x,x) for x in changed}|{('exports/'+x,x) for x in exported}; work=root/'meva-workspace'
