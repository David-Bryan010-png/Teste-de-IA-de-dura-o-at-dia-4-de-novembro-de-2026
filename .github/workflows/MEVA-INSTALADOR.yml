              [[ "$ACCEL_BACKEND" != cpu ]] || exit 1
              echo "Backend GPU não compilou; fallback CPU/OpenBLAS."
              ACCEL_BACKEND=cpu
              rm -rf "$CACHE/build"
              cmake -S "$CACHE" -B "$CACHE/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DGGML_OPENMP=ON -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
              cmake --build "$CACHE/build" --parallel 4 --target llama-server
            fi
            printf '%s\n' "$ACCEL_BACKEND" > "$CACHE/build/meva-backend"
          fi
          test -x "$SERVER"
          ACTUAL_BACKEND="$(cat "$CACHE/build/meva-backend" 2>/dev/null || echo "$ACCEL_BACKEND")"
          ACTUAL_LAYERS=0; [[ "$ACTUAL_BACKEND" == cpu ]] || ACTUAL_LAYERS=999
          echo "backend=$ACTUAL_BACKEND" >> "$GITHUB_OUTPUT"
          echo "layers=$ACTUAL_LAYERS" >> "$GITHUB_OUTPUT"

      - name: Baixar anexos binários da Release
        id: attachments
        if: ${{ inputs.mode == 'agent' && inputs.attachments != '' }}
        env:
          ATTACHMENTS_JSON: ${{ inputs.attachments }}
          CID: ${{ inputs.conversation_id }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,urllib.parse,urllib.request
          from pathlib import Path
          items=json.loads(os.environ['ATTACHMENTS_JSON']); repo=os.environ['GH_REPOSITORY']; cid=os.environ['CID']
          if not isinstance(items,list) or not 1<=len(items)<=5: raise SystemExit('Manifesto inválido.')
          root=Path('meva-inbox')/cid; root.mkdir(parents=True,exist_ok=True); total=0; tag0=None
          for item in items:
              name,url,size=item.get('name',''),item.get('url',''),item.get('size')
              if not re.fullmatch(r'[A-Za-z0-9._-]{1,100}',name): raise SystemExit('Nome de anexo inválido.')
              if not isinstance(size,int) or size<1 or size>200*1024*1024: raise SystemExit('Tamanho inválido.')
              total+=size
              if total>500*1024*1024: raise SystemExit('Anexos excedem 500 MB.')
              u=urllib.parse.urlsplit(url); prefix=f'/{repo}/releases/download/'
              if u.scheme!='https' or u.netloc!='github.com' or not u.path.startswith(prefix): raise SystemExit('URL de anexo fora do repositório.')
              parts=u.path.split('/'); tag=urllib.parse.unquote(parts[5]) if len(parts)>6 else ''
              if not tag.startswith(f'meva-upload-{cid}-') or (tag0 and tag0!=tag): raise SystemExit('Tag de anexo não corresponde à conversa.')
              tag0=tag; dest=root/name; h=hashlib.sha256(); got=0
              req=urllib.request.Request(url,headers={'User-Agent':'MEVA-V8'})
              with urllib.request.urlopen(req,timeout=180) as src,dest.open('wb') as out:
                  while True:
                      chunk=src.read(1024*1024)
                      if not chunk: break
