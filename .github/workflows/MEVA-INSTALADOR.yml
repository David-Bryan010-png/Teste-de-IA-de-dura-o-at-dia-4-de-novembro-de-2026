          def parse_command(command,allowed,read_only=False):
              if not isinstance(command,str) or not command.strip() or len(command)>12000: raise ValueError('Comando vazio ou excessivamente longo.')
              if any(x in command for x in (';','|','&','>','<','`','$','\n','\r')): raise ValueError('Encadeamento/expansão de shell bloqueados; use uma ação por comando.')
              argv=shlex.split(command)
              if not argv: raise ValueError('Comando vazio.')
              exe=argv[0]
              if exe.startswith('./'):
                  p=safe_path(exe[2:])
                  if not p.is_file(): raise ValueError('Executável local não encontrado.')
                  argv[0]=str(p);exe=argv[0]
              base=Path(exe).name
              if base not in allowed: raise ValueError('Executável não autorizado: '+base)
              for a in argv[1:]:
                  if a in ('..','../') or a.startswith('../') or '/../' in a: raise ValueError('Caminho fora do projeto bloqueado.')
                  if read_only and a.startswith('/'): raise ValueError('Caminho absoluto bloqueado em leitura.')
              if read_only and base=='git':
                  if len(argv)<2 or argv[1] not in {'status','diff','log','show','ls-files','branch','rev-parse','describe'}: raise ValueError('Git em leitura aceita somente comandos de inspeção.')
                  dangerous_git_flags=('-C','--git-dir','--work-tree','--output','--exec-path','--upload-pack','--receive-pack','--config-env','--config')
                  for a in argv[1:]:
                      if a in dangerous_git_flags or a.startswith(('--output=','--git-dir=','--work-tree=','--exec-path=','--config=','--config-env=')) or a=='-c' or a.startswith('-c'):
                          raise ValueError('Opção Git com potencial de escrita/configuração/execução bloqueada em leitura: '+a)
              if read_only and base in {'cat','ls','head','tail','file','du','sha256sum','readelf','objdump','nm','wc','stat','strings','xxd','hexdump','find'}:
                  skip=False;value_flags={'-n','-c','-b','-s','-l','-L','-N','-g','-e','-m','-j','-w','-t','-o','-A','-R','-f','-maxdepth','-mindepth','-type'}
                  for a in argv[1:]:
                      if skip: skip=False;continue
                      if a in value_flags: skip=True;continue
                      if a.startswith('-'): continue
                      safe_path(a,allow_root=True)
              return argv
          def record_event(kind,target,status,result=None,error=None):
              ev={'index':len(AUDIT)+1,'tool':str(kind)[:80],'target':str(target)[:240],'status':status,'at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
