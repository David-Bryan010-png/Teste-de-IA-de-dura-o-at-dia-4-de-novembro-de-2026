          def cpio_newc(entries):
              out = b''
              for i, (name, mode, data) in enumerate(entries + [('TRAILER!!!', 0, b'')]):
                  nb = name.encode() + b'\0'
                  hdr = b'070701' + b''.join(b'%08X' % v for v in (i + 1, mode, 0, 0, 1, 0, len(data), 0, 0, 0, 0, len(nb), 0))
                  out += hdr + nb + b'\0' * ((4 - (110 + len(nb)) % 4) % 4) + data + b'\0' * ((4 - len(data) % 4) % 4)
              return out


          def elf32(machine=20, endian='>', entry=0x100000):
              ident = b'\x7fELF' + bytes([1, 2 if endian == '>' else 1, 1]) + b'\0' * 9
              return ident + struct.pack(endian + 'HHIIIIIHHHHHH', 2, machine, 1, entry, 52, 0, 0, 52, 32, 0, 0, 0, 0)


