          def make_zip(entries):
              buf = io.BytesIO()
              with zipfile.ZipFile(buf, 'w') as z:
                  for name, data, *mode in entries:
                      zi = zipfile.ZipInfo(name)
                      zi.create_system = 3
                      if mode:
                          zi.external_attr = mode[0] << 16
                      z.writestr(zi, data)
              return buf.getvalue()


