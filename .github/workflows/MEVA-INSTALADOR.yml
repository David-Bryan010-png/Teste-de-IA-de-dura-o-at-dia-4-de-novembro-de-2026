              q=PurePosixPath(raw)
              if q.is_absolute() or any(x in ('','..','.') for x in q.parts): raise ValueError('Caminho fora do projeto.')
              if any(x.lower() in DENY_DIRS for x in q.parts): raise ValueError('Diretório interno/protegido.')
              if is_secret_path(q.parts): raise ValueError('Arquivo potencialmente secreto bloqueado.')
