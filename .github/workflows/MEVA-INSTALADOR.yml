      - name: Preparar sandbox, busca e validadores
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap ripgrep git patch file; then break; fi
            [[ "$attempt" -lt 3 ]] || { echo 'Não foi possível instalar bubblewrap/ripgrep; o shell ficará indisponível (falha fechada).'; break; }
            sleep $((attempt*5))
          done
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
          python3 -m pip install --quiet pyyaml || echo 'PyYAML indisponível; validação YAML ficará NOT_RUN.'
          if command -v bwrap >/dev/null && bwrap --unshare-all --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 --proc /proc --dev /dev /usr/bin/true; then
            echo 'Sandbox bubblewrap: OK'
          else
            echo 'Sandbox bubblewrap: INDISPONÍVEL neste runner (shell/build ficarão NOT_RUN).'
          fi

      - name: Instalar ferramentas de build autorizadas
        if: ${{ inputs.allow_build == true }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update -qq; then break; fi
            [[ "$attempt" -lt 3 ]] || { echo 'apt-get update falhou após três tentativas.'; exit 1; }
            sleep $((attempt*5))
          done
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex gawk patch perl pkg-config cmake ninja-build meson \
            gcc g++ clang lld binutils-powerpc-linux-gnu gcc-powerpc-linux-gnu \
            g++-powerpc-linux-gnu binutils-powerpc64-linux-gnu gcc-powerpc64-linux-gnu \
            g++-powerpc64-linux-gnu libelf-dev libssl-dev libncurses-dev libzstd-dev \
            cpio rsync unzip zip xz-utils zstd gzip bzip2 lz4 lzop file wget curl git \
            device-tree-compiler gettext autoconf automake libtool nodejs npm python3-dev python3-yaml shellcheck

      - name: Validar parâmetros do workflow
        env:
          MODE: ${{ inputs.mode }}
          MESSAGE: ${{ inputs.message }}
          CID: ${{ inputs.conversation_id }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
          UPLOAD_REF: ${{ inputs.upload_ref }}
          MAX_ACTIONS: ${{ inputs.max_actions }}
          PROVIDER: ${{ inputs.model_provider }}
          MODEL_ID: ${{ inputs.model_id }}
          AUTONOMY: ${{ inputs.autonomy }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$MODE" =~ ^(chat|agent|linux_zip|self_test|resume)$ ]] || { echo 'Modo inválido para o job de IA.'; exit 1; }
          [[ "$MODE" == self_test || "$MODE" == resume || -n "${MESSAGE//[[:space:]]/}" ]] || { echo 'Mensagem vazia.'; exit 1; }
          (( ${#MESSAGE} <= 12000 )) || { echo 'Mensagem acima de 12000 caracteres.'; exit 1; }
          [[ -z "$CID" || "$CID" =~ ^[A-Za-z0-9_-]{8,80}$ ]] || { echo 'ID de conversa inválido.'; exit 1; }
          [[ "$MAX_ACTIONS" =~ ^[0-9]+$ ]] && (( MAX_ACTIONS >= 1 && MAX_ACTIONS <= 80 )) || { echo 'max_actions fora do intervalo 1–80.'; exit 1; }
          git check-ref-format --branch "$BRANCH" >/dev/null
          [[ -z "$UPLOAD_REF" || "$UPLOAD_REF" =~ ^meva-upload-[a-z0-9-]{8,80}$ ]] || { echo 'upload_ref inválido.'; exit 1; }
          [[ "$MODEL_ID" =~ ^[A-Za-z0-9._:/-]{0,160}$ ]] || { echo 'model_id inválido.'; exit 1; }
          [[ "$PROVIDER" =~ ^(auto|nvidia|claude|openai|xai)$ ]] || { echo 'Provedor inválido.'; exit 1; }
          [[ "$AUTONOMY" =~ ^(safe|ask|auto)$ ]] || { echo 'Autonomia inválida.'; exit 1; }

