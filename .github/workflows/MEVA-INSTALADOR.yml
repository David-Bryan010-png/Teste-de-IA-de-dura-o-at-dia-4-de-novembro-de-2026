name: MEVA V9 — assistente, agente de programação e ferramentas
run-name: MEVA V9 / ${{ inputs.mode || 'install' }} / ${{ inputs.conversation_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operação da MEVA
        type: choice
        options: [install, chat, agent, self_test]
        default: install
        required: true
      message:
        description: Mensagem ou tarefa
        type: string
        required: false
        default: ''
      conversation_id:
        description: ID da conversa
        type: string
        required: false
        default: ''
      branch:
        description: Branch do projeto
        type: string
        required: false
        default: ''
      max_actions:
        description: Limite de ações do agente (1 a 30)
        type: number
        required: false
        default: 24
      attachments:
        description: Manifesto interno de anexos
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: meva-v9-${{ github.repository }}-${{ inputs.conversation_id || github.run_id }}
  cancel-in-progress: false

env:
  CHAT_MODEL_REPO: Qwen/Qwen2.5-0.5B-Instruct-GGUF
  CHAT_MODEL_FILE: qwen2.5-0.5b-instruct-q4_k_m.gguf
  CHAT_MODEL_ID: Qwen2.5-0.5B-Instruct-Q4_K_M
  CHAT_MODEL_CACHE: meva-v9-chat-qwen25-05b-q4km-1
  AGENT_MODEL_REPO: Qwen/Qwen2.5-Coder-3B-Instruct-GGUF
  AGENT_MODEL_FILE: qwen2.5-coder-3b-instruct-q4_k_m.gguf
  AGENT_MODEL_ID: Qwen2.5-Coder-3B-Instruct-Q4_K_M
  AGENT_MODEL_CACHE: meva-v9-agent-qwen25-coder3b-q4km-1
  LLAMA_CPP_REPO: https://github.com/ggml-org/llama.cpp.git
  LLAMA_CPP_CACHE: meva-v9-llama-cpp-openblas-1

jobs:
  install:
    name: Instalar painel MEVA V9
    if: ${{ inputs.mode == 'install' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Exigir branch padrão
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" || {
            echo "Execute a instalação na branch padrão: $DEFAULT_BRANCH" >&2
            exit 1
          }

      - name: Gerar interface web V9
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p public meva-config meva-data/conversations
          touch meva-data/conversations/.gitkeep
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#080e1b">
            <title>MEVA V9</title>
            <link rel="manifest" href="./manifest.webmanifest">
            <style>
              :root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif;background:#080e1b;color:#edf4ff}
              *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1b365f,transparent 55%),#080e1b}
              .app{width:min(1040px,calc(100% - 18px));margin:auto;padding:16px 0 28px}
              .top,.head,.foot,.sendrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
              .top{margin:4px 2px 18px}.brand{font-weight:950;letter-spacing:.2em}.state,.muted{color:#9aacc4;font-size:11px}
              .panel{border:1px solid #263650;border-radius:18px;background:linear-gradient(145deg,#121e32,#0b1628);padding:19px;box-shadow:0 20px 60px #0005}
              .hidden{display:none!important}h1{font-size:25px;margin:5px 0 12px}.eyebrow{font-size:9px;letter-spacing:.15em;color:#91bcff;font-weight:900}
              input,textarea,select{width:100%;padding:12px;border:1px solid #263650;border-radius:10px;background:#081426;color:#edf4ff;font:inherit;min-width:0}
              label{display:block;font-size:11px;font-weight:750;margin:10px 0 6px}
              button{border:1px solid #344d6c;border-radius:10px;padding:10px 14px;background:#11233b;color:#eaf3ff;font-weight:800;cursor:pointer}
              button:disabled{opacity:.45;cursor:wait}.primary{background:linear-gradient(110deg,#bad8ff,#79aefb);color:#081426;border:0}
              .warning,.cap{padding:11px;border:1px solid #66552f;border-radius:10px;background:#251f15;color:#e7d5aa;font-size:10px;line-height:1.55;margin-top:13px}
              .cap{border-color:#29486d;background:#10223a;color:#c5dafa}.grid{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px;align-items:center}
              .grid label{margin:0}.messages{height:54vh;min-height:280px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:14px;margin:12px 0;background:#071222;border:1px solid #263650;border-radius:12px}
              .bubble{max-width:94%;padding:12px;border:1px solid #263650;border-radius:12px;background:#101f34;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.65}
              .user{align-self:flex-end;background:#182f4d}.role{font-size:9px;font-weight:900;color:#91bcff;letter-spacing:.12em;margin-bottom:5px}
              .attachments{border:1px dashed #344d6c;border-radius:10px;padding:10px;margin:10px 0}.attachment-list{white-space:pre-wrap;color:#9aacc4;font-size:10px}
              .status{min-height:20px;font-size:11px;color:#9aacc4;overflow-wrap:anywhere}.ok{color:#65d8a9}.err{color:#ff8e9a}
              .small{font-size:10px;color:#9aacc4}a{color:#91bcff}footer{text-align:center;color:#71839d;font-size:10px;padding:18px}
              @media(max-width:620px){.panel{padding:14px}.grid{grid-template-columns:1fr 1fr}.messages{height:52vh}.bubble{max-width:99%}}
            </style>
          </head>
          <body>
          <main class="app">
            <header class="top"><div class="brand">◆ MEVA V9</div><span id="connection" class="state">DESCONECTADA</span></header>
            <section id="login" class="panel">
              <div class="eyebrow">ASSISTENTE DE IA</div><h1>Conectar à MEVA</h1>
              <p class="muted">Use um Fine-grained Personal Access Token limitado a este repositório: Actions Read and write, Contents Read and write e Metadata Read-only. O token fica somente na sessão desta aba.</p>
              <form id="loginForm"><label for="token">Token do GitHub</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_…" required><button class="primary" type="submit">Conectar</button><div id="loginStatus" class="status"></div></form>
              <div class="warning">Atenção: este repositório é público. Anexos enviados por Releases, histórico, arquivos e resultados podem ficar públicos. Nunca envie senhas, tokens, chaves privadas, documentos pessoais ou dados confidenciais.</div>
            </section>
            <section id="workspace" class="panel hidden">
              <div class="head"><div><div class="eyebrow">AGENTE SOB DEMANDA</div><h1>Conversa com a MEVA</h1><div id="repoInfo" class="muted"></div></div><button id="newChat">＋ Nova conversa</button></div>
              <div class="grid">
                <label for="mode">Modo</label><select id="mode"><option value="chat">Conversa rápida</option><option value="agent">Agente completo</option></select>
                <label for="branch">Branch</label><input id="branch" value="main">
              </div>
              <div class="cap"><b>V9:</b> chat leve, agente de programação, memória, leitura e criação de arquivos, ZIP, PDF, terminal Bash, navegador, pesquisa web, compilação, testes e exportação.</div>
              <div id="messages" class="messages"></div>
              <form id="composer">
                <div class="attachments"><label for="files">Arquivos, ZIPs, PDFs, imagens e projetos</label><input id="files" type="file" multiple><div id="fileInfo" class="attachment-list">Até 5 arquivos; 200 MB por arquivo; 500 MB por envio.</div></div>
                <textarea id="message" rows="3" maxlength="5500" placeholder="Escreva uma pergunta ou tarefa… (Enter envia; Shift+Enter quebra linha)"></textarea>
                <div class="sendrow"><span class="small">Agente: até 30 ações por execução</span><button id="send" class="primary" type="submit">Enviar ↗</button></div>
              </form>
              <div id="status" class="status">Pronta.</div>
              <div class="foot"><button id="refresh">Atualizar</button><a id="runs" target="_blank" rel="noopener">Execuções</a><button id="share">Copiar link</button><button id="logout">Desconectar</button></div>
            </section>
            <footer>MEVA V9 · Qwen · llama.cpp · agente · terminal · ZIP · navegador</footer>
          </main>
          <script>
          (()=>{'use strict';
            const $=id=>document.getElementById(id),KEY='meva_v9_pat',CHAT='meva_v9_chat',WF='MEVA-INSTALADOR.yml';
            const MAX_FILE=200*1024*1024,MAX_TOTAL=500*1024*1024,MAX_FILES=5;let owner='',repo='',branch='main',cid='',busy=false,messages=[];
            const say=(t,k='')=>{$('status').textContent=t;$('status').className='status '+k};
            const loginSay=t=>{$('loginStatus').textContent=t};
            const valid=x=>typeof x==='string'&&/^[A-Za-z0-9_-]{8,80}$/.test(x);
            const parts=()=>`/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
            async function api(path,opt={}){
              const token=sessionStorage.getItem(KEY);if(!token)throw Error('Sessão desconectada.');
              const headers={Accept:'application/vnd.github+json',Authorization:'Bearer '+token,...(opt.body?{'Content-Type':'application/json'}:{})};
              let response;try{response=await fetch('https://api.github.com'+path,{...opt,headers})}
              catch(e){throw Error('Falha de rede/CORS ao acessar a API do GitHub. Recarregue o Pages e confira a conexão. Detalhe: '+(e.message||e))}
              if(response.status===204)return null;const raw=await response.text();if(!response.ok){let detail=raw;try{detail=JSON.parse(raw).message||raw}catch(_){}throw Error('GitHub HTTP '+response.status+': '+String(detail).slice(0,220))}
              return raw?JSON.parse(raw):null;
            }
            function render(){
              const root=$('messages');root.replaceChildren();
              if(!messages.length){const d=document.createElement('div');d.className='muted';d.textContent='Faça uma pergunta ou envie um projeto para a MEVA analisar.';root.append(d)}
              for(const m of messages){const d=document.createElement('div');d.className='bubble '+(m.role==='user'?'user':'');const r=document.createElement('div');r.className='role';r.textContent=m.role==='user'?'VOCÊ':'MEVA';const c=document.createElement('div');c.textContent=m.content||'';d.append(r,c);root.append(d)}
              root.scrollTop=root.scrollHeight;
            }
            function decode64(v){const b=atob(String(v||'').replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}
            async function loadConversation(){
              if(!valid(cid))return;try{const d=await api(parts()+'/contents/meva-data/conversations/'+cid+'.json?ref='+encodeURIComponent($('branch').value||branch));const o=JSON.parse(decode64(d.content));messages=Array.isArray(o.messages)?o.messages.filter(x=>x&&['user','assistant'].includes(x.role)&&typeof x.content==='string'):[];render()}
              catch(e){if(!String(e.message).startsWith('GitHub HTTP 404:'))throw e}
            }
            async function connect(){
              const info=await api(parts());owner=info.owner.login;repo=info.name;branch=info.default_branch||'main';$('repoInfo').textContent=owner+'/'+repo+' · branch padrão: '+branch;$('branch').value=new URLSearchParams(location.search).get('branch')||branch;
              const q=new URLSearchParams(location.search).get('conversation');cid=valid(q)?q:(localStorage.getItem(CHAT)||crypto.randomUUID());localStorage.setItem(CHAT,cid);
              $('runs').href='https://github.com/'+owner+'/'+repo+'/actions/workflows/'+WF;
              $('connection').textContent='CONECTADA';$('connection').className='state ok';$('login').classList.add('hidden');$('workspace').classList.remove('hidden');
              await loadConversation();
            }
            $('loginForm').addEventListener('submit',async e=>{e.preventDefault();const token=$('token').value.trim();if(!token)return;sessionStorage.setItem(KEY,token);try{await connect();$('token').value=''}catch(x){sessionStorage.removeItem(KEY);loginSay(x.message)}});
            $('files').addEventListener('change',()=>{const f=[...$('files').files],total=f.reduce((a,b)=>a+b.size,0);$('fileInfo').textContent=f.map(x=>x.name+' · '+(x.size/1048576).toFixed(1)+' MB').join('\n')+'\nTotal: '+(total/1048576).toFixed(1)+' MB'+(f.length>MAX_FILES||f.some(x=>x.size>MAX_FILE)||total>MAX_TOTAL?'\nLIMITE EXCEDIDO':'')});
            function safeName(name){const n=String(name||'arquivo.bin').normalize('NFKC');if(/(^\.env|id_rsa|id_ed25519|credentials|secret|token|private[_-]?key)/i.test(n))throw Error('Arquivo com nome potencialmente secreto bloqueado: '+name);const s=n.replace(/[\/\\]/g,'_').replace(/[^A-Za-z0-9._-]/g,'_').replace(/^\.+/,'').slice(0,100);if(!s||s==='.'||s==='..')throw Error('Nome de arquivo inválido.');return s}
            async function upload(){
              const files=[...$('files').files];if(!files.length)return '';if(files.length>MAX_FILES)throw Error('Máximo de 5 arquivos.');const total=files.reduce((a,b)=>a+b.size,0);if(total>MAX_TOTAL||files.some(f=>!f.size||f.size>MAX_FILE))throw Error('Limite: 200 MB por arquivo e 500 MB por envio.');
              const release=await api(parts()+'/releases',{method:'POST',body:JSON.stringify({tag_name:'meva-v9-upload-'+cid+'-'+Date.now(),name:'MEVA V9 anexos',body:'Anexos temporários da conversa. Conteúdo público.',draft:false,prerelease:true})});
              const base=release.upload_url.replace(/\{\?name,label\}$/,'');const assets=[];
              for(let i=0;i<files.length;i++){const f=files[i],name=String(i+1).padStart(2,'0')+'-'+safeName(f.name);const response=await new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open('POST',base+'?name='+encodeURIComponent(name),true);x.setRequestHeader('Accept','application/vnd.github+json');x.setRequestHeader('Authorization','Bearer '+sessionStorage.getItem(KEY));x.setRequestHeader('Content-Type',f.type||'application/octet-stream');x.upload.onprogress=e=>{if(e.lengthComputable)say('Enviando '+(i+1)+'/'+files.length+' · '+Math.round(e.loaded/e.total*100)+'%')};x.onload=()=>x.status>=200&&x.status<300?resolve(x.responseText):reject(Error('Upload HTTP '+x.status+': '+x.responseText.slice(0,180)));x.onerror=()=>reject(Error('Falha de rede/CORS no envio do anexo.'));x.send(f)});
                const asset=JSON.parse(response);assets.push({name,size:f.size,url:asset.browser_download_url})}
              return JSON.stringify(assets);
            }
            async function getRuns(){const d=await api(parts()+'/actions/workflows/'+WF+'/runs?event=workflow_dispatch&per_page=50');return d.workflow_runs||[]}
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            async function waitRun(before,started,selectedBranch){
              const end=Date.now()+110*60*1000;let n=0;
              while(Date.now()<end){const all=await getRuns();const r=all.find(x=>!before.has(x.id)&&x.head_branch===selectedBranch&&Date.parse(x.created_at)>=started-30000&&String(x.display_title||'').includes(cid));
                if(r){const d=await api(parts()+'/actions/runs/'+r.id);say('MEVA · execução #'+r.run_number+' · '+d.status+(d.status==='completed'?' / '+d.conclusion:''));if(d.status==='completed'){if(d.conclusion!=='success')throw Error('Execução terminou em '+d.conclusion+'. Consulte os logs.');return}}
                else say('Solicitação enviada; aguardando o runner…');n++;await sleep(n<10?2500:6000)}
              throw Error('Tempo de espera excedido. A execução pode continuar no GitHub Actions; use Atualizar.');
            }
            $('composer').addEventListener('submit',async e=>{
              e.preventDefault();if(busy)return;const message=$('message').value.trim(),files=[...$('files').files];if(!message&&!files.length)return;
              const selectedBranch=$('branch').value.trim()||branch;if(!/^[A-Za-z0-9._/-]+$/.test(selectedBranch)||selectedBranch.includes('..'))return say('Branch inválida.','err');
              busy=true;$('send').disabled=true;const started=Date.now();
              try{const before=new Set((await getRuns()).map(x=>x.id));say(files.length?'Preparando anexos…':'Iniciando MEVA…');const attachments=await upload();const mode=files.length?'agent':$('mode').value;const task=message||'Inspecione os anexos, identifique o projeto e descreva a estrutura e o conteúdo.';
                messages.push({role:'user',content:task});render();$('message').value='';$('files').value='';$('fileInfo').textContent='Anexos enviados.';
                await api(parts()+'/actions/workflows/'+WF+'/dispatches',{method:'POST',body:JSON.stringify({ref:selectedBranch,inputs:{mode,message:task,conversation_id:cid,branch:selectedBranch,max_actions:'30',attachments}})});
                await waitRun(before,started,selectedBranch);await loadConversation();say('Resposta recebida.','ok');
              }catch(x){say(x.message,'err');await loadConversation().catch(()=>{})}finally{busy=false;$('send').disabled=false}
            });
            $('newChat').onclick=()=>{cid=crypto.randomUUID();localStorage.setItem(CHAT,cid);messages=[];const u=new URL(location.href);u.searchParams.set('conversation',cid);history.replaceState({},'',u);render();say('Nova conversa criada.')};
            $('refresh').onclick=()=>loadConversation().then(()=>say('Histórico atualizado.','ok')).catch(e=>say(e.message,'err'));
            $('share').onclick=async()=>{const u=new URL(location.href);u.searchParams.set('conversation',cid);u.searchParams.set('branch',$('branch').value||branch);try{await navigator.clipboard.writeText(u.href);say('Link copiado.','ok')}catch(_){say(u.href)}};
            $('logout').onclick=()=>{sessionStorage.removeItem(KEY);location.reload()};
            $('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}});
            if(sessionStorage.getItem(KEY)){const p=location.hostname.endsWith('.github.io')?location.hostname.replace('.github.io','')+'/'+(location.pathname.split('/').filter(Boolean)[0]||''):'';if(p){[owner,repo]=p.split('/');connect().catch(e=>{sessionStorage.removeItem(KEY);loginSay(e.message)})}}
          })();
          </script>
          </body></html>
          HTML
          cat > public/manifest.webmanifest <<'JSON'
          {"name":"MEVA V9","short_name":"MEVA","lang":"pt-BR","start_url":"./","scope":"./","display":"standalone","background_color":"#080e1b","theme_color":"#080e1b"}
          JSON
          touch public/.nojekyll
          for f in IDENTITY.md RESPONSE_RULES.md AGENT_RULES.md; do
            test -s "meva-config/$f" || printf '# %s\n' "$f" > "meva-config/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('public/index.html').read_text()
          m=re.search(r'<script>(.*?)</script>',h,re.S)
          if not m: raise SystemExit('Script da interface ausente')
          Path('/tmp/meva-v9-ui.js').write_text(m.group(1))
          PY
          node --check /tmp/meva-v9-ui.js

      - name: Publicar interface e configuração
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public meva-config meva-data/conversations/.gitkeep
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'MEVA V9: interface e configuração'
            AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:${DEFAULT_BRANCH}"
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Criar artefato Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy-pages:
    name: Publicar MEVA V9
    if: ${{ inputs.mode == 'install' }}
    needs: install
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

  ai:
    name: Executar MEVA V9
    if: ${{ inputs.mode == 'chat' || inputs.mode == 'agent' || inputs.mode == 'self_test' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validar entrada e detectar saudação
        id: request
        env:
          MODE: ${{ inputs.mode }}
          MESSAGE: ${{ inputs.message }}
          CID: ${{ inputs.conversation_id }}
          TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
          MAX_ACTIONS: ${{ inputs.max_actions }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$MODE" == self_test || -n "${MESSAGE//[[:space:]]/}" ]] || { echo 'Mensagem vazia.'; exit 1; }
          (( ${#MESSAGE} <= 5500 )) || { echo 'Mensagem acima de 5.500 caracteres.'; exit 1; }
          [[ -z "$CID" || "$CID" =~ ^[A-Za-z0-9_-]{8,80}$ ]] || { echo 'conversation_id inválido.'; exit 1; }
          [[ "$MAX_ACTIONS" =~ ^[0-9]+$ ]] && (( MAX_ACTIONS >= 1 && MAX_ACTIONS <= 30 )) || { echo 'max_actions precisa ser 1..30.'; exit 1; }
          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null
          FAST=false
          if [[ "$MODE" == self_test ]]; then FAST=true; fi
          if [[ "$MODE" == chat ]]; then
            N=$(printf '%s' "$MESSAGE" | tr '[:upper:]' '[:lower:]' | xargs)
            case "$N" in oi|olá|ola|"oi meva"|"olá meva"|"bom dia"|"boa tarde"|"boa noite"|"tudo bem"|valeu|obrigado|obrigada|ok) FAST=true;; esac
          fi
          echo "fast=$FAST" >> "$GITHUB_OUTPUT"
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Cache do modelo de chat
        if: ${{ steps.request.outputs.fast != 'true' && inputs.mode == 'chat' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/meva/models/chat
          key: meva-v9-${{ runner.os }}-${{ env.CHAT_MODEL_CACHE }}

      - name: Cache do modelo de programação
        if: ${{ inputs.mode == 'agent' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/meva/models/agent
          key: meva-v9-${{ runner.os }}-${{ env.AGENT_MODEL_CACHE }}

      - name: Detectar acelerador físico
        id: accel
        if: ${{ steps.request.outputs.fast != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          B=cpu
          if command -v nvidia-smi >/dev/null 2>&1 && command -v nvcc >/dev/null 2>&1 && nvidia-smi -L >/dev/null 2>&1; then B=cuda
          elif [[ -e /dev/kfd ]] && command -v rocminfo >/dev/null 2>&1 && command -v hipcc >/dev/null 2>&1 && rocminfo >/dev/null 2>&1; then B=hip
          elif compgen -G '/dev/dri/renderD*' >/dev/null && command -v vulkaninfo >/dev/null 2>&1 && command -v glslc >/dev/null 2>&1; then
            V="$(vulkaninfo --summary 2>/dev/null || true)"
            if grep -Eiq 'deviceName.*(nvidia|amd|radeon|intel|arc)' <<<"$V" && ! grep -Eiq 'llvmpipe|lavapipe|software rasterizer' <<<"$V"; then B=vulkan; fi
          fi
          echo "backend=$B" >> "$GITHUB_OUTPUT"
          echo "Acelerador detectado: $B"

      - name: Cache do llama.cpp
        if: ${{ steps.request.outputs.fast != 'true' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/meva/llama.cpp
          key: meva-v9-${{ runner.os }}-${{ steps.accel.outputs.backend }}-${{ env.LLAMA_CPP_CACHE }}

      - name: Preparar ferramentas de programação
        if: ${{ inputs.mode == 'agent' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc g++ clang make cmake ninja-build pkg-config libopenblas-dev libopenblas0-pthread git curl wget zip unzip p7zip-full file python3-dev python3-venv python3-pip poppler-utils libssl-dev zlib1g-dev libffi-dev libsqlite3-dev maven gradle php-cli ruby-full lua5.4 perl iproute2 iputils-ping dnsutils netcat-openbsd
          python -m pip install --disable-pip-version-check pytest
      - name: Preparar Node.js
        if: ${{ inputs.mode == 'agent' }}
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Preparar Go
        if: ${{ inputs.mode == 'agent' }}
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Preparar Java
        if: ${{ inputs.mode == 'agent' }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar .NET
        if: ${{ inputs.mode == 'agent' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Baixar e validar modelo GGUF
        if: ${{ steps.request.outputs.fast != 'true' }}
        id: model
        env:
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$MODE" == chat ]]; then
            REPO="$CHAT_MODEL_REPO"; FILE="$CHAT_MODEL_FILE"; DIR="$HOME/.cache/meva/models/chat"; MIN=400000000; MAX=650000000; ID="$CHAT_MODEL_ID"; CTX=4096
          else
            REPO="$AGENT_MODEL_REPO"; FILE="$AGENT_MODEL_FILE"; DIR="$HOME/.cache/meva/models/agent"; MIN=1700000000; MAX=3000000000; ID="$AGENT_MODEL_ID"; CTX=12288
          fi
          mkdir -p "$DIR"; MODEL="$DIR/$FILE"
          if [[ ! -s "$MODEL" ]] || (( $(stat -c%s "$MODEL") < MIN )); then
            rm -f "$MODEL"
            curl --fail --location --retry 8 --retry-all-errors --connect-timeout 30 --output "$MODEL" "https://huggingface.co/${REPO}/resolve/main/${FILE}?download=true"
          fi
          SIZE=$(stat -c%s "$MODEL")
          (( SIZE >= MIN && SIZE <= MAX )) || { echo "Tamanho GGUF inesperado: $SIZE"; exit 1; }
          head -c 4 "$MODEL" | grep -q GGUF
          echo "model_path=$MODEL" >> "$GITHUB_OUTPUT"
          echo "model_id=$ID" >> "$GITHUB_OUTPUT"
          echo "context=$CTX" >> "$GITHUB_OUTPUT"

      - name: Compilar llama.cpp com fallback CPU
        if: ${{ steps.request.outputs.fast != 'true' }}
        id: llama
        env:
          BACKEND: ${{ steps.accel.outputs.backend }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libopenblas-dev libopenblas0-pthread
          CACHE="$HOME/.cache/meva/llama.cpp"
          SERVER="$CACHE/build/bin/llama-server"
          if [[ ! -x "$SERVER" ]]; then
            rm -rf "$CACHE"
            git clone --depth 1 "$LLAMA_CPP_REPO" "$CACHE"
            FLAGS=(-DGGML_OPENMP=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF)
            case "$BACKEND" in
              cuda) FLAGS+=(-DGGML_CUDA=ON -DGGML_NATIVE=OFF) ;;
              hip) FLAGS+=(-DGGML_HIP=ON -DGGML_NATIVE=OFF) ;;
              vulkan) FLAGS+=(-DGGML_VULKAN=ON -DGGML_NATIVE=OFF) ;;
              *) FLAGS+=(-DGGML_NATIVE=ON -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS) ;;
            esac
            if ! cmake -S "$CACHE" -B "$CACHE/build" -G Ninja -DCMAKE_BUILD_TYPE=Release "${FLAGS[@]}" || ! cmake --build "$CACHE/build" --parallel 4 --target llama-server; then
              [[ "$BACKEND" == cpu ]] || echo "Backend especial indisponível; compilando CPU/OpenBLAS."
              rm -rf "$CACHE/build"
              cmake -S "$CACHE" -B "$CACHE/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DGGML_OPENMP=ON -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
              cmake --build "$CACHE/build" --parallel 4 --target llama-server
              BACKEND=cpu
            fi
            printf '%s\n' "$BACKEND" > "$CACHE/build/meva-backend"
          fi
          test -x "$SERVER"
          ACTUAL_BACKEND="$(cat "$CACHE/build/meva-backend" 2>/dev/null || echo "$BACKEND")"
          echo "backend=$ACTUAL_BACKEND" >> "$GITHUB_OUTPUT"

      - name: Baixar anexos binários
        if: ${{ inputs.mode == 'agent' && inputs.attachments != '' }}
        env:
          MANIFEST: ${{ inputs.attachments }}
          CID: ${{ inputs.conversation_id }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,urllib.parse,urllib.request
          from pathlib import Path
          items=json.loads(os.environ['MANIFEST']); repo=os.environ['GH_REPOSITORY']; cid=os.environ['CID']
          if not isinstance(items,list) or not 1<=len(items)<=5: raise SystemExit('Manifesto de anexos inválido.')
          root=Path('meva-inbox')/cid; root.mkdir(parents=True,exist_ok=True)
          total=0; tag0=None
          for item in items:
              name,url,size=item.get('name',''),item.get('url',''),item.get('size')
              if not re.fullmatch(r'[A-Za-z0-9._-]{1,110}',name): raise SystemExit('Nome de anexo inválido.')
              if not isinstance(size,int) or not 1<=size<=200*1024*1024: raise SystemExit('Tamanho de anexo inválido.')
              total+=size
              if total>500*1024*1024: raise SystemExit('Anexos acima de 500 MB.')
              u=urllib.parse.urlsplit(url); prefix=f'/{repo}/releases/download/'
              if u.scheme!='https' or u.netloc!='github.com' or not u.path.startswith(prefix): raise SystemExit('URL de anexo não pertence ao repositório.')
              parts=u.path.split('/'); tag=urllib.parse.unquote(parts[5]) if len(parts)>6 else ''
              if not tag.startswith(f'meva-v9-upload-{cid}-') or (tag0 and tag0!=tag): raise SystemExit('Tag de anexo não corresponde à conversa.')
              tag0=tag; dest=root/name; h=hashlib.sha256(); got=0
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MEVA-V9'}),timeout=180) as src,dest.open('wb') as out:
                  while True:
                      chunk=src.read(1024*1024)
                      if not chunk: break
                      got+=len(chunk)
                      if got>200*1024*1024: raise SystemExit('Arquivo excedeu 200 MB.')
                      h.update(chunk); out.write(chunk)
              if got!=size: dest.unlink(missing_ok=True); raise SystemExit('Tamanho divergente: '+name)
              print(name,got,'SHA256',h.hexdigest())
          print('Anexos preparados:',len(items))
          PY

      - name: Iniciar llama-server
        if: ${{ steps.request.outputs.fast != 'true' }}
        env:
          MODEL_PATH: ${{ steps.model.outputs.model_path }}
          MODEL_ID: ${{ steps.model.outputs.model_id }}
          MODEL_CONTEXT: ${{ steps.model.outputs.context }}
          ACTUAL_BACKEND: ${{ steps.llama.outputs.backend }}
        shell: bash
        run: |
          set -Eeuo pipefail
          SERVER="$HOME/.cache/meva/llama.cpp/build/bin/llama-server"
          THREADS=$(nproc); (( THREADS>4 )) && THREADS=4
          GPU_LAYERS=0; [[ "$ACTUAL_BACKEND" == cpu ]] || GPU_LAYERS=999
          nohup "$SERVER" --model "$MODEL_PATH" --alias "$MODEL_ID" --ctx-size "$MODEL_CONTEXT" --threads "$THREADS" --threads-batch "$THREADS" --batch-size 384 --ubatch-size 128 --parallel 1 --cache-prompt --n-gpu-layers "$GPU_LAYERS" --host 127.0.0.1 --port 8080 > /tmp/meva-llama.log 2>&1 &
          echo $! > /tmp/meva-llama.pid
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then exit 0; fi
            kill -0 "$(cat /tmp/meva-llama.pid)" 2>/dev/null || { cat /tmp/meva-llama.log; exit 1; }
            sleep 2
          done
          cat /tmp/meva-llama.log; exit 1

      - name: Executar núcleo inteligente MEVA V9
        env:
          MODE: ${{ inputs.mode }}
          MESSAGE: ${{ inputs.message }}
          CID: ${{ inputs.conversation_id }}
          MAX_ACTIONS: ${{ inputs.max_actions }}
          FAST: ${{ steps.request.outputs.fast }}
          MODEL_ID: ${{ steps.model.outputs.model_id }}
          ACCELERATOR: ${{ steps.llama.outputs.backend || 'cpu' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/meva_v9.py <<'PY'
          import hashlib,ipaddress,json,os,re,shutil,socket,stat,subprocess,sys,time,urllib.parse,urllib.request,zipfile
          from pathlib import Path,PurePosixPath
          from html.parser import HTMLParser
          from urllib.request import HTTPRedirectHandler,build_opener
          ROOT=Path.cwd().resolve(); MODE=os.getenv('MODE','chat'); USER=os.getenv('MESSAGE','').strip()
          CID=os.getenv('CID') or 'run-'+os.getenv('GITHUB_RUN_ID','manual')
          FAST=os.getenv('FAST')=='true'; MAX=max(1,min(30,int(os.getenv('MAX_ACTIONS','24'))))
          MODEL=os.getenv('MODEL_ID','fast-greeting'); ACCEL=os.getenv('ACCELERATOR','cpu')
          INBOX=ROOT/'meva-inbox'/CID; WORK=ROOT/'meva-workspace'; STATE=ROOT/'meva-data'/'conversations'/(CID+'.json')
          STATE.parent.mkdir(parents=True,exist_ok=True); WORK.mkdir(exist_ok=True); EXPORTED=set(); READ=set()
          DENY={'.git','.github','meva-data','node_modules','.venv','venv','.cache'}
          BLOCK={'id_rsa','id_ed25519','credentials','.npmrc','.pypirc'}
          def safe(raw,write=False):
              if not isinstance(raw,str) or not raw or '\\' in raw or len(raw)>400: raise ValueError('Caminho inválido.')
              q=PurePosixPath(raw)
              if q.is_absolute() or any(x in ('','..','.') for x in q.parts) or (q.parts and q.parts[0].endswith(':')): raise ValueError('Caminho fora do projeto.')
              if any(x.lower() in DENY for x in q.parts): raise ValueError('Diretório protegido.')
              if write and q.parts[0]=='meva-inbox': raise ValueError('Anexos originais são somente leitura.')
              n=q.name.lower()
              if n.startswith('.env') or n in BLOCK or any(x in n for x in ('secret','token','credential','private_key')): raise ValueError('Possível segredo bloqueado.')
              p=ROOT
              for x in q.parts:
                  p=p/x
                  if p.is_symlink(): raise ValueError('Links simbólicos bloqueados.')
              p=p.resolve(strict=False)
