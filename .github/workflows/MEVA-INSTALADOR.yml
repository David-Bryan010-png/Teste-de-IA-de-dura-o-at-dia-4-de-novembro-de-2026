                      msgs=compact_messages(msgs,budget=100000)
                      answer=reply or answer
                  if not finished:
                      status='partial';answer=(answer+'\n\n' if answer else '')+'Limite de ações ou tempo atingido. Esta execução é PARCIAL; use Retomar para continuar.'
                  if PROJECT.is_dir() and any(x.is_file() for x in PROJECT.rglob('*')):
                      changes,_=make_diff(before_snapshot);answer+='\n\nResumo: '+json.dumps(project_info(),ensure_ascii=False)[:3000]+'\n\nAlterações verificadas: '+('; '.join(x['status']+': '+x['path'] for x in changes[:80]) if changes else 'nenhuma alteração detectada.')
