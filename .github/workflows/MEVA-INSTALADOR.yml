          """Repositório git interno do workspace: baseline, commit por etapa, diff e log reais.

          O `.git` fica dentro do projeto importado, mas nunca é exportado (DENY_DIRS) nem acessível
          pelas ferramentas de arquivo (valid_rel bloqueia). No sandbox ele é montado somente-leitura.
          """
          from __future__ import annotations

          import shutil
          import subprocess
          from pathlib import Path

          from .util import DENY_DIRS, MAX_FILES, clean_env, redact, secret_path

          TRACK_LIMIT = 5 * 1024 * 1024
          UNTRACKED_LIMIT = 256 * 1024
          MAX_TRACKED_FILES = 30000
          _BASE_CFG = [
              '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', '-c', 'commit.gpgsign=false',
              '-c', 'core.autocrlf=false', '-c', 'core.safecrlf=false', '-c', 'core.quotepath=off',
              '-c', 'gc.auto=0', '-c', 'user.name=MEVA', '-c', 'user.email=meva@localhost',
          ]


          class GitRepo:
              def __init__(self, ws):
                  self.ws = ws
                  self.enabled = False
                  self.reason = 'não inicializado'
                  self.base: str | None = None

              @property
              def root(self) -> Path:
                  return self.ws.project

              def _git(self, *args, input_bytes: bytes | None = None, timeout: int = 300) -> subprocess.CompletedProcess:
                  return subprocess.run(
                      ['git', *_BASE_CFG, '-C', str(self.root), *args],
                      capture_output=True, timeout=timeout, env=clean_env(), input=input_bytes,
                      stdin=None if input_bytes is not None else subprocess.DEVNULL,
                  )

              def _out(self, *args, timeout: int = 300) -> str:
                  p = self._git(*args, timeout=timeout)
                  return (p.stdout or b'').decode('utf-8', 'replace')

              def _eligible(self, rel: str) -> bool:
                  p = self.root / rel
                  try:
                      return p.is_file() and not p.is_symlink() and p.stat().st_size <= TRACK_LIMIT
                  except OSError:
                      return False

              def _add(self, rels) -> None:
                  rels = [r for r in rels if self._eligible(r)]
                  if not rels:
                      return
                  data = b'\0'.join(r.encode('utf-8') for r in rels) + b'\0'
                  self._git('add', '-f', '--pathspec-from-file=-', '--pathspec-file-nul', input_bytes=data)

              def init(self) -> None:
                  if not shutil.which('git'):
                      self.reason = 'git ausente no runner'
                      return
                  names = self.ws.inventory(0, MAX_FILES)
                  if len(names) > MAX_TRACKED_FILES:
                      self.reason = f'projeto com {len(names)} arquivos (>{MAX_TRACKED_FILES}); histórico git desativado'
                      return
                  gitdir = self.root / '.git'
                  if gitdir.exists():
                      shutil.rmtree(gitdir, ignore_errors=True)
                  try:
                      p = self._git('init', '-q', '-b', 'meva')
                      if p.returncode != 0:
                          self.reason = 'git init falhou: ' + redact((p.stderr or b'').decode('utf-8', 'replace'))
                          return
