          BUILD_COMMANDS={'make','cmake','ninja','meson','python3','gcc','g++','clang','clang++','ld','as','powerpc64-linux-gnu-gcc','powerpc64-linux-gnu-g++','powerpc64-linux-gnu-ld','dtc','bison','flex','perl','cargo','go','node','npm','ctest','pytest','pkg-config','bash','sh','tar','unzip','zip','cpio','rsync','gzip','xz','zstd','autoreconf','configure','./configure'}
          SYMLINKS={}

          def log(s): print('[MEVA] '+str(s),flush=True)
          def api_url(path): return 'https://api.github.com/repos/'+GH_REPO+path
          def gh_request(path,accept='application/vnd.github+json',timeout=120):
