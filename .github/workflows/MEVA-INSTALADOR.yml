          """Validação sintática/estrutural, dependências, toolchain e detecção de build/test."""
          from __future__ import annotations

          import json
          import re
          import shutil
          import tomllib
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path

          from .util import MAX_FILES, MAX_VALIDATION_FILES, redact, run_host
          from .workspace import environment_info

          TEXT_EXTS = ('.py', '.json', '.yaml', '.yml', '.toml', '.xml', '.sh', '.js', '.mjs', '.cjs')


          def validate_file(ws, name: str) -> tuple[str | None, str]:
              """Devolve (status, detalhe). status None = extensão sem validador. Nunca executa código do projeto."""
              p = ws.project / name
              ext = p.suffix.lower()
              try:
                  if ext in TEXT_EXTS and p.stat().st_size > 25 * 1024 * 1024:
                      return 'SKIP', 'Arquivo textual maior que 25 MiB; validação sintática automática omitida.'
                  if ext == '.py':
                      compile(p.read_text(encoding='utf-8'), name, 'exec')
                      return 'PASS', 'Sintaxe Python válida; nenhum código foi executado.'
                  if ext == '.json':
                      json.loads(p.read_text(encoding='utf-8'))
                      return 'PASS', 'JSON válido.'
                  if ext == '.toml':
                      with p.open('rb') as f:
                          tomllib.load(f)
                      return 'PASS', 'TOML válido.'
                  if ext == '.xml':
                      ET.parse(p)
                      return 'PASS', 'XML bem formado.'
                  if ext in ('.yaml', '.yml'):
                      try:
                          import yaml  # type: ignore
                      except ImportError:
                          return 'NOT_RUN', 'PyYAML não está instalado no runner.'
                      yaml.safe_load(p.read_text(encoding='utf-8'))
                      return 'PASS', 'YAML sintaticamente válido (PyYAML).'
                  if ext == '.sh':
                      if not shutil.which('bash'):
                          return 'NOT_RUN', 'bash não está disponível.'
                      r = run_host(['bash', '-n', str(p)], ws.project, 30, 2000)
                      return ('PASS' if r.get('ok') else 'FAIL'), redact(r.get('output', ''))
                  if ext in ('.js', '.mjs', '.cjs'):
                      if not shutil.which('node'):
                          return 'NOT_RUN', 'Node.js não está disponível no runner.'
                      r = run_host(['node', '--check', str(p)], ws.project, 30, 2000)
                      return ('PASS' if r.get('ok') else 'FAIL'), redact(r.get('output', ''))
                  if ext == '.zip':
                      if not zipfile.is_zipfile(p):
                          return 'FAIL', 'Extensão .zip sem assinatura ZIP válida.'
                      with zipfile.ZipFile(p) as z:
                          bad = z.testzip()
                      return ('PASS', 'CRC ZIP válido.') if bad is None else ('FAIL', 'Entrada CRC inválida: ' + str(bad))
                  return None, ''
              except Exception as e:  # noqa: BLE001
                  return 'FAIL', redact(type(e).__name__ + ': ' + str(e))


          def validate_project(ws, only=None) -> dict:
              names = list(only) if only is not None else ws.inventory(0, MAX_FILES)
              checks = []
              counts = {'PASS': 0, 'FAIL': 0, 'NOT_RUN': 0, 'SKIP': 0}
              checked = 0
              for name in names:
                  if checked >= MAX_VALIDATION_FILES:
                      break
                  if not (ws.project / name).is_file():
                      continue
                  status, detail = validate_file(ws, name)
                  if status is None:
                      continue
                  checked += 1
                  counts[status] = counts.get(status, 0) + 1
                  checks.append({'path': name, 'status': status, 'detail': detail[:1000]})
              return {
                  'ok': counts['FAIL'] == 0, 'complete': counts['FAIL'] == 0 and counts['NOT_RUN'] == 0 and counts['SKIP'] == 0, 'checked': checked, 'truncated': len(names) > checked and checked >= MAX_VALIDATION_FILES,
                  'counts': counts, 'checks': [c for c in checks if c['status'] != 'PASS'][:300] + [c for c in checks if c['status'] == 'PASS'][:200],
                  'scope': 'changed_files' if only is not None else 'whole_project',
              }


          def analyze_dependencies(ws) -> dict:
              out = {'build_systems': [], 'buildroot_packages': [], 'cmake_packages': [], 'python_requirements': [], 'manifests': [], 'notes': []}
              for n in ws.inventory(0, MAX_FILES):
                  base = Path(n).name.lower()
                  if base in ('buildroot.config', 'defconfig', '.config') or n.endswith('.defconfig'):
                      out['build_systems'].append({'path': n, 'kind': 'Buildroot/config'})
                  elif base == 'cmakelists.txt':
                      out['build_systems'].append({'path': n, 'kind': 'CMake'})
                  elif base in ('makefile', 'gnumakefile'):
                      out['build_systems'].append({'path': n, 'kind': 'Make'})
                  elif base in ('meson.build', 'cargo.toml', 'go.mod', 'package.json', 'pyproject.toml', 'requirements.txt', 'build.gradle', 'build.gradle.kts'):
                      out['manifests'].append(n)
                  p = ws.project / n
                  try:
                      if p.stat().st_size > 2 * 1024 * 1024:
                          continue
                      text = p.read_text(encoding='utf-8', errors='strict')
                  except Exception:  # noqa: BLE001
                      continue
                  if base in ('buildroot.config', 'defconfig', '.config') or n.endswith('.defconfig'):
                      out['buildroot_packages'] += re.findall(r'(?m)^(BR2_PACKAGE_[A-Z0-9_]+)=y$', text)
                  if base == 'cmakelists.txt':
                      out['cmake_packages'] += re.findall(r'(?im)^\s*find_package\(\s*([A-Za-z0-9_.+-]+)', text)
                  if base == 'requirements.txt':
                      out['python_requirements'] += [x.strip() for x in text.splitlines() if x.strip() and not x.lstrip().startswith('#')]
              out['buildroot_packages'] = sorted(set(out['buildroot_packages']))[:1000]
              out['cmake_packages'] = sorted(set(out['cmake_packages']))[:500]
              out['python_requirements'] = out['python_requirements'][:500]
              out['build_systems'] = out['build_systems'][:500]
              out['manifests'] = out['manifests'][:500]
              return out


          def toolchain_info(ws) -> dict:
              bins = (
                  'python3', 'git', 'make', 'cmake', 'ninja', 'meson', 'gcc', 'g++', 'clang', 'powerpc-linux-gnu-gcc',
                  'powerpc-linux-gnu-ld', 'powerpc64-linux-gnu-gcc', 'dtc', 'bison', 'flex', 'node', 'npm', 'cargo', 'go',
                  'readelf', 'file', 'cpio', 'shellcheck', 'rg', 'bwrap', 'gradle', 'javac',
