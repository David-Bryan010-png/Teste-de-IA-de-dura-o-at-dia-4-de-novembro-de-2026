                  self.router_factory = router_factory  # callable() -> Router usado para resumir
                  self.session = session
                  self.compactions = 0

              def _fallback_summary(self, old: list) -> str:
                  s = self.session
                  parts = ['(resumo determinístico — o resumo por IA falhou)']
                  if s is not None:
                      if s.todos:
                          parts.append('TODOS: ' + json.dumps(s.todos, ensure_ascii=False)[:2000])
                      if s.touched:
                          parts.append('ARQUIVOS EDITADOS: ' + ', '.join(sorted(s.touched)[:80]))
                      errs = [e for e in s.audit if e.get('status') in ('error', 'failed')][-8:]
                      if errs:
                          parts.append('ÚLTIMOS ERROS: ' + '; '.join(f"{e['tool']} {e.get('error', '')[:160]}" for e in errs))
