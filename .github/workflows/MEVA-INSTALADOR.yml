          RESULT_TOTAL_LIMIT = 48000
          KEEP_RECENT = 8


          def est_tokens(*objs) -> int:
              return sum(len(o if isinstance(o, str) else json.dumps(o, ensure_ascii=False)) for o in objs) // 3


