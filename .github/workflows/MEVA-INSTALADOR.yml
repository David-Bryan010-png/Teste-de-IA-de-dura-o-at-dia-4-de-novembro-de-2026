      - name: Salvar arquivos de instalação no repositório
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public meva-config meva-data/conversations/.gitkeep MEVA-LEIA-ME.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "MEVA: instalar painel, prompts e documentação"
            AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:${DEFAULT_BRANCH}"
          else
            echo "Os arquivos já estão atualizados."
          fi
      - name: Configurar GitHub Pages
