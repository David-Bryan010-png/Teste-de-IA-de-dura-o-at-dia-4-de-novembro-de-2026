          """Mapa do repositório: símbolos por arquivo (sem executar código), para orientar projetos grandes."""
          from __future__ import annotations

          import ast
          import re
          from pathlib import Path

          _RX = {
              '.c': r'^[A-Za-z_][\w\s\*]*?\b([A-Za-z_]\w*)\s*\([^;{]*\)\s*\{?\s*$',
              '.h': r'^(?:#define\s+([A-Za-z_]\w*)|[A-Za-z_][\w\s\*]*?\b([A-Za-z_]\w*)\s*\([^;{]*\)\s*;)',
              '.js': r'^\s*(?:export\s+)?(?:async\s+)?(?:function\s*\*?\s*([A-Za-z_$][\w$]*)|class\s+([A-Za-z_$][\w$]*))',
              '.go': r'^(?:func\s+(?:\([^)]*\)\s*)?([A-Za-z_]\w*)|type\s+([A-Za-z_]\w*)\s+(?:struct|interface))',
              '.rs': r'^\s*(?:pub\s+)?(?:async\s+)?(?:fn|struct|enum|trait)\s+([A-Za-z_]\w*)',
              '.kt': r'^\s*(?:(?:public|private|internal|override|suspend)\s+)*(?:fun|class|object|interface)\s+([A-Za-z_]\w*)',
              '.java': r'^\s*(?:(?:public|private|protected|static|final|abstract)\s+)+[\w<>\[\], ]+?\s+([A-Za-z_]\w*)\s*\(|^\s*(?:public\s+)?(?:class|interface|enum)\s+([A-Za-z_]\w*)',
              '.sh': r'^\s*(?:function\s+)?([A-Za-z_][\w-]*)\s*\(\)\s*\{?',
              '.mk': r'^([A-Za-z_][\w./%-]*)\s*:(?!=)',
          }
          _ALIASES = {'.cc': '.c', '.cpp': '.c', '.cxx': '.c', '.hpp': '.h', '.mjs': '.js', '.cjs': '.js', '.ts': '.js', '.tsx': '.js',
                      '.jsx': '.js', '.bash': '.sh', '.kts': '.kt'}
          _COMP = {k: re.compile(v) for k, v in _RX.items()}


          def _py(text: str) -> list[str]:
              out = []
              for n in ast.parse(text).body:
                  if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      out.append(f'def {n.name}:{n.lineno}')
                  elif isinstance(n, ast.ClassDef):
                      out.append(f'class {n.name}:{n.lineno}')
                      out += [f'  .{m.name}:{m.lineno}' for m in n.body if isinstance(m, (ast.FunctionDef, ast.AsyncFunctionDef))][:30]
              return out


          def symbols(path: Path, name: str) -> list[str]:
              ext = Path(name).suffix.lower()
              base = Path(name).name
              if base in ('Makefile', 'makefile', 'GNUmakefile') or ext == '.mk':
                  ext = '.mk'
              ext = _ALIASES.get(ext, ext)
              if ext != '.py' and ext not in _COMP:
                  return []
              try:
                  if path.stat().st_size > 1024 * 1024:
                      return []
                  text = path.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  return []
              if ext == '.py':
                  try:
                      return _py(text)
                  except SyntaxError:
                      return ['(erro de sintaxe)']
              rx, out = _COMP[ext], []
              for i, line in enumerate(text.splitlines(), 1):
                  m = rx.match(line)
                  if m:
                      sym = next((g for g in m.groups() if g), None)
                      if sym and sym not in ('if', 'for', 'while', 'switch', 'return', 'sizeof'):
                          out.append(f'{sym}:{i}')
                  if len(out) >= 80:
                      break
              return out


          def build_map(ws, prefix: str = '', max_files: int = 200, max_symbols: int = 25) -> dict:
              files, total = [], 0
              for n in ws.inventory(0, 100000):
                  if prefix and not (n == prefix or n.startswith(prefix.rstrip('/') + '/')):
                      continue
                  syms = symbols(ws.project / n, n)
                  if not syms:
                      continue
                  total += 1
                  if len(files) < max_files:
                      files.append({'path': n, 'symbols': syms[:max_symbols], 'more': max(0, len(syms) - max_symbols)})
              return {'files_with_symbols': total, 'shown': len(files), 'truncated': total > len(files), 'map': files}
