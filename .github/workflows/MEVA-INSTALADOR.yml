                                  links[name] = target
                                  continue
                              target_path = stage.joinpath(*rel.parts)
                              target_path.parent.mkdir(parents=True, exist_ok=True)
                              if info.is_dir():
                                  target_path.mkdir(parents=True, exist_ok=True)
                                  dir_modes[target_path] = mode & 0o777
