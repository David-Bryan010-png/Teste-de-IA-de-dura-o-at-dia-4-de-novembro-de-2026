                              if info.flag_bits & 1:
                                  raise RuntimeError('ZIP criptografado não é aceito.')
                              if '\\' in raw or '\x00' in raw:
                                  raise RuntimeError('Nome de entrada ZIP inválido.')
                              parts = raw.split('/')
