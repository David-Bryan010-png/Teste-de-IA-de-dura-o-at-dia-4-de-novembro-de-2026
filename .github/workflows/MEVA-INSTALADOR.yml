      - name: Persistir conversa e checkpoint sem sobrescrever mudanças remotas
        id: persist
        if: ${{ always() && steps.agent.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
          CID: ${{ inputs.conversation_id || format('run-{0}', github.run_id) }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p meva-data/conversations meva-data/checkpoints
          if [[ -s /tmp/meva-v18-published.json && -s "meva-data/conversations/${CID}.json" ]]; then
            python3 - "$CID" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path('meva-data/conversations')/(sys.argv[1]+'.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          r=json.loads(Path('/tmp/meva-v18-published.json').read_text(encoding='utf-8'))
          d['last_release']=r['release_url'];d['last_asset_url']=r['asset_url'];d['project_archive']={'release_id':r['release_id'],'asset_id':r['asset_id'],'name':r['asset_name'],'size':r['asset_size']};d.pop('pending_upload',None)
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          fi
          cp -a meva-data /tmp/meva-v18-data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git checkout -f -B "$BRANCH" "origin/${BRANCH}"
          mkdir -p meva-data
          cp -a /tmp/meva-v18-data/. meva-data/
          git add -A -- meva-data
          if ! git diff --cached --quiet; then
            git commit -m "MEVA V18: persistir conversa ${CID}"
            for attempt in 1 2 3; do
              if git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:${BRANCH}"; then break; fi
              if [[ "$attempt" -eq 3 ]]; then echo 'Push recusado após três tentativas; dados locais ainda estão no artefato.'; exit 1; fi
              git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
              git pull --rebase origin "$BRANCH"
              sleep $((attempt*2))
            done
          fi
          echo 'persisted=true' >> "$GITHUB_OUTPUT"

      - name: Remover branch temporária somente após persistência e Release confirmados
        if: ${{ always() && (inputs.upload_ref != '' || steps.agent.outputs.upload_ref != '') && steps.publish.outputs.published == 'true' && steps.persist.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPLOAD_REF: ${{ steps.agent.outputs.upload_ref || inputs.upload_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$UPLOAD_REF" =~ ^meva-upload-[a-z0-9-]{8,80}$ ]] || { echo 'Ref inválida; limpeza ignorada.'; exit 0; }
          if gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${UPLOAD_REF}"; then
            echo 'Branch temporária removida após persistência confirmada.'
          else
            echo 'Branch temporária não removida; preservada para recuperação.'
          fi

      - name: Resumo da execução
        if: always()
        env:
          MODE: ${{ inputs.mode }}
          CID: ${{ inputs.conversation_id || format('run-{0}', github.run_id) }}
          PROVIDER: ${{ inputs.model_provider }}
          MODEL_ID: ${{ inputs.model_id }}
          AUTONOMY: ${{ inputs.autonomy }}
          ALLOW_BUILD: ${{ inputs.allow_build }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
        shell: bash
        run: |
          {
            echo '## MEVA CODE V18'
            echo "- Modo: ${MODE}"
            echo "- Conversa: ${CID}"
            echo "- Provedor solicitado: ${PROVIDER}"
            echo "- Modelo solicitado: ${MODEL_ID:-padrão preservado do provedor}"
            echo "- Autonomia: ${AUTONOMY}"
            echo "- Build autorizado: ${ALLOW_BUILD}"
            echo "- Agente: ${AGENT_OUTCOME}"
            echo "- Publicação: ${PUBLISH_OUTCOME}"
            echo "- Persistência: ${PERSIST_OUTCOME}"
            echo '- Upload: blocos Git de 2 MiB com SHA Git, SHA-256, tamanho, manifesto e verificação da árvore do commit.'
            echo '- Validação sintática pós-alteração; backup por arquivo com limite de 512 MiB e rollback por SHA-256.'
            echo '- Pages usa deploy-pages v5.0.1, Node 24, backoff/jitter, até três tentativas e verificação HTTP.'
            echo '- Estado parcial, erro ou teste não executado não é apresentado como build concluído.'
          } >> "$GITHUB_STEP_SUMMARY"
