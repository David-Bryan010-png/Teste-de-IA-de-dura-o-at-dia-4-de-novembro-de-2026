          MEVA_BUNDLE_EOF
          base64 --decode "$RUNNER_TEMP/meva-bundle.b64" > "$RUNNER_TEMP/meva-bundle.zip"
          ACTUAL="$(sha256sum "$RUNNER_TEMP/meva-bundle.zip" | awk '{print $1}')"
          EXPECTED="e41555bda4932413818cdd51b711cdc6c25fd767d9087af2b2739e590b86c3e4"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "Pacote MEVA corrompido: SHA-256 não confere." >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/meva-installer/extracted"
          unzip -q "$RUNNER_TEMP/meva-bundle.zip" -d "$RUNNER_TEMP/meva-installer/extracted"
          if [[ "$OVERWRITE" != "true" ]]; then
            while IFS= read -r -d '' file; do
              rel="${file#"$RUNNER_TEMP/meva-installer/extracted/"}"
              if [[ -e "$GITHUB_WORKSPACE/$rel" ]]; then
                echo "Arquivo já existe e overwrite_existing=false: $rel" >&2
                exit 1
              fi
            done < <(find "$RUNNER_TEMP/meva-installer/extracted" -type f -print0)
          fi
          cp -a "$RUNNER_TEMP/meva-installer/extracted/." "$GITHUB_WORKSPACE/"
          echo "Arquivos MEVA criados/atualizados:" 
          find public cloudflare tests .github/workflows -maxdepth 4 -type f -print | sort
          echo "bundle_sha256=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Validar todos os arquivos gerados
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f) }; puts "YAML válido."' \
            .github/workflows/meva-agent.yml \
            .github/workflows/deploy-meva.yml \
            .github/workflows/MEVA-INSTALADOR.yml
          python3 - <<'PYCODE'
          from pathlib import Path
          import re, textwrap
          workflow = Path('.github/workflows/meva-agent.yml').read_text(encoding='utf-8')
          match = re.search(r"cat > \"?\$RUNNER_TEMP/meva_agent\.py\"? <<'PY'\n(.*?)\n\s+PY\n", workflow, re.S)
          if not match:
              # Validate that the embedded Python payload exists, without assuming indentation.
              if 'def safe_path(' not in workflow or 'def main()' not in workflow:
                  raise SystemExit('Código do agente Python não encontrado.')
          print('Arquivos do agente local encontrados.')
          PYCODE
          echo "Validação concluída."

      - name: Criar ou reutilizar banco D1
        if: ${{ inputs.deploy_now }}
        id: d1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          LIST="$(curl --fail --silent --show-error --get --header "$AUTH" --header 'Content-Type: application/json' "$API" --data-urlencode 'per_page=100')"
          DB_ID="$(printf '%s' "$LIST" | jq -r '.result[]? | select(.name == "meva-auth") | .uuid' | head -n 1)"
          if [[ -z "$DB_ID" || "$DB_ID" == "null" ]]; then
            CREATED="$(curl --fail --silent --show-error --request POST --header "$AUTH" --header 'Content-Type: application/json' --data '{"name":"meva-auth"}' "$API")"
            DB_ID="$(printf '%s' "$CREATED" | jq -r '.result.uuid // empty')"
          fi
          [[ -n "$DB_ID" ]] || { echo "Não foi possível criar/localizar o banco D1." >&2; exit 1; }
          jq --arg id "$DB_ID" --arg owner "$GITHUB_OWNER" --arg repo "$GITHUB_REPO" \
            '.d1_databases = [{"binding":"DB","database_name":"meva-auth","database_id":$id,"migrations_dir":"cloudflare/worker/migrations"}] | .vars.GITHUB_OWNER=$owner | .vars.GITHUB_REPO=$repo' \
            wrangler.jsonc > "$RUNNER_TEMP/wrangler.jsonc"
          mv "$RUNNER_TEMP/wrangler.jsonc" wrangler.jsonc
          echo "D1 configurado. ID ocultado."

      - name: Aplicar migrações do banco
        if: ${{ inputs.deploy_now }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm install --global wrangler@4
          wrangler d1 migrations apply meva-auth --remote --config wrangler.jsonc

      - name: Salvar automaticamente os arquivos no repositório
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public cloudflare tests package.json wrangler.jsonc .gitignore LEIA-PRIMEIRO.md .github/workflows/meva-agent.yml .github/workflows/deploy-meva.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos arquivos MEVA."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "MEVA: install complete mobile AI coding environment"
            AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:${{ github.ref_name }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar painel, API e autenticação
        if: ${{ inputs.deploy_now }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MEVA_GITHUB_TOKEN: ${{ secrets.MEVA_GITHUB_TOKEN }}
          MEVA_BOOTSTRAP_SECRET: ${{ secrets.MEVA_BOOTSTRAP_SECRET }}
        run: |
          set -euo pipefail
          SECRET_FILE="$RUNNER_TEMP/meva-worker-secrets.json"
          node -e 'const fs=require("fs"); fs.writeFileSync(process.argv[1], JSON.stringify({GITHUB_TOKEN:process.env.MEVA_GITHUB_TOKEN,BOOTSTRAP_SECRET:process.env.MEVA_BOOTSTRAP_SECRET}), {mode:0o600});' "$SECRET_FILE"
          trap 'rm -f "$SECRET_FILE"' EXIT
          wrangler deploy --config wrangler.jsonc --secrets-file "$SECRET_FILE" | tee "$RUNNER_TEMP/meva-deploy.log"
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/meva-deploy.log" | head -n 1 || true)"
          {
            echo "## MEVA — instalação concluída"
            echo
            echo "Os arquivos do painel móvel, backend, banco e agente local foram gerados."
            echo "O banco D1 foi configurado e as migrações foram aplicadas."
            echo
            if [[ -n "$URL" ]]; then
              echo "**Painel:** $URL"
            else
              echo "Consulte a URL em Cloudflare → Workers & Pages → meva-local-agent."
            fi
            echo
            echo "Primeiro acesso: crie seu login e senha no painel e use a chave MEVA_BOOTSTRAP_SECRET. Guarde o código de recuperação exibido uma única vez."
            echo
            echo "**Agente de programação:** Actions → MEVA - Local AI Coding Agent → Run workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resumo caso o deploy seja adiado
        if: ${{ !inputs.deploy_now }}
        run: |
          echo "Arquivos criados e commitados. O banco e a publicação ficaram adiados. Execute novamente com deploy_now=true após configurar os Secrets." >> "$GITHUB_STEP_SUMMARY"

      - name: Remover credenciais temporárias
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/meva-worker-secrets.json" "$RUNNER_TEMP/meva-bundle.b64" "$RUNNER_TEMP/meva-bundle.zip"
