              return {'path':n,'bytes':p.stat().st_size,'sha256':h.hexdigest(),'magic':head.hex(),'zip':zipfile.is_zipfile(p)}
          def build(profile,directory=''):
              cwd=ROOT if not directory else safe(directory)[0]
              names={x.name for x in cwd.iterdir()}
              if profile=='auto':
                  profile=next((x for f,x in [('package.json','node'),('CMakeLists.txt','cmake'),('Cargo.toml','cargo'),('go.mod','go'),('pyproject.toml','python'),('Makefile','make'),('pom.xml','java'),('build.gradle','java'),('build.gradle.kts','java')] if f in names),'dotnet' if list(cwd.glob('*.csproj')) or list(cwd.glob('*.sln')) else '')
              if profile=='node':
                  if not (cwd/'package.json').is_file(): return {'ok':False,'output':'package.json ausente.'}
                  lock=any((cwd/x).is_file() for x in ('package-lock.json','npm-shrinkwrap.json'))
                  r=proc(['npm','ci' if lock else 'install','--no-audit','--no-fund'],cwd,900)
                  if not r['ok']: return r
                  pkg=json.loads((cwd/'package.json').read_text(encoding='utf-8'))
                  return proc(['npm','run','build'],cwd,1800) if 'build' in pkg.get('scripts',{}) else {'ok':True,'output':'Dependências instaladas; não existe script build.'}
              if profile=='cmake':
                  r=proc(['cmake','-S','.','-B','build-meva','-G','Ninja','-DCMAKE_BUILD_TYPE=Release'],cwd,600)
                  return proc(['cmake','--build','build-meva','--parallel','2'],cwd,1800) if r['ok'] else r
              commands={'python':[sys.executable,'-m','compileall','-q','.'],'make':['make','-j2'],'cargo':['cargo','build','--release'],'go':['go','build','./...'],'java':['bash','-lc','if [ -x ./gradlew ]; then ./gradlew build --no-daemon; elif [ -x ./mvnw ]; then ./mvnw -B package; elif [ -f pom.xml ]; then mvn -B package; else gradle build --no-daemon; fi'],'dotnet':['dotnet','build','-c','Release'],'c':['bash','-lc','gcc -O2 -Wall *.c -o meva-program'],'cpp':['bash','-lc','g++ -O2 -Wall *.cpp -o meva-program']}
              if profile not in commands: return {'ok':False,'output':'Perfil de build não reconhecido. Perfis: auto, python, node, cmake, make, cargo, go, java, dotnet, c, cpp.'}
              return proc(commands[profile],cwd,1800)
          def test_project(profile,directory=''):
              cwd=ROOT if not directory else safe(directory)[0]
              if profile=='auto':
                  names={x.name for x in cwd.iterdir()}
                  profile=next((x for f,x in [('pytest.ini','python'),('pyproject.toml','python'),('package.json','node'),('Cargo.toml','cargo'),('go.mod','go'),('pom.xml','java'),('build.gradle','java')] if f in names),'dotnet' if list(cwd.glob('*.csproj')) or list(cwd.glob('*.sln')) else '')
              if profile=='python': cmd=[sys.executable,'-m','pytest','-q']
              elif profile=='node':
                  if not (cwd/'package.json').is_file(): return {'ok':False,'output':'package.json ausente.'}
                  lock=any((cwd/x).is_file() for x in ('package-lock.json','npm-shrinkwrap.json'))
                  r=proc(['npm','ci' if lock else 'install','--no-audit','--no-fund'],cwd,900)
                  if not r['ok']: return r
                  pkg=json.loads((cwd/'package.json').read_text(encoding='utf-8'))
                  if 'test' not in pkg.get('scripts',{}): return {'ok':True,'output':'Não existe script test; nenhum teste executado.'}
                  cmd=['npm','test']
              elif profile=='cargo': cmd=['cargo','test']
