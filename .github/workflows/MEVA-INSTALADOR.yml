                          answer='Modelo não produziu JSON válido após duas tentativas de correção.';break
                      if not actions:answer=reply or 'Tarefa concluída.';finished=True;break
                      results=[]
                      for action in actions[:min(4,MAX_ACTIONS-done)]:
                          kind=action.get('type','unknown') if isinstance(action,dict) else 'invalid';ev={'index':done+1,'tool':str(kind)[:80],'target':str(action.get('path',action.get('command','')))[:240] if isinstance(action,dict) else '', 'status':'running','started_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())};AUDIT.append(ev)
                          try:
                              result=tool(action)
                              if isinstance(result,dict) and result.get('status')=='NOT_RUN': ev['status']='not_run'
                              else: ev['status']='failed' if isinstance(result,dict) and result.get('ok') is False else 'success'
                              ev['result']=audit_result(result);results.append({'tool':kind,'result':result})
                          except Exception as exc:ev['status']='error';ev['error']=redact(exc);results.append({'tool':kind,'error':redact(exc)})
                          ev['finished_at']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime());done+=1
