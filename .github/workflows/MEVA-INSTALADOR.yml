              if (pr / 'Makefile').is_file() or (pr / 'makefile').is_file() or (pr / 'GNUmakefile').is_file():
                  return 'make -j"$(nproc)"'
              if (pr / 'Cargo.toml').is_file():
                  return 'cargo build'
              if (pr / 'go.mod').is_file():
                  return 'go build ./...'
              pj = pr / 'package.json'
              if pj.is_file():
                  try:
                      if (json.loads(pj.read_text(encoding='utf-8')).get('scripts') or {}).get('build'):
                          return 'npm run build'
                  except Exception:  # noqa: BLE001
                      pass
              return None


          def interpret_test_result(result: dict) -> dict:
              """Evita declarar sucesso quando o runner não executou nenhum teste."""
              out = str(result.get('output', ''))
              code = result.get('exit_code')
              if code == 0 and re.search(r'No tests were found|Ran 0 tests|no tests ran|collected 0 items|(?<![\d.])0 passed|running 0 tests|\[no test files\]', out, re.I):
