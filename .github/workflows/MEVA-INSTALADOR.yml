                      entry,phoff=struct.unpack('>II',head[24:32]);ehsize,phentsize,phnum=struct.unpack('>HHH',head[40:46])
                      if machine!=20: add(name,'FAIL','e_machine='+str(machine)+'; esperado EM_PPC (20).')
                      elif etype not in (2,3): add(name,'FAIL','e_type='+str(etype)+'; esperado ELF executável (ET_EXEC/ET_DYN), não objeto relocável.')
                      elif version!=1 or ehsize<52: add(name,'FAIL','Versão/tamanho ELF inconsistente.')
                      elif entry==0: add(name,'FAIL','ELF PowerPC big-endian sem entry point.')
                      elif phnum and (phentsize<32 or phoff+phentsize*phnum>size): add(name,'FAIL','Tabela de program headers inválida ou truncada.')
                      else: add(name,'PASS','ELF32 big-endian EM_PPC; tipo='+str(etype)+'; entry=0x'+format(entry,'x')+'; program_headers='+str(phnum)+'. Não prova boot no Xbox 360.')
                  except Exception as e: add(name,'ERROR',redact(e))
              rootfs=[n for n in names if Path(n).name=='rootfs.cpio.gz']
              for name in rootfs:
                  try:
                      entries={};total=0;trailer=False;trailing_nonzero=False
                      with gzip.open(PROJECT/name,'rb') as f:
                          while True:
                              h=f.read(110)
                              if not h: break
                              if len(h)!=110 or h[:6] not in (b'070701',b'070702'): raise RuntimeError('Cabeçalho CPIO newc inválido/truncado.')
                              fields=[int(h[6+i*8:14+i*8],16) for i in range(13)]
