                      accepted.append((info,q,mode,link_target))
                  if not accepted: raise RuntimeError('ZIP sem arquivos permitidos.')
                  # ZIP de resultado V13 tem linux-project/ e relatórios na raiz.
                  has_package_root=any(q.parts[0]=='linux-project' and len(q.parts)>1 for _,q,_,_ in accepted)
                  top={q.parts[0] for _,q,_,_ in accepted if len(q.parts)>1}
                  root_files=[q for info,q,_,_ in accepted if len(q.parts)==1 and not info.is_dir()]
                  strip_root=has_package_root or (len(top)==1 and not root_files)
                  links={}
                  for info,q,mode,link_target in accepted:
                      parts=q.parts[1:] if strip_root else q.parts
                      if not parts: continue
                      if has_package_root and q.parts[0]!='linux-project': continue
                      if has_package_root: parts=q.parts[1:]
                      if not parts: continue
                      if link_target is not None:
                          links[PurePosixPath(*parts).as_posix()]=link_target
                          continue
                      target=stage.joinpath(*parts)
                      resolved=target.resolve(strict=False)
                      if stage.resolve() not in resolved.parents and resolved!=stage.resolve(): raise RuntimeError('Extração escapou do diretório seguro.')
                      if info.is_dir(): target.mkdir(parents=True,exist_ok=True); continue
