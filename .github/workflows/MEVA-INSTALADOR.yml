              def test_build_evidence_is_invalidated_by_later_edit(self):
                  r = self.tb.call('run_build', {'command': 'make'})
                  self.assertTrue(r['ok'])
                  self.assertTrue(self.s.build_ok_current)
                  self.tb.call('read_file', {'path': 'test_x.py'})
                  self.tb.call('edit_file', {'path': 'test_x.py', 'edits': [{'old': '1, 1', 'new': '2, 2'}]})
                  self.assertFalse(self.s.build_ok_current)
                  self.tb.call('run_build', {'command': 'make'})
                  self.assertTrue(self.s.build_ok_current)

              def test_tests_detected_and_recorded(self):
                  r = self.tb.call('run_tests', {})
                  self.assertTrue(r['ok'], r)
                  self.assertEqual(r['test_command'], 'make test')
                  self.assertTrue(self.s.tests_ok_current)

              def test_zero_tests_is_not_success(self):
                  from meva.validate import interpret_test_result
                  r = interpret_test_result({'ok': True, 'exit_code': 0, 'output': 'Ran 0 tests in 0.000s\n\nOK'})
                  self.assertEqual(r['status'], 'NOT_RUN')
