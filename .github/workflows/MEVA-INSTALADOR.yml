                  log(f'Contexto compactado ({len(old)} mensagens → resumo; compactação #{self.compactions}).')
                  first_blocks = [{'type': 'text', 'text': first['content']}] if isinstance(first['content'], str) else list(first['content'])
                  merged = {'role': 'user', 'content': first_blocks + [{'type': 'text', 'text': '[RESUMO DO TRABALHO ATÉ AQUI — contexto compactado]\n' + summary}]}
                  return [merged] + recent
