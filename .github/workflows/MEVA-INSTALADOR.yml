      - name: Commit e push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public .github/workflows/deploy-pages.yml .github/workflows/meva-agent.yml LEIA-PRIMEIRO.md package.json .gitignore
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "MEVA: instalar painel no GitHub Pages"
            git config --unset-all http.[https://github.com/.extraheader](https://github.com/.extraheader) || true
            git push "https://x-access-token:${GH_TOKEN}@[github.com/$](https://github.com/$){GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
            echo "Commit enviado."
          fi

