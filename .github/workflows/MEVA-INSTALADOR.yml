                  for name in rootfs:
                      self._audit_rootfs(project / name, name, add)
                  if not elf_candidates:
                      add('kernel/ELF', 'NOT_FOUND', 'Nenhum xenon.elf, vmlinux ou zImage.xenon encontrado.')
                  if not rootfs:
                      add('rootfs.cpio.gz', 'NOT_FOUND', 'Rootfs comprimido não encontrado.')
                  config_names = [n for n in names if Path(n).name in ('.config', 'buildroot.config') or n.endswith('.defconfig')]
                  text = ''
                  for n in config_names[:20]:
                      try:
                          p = project / n
                          if p.stat().st_size <= 1024 * 1024:
                              text += '\n' + p.read_text(encoding='utf-8', errors='replace')
                      except OSError:
                          pass
