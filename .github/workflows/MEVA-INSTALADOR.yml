          def proc(command,cwd=ROOT,timeout=300,shell=False):
              try:
                  r=subprocess.run(command,cwd=cwd,text=True,capture_output=True,timeout=timeout,env=clean_env(),shell=shell,executable='/bin/bash' if shell else None)
                  return {'ok':r.returncode==0,'exit_code':r.returncode,'output':((r.stdout or '')+'\n'+(r.stderr or '')).strip()[-24000:] or 'Concluído sem saída.'}
              except subprocess.TimeoutExpired as x:
                  a=x.stdout or '';b=x.stderr or ''
                  if isinstance(a,bytes): a=a.decode(errors='replace')
                  if isinstance(b,bytes): b=b.decode(errors='replace')
                  return {'ok':False,'timeout':True,'output':(a+'\n'+b)[-16000:]}
              except Exception as x: return {'ok':False,'output':str(x)}
          def public_url(url):
              u=urllib.parse.urlsplit(url)
              if u.scheme not in ('http','https') or not u.hostname or u.username or u.password: raise ValueError('URL inválida.')
              try: ips=[ipaddress.ip_address(u.hostname)]
              except ValueError: ips=[ipaddress.ip_address(x[4][0]) for x in socket.getaddrinfo(u.hostname,u.port or (443 if u.scheme=='https' else 80),type=socket.SOCK_STREAM)]
              if not ips or any(not x.is_global for x in ips): raise ValueError('Host local/privado bloqueado.')
              return u
          class SafeRedirect(HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  public_url(newurl); return super().redirect_request(req,fp,code,msg,headers,newurl)
          WEB=build_opener(SafeRedirect())
          def web(url,limit=1200000):
              public_url(url); req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 MEVA-V9'})
              with WEB.open(req,timeout=30) as r: return r.headers.get('Content-Type',''),r.read(limit+1)[:limit].decode('utf-8',errors='replace')
          def search(q):
              if not isinstance(q,str) or not q.strip() or len(q)>500: raise ValueError('Consulta inválida.')
              _,page=web('https://html.duckduckgo.com/html/?q='+urllib.parse.quote(q),1000000)
              class P(HTMLParser):
                  def __init__(self): super().__init__(); self.rows=[]; self.cur=None
                  def handle_starttag(self,t,a):
                      d=dict(a)
                      if t=='a' and 'result__a' in d.get('class',''):
                          self.cur={'title':'','url':d.get('href','')}; self.rows.append(self.cur)
                  def handle_data(self,d):
                      if self.cur and not self.cur['title']: self.cur['title']=d.strip()
              p=P();p.feed(page); out=[]
              for x in p.rows[:8]:
                  u=x['url']
                  if u.startswith('//'): u='https:'+u
                  if 'uddg=' in u: u=urllib.parse.parse_qs(urllib.parse.urlsplit(u).query).get('uddg',[''])[0]
                  try: public_url(u); out.append({'title':x['title'],'url':u})
                  except Exception: pass
              return {'query':q,'results':out}
          def inventory():
              names=[]
              for current,dirs,files in os.walk(ROOT):
                  dirs[:]=[d for d in dirs if d.lower() not in DENY and not (Path(current)/d).is_symlink()]
                  for f in files:
                      p=Path(current)/f
                      try: _,n=safe(p.relative_to(ROOT).as_posix()); names.append(n)
                      except Exception: continue
                      if len(names)>=1800: return sorted(set(names))[:1800]
              return sorted(set(names))[:1800]
          def project_info():
              names=inventory(); markers={'README.md','package.json','pyproject.toml','requirements.txt','Cargo.toml','go.mod','CMakeLists.txt','Makefile','pom.xml','build.gradle','build.gradle.kts'}
              return {'file_count':len(names),'files':names[:500],'manifests':[n for n in names if Path(n).name in markers][:100]}
          def inspect_zip(name,limit=300):
              p,label=safe(name)
              if not p.is_file() or not zipfile.is_zipfile(p): raise ValueError('ZIP inválido.')
              rows=[]; manifests=[]; unsafe=[]; total=0
              with zipfile.ZipFile(p) as z:
                  infos=z.infolist()
                  if len(infos)>8000: raise ValueError('ZIP com mais de 8.000 entradas.')
                  for i in infos:
                      q=PurePosixPath(i.filename); mode=i.external_attr>>16
                      if q.is_absolute() or '..' in q.parts or '\\' in i.filename or stat.S_ISLNK(mode): unsafe.append(i.filename[:200]); continue
                      if i.is_dir(): continue
                      total+=i.file_size
                      if i.file_size>256*1024*1024: unsafe.append(i.filename[:200]); continue
                      if Path(i.filename).name.lower() in {'readme','readme.md','readme.txt','package.json','pyproject.toml','cargo.toml','cmakelists.txt','makefile','go.mod','pom.xml'}: manifests.append(i.filename)
                      if len(rows)<limit: rows.append({'path':i.filename[:250],'bytes':i.file_size,'compressed':i.compress_size,'type':Path(i.filename).suffix.lower()})
              return {'archive':label,'entry_count':len(infos),'listed':len(rows),'expanded_bytes':total,'manifests':manifests[:100],'unsafe_entries':unsafe[:40],'files':rows}
          def read_zip(name,entry):
              p,label=safe(name); q=PurePosixPath(entry)
              if q.is_absolute() or '..' in q.parts or '\\' in entry: raise ValueError('Entrada ZIP insegura.')
              with zipfile.ZipFile(p) as z:
                  i=z.getinfo(entry)
                  if i.file_size>250000: raise ValueError('Entrada acima de 250 KB; extraia o ZIP para ler por partes.')
                  data=z.read(i)
              if b'\0' in data[:4096]: return {'archive':label,'entry':entry,'binary':True,'bytes':len(data)}
              return {'archive':label,'entry':entry,'content':data.decode('utf-8',errors='replace')}
          def extract_zip(name,destination=''):
              p,label=safe(name); dest,label2=safe(destination or 'meva-workspace/'+p.stem,True)
              if not zipfile.is_zipfile(p) or dest.exists(): raise ValueError('ZIP inválido ou destino já existe.')
              dest.mkdir(parents=True); total=0; files=[]
              try:
                  with zipfile.ZipFile(p) as z:
                      infos=z.infolist()
                      if len(infos)>8000: raise ValueError('Mais de 8.000 entradas.')
                      for i in infos:
                          q=PurePosixPath(i.filename); mode=i.external_attr>>16
                          if q.is_absolute() or '..' in q.parts or '\\' in i.filename or stat.S_ISLNK(mode): raise ValueError('Caminho perigoso no ZIP: '+i.filename[:150])
                          if i.is_dir(): continue
                          if i.file_size>256*1024*1024: raise ValueError('Arquivo interno acima de 256 MB.')
                          total+=i.file_size
                          if total>1024*1024*1024: raise ValueError('ZIP expande acima de 1 GB.')
                          if i.compress_size and i.file_size/i.compress_size>1000: raise ValueError('Taxa de compressão suspeita.')
                          target=dest.joinpath(*q.parts).resolve()
                          if dest.resolve() not in target.parents: raise ValueError('ZIP tenta escapar do destino.')
