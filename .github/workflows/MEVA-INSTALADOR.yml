          SECRET_SUFFIXES={'.pem','.p12','.pfx','.key','.keystore'}
          READ_COMMANDS={'pwd','ls','head','tail','cat','file','du','df','which','sha256sum','readelf','objdump','nm','wc','stat','git','strings','xxd','hexdump','uname'}
          FILE_READER_COMMANDS={'head','tail','cat','file','sha256sum','readelf','objdump','nm','strings','xxd','hexdump','wc','stat','du'}
          BUILD_COMMANDS={'make','cmake','ninja','meson','python3','gcc','g++','clang','clang++','ld','ld.lld','as','powerpc-linux-gnu-gcc','powerpc-linux-gnu-g++','powerpc-linux-gnu-ld','powerpc64-linux-gnu-gcc','powerpc64-linux-gnu-g++','powerpc64-linux-gnu-ld','dtc','bison','flex','perl','cargo','go','node','npm','ctest','pytest','pkg-config','autoreconf','configure','tar','unzip','zip','cpio','rsync','gzip','xz','zstd','makeinfo','git','gh'}
          SYMLINKS={}
          BASELINE_DIR=WORK/'baseline'
          AUDIT=[]
          AUDIT_PATH=WORK/'MEVA-ACTIONS.json'
          ERROR_PATH=WORK/'MEVA-ERROR.md'
          MEMORY_PATH=PROJECT/'MEVA.md'

          def log(s): print('[MEVA] '+str(s),flush=True)

          def redact_text(value):
              text=str(value)
              text=re.sub(r'(?i)(authorization|api[_-]?key|access[_-]?token|password|secret)\s*[:=]\s*[^\s,;]+',r'\1=[REDACTED]',text)
              text=re.sub(r'\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|nvapi-[A-Za-z0-9_-]{20,})\b','[REDACTED_TOKEN]',text)
              return text[:2400]

          def audit_target(action):
              for key in ('path','source','destination','directory'):
                  value=action.get(key)
                  if isinstance(value,str) and value:
                      return key+'='+value[:240]
              command=action.get('command')
              return 'command='+redact_text(command)[:240] if isinstance(command,str) and command else ''

          def persist_audit():
              try:
                  WORK.mkdir(parents=True,exist_ok=True)
                  tmp=AUDIT_PATH.with_suffix('.tmp')
                  tmp.write_text(json.dumps({'schema':1,'events':AUDIT},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  tmp.replace(AUDIT_PATH)
              except Exception as exc:
                  log('Não foi possível gravar a auditoria intermediária: '+redact_text(exc))

          def audit_result(value):
              if not isinstance(value,dict):
                  return {'type':type(value).__name__,'length':len(str(value))}
              keep=('ok','exit_code','timeout','error','written','bytes','replacements','deleted','moved_from','moved_to','extracted_files','unpacked_bytes','destination','entries_total','total_size','next_offset','size','mode','sha256','file_count','symlink_count','languages','architecture_hints','files','matches','results')
              result={}
              for key in keep:
                  if key not in value: continue
                  item=value[key]
                  if isinstance(item,str): result[key]=redact_text(item)
                  elif isinstance(item,(int,float,bool)) or item is None: result[key]=item
                  elif isinstance(item,list):
                      result[key+'_count']=len(item)
                      if key=='files': result['files_sample']=[redact_text(x) for x in item[:20] if isinstance(x,str)]
                  elif isinstance(item,dict): result[key]={str(k):redact_text(v) if isinstance(v,str) else v for k,v in list(item.items())[:30] if isinstance(v,(str,int,float,bool)) or v is None}
              if 'output' in value and isinstance(value['output'],str):
                  output=redact_text(value['output'])
                  result['output_tail']=output[-1200:]
              return result
          def api_url(path): return 'https://api.github.com/repos/'+GH_REPO+path

          def gh_request(path,accept='application/vnd.github+json',timeout=300):
              if not GH_TOKEN: raise RuntimeError('GITHUB_TOKEN indisponível para buscar o anexo.')
              req=urllib.request.Request(api_url(path),headers={'Authorization':'Bearer '+GH_TOKEN,'Accept':accept,'X-GitHub-Api-Version':'2022-11-28','User-Agent':'MEVA-CODE-V15'})
              try:
                  response=urllib.request.urlopen(req,timeout=timeout)
                  host=(urllib.parse.urlparse(response.geturl()).hostname or '').lower()
                  if accept=='application/octet-stream' and host not in ('api.github.com','release-assets.githubusercontent.com','objects.githubusercontent.com'):
                      response.close(); raise RuntimeError('Host de download não autorizado: '+host)
                  return response
              except urllib.error.HTTPError as e:
                  detail=e.read(1800).decode('utf-8','replace')
                  raise RuntimeError('GitHub API HTTP '+str(e.code)+': '+detail)

          def valid_manifest(raw):
              if not raw: return None
              try: data=json.loads(raw)
              except Exception as e: raise RuntimeError('Manifesto de upload inválido: '+str(e))
              if not isinstance(data,dict): raise RuntimeError('Manifesto de upload precisa ser um objeto JSON.')
              transport=data.get('transport','release')
              if transport=='git_chunks':
                  upload_ref=str(data.get('upload_ref',''))
                  upload_id=str(data.get('upload_id',''))
                  name=str(data.get('name',''))
                  size=int(data.get('size',0))
                  chunk_size=int(data.get('chunk_size',0))
                  parts=data.get('parts')
                  if not re.fullmatch(r'meva-upload-[a-z0-9-]{8,80}',upload_ref): raise RuntimeError('Branch temporário de upload inválido.')
                  if not re.fullmatch(r'[a-z0-9-]{8,80}',upload_id): raise RuntimeError('ID de upload inválido.')
                  commit_sha=str(data.get('commit_sha','')).lower()
                  if not re.fullmatch(r'[0-9a-f]{40}',commit_sha): raise RuntimeError('SHA do commit temporário ausente ou inválido.')
                  if not name.lower().endswith('.zip'): raise RuntimeError('O anexo precisa ser ZIP.')
                  if size<=0 or size>900*1024*1024: raise RuntimeError('ZIP por blocos vazio ou acima de 900 MiB.')
                  if chunk_size!=16*1024*1024 or not isinstance(parts,list) or not parts or len(parts)>60: raise RuntimeError('Manifesto de blocos inválido.')
                  expected_count=(size+chunk_size-1)//chunk_size
                  if len(parts)!=expected_count: raise RuntimeError('Quantidade de blocos não confere com o tamanho total.')
                  normalized=[]; summed=0
                  for i,item in enumerate(parts):
                      if not isinstance(item,dict): raise RuntimeError('Metadados de bloco inválidos.')
                      expected_path='.meva-upload/'+upload_id+'/part-'+str(i).zfill(5)+'.bin'
                      part_path=str(item.get('path',''))
                      part_size=int(item.get('size',-1))
                      expected_size=min(chunk_size,size-i*chunk_size)
                      part_sha=str(item.get('sha256','')).lower()
                      if part_path!=expected_path or part_size!=expected_size: raise RuntimeError('Caminho ou tamanho do bloco '+str(i)+' inválido.')
                      if not re.fullmatch(r'[0-9a-f]{64}',part_sha): raise RuntimeError('SHA-256 inválido no bloco '+str(i)+'.')
                      normalized.append({'path':expected_path,'size':part_size,'sha256':part_sha}); summed+=part_size
                  if summed!=size: raise RuntimeError('Soma dos blocos não corresponde ao tamanho do ZIP.')
                  return {'transport':'git_chunks','upload_ref':upload_ref,'upload_id':upload_id,'commit_sha':commit_sha,'name':name,'size':size,'chunk_size':chunk_size,'parts':normalized}
              if not isinstance(data.get('release_id'),int) or not isinstance(data.get('assets'),list) or len(data['assets'])!=1:
                  raise RuntimeError('Manifesto de Release antigo inválido.')
              item=data['assets'][0]
              if not isinstance(item,dict) or not isinstance(item.get('asset_id'),int): raise RuntimeError('ID do asset inválido.')
              name=str(item.get('name',''))
              if not name.lower().endswith('.zip'): raise RuntimeError('O anexo precisa ser ZIP.')
              size=int(item.get('size',0))
              if size<=0 or size>MAX_UPLOAD: raise RuntimeError('Tamanho do ZIP inválido ou acima de 1,8 GB.')
              return {'transport':'release','release_id':data['release_id'],'tag_name':str(data.get('tag_name','')),'asset_id':item['asset_id'],'name':name,'size':size}

          def download_asset(meta):
              if meta.get('transport')=='git_chunks':
                  upload_ref=os.getenv('UPLOAD_REF','')
                  if upload_ref!=meta['upload_ref']: raise RuntimeError('A branch temporária não corresponde ao manifesto do ZIP.')
                  encoded_ref=urllib.parse.quote(upload_ref,safe='')
                  with gh_request('/git/ref/heads/'+encoded_ref) as response:
                      ref_data=json.loads(response.read().decode('utf-8'))
                  commit_sha=str((ref_data.get('object') or {}).get('sha','')).lower()
                  if commit_sha!=meta.get('commit_sha'): raise RuntimeError('O commit da branch temporária não corresponde ao SHA verificado no manifesto.')
                  with gh_request('/git/commits/'+commit_sha) as response:
                      commit_data=json.loads(response.read().decode('utf-8'))
                  tree_sha=str((commit_data.get('tree') or {}).get('sha',''))
                  if not re.fullmatch(r'[0-9a-f]{40}',tree_sha): raise RuntimeError('Commit temporário sem árvore Git válida.')
                  with gh_request('/git/trees/'+tree_sha+'?recursive=1') as response:
                      tree_data=json.loads(response.read().decode('utf-8'))
                  if tree_data.get('truncated'): raise RuntimeError('Árvore Git temporária truncada; não é seguro reconstruir o ZIP.')
                  blobs={entry.get('path'):entry.get('sha') for entry in tree_data.get('tree',[]) if entry.get('type')=='blob'}
                  INBOX.mkdir(parents=True,exist_ok=True)
                  dest=INBOX/'linux-upload.zip'; dest.unlink(missing_ok=True)
                  total=0
                  with dest.open('wb') as out:
                      for i,part in enumerate(meta['parts']):
                          blob_sha=blobs.get(part['path'])
                          if not isinstance(blob_sha,str) or not re.fullmatch(r'[0-9a-f]{40}',blob_sha): raise RuntimeError('Bloco não encontrado na árvore do commit: '+part['path'])
                          with gh_request('/git/blobs/'+blob_sha) as response:
                              blob=json.loads(response.read().decode('utf-8'))
                          if blob.get('encoding')!='base64' or not isinstance(blob.get('content'),str): raise RuntimeError('GitHub não retornou o bloco em base64: '+part['path'])
                          try: payload=base64.b64decode(blob['content'],validate=False)
                          except Exception as exc: raise RuntimeError('Base64 inválido no bloco '+str(i)+': '+str(exc))
                          if len(payload)!=part['size']: raise RuntimeError('Tamanho divergente no bloco '+str(i)+'.')
                          if hashlib.sha256(payload).hexdigest()!=part.get('sha256'): raise RuntimeError('SHA-256 divergente no bloco '+str(i)+'.')
                          out.write(payload); total+=len(payload)
                  if total!=meta['size']: raise RuntimeError('ZIP reconstruído incompleto: '+str(total)+' de '+str(meta['size'])+' bytes.')
                  if not zipfile.is_zipfile(dest): raise RuntimeError('O ZIP reconstruído é inválido.')
                  with zipfile.ZipFile(dest) as archive:
                      bad=archive.testzip()
                      if bad: raise RuntimeError('CRC inválido no ZIP de entrada: '+bad)
                  log('ZIP reconstruído e verificado via Git Database API: '+str(len(meta['parts']))+' blocos, '+str(total)+' bytes.')
                  return dest

              rid=int(meta['release_id']); aid=int(meta['asset_id'])
              with gh_request('/releases/'+str(rid)) as r: release=json.loads(r.read().decode('utf-8'))
              if int(release.get('id',-1))!=rid: raise RuntimeError('Release do anexo não corresponde ao ID informado.')
              asset=next((x for x in release.get('assets',[]) if int(x.get('id',-1))==aid),None)
              if not asset: raise RuntimeError('O asset não pertence ao Release informado.')
              if not str(asset.get('name','')).lower().endswith('.zip'): raise RuntimeError('O asset não é ZIP.')
              expected=int(asset.get('size',0))
              if expected<=0 or expected>MAX_UPLOAD: raise RuntimeError('ZIP vazio ou acima do limite de 1,8 GB.')
              if meta.get('size') and int(meta['size'])!=expected: raise RuntimeError('O tamanho informado no manifesto não confere com o asset.')
              INBOX.mkdir(parents=True,exist_ok=True)
              dest=INBOX/'linux-upload.zip'; dest.unlink(missing_ok=True)
              total=0
              with gh_request('/releases/assets/'+str(aid),'application/octet-stream',timeout=600) as response, dest.open('wb') as out:
                  while True:
                      block=response.read(1024*1024)
                      if not block: break
                      total+=len(block)
                      if total>MAX_UPLOAD: raise RuntimeError('Download ultrapassou 1,8 GB.')
                      out.write(block)
              if total!=expected: raise RuntimeError('Download incompleto: esperado '+str(expected)+' bytes; recebido '+str(total)+'.')
              log('ZIP recebido e conferido: '+str(total)+' bytes.')
              return dest

          def is_secret_path(parts):
              for part in parts:
                  low=part.lower()
                  if low in SECRET_NAMES or low.startswith('.env.') or low.endswith(tuple(SECRET_SUFFIXES)):
                      return True
              return False

          def clean_zip_name(name):
              if not isinstance(name,str) or not name or '\x00' in name or '\\' in name:
                  raise ValueError('Caminho ZIP inválido.')
              q=PurePosixPath(name)
              if q.is_absolute() or re.match(r'^[A-Za-z]:',name) or any(p in ('..','.') for p in q.parts):
                  raise ValueError('ZIP contém caminho absoluto ou traversal: '+name[:160])
              if not q.parts: raise ValueError('Entrada ZIP sem caminho.')
              return q

          def link_is_safe(link_parts,target):
              if not isinstance(target,str) or not target or '\x00' in target or '\\' in target:
                  return False
              # Links absolutos legítimos de Linux podem ser preservados no ZIP,
              # mas nunca são materializados no runner.
              if target.startswith('/'):
                  return True
              stack=list(link_parts[:-1])
              for part in PurePosixPath(target).parts:
                  if part in ('','.'): continue
                  if part=='..':
                      if not stack: return False
                      stack.pop()
                  else: stack.append(part)
              return True

          def unzip_project(zip_path):
              stage=WORK/'staging'
              if stage.exists(): shutil.rmtree(stage)
              stage.mkdir(parents=True)
              with zipfile.ZipFile(zip_path) as z:
                  infos=z.infolist()
                  if not infos or len(infos)>MAX_FILES: raise RuntimeError('Quantidade de entradas ZIP inválida ou acima de '+str(MAX_FILES)+'.')
                  accepted=[]; seen=set(); total=0
                  for info in infos:
                      if info.flag_bits&0x1: raise RuntimeError('ZIP criptografado não é aceito.')
                      q=clean_zip_name(info.filename)
                      if any(p in ('.git','__MACOSX') for p in q.parts) or q.name in ('.DS_Store','Thumbs.db'): continue
                      if is_secret_path(q.parts):
                          log('Arquivo sensível excluído da importação: '+info.filename[:120]); continue
                      mode=(info.external_attr>>16)&0xffff; kind=stat.S_IFMT(mode)
                      if kind not in (0,stat.S_IFREG,stat.S_IFDIR,stat.S_IFLNK):
                          raise RuntimeError('ZIP contém arquivo especial não suportado: '+info.filename[:160])
                      norm=q.as_posix().rstrip('/')
                      if norm in seen: raise RuntimeError('ZIP contém caminho duplicado: '+norm[:160])
                      seen.add(norm)
                      if info.file_size>MAX_FILE: raise RuntimeError('Arquivo individual acima de 1 GB: '+norm[:160])
                      total+=info.file_size
                      if total>MAX_UNPACKED: raise RuntimeError('Conteúdo descompactado acima de 3 GB.')
                      if info.file_size and info.compress_size and info.file_size/max(1,info.compress_size)>500:
                          raise RuntimeError('Taxa de compressão suspeita: '+norm[:160])
                      target=None
                      if kind==stat.S_IFLNK:
                          if info.file_size>4096: raise RuntimeError('Alvo de symlink excessivamente longo.')
                          raw=z.read(info)
                          if len(raw)>4096: raise RuntimeError('Alvo de symlink excessivamente longo.')
                          target=raw.decode('utf-8','strict')
                          if not link_is_safe(q.parts,target):
                              log('Symlink inseguro ignorado: '+norm); continue
                      accepted.append((info,q,mode,target))
                  if not accepted: raise RuntimeError('ZIP sem arquivos permitidos após validação.')
                  dirs={q.parts[0] for info,q,mode,target in accepted if len(q.parts)>1}
                  root_files=[q for info,q,mode,target in accepted if len(q.parts)==1 and not info.is_dir() and target is None]
                  strip_root=(len(dirs)==1 and not root_files)
                  links={}
                  for info,q,mode,target in accepted:
                      parts=q.parts[1:] if strip_root else q.parts
                      if not parts: continue
                      out=stage.joinpath(*parts)
                      if target is not None:
                          links[PurePosixPath(*parts).as_posix()]=target
                          continue
                      resolved=out.resolve(strict=False)
                      if resolved!=stage.resolve() and stage.resolve() not in resolved.parents:
                          raise RuntimeError('Extração escapou do diretório temporário.')
                      if info.is_dir(): out.mkdir(parents=True,exist_ok=True); continue
                      out.parent.mkdir(parents=True,exist_ok=True)
                      written=0
                      with z.open(info,'r') as src, out.open('wb') as dst:
                          while True:
                              block=src.read(1024*1024)
                              if not block: break
                              written+=len(block)
                              if written>MAX_FILE or written>info.file_size: raise RuntimeError('Tamanho real da entrada ZIP excedeu o declarado.')
                              dst.write(block)
                      if written!=info.file_size: raise RuntimeError('Entrada ZIP incompleta: '+str(info.filename))
                      permissions=mode&0o777
                      if permissions: out.chmod(permissions)
              if not any(p.is_file() for p in stage.rglob('*')) and not links:
                  raise RuntimeError('Nenhum arquivo regular válido foi extraído.')
              if PROJECT.exists(): shutil.rmtree(PROJECT)
              stage.rename(PROJECT)
              SYMLINKS.clear(); SYMLINKS.update(links)
              (WORK/'project-symlinks.json').write_text(json.dumps(SYMLINKS,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              log('Projeto extraído: '+str(sum(1 for p in PROJECT.rglob('*') if p.is_file()))+' arquivos; '+str(len(SYMLINKS))+' symlinks preservados como metadados.')

          def safe_path(raw,allow_root=False):
              if allow_root and raw in ('',None,'.'): return PROJECT
              if not isinstance(raw,str) or not raw or len(raw)>600 or '\\' in raw:
                  raise ValueError('Caminho inválido.')
              q=PurePosixPath(raw)
              if q.is_absolute() or any(x in ('','..','.') for x in q.parts): raise ValueError('Caminho fora do projeto.')
              if any(x.lower() in DENY_DIRS for x in q.parts) or is_secret_path(q.parts):
                  raise ValueError('Diretório interno ou arquivo sensível protegido.')
              name=q.as_posix()
              for i in range(1,len(q.parts)+1):
                  if PurePosixPath(*q.parts[:i]).as_posix() in SYMLINKS:
                      raise ValueError('Caminho passa por symlink preservado; inspecione o link antes de alterar.')
              p=PROJECT.joinpath(*q.parts)
              for parent in [p,*p.parents]:
                  if parent==PROJECT.parent: break
                  if parent.is_symlink(): raise ValueError('Links simbólicos não podem ser seguidos pelo agente.')
                  if parent==PROJECT: break
              resolved=p.resolve(strict=False)
              if resolved!=PROJECT.resolve() and PROJECT.resolve() not in resolved.parents:
                  raise ValueError('Caminho escapou do projeto Linux.')
              return p

          def inventory(limit=8000,offset=0):
              result=[]
              if not PROJECT.is_dir(): return result
              for cur,dirs,files in os.walk(PROJECT,followlinks=False):
                  dirs[:]=sorted(d for d in dirs if d.lower() not in DENY_DIRS and not (Path(cur)/d).is_symlink())
                  for name in sorted(files):
                      p=Path(cur)/name
                      try:
                          rel=p.relative_to(PROJECT).as_posix()
                          if is_secret_path(PurePosixPath(rel).parts) or p.is_symlink(): continue
                          result.append(rel)
                      except Exception: continue
                      if len(result)>=MAX_FILES: break
                  if len(result)>=MAX_FILES: break
              result.sort(); offset=max(0,min(MAX_FILES,int(offset))); limit=max(1,min(MAX_FILES,int(limit)))
              return result[offset:offset+limit]

          def file_hash(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()

          def snapshot():
              data={}
              for name in inventory(MAX_FILES):
                  p=PROJECT/name
                  try: data[name]={'sha256':file_hash(p),'size':p.stat().st_size,'mode':stat.S_IMODE(p.stat().st_mode)}
                  except OSError: pass
              return data

          def project_info():
              names=inventory(MAX_FILES)
              markers={'README','README.md','README.txt','Kconfig','Makefile','CMakeLists.txt','Config.in','.config','buildroot.config','defconfig','rootfs.cpio.gz','zImage','zImage.xenon','xenon.elf','package.json','pyproject.toml','Cargo.toml','go.mod'}
              important=[n for n in names if Path(n).name in markers or Path(n).name.endswith(('.defconfig','.config'))]
              lang_ext={'.c':'C','.h':'C headers','.cpp':'C++','.hpp':'C++ headers','.py':'Python','.sh':'Shell','.js':'JavaScript','.ts':'TypeScript','.rs':'Rust','.go':'Go','.mk':'Make/Buildroot','.dts':'Device Tree','.dtsi':'Device Tree'}
              langs={}
              for n in names:
                  ext=Path(n).suffix.lower()
                  if ext in lang_ext: langs[lang_ext[ext]]=langs.get(lang_ext[ext],0)+1
              hints=[]
              for n in names:
                  low=n.lower()
                  if 'buildroot' in low: hints.append('Buildroot: '+n)
                  if 'xenon' in low or 'xbox' in low or 'free60' in low: hints.append('Xbox/Xenon: '+n)
                  if 'rootfs' in low or 'cpio' in low: hints.append('Root filesystem: '+n)
                  if 'kernel' in low or 'zimage' in low: hints.append('Kernel: '+n)
              return {'root':'meva-workspace/linux-project','file_count':len(names),'sample_files':names[:1200],'important_files':important[:300],'languages':langs,'architecture_hints':sorted(set(hints))[:250],'symlink_count':len(SYMLINKS)}

          def proc(argv,cwd=PROJECT,timeout=120,limit=18000):
              env=os.environ.copy()
              for key in list(env):
                  if key.startswith(('GITHUB_','ACTIONS_','RUNNER_')) or re.search(r'(TOKEN|SECRET|PASSWORD|CREDENTIAL|PRIVATE_KEY|API_KEY)',key,re.I): env.pop(key,None)
              env.update({'HOME':'/tmp/meva-home','GIT_CONFIG_NOSYSTEM':'1','GIT_TERMINAL_PROMPT':'0','CI':'1'})
              Path(env['HOME']).mkdir(parents=True,exist_ok=True)
              try:
                  cp=subprocess.run(argv,cwd=cwd,text=True,capture_output=True,timeout=timeout,env=env,stdin=subprocess.DEVNULL)
                  output=((cp.stdout or '')+'\n'+(cp.stderr or '')).strip()
                  return {'ok':cp.returncode==0,'exit_code':cp.returncode,'output':output[-limit:]}
              except subprocess.TimeoutExpired as e:
                  out=(e.stdout or '')+(e.stderr or '')
                  if isinstance(out,bytes): out=out.decode('utf-8','replace')
                  return {'ok':False,'timeout':True,'output':str(out)[-limit:]+'\nTIMEOUT'}
              except Exception as e: return {'ok':False,'error':str(e)[:1000]}

          def parse_command(command,allowed,read_only=False):
              if not isinstance(command,str) or not command.strip() or len(command)>12000: raise ValueError('Comando vazio ou acima do limite.')
              if any(x in command for x in (';','|','&','>','<','`','$','\n','\r')): raise ValueError('Use um comando por ação; encadeamento de shell bloqueado.')
              argv=shlex.split(command)
              if not argv: raise ValueError('Comando vazio.')
              raw=argv[0]; exe=raw[2:] if raw.startswith('./') else raw
              local_script=None
              if raw.startswith('./'):
                  local_script=safe_path(raw[2:])
                  if not local_script.is_file(): raise ValueError('Script local inexistente.')
              if exe not in allowed: raise ValueError('Executável não autorizado: '+exe)
              if exe in ('bash','sh'):
                  if len(argv)<2 or argv[1] in ('-c','--command'): raise ValueError('Shell inline bloqueado; só scripts do projeto são permitidos.')
                  safe_path(argv[1])
              if exe=='git' and (len(argv)<2 or argv[1] not in {'status','diff','log','show','ls-files','branch','rev-parse','describe'}):
                  raise ValueError('Somente subcomandos Git de leitura são permitidos.')
              for arg in argv[1:]:
                  if arg in ('..','../') or arg.startswith('../') or '/../' in arg: raise ValueError('Caminho que tenta sair do projeto bloqueado.')
                  if read_only and arg.startswith('/'): raise ValueError('Caminho absoluto bloqueado em comandos de inspeção.')
              if exe in FILE_READER_COMMANDS:
                  skip=False
                  for arg in argv[1:]:
                      if skip: skip=False; continue
                      if arg in ('-n','-c','-b','-s','-l','-L','-N','-g','-e','-m','-j'): skip=True; continue
                      if arg.startswith('-'): continue
                      safe_path(arg,allow_root=True)
              return ([str(local_script)]+argv[1:]) if local_script else argv

          def materialize_symlinks():
              created=[]; root=PROJECT.resolve()
              for rel,target in sorted(SYMLINKS.items()):
                  link=PROJECT.joinpath(*PurePosixPath(rel).parts)
                  if link.exists() or link.is_symlink() or target.startswith('/') or not link_is_safe(PurePosixPath(rel).parts,target): continue
                  resolved=(link.parent/target).resolve(strict=False)
                  if resolved!=root and root not in resolved.parents: continue
                  link.parent.mkdir(parents=True,exist_ok=True)
                  try: os.symlink(target,link); created.append(link)
                  except OSError: pass
              return created

          def remove_materialized_symlinks(created):
              for link in reversed(created):
                  try:
                      if link.is_symlink(): link.unlink()
                  except OSError: pass

          def tool(action):
              if not isinstance(action,dict): raise ValueError('Ação precisa ser um objeto JSON.')
              kind=action.get('type'); path=action.get('path','')
              write_allowed=(AUTONOMY=='auto' and MODE in ('agent','linux_zip','resume'))
              if kind in {'write_file','replace_text','delete_file','move_file','extract_zip','run_build'} and not write_allowed:
                  raise ValueError('Edição bloqueada. Use Auto em modo Agente/ZIP/Retomar.')
              if kind=='inspect_project': return project_info()
              if kind=='analyze_architecture': return project_info()
              if kind=='list_files':
                  offset=max(0,min(MAX_FILES,int(action.get('offset',0)))); limit=max(100,min(5000,int(action.get('limit',1000))))
                  page=inventory(limit,offset)
                  return {'files':page,'offset':offset,'next_offset':offset+len(page) if len(page)==limit else None}
              if kind=='read_file':
                  p=safe_path(path); offset=max(0,int(action.get('offset',0))); limit=max(1,min(40000,int(action.get('limit',24000))))
                  if not p.is_file(): raise ValueError('Arquivo não encontrado.')
                  if p.stat().st_size>100*1024*1024: raise ValueError('Arquivo grande demais para leitura textual.')
                  with p.open('rb') as f: f.seek(offset); data=f.read(limit)
                  if b'\0' in data[:2048]: raise ValueError('Arquivo binário; use file_info.')
                  return {'path':path,'content':data.decode('utf-8','replace'),'next_offset':offset+len(data),'total_size':p.stat().st_size}
              if kind=='write_file':
                  p=safe_path(path); content=action.get('content','')
                  if not isinstance(content,str) or len(content)>5_000_000: raise ValueError('Conteúdo precisa ser texto com até 5 MB.')
                  p.parent.mkdir(parents=True,exist_ok=True); tmp=p.with_name(p.name+'.meva-tmp'); tmp.write_text(content,encoding='utf-8'); tmp.replace(p)
                  return {'written':path,'bytes':p.stat().st_size}
              if kind=='replace_text':
                  p=safe_path(path)
                  if not p.is_file() or p.stat().st_size>25*1024*1024: raise ValueError('Arquivo ausente ou acima de 25 MB.')
                  old=action.get('find'); new=action.get('replace',''); expected=int(action.get('expected_count',1))
                  if not isinstance(old,str) or not old or not isinstance(new,str): raise ValueError('find/replace inválidos.')
                  content=p.read_text(encoding='utf-8'); count=content.count(old)
                  if count!=expected: raise ValueError('Ocorrências encontradas: '+str(count)+'; esperadas: '+str(expected)+'.')
                  tmp=p.with_name(p.name+'.meva-tmp'); tmp.write_text(content.replace(old,new),encoding='utf-8'); tmp.replace(p)
                  return {'file':path,'replacements':count}
              if kind=='delete_file':
                  p=safe_path(path)
                  if not p.is_file(): raise ValueError('Somente arquivos regulares existentes podem ser removidos.')
                  p.unlink(); return {'deleted':path}
              if kind=='move_file':
                  src=safe_path(action.get('source','')); dst=safe_path(action.get('destination',''))
                  if not src.is_file(): raise ValueError('Origem não é arquivo regular.')
                  if dst.exists(): raise ValueError('Destino já existe; não sobrescreva silenciosamente.')
                  dst.parent.mkdir(parents=True,exist_ok=True); shutil.move(str(src),str(dst))
                  return {'moved_from':action['source'],'moved_to':action['destination']}
              if kind=='search_text':
                  query=str(action.get('query','')).casefold()
                  if not query: raise ValueError('Consulta vazia.')
                  matches=[]
                  for name in inventory(MAX_FILES):
                      p=PROJECT/name
                      try:
                          if p.stat().st_size>8*1024*1024: continue
                          with p.open('r',encoding='utf-8',errors='replace') as f:
                              for number,line in enumerate(f,1):
                                  if query in line.casefold():
                                      matches.append({'path':name,'line':number,'text':line.rstrip()[:500]})
                                      if len(matches)>=150: return {'matches':matches}
                      except Exception: pass
                  return {'matches':matches}
              if kind=='symlink_info':
                  name=PurePosixPath(str(path)).as_posix()
                  if name not in SYMLINKS or is_secret_path(PurePosixPath(name).parts): raise ValueError('Symlink não encontrado ou protegido.')
                  return {'path':name,'target':SYMLINKS[name],'note':'Preservado como metadado ZIP; links absolutos nunca são materializados no runner.'}
              if kind=='file_info':
                  p=safe_path(path)
                  if not p.is_file(): raise ValueError('Arquivo não encontrado.')
                  st=p.stat(); result={'path':path,'size':st.st_size,'mode':oct(stat.S_IMODE(st.st_mode)),'sha256':file_hash(p)}
                  if shutil.which('file'): result['file']=proc(['file','-b',str(p)],timeout=30)['output']
                  return result
              if kind=='inspect_zip':
                  p=safe_path(path)
                  if not p.is_file() or not zipfile.is_zipfile(p): raise ValueError('ZIP não encontrado ou inválido.')
                  with zipfile.ZipFile(p) as z:
                      return {'entries_total':len(z.infolist()),'sample':[{'name':i.filename[:240],'size':i.file_size,'compressed':i.compress_size} for i in z.infolist()[:500]]}
              if kind=='extract_zip':
                  p=safe_path(path); dest=safe_path(action.get('destination','extracted'))
                  if not p.is_file() or not zipfile.is_zipfile(p): raise ValueError('ZIP inválido.')
                  if dest.exists() and any(dest.iterdir()): raise ValueError('Destino não vazio.')
                  dest.mkdir(parents=True,exist_ok=True); count=0; total=0
