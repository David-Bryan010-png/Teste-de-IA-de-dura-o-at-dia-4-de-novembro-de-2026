              for m in reversed(d.get('messages',[])):
                  if m.get('role')=='assistant':m['content']+='\n\nProjeto/artefatos: '+url;break
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          fi
          if [[ -n "$SOURCE_TAG" ]]; then gh release delete "$SOURCE_TAG" --repo "$GH_REPO" --cleanup-tag --yes || true; fi

      - name: Persistir histórico e alterações de projeto
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A -- . ':(exclude).github/**' ':(exclude)meva-inbox/**' ':(exclude)meva-workspace/**' ':(exclude)**/node_modules/**' ':(exclude)**/.venv/**' ':(exclude)**/venv/**' ':(exclude)**/.cache/**' ':(exclude)**/.gradle/**' ':(exclude)**/.pytest_cache/**' ':(exclude)**/__pycache__/**' ':(exclude)**/target/**' ':(exclude)**/build-meva/**' ':(exclude)**/bin/**' ':(exclude)**/obj/**'
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git commit -m 'MEVA V8: memória e alterações'
            AUTH="$(printf 'x-access-token:%s' "${{ github.token }}" | base64 -w0)"
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch origin "+refs/heads/${{ inputs.branch || github.ref_name }}:refs/remotes/origin/${{ inputs.branch || github.ref_name }}"
            git rebase "origin/${{ inputs.branch || github.ref_name }}"
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:${{ inputs.branch || github.ref_name }}"
          fi

      - name: Diagnóstico
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/meva-diagnostics
          cp /tmp/meva-llama.log /tmp/meva-diagnostics/ 2>/dev/null || true
          cp /tmp/meva-response.txt /tmp/meva-diagnostics/ 2>/dev/null || true
          { df -h; tail -n 100 /tmp/meva-llama.log 2>/dev/null || true; } >> "$GITHUB_STEP_SUMMARY"

      - name: Enviar diagnóstico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meva-v8-diagnostics-${{ github.run_id }}
          path: /tmp/meva-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Resumo
        if: always()
        env:
          MODE: ${{ inputs.mode }}
          CID: ${{ inputs.conversation_id }}
          ACCEL: ${{ steps.accelerator.outputs.backend }}
        shell: bash
        run: |
          {
            echo '## MEVA V8'
            echo "- Modo: $MODE"
            echo "- Conversa: ${CID:-não definida}"
            echo '- Chat: Qwen2.5-0.5B-Instruct Q4_K_M'
            echo '- Agente: Qwen2.5-Coder-3B-Instruct Q4_K_M'
            echo "- Acelerador detectado: ${ACCEL:-não usado}"
            echo '- Ferramentas: Bash, Playwright, ZIP, arquivos, Internet, build e testes'
            echo '- Terminal/browser executam apenas na VM temporária do runner.'
          } >> "$GITHUB_STEP_SUMMARY"
