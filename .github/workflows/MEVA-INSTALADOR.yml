                  # Very basic patch application (expects simple context)
                  try:
                      import difflib
                      # For robustness we use a simple replace-based if possible, else fail
                      if '---' in patch and '+++' in patch:
                          # Fallback: expect the user to provide exact old/new via replace_text for complex cases
                          raise ValueError('use replace_text para patches complexos; apply_patch aceita apenas diffs simples')
                      # Minimal: treat as full file replacement if starts with special marker
                      if patch.startswith('FULL_FILE:'):
