                      if got>200*1024*1024: raise SystemExit('Arquivo excedeu 200 MB.')
                      h.update(chunk); out.write(chunk)
              if got!=size: dest.unlink(missing_ok=True); raise SystemExit(f'Tamanho divergente: {name}')
              print(f'{name}: {got} bytes · SHA256 {h.hexdigest()}')
