              stamp=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime());prev=old_messages[-36:]
              if MODE!='self_test':prev.extend([{'role':'user','content':USER,'created_at':stamp},{'role':'assistant','content':answer,'created_at':stamp}])
              history['messages']=prev;history['provider']=provider;history['model']=model;history['project_loaded']=PROJECT.is_dir() and any(x.is_file() for x in PROJECT.rglob('*'))
