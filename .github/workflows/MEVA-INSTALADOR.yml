name: MEVA — IA, chat, memória e agente de programação
run-name: MEVA ${{ inputs.mode || 'install' }} | ${{ inputs.conversation_id || 'painel' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operação da MEVA
        type: choice
        options:
          - install
          - chat
          - agent
        default: install
        required: true
      message:
        description: Mensagem ou tarefa para a MEVA
        type: string
        required: false
        default: ''
      conversation_id:
        description: ID da conversa (gerado pelo painel)
        type: string
        required: false
        default: ''
      branch:
        description: Branch de destino (vazio usa a branch selecionada)
        type: string
        required: false
        default: ''
      max_steps:
        description: Máximo de ações do agente (1 a 12)
        type: number
        required: false
        default: 6

permissions:
  contents: read

concurrency:
  group: meva-${{ github.repository }}-${{ inputs.conversation_id || github.run_id }}
  cancel-in-progress: false

env:
  # Para atualizar o modelo no futuro, altere MODEL_REPO, MODEL_FILE e MODEL_CACHE_VERSION.
  MODEL_REPO: Qwen/Qwen2.5-Coder-3B-Instruct-GGUF
  MODEL_FILE: qwen2.5-coder-3b-instruct-q4_k_m.gguf
  MODEL_CACHE_VERSION: qwen25-coder-3b-q4km-v1

jobs:
  install:
    name: Gerar painel MEVA e publicar no Pages
    if: ${{ inputs.mode == 'install' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirmar branch padrão
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Execute a instalação na branch padrão: $DEFAULT_BRANCH" >&2
            exit 1
          fi
          mkdir -p public

      - name: Gerar página HTML
        shell: bash
        run: |
          set -euo pipefail
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#0a1020">
            <meta name="description" content="MEVA — inteligência artificial, conversas e agente de programação.">
            <link rel="manifest" href="./manifest.webmanifest">
            <link rel="icon" href="./icon.svg" type="image/svg+xml">
            <link rel="stylesheet" href="./styles.css">
            <title>MEVA — Inteligência Nativa</title>
          </head>
          <body>
            <main class="shell">
              <header class="topbar">
                <div class="brand">
                  <div class="brand-mark">M</div>
                  <div><div class="brand-title">MEVA</div><div class="brand-sub">INTELIGÊNCIA ARTIFICIAL · EXPERIMENTAL</div></div>
                </div>
                <span id="connectionState" class="connection">DESConectada</span>
              </header>

              <section id="loginPanel" class="panel login-panel">
                <div class="eyebrow">ACESSO AO GITHUB</div>
                <h1>Conectar a MEVA</h1>
                <p class="muted">Cada pessoa deve usar seu próprio Fine-grained Personal Access Token. Ele precisa ter <b>Actions: Read and write</b> e acesso a este repositório. Não compartilhe seu token com amigos nem o envie no chat.</p>
                <form id="tokenForm" class="stack">
                  <label for="tokenInput">Token do GitHub</label>
                  <input id="tokenInput" type="password" autocomplete="off" placeholder="github_pat_..." required>
                  <button class="primary" type="submit">Conectar</button>
                  <div id="loginMessage" class="notice" role="status"></div>
                </form>
                <p class="small warning">AVISO: este repositório é público. As mensagens, respostas e memórias salvas poderão ser lidas por qualquer pessoa. Não escreva senhas, endereços, dados pessoais ou informações privadas.</p>
              </section>

              <section id="chatPanel" class="panel chat-panel hidden">
                <div class="chat-head">
                  <div><div class="eyebrow">MEVA ONLINE SOB DEMANDA</div><h1>Conversa</h1><p id="repoLabel" class="muted"></p></div>
                  <button id="newChatBtn" class="ghost" type="button">＋ Nova conversa</button>
                </div>
                <div class="toolbar">
                  <label class="mode-label" for="modeSelect">Modo de operação</label>
                  <select id="modeSelect">
                    <option value="chat">Conversa normal</option>
                    <option value="agent">Agente de programação</option>
                  </select>
                  <label class="mode-label" for="branchInput">Branch</label>
                  <input id="branchInput" class="branch-input" placeholder="main">
                </div>
                <div class="public-note"><b>Conversa pública:</b> o histórico é salvo no repositório e qualquer pessoa pode acessá-lo. Cada mensagem inicia uma execução do GitHub Actions; a resposta não é instantânea.</div>
                <div id="messages" class="messages" aria-live="polite">
                  <div class="welcome"><div class="welcome-symbol">M</div><h2>MEVA pronta para conversar</h2><p>Faça uma pergunta ou escolha o agente para trabalhar nos arquivos do projeto.</p></div>
                </div>
                <form id="messageForm" class="composer">
                  <textarea id="messageInput" rows="3" maxlength="5000" placeholder="Escreva uma mensagem para a MEVA..." required></textarea>
                  <div class="composer-bottom"><span class="small muted">Máximo de 5.000 caracteres</span><button id="sendBtn" class="primary send" type="submit">Enviar ↗</button></div>
                </form>
                <div id="taskStatus" class="task-status" role="status"></div>
                <div class="footer-actions"><button id="refreshConversationBtn" class="ghost" type="button">Atualizar histórico</button><button id="logoutBtn" class="ghost danger" type="button">Desconectar</button></div>
              </section>
              <footer>MEVA · Qwen2.5-Coder-3B · llama.cpp · GitHub Actions</footer>
            </main>
            <script src="./app.js"></script>
          </body>
          </html>
          HTML

      - name: Gerar aplicação JavaScript
        shell: bash
        run: |
          set -euo pipefail
          cat > public/app.js <<'JAVASCRIPT'
          "use strict";

          const TOKEN_KEY = "meva_github_token";
          const REPO_KEY = "meva_repository";
          const CONVERSATION_KEY = "meva_conversation_id";
          const WORKFLOW = "MEVA-INSTALADOR.yml";
          const $ = (id) => document.getElementById(id);
          let repository = "";
          let defaultBranch = "main";
          let conversationId = "";
          let busy = false;
          let messages = [];

          function repoFromLocation() {
            const saved = sessionStorage.getItem(REPO_KEY);
            if (saved && /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(saved)) return saved;
            const host = location.hostname;
            if (host.endsWith(".github.io")) {
              const owner = host.slice(0, -".github.io".length);
              const first = location.pathname.split("/").filter(Boolean)[0];
              const repo = first || `${owner}.github.io`;
              const value = `${owner}/${repo}`;
              sessionStorage.setItem(REPO_KEY, value);
              return value;
            }
            return "";
          }

          function repoParts() {
            const parts = repository.split("/");
            if (parts.length !== 2 || !parts[0] || !parts[1]) throw new Error("Repositório não identificado.");
            return parts;
          }

          function setNotice(id, text, kind = "") {
            const el = $(id);
            el.textContent = text;
            el.className = `notice ${kind}`.trim();
          }

          async function api(path, options = {}) {
            const token = sessionStorage.getItem(TOKEN_KEY);
            if (!token) throw new Error("Conecte seu token do GitHub.");
            const headers = {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${token}`,
              "X-GitHub-Api-Version": "2022-11-28",
              ...(options.body ? { "Content-Type": "application/json" } : {}),
              ...(options.headers || {})
            };
            const response = await fetch(`https://api.github.com${path}`, { ...options, headers });
            if (response.status === 204) return null;
            const raw = await response.text();
            if (!response.ok) {
              let detail = raw;
              try { detail = JSON.parse(raw).message || raw; } catch (_) {}
              throw new Error(`${response.status}: ${String(detail).slice(0, 240)}`);
            }
            return raw ? JSON.parse(raw) : null;
          }

          function renderMessages() {
            const area = $("messages");
            area.replaceChildren();
            if (!messages.length) {
              const empty = document.createElement("div");
              empty.className = "welcome";
              const mark = document.createElement("div"); mark.className = "welcome-symbol"; mark.textContent = "M";
              const title = document.createElement("h2"); title.textContent = "MEVA pronta para conversar";
              const desc = document.createElement("p"); desc.textContent = "Envie uma mensagem para começar.";
              empty.append(mark, title, desc); area.appendChild(empty); return;
            }
            for (const item of messages) {
              const wrap = document.createElement("article");
              wrap.className = `message ${item.role === "user" ? "user-message" : "assistant-message"}`;
              const who = document.createElement("div"); who.className = "message-role";
              who.textContent = item.role === "user" ? "VOCÊ" : "MEVA";
              const body = document.createElement("div"); body.className = "message-body";
              body.textContent = String(item.content || "");
              wrap.append(who, body); area.appendChild(wrap);
            }
            area.scrollTop = area.scrollHeight;
          }

          function newConversation() {
            conversationId = crypto.randomUUID();
            localStorage.setItem(CONVERSATION_KEY, conversationId);
            messages = [];
            renderMessages();
            setNotice("taskStatus", `Nova conversa criada: ${conversationId}`);
          }

          async function loadConversation() {
            if (!conversationId) return;
            const [owner, repo] = repoParts();
            const branch = $("branchInput").value.trim() || defaultBranch;
            const url = `https://raw.githubusercontent.com/${owner}/${repo}/${encodeURIComponent(branch)}/meva-data/conversations/${conversationId}.json?t=${Date.now()}`;
            const response = await fetch(url, { cache: "no-store" });
            if (response.status === 404) { messages = []; renderMessages(); return; }
            if (!response.ok) throw new Error(`Não foi possível ler o histórico (${response.status}).`);
            const data = await response.json();
            messages = Array.isArray(data.messages) ? data.messages : [];
            renderMessages();
          }

          async function connect() {
            const [owner, repo] = repoParts();
            const data = await api(`/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`);
            defaultBranch = data.default_branch || "main";
            repository = data.full_name;
            $("repoLabel").textContent = `${repository} · branch padrão: ${defaultBranch}`;
            $("branchInput").value = new URLSearchParams(location.search).get("branch") || defaultBranch;
            conversationId = localStorage.getItem(CONVERSATION_KEY) || "";
            const sharedId = new URLSearchParams(location.search).get("conversation");
            if (sharedId && /^[A-Za-z0-9_-]{8,80}$/.test(sharedId)) conversationId = sharedId;
            if (!conversationId) newConversation(); else localStorage.setItem(CONVERSATION_KEY, conversationId);
            $("connectionState").textContent = "CONECTADA";
            $("connectionState").classList.add("online");
            $("loginPanel").classList.add("hidden");
            $("chatPanel").classList.remove("hidden");
            await loadConversation();
          }

          $("tokenForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const button = event.submitter;
            const token = $("tokenInput").value.trim();
            if (!token) return;
            button.disabled = true; button.textContent = "Verificando...";
            sessionStorage.setItem(TOKEN_KEY, token);
            try { await connect(); $("tokenInput").value = ""; }
            catch (error) { sessionStorage.removeItem(TOKEN_KEY); setNotice("loginMessage", `Falha: ${error.message}`, "error"); }
            finally { button.disabled = false; button.textContent = "Conectar"; }
          });

          async function recentRuns() {
            const [owner, repo] = repoParts();
            const data = await api(`/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/actions/workflows/${encodeURIComponent(WORKFLOW)}/runs?event=workflow_dispatch&per_page=30`);
            return data.workflow_runs || [];
          }

          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

          async function waitForRun(beforeIds, branch, startedAt) {
            const [owner, repo] = repoParts();
            let run = null;
            const deadline = Date.now() + 50 * 60 * 1000;
            while (Date.now() < deadline) {
              const runs = await recentRuns();
              run = runs.find(item => !beforeIds.has(item.id) && item.head_branch === branch && Date.parse(item.created_at) >= startedAt - 15000 && String(item.display_title || "").includes(conversationId));
              if (!run) run = runs.find(item => !beforeIds.has(item.id) && item.head_branch === branch && Date.parse(item.created_at) >= startedAt - 15000);
              if (run) {
                const current = await api(`/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/actions/runs/${run.id}`);
                setNotice("taskStatus", `MEVA está trabalhando · execução #${run.run_number} · ${current.status}${current.status === "completed" ? ` (${current.conclusion})` : ""}`);
                if (current.status === "completed") {
                  if (current.conclusion !== "success") throw new Error(`A execução terminou com estado: ${current.conclusion}. Abra a execução #${run.run_number} no GitHub para ver o log.`);
                  return;
                }
              } else {
                setNotice("taskStatus", "Solicitação enviada. Aguardando o GitHub iniciar a execução...");
              }
              await sleep(9000);
            }
            throw new Error("Tempo de espera do painel esgotado. A execução pode continuar no GitHub Actions.");
          }

          $("messageForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            if (busy) return;
            const text = $("messageInput").value.trim();
            if (!text) return;
            if (text.length > 5000) return setNotice("taskStatus", "A mensagem ultrapassa 5.000 caracteres.", "error");
            const branch = $("branchInput").value.trim() || defaultBranch;
            const mode = $("modeSelect").value;
            const button = $("sendBtn");
            busy = true; button.disabled = true; button.textContent = "Executando...";
            const startedAt = Date.now();
            try {
              const before = await recentRuns();
              const beforeIds = new Set(before.map(item => item.id));
              $("messageInput").value = "";
              messages.push({ role: "user", content: text }); renderMessages();
              setNotice("taskStatus", mode === "agent" ? "Agente iniciado. Ele vai analisar os arquivos e só poderá alterar arquivos fora de .github." : "Preparando o modelo de IA no GitHub Actions...");
              const [owner, repo] = repoParts();
              await api(`/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/actions/workflows/${encodeURIComponent(WORKFLOW)}/dispatches`, {
                method: "POST",
                body: JSON.stringify({ ref: branch, inputs: { mode, message: text, conversation_id: conversationId, branch, max_steps: "6" } })
              });
              await waitForRun(beforeIds, branch, startedAt);
              await loadConversation();
              setNotice("Resposta recebida e histórico salvo no repositório público.", "success");
            } catch (error) {
              setNotice(`Não foi possível concluir: ${error.message}`, "error");
              messages.push({ role: "assistant", content: `A execução não foi concluída pelo painel. Detalhe: ${error.message}` }); renderMessages();
            } finally {
              busy = false; button.disabled = false; button.textContent = "Enviar ↗";
            }
          });

          $("newChatBtn").addEventListener("click", newConversation);
          $("refreshConversationBtn").addEventListener("click", async () => {
            try { await loadConversation(); setNotice("Histórico atualizado.", "success"); }
            catch (error) { setNotice(error.message, "error"); }
          });
          $("logoutBtn").addEventListener("click", () => {
            sessionStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(REPO_KEY); location.reload();
          });
          $("messageInput").addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); $("messageForm").requestSubmit(); }
          });

          async function init() {
            repository = repoFromLocation();
            if (!repository) { setNotice("loginMessage", "Não consegui identificar o repositório a partir do endereço do Pages.", "error"); return; }
            if (sessionStorage.getItem(TOKEN_KEY)) {
              try { await connect(); }
              catch (error) { sessionStorage.removeItem(TOKEN_KEY); setNotice("loginMessage", `Sessão inválida: ${error.message}`, "error"); }
            }
          }
          init();
          JAVASCRIPT

      - name: Gerar estilos e PWA
        shell: bash
        run: |
          set -euo pipefail
          cat > public/styles.css <<'CSS'
          :root{color-scheme:dark;--bg:#0a1020;--panel:#111c30;--panel2:#0d1729;--line:#263650;--text:#edf4ff;--muted:#9aacbf;--blue:#8cbaff;--green:#69ddb0;--red:#ff8e9a;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
          *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#1b3458 0,transparent 48%),var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}.hidden{display:none!important}.shell{width:min(920px,calc(100% - 26px));margin:auto;padding:max(20px,env(safe-area-inset-top)) 0 32px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:47px;height:47px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#b8d7ff,#5998f0);color:#071326;font-weight:950;font-size:25px}.brand-title{font-size:19px;font-weight:950;letter-spacing:.18em}.brand-sub,.eyebrow{font-size:9px;letter-spacing:.16em;font-weight:850;color:var(--blue)}.connection{font-size:9px;font-weight:850;letter-spacing:.1em;color:#d8b878;border:1px solid var(--line);padding:8px 10px;border-radius:999px}.connection.online{color:var(--green);border-color:#2f715f}.panel{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(19,31,51,.98),rgba(13,23,41,.98));box-shadow:0 24px 70px #0005;padding:24px}.login-panel{max-width:620px;margin:0 auto}.chat-panel{padding:0;overflow:hidden}.chat-head{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:22px 23px 16px}h1{font-size:clamp(23px,5vw,31px);margin:7px 0}h2{font-size:17px;margin:12px 0 7px}.muted{color:var(--muted);font-size:12px;line-height:1.6}.small{font-size:10px}.warning{margin-top:18px;color:#e5c78b}.stack{display:flex;flex-direction:column;gap:11px;margin-top:17px}label{font-size:11px;color:#cad8eb;font-weight:750}input,textarea,select{width:100%;background:#081426;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--blue)}textarea{resize:vertical;min-height:74px;line-height:1.5}.primary{border:0;border-radius:12px;background:linear-gradient(110deg,#b5d6ff,#79acfa);color:#071428;font-weight:900;padding:12px 17px;min-height:44px;cursor:pointer}.primary:disabled{opacity:.5;cursor:wait}.ghost{border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:#0b1729;color:#d9e8ff;font-weight:750;cursor:pointer}.danger{color:var(--red)}.notice{min-height:18px;font-size:11px;line-height:1.55;overflow-wrap:anywhere;color:var(--muted)}.notice.error{color:var(--red)}.notice.success{color:var(--green)}.public-note{margin:0 22px 13px;padding:11px 13px;border:1px solid #67542d;border-radius:11px;background:#241f16;color:#e9d8ad;font-size:10px;line-height:1.6}.toolbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(100px,.6fr);gap:9px;align-items:center;padding:0 22px 16px}.mode-label{font-size:10px}.toolbar select,.branch-input{padding:10px;font-size:11px}.messages{height:min(54vh,560px);min-height:250px;overflow:auto;display:flex;flex-direction:column;gap:13px;padding:18px 22px;background:#081222;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.welcome{text-align:center;margin:auto;max-width:330px;color:var(--muted);font-size:12px;line-height:1.6}.welcome-symbol{margin:auto;width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,#a9ceff,#4c8ce9);color:#071326;display:grid;place-items:center;font-size:27px;font-weight:950}.message{max-width:88%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#101e33;overflow-wrap:anywhere}.user-message{align-self:flex-end;background:#172d49;border-color:#345780}.assistant-message{align-self:flex-start}.message-role{font-size:9px;letter-spacing:.13em;font-weight:900;color:var(--blue);margin-bottom:7px}.message-body{font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.composer{padding:15px 22px 8px}.composer textarea{min-height:78px}.composer-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px}.send{min-width:110px}.task-status{padding:4px 22px 12px;min-height:28px;font-size:11px;color:var(--muted);overflow-wrap:anywhere}.footer-actions{display:flex;justify-content:space-between;padding:11px 22px 17px;border-top:1px solid var(--line)}footer{text-align:center;color:#74859d;font-size:10px;padding:20px 0}@media(max-width:620px){.shell{width:calc(100% - 16px);padding-top:12px}.panel{padding:17px;border-radius:17px}.chat-panel{padding:0}.chat-head{padding:17px;align-items:flex-start}.chat-head .ghost{font-size:10px;padding:8px}.toolbar{grid-template-columns:1fr 1fr;padding:0 17px 13px}.mode-label{align-self:end}.messages{padding:13px;height:54vh}.composer{padding:12px 14px 6px}.public-note{margin:0 14px 12px}.task-status{padding-left:15px;padding-right:15px}.footer-actions{padding:10px 14px 14px}.message{max-width:96%}}
