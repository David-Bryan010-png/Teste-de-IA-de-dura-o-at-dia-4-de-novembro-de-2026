
name: MEVA — instalação e painel GitHub Pages
run-name: MEVA — ${{ github.event.inputs.mode || 'install' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operação da MEVA"
        type: choice
        options:
          - install
          - agent
        default: install
        required: true
      overwrite:
        description: "Substituir arquivos existentes durante a instalação"
        type: boolean
        default: true
        required: true
      task:
        description: "Tarefa solicitada ao agente"
        type: string
        required: false
        default: ""
      branch:
        description: "Branch de destino (vazio = branch selecionada)"
        type: string
        required: false
        default: ""
      max_steps:
        description: "Limite de operações solicitado (8 a 20)"
        type: number
        required: false
        default: 14

permissions:
  contents: write

concurrency:
  group: meva-${{ github.repository }}-${{ github.event.inputs.mode || 'install' }}
  cancel-in-progress: false

jobs:

  # ==========================================================
  # INSTALAÇÃO DO PAINEL E PUBLICAÇÃO NO GITHUB PAGES
  # ==========================================================
  install:
    name: Criar painel e publicar no Pages
    if: ${{ inputs.mode == 'install' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verificar branch padrão
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Execute a instalação na branch padrão: $DEFAULT_BRANCH" >&2
            exit 1
          fi

      - name: Verificar arquivos existentes
        shell: bash
        env:
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail

          FILES=(
            public/index.html
            public/app.js
            public/styles.css
            public/manifest.webmanifest
            public/icon.svg
            public/.nojekyll
          )

          if [[ "$OVERWRITE" != "true" ]]; then
            for file in "${FILES[@]}"; do
              if [[ -e "$file" ]]; then
                echo "Arquivo já existe: $file" >&2
                echo "Ative overwrite para substituí-lo." >&2
                exit 1
              fi
            done
          fi

          mkdir -p public

      - name: Criar página principal
        shell: bash
        run: |
          set -euo pipefail

          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#0b1220">
            <meta name="description" content="MEVA — painel de controle para GitHub Actions.">
            <link rel="manifest" href="./manifest.webmanifest">
            <link rel="icon" href="./icon.svg" type="image/svg+xml">
            <link rel="stylesheet" href="./styles.css">
            <title>MEVA — Painel</title>
          </head>
          <body>
            <main class="shell">
              <header class="brand">
                <div class="brand-mark">M</div>
                <div>
                  <div class="brand-name">MEVA</div>
                  <div class="brand-subtitle">Painel de controle · GitHub Actions</div>
                </div>
              </header>

              <section id="tokenPanel" class="panel">
                <span class="eyebrow">CONEXÃO</span>
                <h1>Conectar ao GitHub</h1>
                <p class="muted">
                  Use um Fine-grained Personal Access Token limitado a este
                  repositório, com Actions: Read and write. O token fica apenas
                  nesta sessão do navegador e é enviado à API oficial do GitHub
                  para autenticar as operações.
                </p>
                <form id="tokenForm" class="form-stack">
                  <label for="tokenInput">Token do GitHub</label>
                  <input
                    id="tokenInput"
                    type="password"
                    autocomplete="off"
                    placeholder="github_pat_..."
                    required
                  >
                  <button class="primary" type="submit">Conectar</button>
                  <p id="tokenMessage" class="form-message" role="status"></p>
                </form>
              </section>

              <section id="appPanel" class="panel hidden">
                <span class="eyebrow">PAINEL PRINCIPAL</span>
                <h1>Nova tarefa</h1>

                <p class="muted">
                  O painel envia a solicitação ao workflow MEVA-INSTALADOR.yml.
                  O núcleo de inteligência artificial ainda precisa ser integrado
                  para executar alterações reais no código.
                </p>

                <form id="taskForm" class="form-stack">
                  <label for="taskInput">O que deve ser feito?</label>
                  <textarea
                    id="taskInput"
                    rows="5"
                    placeholder="Ex.: analise o projeto, encontre erros e proponha correções."
                    required
                  ></textarea>

                  <label for="branchInput">Branch</label>
                  <input id="branchInput" placeholder="Vazia = branch padrão">

                  <label for="stepsInput">Limite de operações</label>
                  <input
                    id="stepsInput"
                    type="number"
                    min="8"
                    max="20"
                    step="1"
                    value="14"
                    required
                  >

                  <button class="primary" id="runBtn" type="submit">
                    Enviar tarefa
                  </button>
                  <p id="taskMessage" class="form-message" role="status"></p>
                </form>

                <div class="section-heading">
                  <h2>Execuções recentes</h2>
                  <button id="refreshBtn" class="secondary" type="button">
                    Atualizar
                  </button>
                </div>

                <div id="jobsList" class="jobs"></div>

                <button id="logoutBtn" class="link-button" type="button">
                  Desconectar este dispositivo
                </button>
              </section>

              <footer>
                MEVA · Execução sob demanda
              </footer>
            </main>
            <script src="./app.js"></script>
          </body>
          </html>
          HTML

      - name: Criar JavaScript do painel
        shell: bash
        run: |
          set -euo pipefail

          cat > public/app.js <<'JAVASCRIPT'
          "use strict";

          const TOKEN_KEY = "meva_github_token";
          const REPO_KEY = "meva_repository";
          const WORKFLOW = "MEVA-INSTALADOR.yml";

          function resolveRepository() {
            const saved = sessionStorage.getItem(REPO_KEY);

            if (saved && /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(saved)) {
              return saved;
            }

            const queryRepo = new URLSearchParams(location.search).get("repo");

            if (queryRepo && /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(queryRepo)) {
              sessionStorage.setItem(REPO_KEY, queryRepo);
              return queryRepo;
            }

            const host = location.hostname;

            if (host.endsWith(".github.io")) {
              const owner = host.slice(0, -".github.io".length);
              const parts = location.pathname.split("/").filter(Boolean);
              const repo = parts[0] || `${owner}.github.io`;
              const result = `${owner}/${repo}`;

              sessionStorage.setItem(REPO_KEY, result);
              return result;
            }

            const manual = prompt(
              "Informe o repositório no formato owner/repo:"
            );

            if (manual && /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(manual.trim())) {
              sessionStorage.setItem(REPO_KEY, manual.trim());
              return manual.trim();
            }

            return "";
          }

          const REPOSITORY = resolveRepository();

          function repositoryParts() {
            const parts = REPOSITORY.split("/");
            if (parts.length !== 2 || !parts[0] || !parts[1]) {
              throw new Error("Repositório não identificado.");
            }
            return parts;
          }

          function show(id) {
            document.getElementById(id).classList.remove("hidden");
          }

          function hide(id) {
            document.getElementById(id).classList.add("hidden");
          }

          function message(id, value, success = false) {
            const element = document.getElementById(id);
            element.textContent = value;
            element.className = success
              ? "form-message success"
              : "form-message error";
          }

          async function github(path, options = {}) {
            const token = sessionStorage.getItem(TOKEN_KEY);

            if (!token) {
              throw new Error("Token não configurado.");
            }

            const headers = {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${token}`,
              "X-GitHub-Api-Version": "2022-11-28",
              ...(options.body ? { "Content-Type": "application/json" } : {}),
              ...(options.headers || {})
            };

            const response = await fetch(
              `https://api.github.com${path}`,
              { ...options, headers }
            );

            if (response.status === 204) {
              return null;
            }

            const body = await response.text();

            if (!response.ok) {
              let detail = body;

              try {
                detail = JSON.parse(body).message || body;
              } catch (_) {}

              throw new Error(`${response.status}: ${detail.slice(0, 220)}`);
            }

            return body ? JSON.parse(body) : null;
          }

          async function getRepository() {
            const [owner, repo] = repositoryParts();

            return github(
              `/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`
            );
          }

          async function connect() {
            const repository = await getRepository();

            if (!repository.default_branch) {
              throw new Error("Não foi possível identificar a branch padrão.");
            }

            hide("tokenPanel");
            show("appPanel");
            message(
              "taskMessage",
              `Conectado a ${repository.full_name}. Branch padrão: ${repository.default_branch}.`,
              true
            );

            await loadJobs();
          }

          document.getElementById("tokenForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const button = event.submitter;
            const token = document.getElementById("tokenInput").value.trim();

            if (!token) return;

            button.disabled = true;
            button.textContent = "Verificando...";

            sessionStorage.setItem(TOKEN_KEY, token);

            try {
              await connect();
              document.getElementById("tokenInput").value = "";
            } catch (error) {
              sessionStorage.removeItem(TOKEN_KEY);
              message("tokenMessage", `Falha na conexão: ${error.message}`);
            } finally {
              button.disabled = false;
              button.textContent = "Conectar";
            }
          });

          document.getElementById("taskForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const button = document.getElementById("runBtn");
            const task = document.getElementById("taskInput").value.trim();
            const branchTyped = document.getElementById("branchInput").value.trim();
            const maxSteps = Number(document.getElementById("stepsInput").value);

            if (!task) {
              return message("taskMessage", "Descreva a tarefa.");
            }

            if (!Number.isInteger(maxSteps) || maxSteps < 8 || maxSteps > 20) {
              return message("taskMessage", "Use um limite entre 8 e 20.");
            }

            button.disabled = true;
            button.textContent = "Enviando...";

            try {
              const repository = await getRepository();
              const branch = branchTyped || repository.default_branch;
              const [owner, repo] = repositoryParts();

              await github(
                `/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/actions/workflows/${encodeURIComponent(WORKFLOW)}/dispatches`,
                {
                  method: "POST",
                  body: JSON.stringify({
                    ref: branch,
                    inputs: {
                      mode: "agent",
                      task,
                      branch,
                      max_steps: String(maxSteps)
                    }
                  })
                }
              );

              message(
                "taskMessage",
                "Solicitação enviada ao GitHub Actions. Consulte as execuções abaixo.",
                true
              );

              document.getElementById("taskInput").value = "";
              setTimeout(loadJobs, 2500);
            } catch (error) {
              message("taskMessage", `Erro ao enviar: ${error.message}`);
            } finally {
              button.disabled = false;
              button.textContent = "Enviar tarefa";
            }
          });

          async function loadJobs() {
            const list = document.getElementById("jobsList");
            list.replaceChildren();

            const loading = document.createElement("p");
            loading.className = "muted";
            loading.textContent = "Carregando execuções...";
            list.appendChild(loading);

            try {
              const [owner, repo] = repositoryParts();

              const data = await github(
                `/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/actions/workflows/${encodeURIComponent(WORKFLOW)}/runs?per_page=8`
              );

              list.replaceChildren();

              const runs = data.workflow_runs || [];

              if (runs.length === 0) {
                const empty = document.createElement("p");
                empty.className = "muted";
                empty.textContent = "Nenhuma execução encontrada.";
                list.appendChild(empty);
                return;
              }

              for (const run of runs) {
                const url = new URL(run.html_url);

                if (url.hostname !== "github.com") continue;

                const link = document.createElement("a");
                link.className = "job";
                link.href = url.href;
                link.target = "_blank";
                link.rel = "noopener noreferrer";

                const title = document.createElement("strong");
                title.textContent = `#${run.run_number} — ${run.display_title || run.name}`;

                const status = document.createElement("span");
                status.className = `status ${run.conclusion || run.status}`;
                status.textContent = run.conclusion || run.status;

                link.append(title, status);
                list.appendChild(link);
              }
            } catch (error) {
              list.replaceChildren();

              const failure = document.createElement("p");
              failure.className = "muted";
              failure.textContent = `Erro ao carregar: ${error.message}`;
              list.appendChild(failure);
            }
          }

          document.getElementById("refreshBtn").addEventListener("click", loadJobs);

          document.getElementById("logoutBtn").addEventListener("click", () => {
            sessionStorage.removeItem(TOKEN_KEY);
            sessionStorage.removeItem(REPO_KEY);
            location.reload();
          });

          async function initialize() {
            if (!REPOSITORY) {
              message("tokenMessage", "Não foi possível identificar o repositório.");
              return;
            }

            if (sessionStorage.getItem(TOKEN_KEY)) {
              try {
                await connect();
              } catch (error) {
                sessionStorage.removeItem(TOKEN_KEY);
                show("tokenPanel");
                hide("appPanel");
                message("tokenMessage", `Sessão inválida: ${error.message}`);
              }
            }
          }

          initialize();
          JAVASCRIPT

      - name: Criar estilos responsivos
        shell: bash
        run: |
          set -euo pipefail

          cat > public/styles.css <<'CSS'
          :root {
            color-scheme: dark;
            --bg: #0b1220;
            --surface: #111c2e;
            --border: rgba(159,184,218,.16);
            --text: #edf4ff;
            --muted: #9aacc4;
            --accent: #82b4ff;
            --good: #62d7aa;
            --danger: #ff8f9b;
            font-family: Inter, system-ui, -apple-system, sans-serif;
          }

          * { box-sizing: border-box; }

          body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
          }

          .hidden { display: none !important; }

          .shell {
            width: min(900px, calc(100% - 32px));
            margin: 0 auto;
            padding: max(25px, env(safe-area-inset-top)) 0 35px;
          }

          .brand {
            display: flex;
            align-items: center;
            gap: 13px;
            margin-bottom: 22px;
          }

          .brand-mark {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 15px;
            color: #081322;
            background: linear-gradient(145deg,#a8ceff,#4b8ae8);
            font-size: 24px;
            font-weight: 950;
          }

          .brand-name {
            font-size: 19px;
            font-weight: 900;
            letter-spacing: .16em;
          }

          .brand-subtitle {
            color: var(--muted);
            font-size: 12px;
          }

          .panel {
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            border-radius: 22px;
            background: var(--surface);
            box-shadow: 0 22px 60px rgba(0,0,0,.2);
          }

          .eyebrow {
            color: var(--accent);
            font-size: 10px;
            font-weight: 850;
            letter-spacing: .17em;
          }

          h1 {
            margin: 7px 0 14px;
            font-size: clamp(23px,5vw,30px);
          }

          h2 { font-size: 17px; }

          .muted {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.65;
          }

          .form-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 17px;
          }

          label {
            color: #cbd9ed;
            font-size: 12px;
            font-weight: 750;
          }

          input, textarea {
            width: 100%;
            min-width: 0;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            background: #0b1627;
            font: inherit;
            outline: none;
          }

          textarea {
            resize: vertical;
            min-height: 110px;
          }

          input:focus, textarea:focus {
            border-color: var(--accent);
          }

          button {
            min-height: 44px;
            font: inherit;
            cursor: pointer;
          }

          button:disabled {
            opacity: .55;
            cursor: wait;
          }

          .primary {
            padding: 12px 18px;
            border: 0;
            border-radius: 12px;
            color: #081526;
            background: linear-gradient(115deg,#a6cbff,#73a9ff);
            font-weight: 850;
          }

          .secondary {
            padding: 9px 13px;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            background: #0e192a;
          }

          .form-message {
            min-height: 18px;
            font-size: 12px;
            overflow-wrap: anywhere;
          }

          .success { color: var(--good); }
          .error { color: var(--danger); }

          .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 30px;
          }

          .jobs {
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin: 12px 0;
          }

          .job {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 11px;
            color: var(--text);
            background: #0e192a;
            text-decoration: none;
            overflow-wrap: anywhere;
          }

          .status {
            flex-shrink: 0;
            font-size: 11px;
            font-weight: 850;
          }

          .status.success, .status.completed { color: var(--good); }
          .status.failure, .status.cancelled { color: var(--danger); }

          .link-button {
            margin-top: 18px;
            padding: 5px 0;
            border: 0;
            color: var(--accent);
            background: transparent;
            font-weight: 750;
          }

          footer {
            padding: 20px 0;
            color: var(--muted);
            text-align: center;
            font-size: 11px;
          }

          @media (max-width: 520px) {
            .shell { width: calc(100% - 22px); padding-top: 18px; }
            .panel { padding: 18px; border-radius: 17px; }
            .job { align-items: flex-start; flex-direction: column; gap: 5px; }
          }
          CSS

      - name: Criar manifesto e ícone
        shell: bash
        run: |
          set -euo pipefail

          cat > public/manifest.webmanifest <<'JSON'
          {
            "name": "MEVA — Painel",
            "short_name": "MEVA",
            "lang": "pt-BR",
            "start_url": "./",
            "scope": "./",
            "display": "standalone",
            "background_color": "#0b1220",
            "theme_color": "#0b1220",
            "icons": [
              {
                "src": "./icon.svg",
                "sizes": "any",
                "type": "image/svg+xml",
                "purpose": "any maskable"
              }
            ]
          }
          JSON

          cat > public/icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
            <rect width="128" height="128" rx="30" fill="#82b4ff"/>
            <path d="M28 96V32h17l19 29 19-29h17v64H82V58L64 84 46 58v38z" fill="#0b1220"/>
          </svg>
          SVG

          touch public/.nojekyll

      - name: Validar arquivos do painel
        shell: bash
        run: |
          set -euo pipefail

          test -s public/index.html
          test -s public/app.js
          test -s public/styles.css
          test -s public/manifest.webmanifest
          test -s public/icon.svg

          node --check public/app.js
          python3 -m json.tool public/manifest.webmanifest >/dev/null

          echo "Arquivos do painel validados."

      - name: Salvar arquivos no repositório
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos arquivos públicos."
          else
            git commit -m "MEVA: criar painel GitHub Pages"

            AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
              push origin "HEAD:${DEFAULT_BRANCH}"
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  # ==========================================================
  # PUBLICAÇÃO DO SITE
  # ==========================================================
  deploy-pages:
    name: Publicar MEVA no GitHub Pages
    if: ${{ inputs.mode == 'install' }}
    needs: install
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4

  # ==========================================================
  # RECEBIMENTO DE TAREFAS
  # ==========================================================
  agent:
    name: Receber solicitação da MEVA
    if: ${{ inputs.mode == 'agent' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Validar solicitação
        shell: bash
        env:
          TASK: ${{ inputs.task }}
          TARGET_BRANCH: ${{ inputs.branch }}
          MAX_STEPS: ${{ inputs.max_steps }}
        run: |
          set -euo pipefail

          if [[ -z "${TASK//[[:space:]]/}" ]]; then
            echo "A tarefa está vazia." >&2
            exit 1
          fi

          if ! [[ "$MAX_STEPS" =~ ^[0-9]+$ ]] ||
             (( MAX_STEPS < 8 || MAX_STEPS > 20 )); then
            echo "O limite precisa estar entre 8 e 20." >&2
            exit 1
          fi

          {
            echo "# MEVA — solicitação recebida"
            echo
            echo "- Branch: ${TARGET_BRANCH:-${GITHUB_REF_NAME}}"
            echo "- Limite solicitado: $MAX_STEPS operações"
            echo
            echo "## Tarefa"
            printf '%s\n' "$TASK"
            echo
            echo "## Estado"
            echo "O disparo do workflow foi validado."
            echo "O núcleo de IA ainda não está integrado; nenhum arquivo do projeto foi alterado."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Solicitação recebida e validada."
