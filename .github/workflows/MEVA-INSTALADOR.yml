name: MEVA V6 — IA com Internet, programação e compilação
run-name: MEVA / ${{ inputs.mode || 'install' }} / ${{ inputs.conversation_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operação da MEVA
        type: choice
        options:
          - install
          - chat
          - agent
          - self_test
        default: install
        required: true
      message:
        description: Mensagem ou tarefa para a IA
        type: string
        required: false
        default: ''
      conversation_id:
        description: ID da conversa
        type: string
        required: false
        default: ''
      branch:
        description: Branch do projeto
        type: string
        required: false
        default: ''
      max_actions:
        description: Quantidade máxima de ferramentas por execução
        type: number
        required: false
        default: 16

permissions:
  contents: read

concurrency:
  group: meva-${{ github.repository }}-${{ inputs.conversation_id || github.run_id }}
  cancel-in-progress: false

env:
  MODEL_REPO: Qwen/Qwen2.5-Coder-3B-Instruct-GGUF
  MODEL_FILE: qwen2.5-coder-3b-instruct-q4_k_m.gguf
  MODEL_CACHE_VERSION: qwen25-coder-3b-q4km-v2
  LLAMA_CACHE_VERSION: llama-cpp-server-v2
  MODEL_ID: Qwen2.5-Coder-3B-Instruct-Q4_K_M

jobs:

  # ============================================================
  # INSTALAÇÃO E PAINEL
  # ============================================================

  install:
    name: Instalar painel e configurações da MEVA
    if: ${{ inputs.mode == 'install' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validar branch padrão
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Execute a instalação na branch padrão: $DEFAULT_BRANCH" >&2
            exit 1
          fi

      - name: Criar interface da MEVA
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p public meva-config meva-data/conversations
          touch meva-data/conversations/.gitkeep

          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#080e1b">
            <meta name="description" content="MEVA — inteligência artificial, Internet e programação.">
            <link rel="manifest" href="./manifest.webmanifest">
            <link rel="icon" href="./icon.svg" type="image/svg+xml">
            <link rel="stylesheet" href="./styles.css">
            <title>MEVA — Inteligência Artificial</title>
          </head>
          <body>
            <main class="app">
              <header class="topbar">
                <div class="brand">
                  <div class="logo">M</div>
                  <div>
                    <div class="brand-name">MEVA</div>
                    <div class="brand-caption">INTELIGÊNCIA ARTIFICIAL</div>
                  </div>
                </div>
                <span id="connection" class="connection">DESCONECTADA</span>
              </header>

              <section id="login" class="panel login">
                <div class="eyebrow">ACESSO</div>
                <h1>Conectar à MEVA</h1>
                <p class="muted">
                  Use um Fine-grained Personal Access Token restrito a este
                  repositório, com Actions: Read and write, Contents: Read and
                  write e Metadata: Read-only.
                </p>
                <form id="loginForm">
                  <label for="token">Token pessoal do GitHub</label>
                  <input id="token" type="password" autocomplete="off"
                    placeholder="github_pat_…" required>
                  <button class="primary" type="submit">Conectar</button>
                  <p id="loginStatus" class="status"></p>
                </form>
                <div class="warning">
                  <b>Atenção:</b> este repositório é público. Conversas,
                  respostas, arquivos anexados, memória e arquivos publicados
                  podem ser vistos por outras pessoas. Não envie senhas,
                  tokens, chaves privadas ou dados pessoais.
                </div>
              </section>

              <section id="workspace" class="panel hidden">
                <div class="workspace-head">
                  <div>
                    <div class="eyebrow">ASSISTENTE INTELIGENTE</div>
                    <h1>Conversa com a MEVA</h1>
                    <p id="repoInfo" class="muted"></p>
                  </div>
                  <button id="newChat" class="secondary" type="button">＋ Nova</button>
                </div>

                <div class="controls">
                  <label for="mode">Modo</label>
                  <select id="mode">
                    <option value="chat">Conversa com Internet</option>
                    <option value="agent">Agente de programação</option>
                  </select>
                  <label for="branch">Branch</label>
                  <input id="branch" value="main">
                </div>

                <div class="conversation-tools">
                  <label for="savedChats">Conversas</label>
                  <select id="savedChats">
                    <option value="">Selecione uma conversa…</option>
                  </select>
                  <button id="shareChat" class="ghost" type="button">Copiar link</button>
                </div>

                <div class="capabilities">
                  <b>MEVA V6:</b>
                  pesquisa na Internet, consulta páginas, analisa projetos,
                  trabalha com arquivos e ZIPs, programa, compila e executa
                  testes em ambientes compatíveis.
                </div>

                <div id="messages" class="messages" aria-live="polite">
                  <div class="welcome">
                    <div class="welcome-logo">M</div>
                    <h2>Como posso ajudar?</h2>
                    <p>
                      Pergunte, pesquise, envie um projeto ou peça à MEVA
                      para desenvolver e testar alguma coisa.
                    </p>
                  </div>
                </div>

                <form id="composer" class="composer">
                  <div class="attachment-panel">
                    <label for="attachments">Arquivos e projetos</label>
                    <input id="attachments" type="file" multiple>
                    <div id="attachmentList" class="attachment-list">
                      Até 5 arquivos, 200 MB por arquivo e 500 MB no total.
                      São aceitos arquivos de código, documentos, ZIPs e
                      outros arquivos binários.
                    </div>
                  </div>

                  <textarea id="message" rows="3" maxlength="5500"
                    placeholder="Escreva sua mensagem… (Enter envia, Shift+Enter quebra linha)"></textarea>

                  <div class="composer-footer">
                    <span class="muted small">Até 5.500 caracteres</span>
                    <button id="send" class="primary" type="submit">Enviar ↗</button>
                  </div>
                </form>

                <div id="taskStatus" class="task-status">
                  Pronta para receber uma mensagem.
                </div>

                <div class="footer-actions">
                  <button id="refresh" class="ghost" type="button">Atualizar</button>
                  <a id="actionsLink" href="https://github.com"
                    target="_blank" rel="noopener noreferrer">Execuções</a>
                  <button id="logout" class="ghost danger" type="button">Desconectar</button>
                </div>
              </section>

              <footer>MEVA V6 · Qwen2.5-Coder 3B · Internet · Agente de programação</footer>
            </main>
            <script src="./app.js"></script>
          </body>
          </html>
          HTML

          cat > public/app.js <<'JAVASCRIPT'
          "use strict";

          const $ = id => document.getElementById(id);
          const TOKEN_KEY = "meva_pat_session";
          const REPO_KEY = "meva_repo";
          const CHAT_KEY = "meva_chat_id";
          const WORKFLOW = "MEVA-INSTALADOR.yml";

          const MAX_FILE = 200 * 1024 * 1024;
          const MAX_TOTAL = 500 * 1024 * 1024;
          const MAX_FILES = 5;
          const MAX_WAIT = 3 * 60 * 60 * 1000;

          let owner = "";
          let repoName = "";
          let repo = "";
          let defaultBranch = "main";
          let chatId = "";
          let chatMessages = [];
          let busy = false;

          function status(message, kind = "") {
            $("taskStatus").textContent = message;
            $("taskStatus").className = `task-status ${kind}`;
          }

          function loginStatus(message, kind = "") {
            $("loginStatus").textContent = message;
            $("loginStatus").className = `status ${kind}`;
          }

          function repoFromPage() {
            const cached = sessionStorage.getItem(REPO_KEY);
            if (cached && /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(cached)) {
              return cached;
            }

            const host = location.hostname;
            if (!host.endsWith(".github.io")) return "";

            const user = host.slice(0, -".github.io".length);
            const firstPath = location.pathname.split("/").filter(Boolean)[0];
            const project = firstPath || `${user}.github.io`;
            const found = `${user}/${project}`;

            sessionStorage.setItem(REPO_KEY, found);
            return found;
          }

          function parts() {
            if (!owner || !repoName) {
              throw new Error("Repositório não identificado.");
            }
            return [owner, repoName];
          }

          async function github(path, options = {}) {
            const token = sessionStorage.getItem(TOKEN_KEY);
            if (!token) throw new Error("Sessão desconectada.");

            const headers = {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${token}`,
              "X-GitHub-Api-Version": "2022-11-28",
              ...(options.body ? {"Content-Type": "application/json"} : {}),
              ...(options.headers || {})
            };

            const response = await fetch(`https://api.github.com${path}`, {
              ...options,
              headers
            });

            if (response.status === 204) return null;

            const raw = await response.text();

            if (!response.ok) {
              let detail = raw;
              try {
                detail = JSON.parse(raw).message || raw;
              } catch (_) {}
              throw new Error(`${response.status}: ${String(detail).slice(0, 250)}`);
            }

            return raw ? JSON.parse(raw) : null;
          }

          function validChatId(value) {
            return typeof value === "string" &&
              /^[A-Za-z0-9_-]{8,80}$/.test(value);
          }

          function newConversation() {
            chatId = crypto.randomUUID();
            localStorage.setItem(CHAT_KEY, chatId);

            const url = new URL(location.href);
            url.searchParams.set("conversation", chatId);
            history.replaceState({}, "", url);

            chatMessages = [];
            render();
            status("Nova conversa criada.");
          }

          function render() {
            const root = $("messages");
            root.replaceChildren();

            if (!chatMessages.length) {
              const box = document.createElement("div");
              box.className = "welcome";

              const logo = document.createElement("div");
              logo.className = "welcome-logo";
              logo.textContent = "M";

              const title = document.createElement("h2");
              title.textContent = "Como posso ajudar?";

              const description = document.createElement("p");
              description.textContent =
                "Faça uma pergunta ou envie um projeto para trabalhar.";

              box.append(logo, title, description);
              root.appendChild(box);
              return;
            }

            for (const item of chatMessages) {
              const article = document.createElement("article");
              article.className = `bubble ${
                item.role === "user" ? "from-user" : "from-meva"
              }`;

              const role = document.createElement("div");
              role.className = "bubble-role";
              role.textContent = item.role === "user" ? "VOCÊ" : "MEVA";

              const content = document.createElement("div");
              content.className = "bubble-content";

              const value = String(item.content || "");
              const pattern = /https:\/\/[^\s<>"']+/g;
              let cursor = 0;

              for (const match of value.matchAll(pattern)) {
                const raw = match[0];
                const clean = raw.replace(/[.,;:!?)}\]]+$/, "");
                const start = match.index;

                if (start > cursor) {
                  content.appendChild(
                    document.createTextNode(value.slice(cursor, start))
                  );
                }

                try {
                  const parsed = new URL(clean);
                  if (parsed.protocol === "https:") {
                    const link = document.createElement("a");
                    link.href = parsed.href;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    link.textContent = clean;
                    content.appendChild(link);
                    content.appendChild(
                      document.createTextNode(raw.slice(clean.length))
                    );
                  }
                } catch (_) {
                  content.appendChild(document.createTextNode(raw));
                }

                cursor = start + raw.length;
              }

              if (cursor < value.length) {
                content.appendChild(
                  document.createTextNode(value.slice(cursor))
                );
              }

              article.append(role, content);
              root.appendChild(article);
            }

            root.scrollTop = root.scrollHeight;
          }

          function decodeBase64Utf8(value) {
            const binary = atob(String(value || "").replace(/\s/g, ""));
            const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
            return new TextDecoder().decode(bytes);
          }

          async function loadConversation() {
            if (!validChatId(chatId)) {
              chatMessages = [];
              render();
              return;
            }

            const [o, r] = parts();
            const branch = $("branch").value.trim() || defaultBranch;
            const path = `meva-data/conversations/${chatId}.json`;

            let data;

            try {
              data = await github(
                `/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}` +
                `/contents/${path}?ref=${encodeURIComponent(branch)}`
              );
            } catch (error) {
              if (String(error.message).startsWith("404:")) {
                chatMessages = [];
                render();
                return;
              }
              throw error;
            }

            const parsed = JSON.parse(decodeBase64Utf8(data.content));

            chatMessages = Array.isArray(parsed.messages)
              ? parsed.messages.filter(item =>
                  item &&
                  ["user", "assistant"].includes(item.role) &&
                  typeof item.content === "string"
                )
              : [];

            render();
            await loadConversationList().catch(() => {});
          }

          async function loadConversationList() {
            const [o, r] = parts();
            const branch = $("branch").value.trim() || defaultBranch;

            const data = await github(
              `/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}` +
              `/contents/meva-data/conversations?ref=${encodeURIComponent(branch)}`
            );

            const select = $("savedChats");
            select.replaceChildren();

            const first = document.createElement("option");
            first.value = "";
            first.textContent = "Selecione uma conversa…";
            select.appendChild(first);

            const files = Array.isArray(data)
              ? data.filter(file =>
                  file.type === "file" &&
                  /^[-A-Za-z0-9_]{8,80}\.json$/.test(file.name)
                ).slice(0, 100)
              : [];

            for (const file of files) {
              const option = document.createElement("option");
              option.value = file.name.slice(0, -5);
              option.textContent = file.name.slice(0, -5);
              select.appendChild(option);
            }

            select.value = chatId;
          }

          async function connect() {
            const [o, r] = parts();

            const info = await github(
              `/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}`
            );

            owner = info.owner.login;
            repoName = info.name;
            repo = info.full_name;
            defaultBranch = info.default_branch || "main";

            $("repoInfo").textContent =
              `${repo} · branch padrão: ${defaultBranch}`;

            const query = new URLSearchParams(location.search);
            const shared = query.get("conversation");

            chatId = validChatId(shared)
              ? shared
              : (localStorage.getItem(CHAT_KEY) || "");

            if (!validChatId(chatId)) {
              newConversation();
            } else {
              localStorage.setItem(CHAT_KEY, chatId);
            }

            $("branch").value = query.get("branch") || defaultBranch;
            $("actionsLink").href =
              `https://github.com/${owner}/${repo}/actions/workflows/${WORKFLOW}`;

            $("connection").textContent = "CONECTADA";
            $("connection").classList.add("online");
            $("login").classList.add("hidden");
            $("workspace").classList.remove("hidden");

            await loadConversation().catch(error =>
              status(`Histórico: ${error.message}`, "error")
            );

            await loadConversationList().catch(() => {});
          }

          $("loginForm").addEventListener("submit", async event => {
            event.preventDefault();

            const button = event.submitter;
            const token = $("token").value.trim();
            if (!token) return;

            button.disabled = true;
            button.textContent = "Verificando…";
            sessionStorage.setItem(TOKEN_KEY, token);

            try {
              await connect();
              $("token").value = "";
            } catch (error) {
              sessionStorage.removeItem(TOKEN_KEY);
              loginStatus(`Falha: ${error.message}`, "error");
            } finally {
              button.disabled = false;
              button.textContent = "Conectar";
            }
          });

          async function getRuns() {
            const [o, r] = parts();

            const result = await github(
              `/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}` +
              `/actions/workflows/${encodeURIComponent(WORKFLOW)}/runs` +
              `?event=workflow_dispatch&per_page=50`
            );

            return result.workflow_runs || [];
          }

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function waitForRun(previousIds, startedAt) {
            const [o, r] = parts();
            const end = Date.now() + MAX_WAIT;

            while (Date.now() < end) {
              const runs = await getRuns();
              const branch = $("branch").value.trim() || defaultBranch;

              const run = runs.find(item =>
                !previousIds.has(item.id) &&
                item.head_branch === branch &&
                Date.parse(item.created_at) >= startedAt - 30000 &&
                String(item.display_title || "").includes(chatId)
              );

              if (run) {
                const detail = await github(
                  `/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}` +
                  `/actions/runs/${run.id}`
                );

                status(
                  `MEVA trabalhando · execução #${run.run_number} · ` +
                  `${detail.status}` +
                  (detail.status === "completed"
                    ? ` / ${detail.conclusion}`
                    : "")
                );

                if (detail.status === "completed") {
                  if (detail.conclusion !== "success") {
                    throw new Error(
                      `Execução #${run.run_number} terminou com ` +
                      `${detail.conclusion}. Consulte os logs no GitHub Actions.`
                    );
                  }
                  return run;
                }
              } else {
                status("Solicitação recebida. Preparando a execução da MEVA…");
              }

              await sleep(3000);
            }

            throw new Error(
              "O painel atingiu o limite de espera. A execução pode continuar; " +
              "use Atualizar ou consulte as execuções."
            );
          }

          function safeFileName(name) {
            const cleaned = String(name || "arquivo.bin")
              .normalize("NFKC")
              .replace(/[/\\]/g, "_")
              .replace(/[^A-Za-z0-9._-]/g, "_")
              .replace(/^\.+/, "")
              .slice(0, 100);

            if (
              !cleaned ||
              cleaned === "." ||
              cleaned === ".." ||
              cleaned.toLowerCase().endsWith(".")
            ) {
              throw new Error(`Nome de arquivo inválido: ${name}`);
            }

            return cleaned;
          }

          async function createAttachmentRelease(files) {
            const [o, r] = parts();
            const stamp = Date.now();
            const tag = `meva-upload-${chatId}-${stamp}`;

            const release = await github(
              `/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}/releases`,
              {
                method: "POST",
                body: JSON.stringify({
                  tag_name: tag,
                  name: `MEVA anexos ${chatId}`,
                  body: "Arquivos enviados ao assistente MEVA.",
                  draft: false,
                  prerelease: true
                })
              }
            );

            const uploaded = [];

            for (let index = 0; index < files.length; index++) {
              const file = files[index];
              const name =
                `${String(index + 1).padStart(2, "0")}-` +
                safeFileName(file.name);

              const uploadBase = String(release.upload_url || "")
                .replace(/\{\?name,label\}$/, "");

              if (!uploadBase.startsWith("https://uploads.github.com/")) {
                throw new Error("Endereço de upload inválido retornado pelo GitHub.");
              }

              const uploadUrl =
                `${uploadBase}?name=${encodeURIComponent(name)}`;

              const token = sessionStorage.getItem(TOKEN_KEY);

              const raw = await new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();

                xhr.open("POST", uploadUrl, true);
                xhr.setRequestHeader("Accept", "application/vnd.github+json");
                xhr.setRequestHeader("Authorization", `Bearer ${token}`);
                xhr.setRequestHeader("X-GitHub-Api-Version", "2022-11-28");
                xhr.setRequestHeader(
                  "Content-Type",
                  file.type || "application/octet-stream"
                );

                xhr.upload.addEventListener("progress", event => {
                  if (event.lengthComputable) {
                    const percent =
                      Math.round((event.loaded / event.total) * 100);

                    status(
                      `Enviando ${index + 1}/${files.length}: ` +
                      `${file.name} · ${percent}%`
                    );
                  }
                });

                xhr.onload = () => {
                  if (xhr.status >= 200 && xhr.status < 300) {
                    resolve(xhr.responseText);
                  } else {
                    reject(new Error(`GitHub HTTP ${xhr.status}: ${xhr.responseText.slice(0, 200)}`));
                  }
                };

                xhr.onerror = () => reject(
                  new Error("Falha de rede ao enviar o arquivo.")
                );

                xhr.onabort = () => reject(
                  new Error("Envio cancelado.")
                );

                xhr.send(file);
              });

              const asset = JSON.parse(raw);

              uploaded.push({
                name,
                size: file.size,
                url: asset.browser_download_url
              });
            }

            return {tag, assets: uploaded};
          }

          $("attachments").addEventListener("change", () => {
            const files = Array.from($("attachments").files || []);
            const total = files.reduce((sum, file) => sum + file.size, 0);

            let message = files.map(file =>
              `${file.name} · ${(file.size / 1024 / 1024).toFixed(2)} MB`
            ).join("\n");

            message += `\nTotal: ${(total / 1024 / 1024).toFixed(2)} MB`;

            if (files.length > MAX_FILES) {
              message += "\nERRO: limite de 5 arquivos.";
            }

            if (files.some(file => !file.size || file.size > MAX_FILE)) {
              message += "\nERRO: cada arquivo deve ter até 200 MB.";
            }

            if (total > MAX_TOTAL) {
              message += "\nERRO: total acima de 500 MB.";
            }

            $("attachmentList").textContent =
              message || "Nenhum arquivo selecionado.";
          });

          async function uploadAttachments() {
            const files = Array.from($("attachments").files || []);

            if (!files.length) return null;
            if (files.length > MAX_FILES) {
              throw new Error("Limite de 5 arquivos por envio.");
            }

            const total = files.reduce((sum, file) => sum + file.size, 0);

            if (total > MAX_TOTAL) {
              throw new Error("Os anexos ultrapassam 500 MB no total.");
            }

            for (const file of files) {
              safeFileName(file.name);

              if (!file.size || file.size > MAX_FILE) {
                throw new Error(`${file.name}: arquivo vazio ou acima de 200 MB.`);
              }
            }

            const result = await createAttachmentRelease(files);

            $("attachments").value = "";
            $("attachmentList").textContent =
              `${files.length} arquivo(s) enviado(s).`;

            return result;
          }

          $("composer").addEventListener("submit", async event => {
            event.preventDefault();
            if (busy) return;

            const message = $("message").value.trim();
            const files = Array.from($("attachments").files || []);

            if (!message && !files.length) return;

            if (files.length && !message) {
              return status("Explique o que a MEVA deve fazer com os arquivos.", "error");
            }

            if (message.length > 5500) {
              return status("Mensagem acima de 5.500 caracteres.", "error");
            }

            if (files.length && message.length > 4800) {
              return status("Com anexos, limite a instrução a 4.800 caracteres.", "error");
            }

            const branch = $("branch").value.trim() || defaultBranch;

            if (
              !/^[A-Za-z0-9._/-]+$/.test(branch) ||
              branch.includes("..")
            ) {
              return status("Nome de branch inválido.", "error");
            }

            const mode = files.length ? "agent" : $("mode").value;
            if (files.length) $("mode").value = "agent";

            const button = $("send");
            busy = true;
            button.disabled = true;
            button.textContent = "Executando…";

            const startedAt = Date.now();

            try {
              const previousRuns = await getRuns();
              const previousIds = new Set(previousRuns.map(run => run.id));

              status(
                files.length
                  ? "Enviando arquivos para análise…"
                  : "Solicitação recebida. Preparando a MEVA…"
              );

              const uploaded = await uploadAttachments();

              const manifest = uploaded
                ? "\n\nMEVA_ATTACHMENT_MANIFEST: " +
                  JSON.stringify(uploaded.assets)
                : "";

              const taskText = message + manifest;

              if (taskText.length > 6000) {
                throw new Error("A mensagem e o manifesto dos anexos excedem o limite.");
              }

              $("message").value = "";

              chatMessages.push({role: "user", content: message});
              render();

              status(
                mode === "agent"
                  ? "Agente iniciado. Analisando arquivos e preparando ferramentas…"
                  : "Preparando o modelo e gerando sua resposta…"
              );

              const [o, r] = parts();

              await github(
                `/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}` +
                `/actions/workflows/${encodeURIComponent(WORKFLOW)}/dispatches`,
                {
                  method: "POST",
                  body: JSON.stringify({
                    ref: branch,
                    inputs: {
                      mode,
                      message: taskText,
                      conversation_id: chatId,
                      branch,
                      max_actions: "16"
                    }
                  })
                }
              );

              await waitForRun(previousIds, startedAt);
              await loadConversation();

              status("Resposta concluída. Histórico atualizado.", "success");
            } catch (error) {
              status(`Não foi possível concluir: ${error.message}`, "error");
              await loadConversation().catch(() => {});
            } finally {
              busy = false;
              button.disabled = false;
              button.textContent = "Enviar ↗";
            }
          });

          $("newChat").addEventListener("click", async () => {
            newConversation();
            await loadConversationList().catch(() => {});
          });

          $("savedChats").addEventListener("change", async () => {
            const selected = $("savedChats").value;
            if (!validChatId(selected)) return;

            chatId = selected;
            localStorage.setItem(CHAT_KEY, chatId);

            const url = new URL(location.href);
            url.searchParams.set("conversation", chatId);
            history.replaceState({}, "", url);

            try {
              await loadConversation();
              status("Conversa aberta.", "success");
            } catch (error) {
              status(error.message, "error");
            }
          });

          $("shareChat").addEventListener("click", async () => {
            const url = new URL(location.href);

            url.searchParams.set("conversation", chatId);
            url.searchParams.set(
              "branch",
              $("branch").value.trim() || defaultBranch
            );

            try {
              await navigator.clipboard.writeText(url.href);
              status("Link copiado.", "success");
            } catch (_) {
              status(url.href);
            }
          });

          $("refresh").addEventListener("click", async () => {
            try {
              await loadConversation();
              status("Histórico atualizado.", "success");
            } catch (error) {
              status(error.message, "error");
            }
          });

          $("logout").addEventListener("click", () => {
            sessionStorage.removeItem(TOKEN_KEY);
            sessionStorage.removeItem(REPO_KEY);
            location.reload();
          });

          $("message").addEventListener("keydown", event => {
            if (event.key === "Enter" && !event.shiftKey) {
              event.preventDefault();
              $("composer").requestSubmit();
            }
          });

          async function init() {
            const detected = repoFromPage();

            if (!detected) {
              loginStatus("Não consegui identificar o repositório do Pages.", "error");
              return;
            }

            [owner, repoName] = detected.split("/");

            if (sessionStorage.getItem(TOKEN_KEY)) {
              try {
                await connect();
              } catch (error) {
                sessionStorage.removeItem(TOKEN_KEY);
                loginStatus(`Sessão inválida: ${error.message}`, "error");
              }
            }
          }

          init();
