          """Utilitários compartilhados: limites, redação de segredos, caminhos seguros, hashes."""
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path, PurePosixPath

          VERSION = '19.0'

          MAX_UPLOAD = 1800 * 1024 * 1024
          MAX_INPUT = 100 * 1024 * 1024
          MAX_UNPACKED = 3 * 1024 * 1024 * 1024
          MAX_FILES = 100000
          MAX_UPLOAD_FILES = 2000
          MAX_FILE = 1024 * 1024 * 1024
          CHUNK_SIZE = 2 * 1024 * 1024
          MAX_BACKUP_TOTAL = 512 * 1024 * 1024
          MAX_VALIDATION_FILES = 2500

          DENY_DIRS = {'.git', '.meva-cache', 'node_modules', '.venv', 'venv', '__pycache__', '.pytest_cache'}
          SECRET_NAMES = {
              '.env', '.env.local', '.env.production', '.ssh', 'id_rsa', 'id_ed25519', 'id_ecdsa',
              'credentials', 'credentials.json', '.npmrc', '.pypirc', 'authorized_keys', 'known_hosts',
              'shadow', 'gshadow',
          }
          SECRET_SUFFIXES = ('.pem', '.p12', '.pfx', '.key', '.keystore')
          OUTPUT_NAMES = (
              'MEVA-REPORT.md', 'MEVA-CHANGES.diff', 'MEVA-MANIFEST.json', 'MEVA-ACTIONS.json',
              'MEVA-BACKUPS.json', 'MEVA-VALIDATION.json', 'MEVA-ENVIRONMENT.json', 'MEVA-PLAN.json',
              'MEVA-ERROR.md', 'MEVA-VERIFY.json', 'MEVA-TODOS.json', 'MEVA-GIT-LOG.txt',
          )


          def now_iso() -> str:
              return time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())


          def log(message) -> None:
              print('[MEVA] ' + str(message), flush=True)


          def redact(value, limit: int = 3000) -> str:
              s = str(value)
              s = re.sub(r'(?i)Bearer\s+[A-Za-z0-9._~+/=-]{12,}', 'Bearer [REDACTED]', s)
              s = re.sub(r'(?i)(authorization|api[_-]?key|access[_-]?token|password|secret|client_secret)\s*[:=]\s*(?:(?:Bearer|Basic|Token)\s+)?[^\s,;]+', r'\1=[REDACTED]', s)
              s = re.sub(r'(?i)([?&](?:token|key|secret|access_token)=)[^&\s]+', r'\1[REDACTED]', s)
              s = re.sub(r'\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|nvapi-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9_-]{20,}|xai-[A-Za-z0-9_-]{20,}|tvly-[A-Za-z0-9_-]{16,})\b', '[REDACTED_TOKEN]', s)
              return s[:limit]


          def atomic_json(path: Path, obj) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + '.tmp')
              tmp.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              tmp.replace(path)


          def file_hash(p: Path) -> str:
              h = hashlib.sha256()
              with p.open('rb') as f:
                  for block in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()


          def secret_path(parts) -> bool:
              for part in parts:
                  x = part.lower()
                  if x in SECRET_NAMES or x.startswith('.env.') or x.endswith(SECRET_SUFFIXES):
                      return True
              return False


          def valid_rel(raw) -> PurePosixPath:
              if not isinstance(raw, str) or not raw or len(raw) > 500 or '\\' in raw or '\x00' in raw:
                  raise ValueError('Caminho de arquivo inválido.')
              parts = raw.split('/')
              if any(x in ('', '..', '.') for x in parts) or raw.startswith('/') or re.match(r'^[A-Za-z]:', raw):
                  raise ValueError('Caminho absoluto ou traversal bloqueado: ' + raw[:150])
              p = PurePosixPath(raw)
              if any(x.lower() in DENY_DIRS for x in p.parts):
                  raise ValueError('Diretório protegido: ' + raw[:150])
              if secret_path(p.parts) or p.name in ('.DS_Store', 'Thumbs.db'):
                  raise ValueError('Arquivo sensível/bloqueado: ' + raw[:150])
              return p


          def safe_link_target(link_parts, target) -> bool:
              if not isinstance(target, str) or not target or len(target) > 4096 or '\x00' in target or '\\' in target or target.startswith('/'):
                  return False
              stack = list(link_parts[:-1])
              for part in PurePosixPath(target).parts:
                  if part in ('', '.'):
                      continue
                  if part == '..':
                      if not stack:
                          return False
                      stack.pop()
                  else:
                      stack.append(part)
              return True


          def read_memory_safe(path: Path, project: Path, limit: int = 15000) -> str:
              """Lê MEVA.md só se for arquivo regular DENTRO do projeto (nunca segue symlink)."""
              try:
                  if path.is_symlink() or not path.is_file():
                      return ''
                  root = project.resolve()
                  if root not in path.resolve().parents:
                      return ''
                  return path.read_text(encoding='utf-8', errors='replace')[:limit]
              except OSError:
                  return ''


          def head_tail(text: str, limit: int, head_ratio: float = 0.25) -> tuple[str, bool]:
              """Corta o meio do texto preservando começo e fim (erros costumam estar no fim)."""
              if len(text) <= limit:
                  return text, False
              head = int(limit * head_ratio)
              tail = limit - head
              return text[:head] + f'\n[… {len(text) - limit} caracteres omitidos …]\n' + text[-tail:], True


          _SECRET_ENV = re.compile(r'(TOKEN|SECRET|PASSWORD|CREDENTIAL|PRIVATE_KEY|API_KEY)', re.I)


          def clean_env(extra: dict | None = None) -> dict:
              env = os.environ.copy()
              for k in list(env):
                  if k.startswith(('GITHUB_', 'ACTIONS_', 'RUNNER_')) or _SECRET_ENV.search(k):
                      env.pop(k, None)
              env.update({
                  'HOME': '/tmp/meva-home', 'GIT_CONFIG_NOSYSTEM': '1', 'GIT_CONFIG_GLOBAL': '/dev/null',
                  'GIT_TERMINAL_PROMPT': '0', 'GIT_PAGER': 'cat', 'PAGER': 'cat', 'CI': '1',
                  'PYTHONNOUSERSITE': '1', 'PYTHONPYCACHEPREFIX': '/tmp/meva-pycache',
                  'LANG': 'C.UTF-8', 'LC_ALL': 'C.UTF-8',
              })
              if extra:
                  env.update(extra)
              Path(env['HOME']).mkdir(parents=True, exist_ok=True)
              return env


          def run_host(argv, cwd, timeout: int = 120, limit: int = 20000, input_bytes: bytes | None = None) -> dict:
              """Executa um binário no host (sem shell). Usado só para ferramentas de inspeção/validação
              que não executam código do projeto (git, bash -n, node --check, file...)."""
              try:
                  p = subprocess.run(
                      argv, cwd=cwd, capture_output=True, timeout=timeout, env=clean_env(),
                      input=input_bytes, stdin=None if input_bytes is not None else subprocess.DEVNULL,
                  )
                  out = ((p.stdout or b'').decode('utf-8', 'replace') + '\n' + (p.stderr or b'').decode('utf-8', 'replace')).strip()
                  return {'ok': p.returncode == 0, 'exit_code': p.returncode, 'output': out[-limit:]}
              except subprocess.TimeoutExpired as e:
                  a = (e.stdout or b'').decode('utf-8', 'replace') if isinstance(e.stdout, bytes) else (e.stdout or '')
                  b = (e.stderr or b'').decode('utf-8', 'replace') if isinstance(e.stderr, bytes) else (e.stderr or '')
                  return {'ok': False, 'timeout': True, 'output': (a + '\n' + b + '\nTIMEOUT')[-limit:]}
              except Exception as e:  # noqa: BLE001
                  return {'ok': False, 'error': redact(e)}
