          """Gerenciamento de contexto: limites por resultado, limpeza de resultados antigos e resumo automático.

          Substitui o `compact_messages` da V18, que só cortava texto por caracteres e perdia o histórico.
          Estágios (do mais barato ao mais caro):
            1. cada resultado de ferramenta já nasce limitado, com dica de paginação;
            2. resultados antigos de ferramenta viram stubs (o assistente e suas decisões permanecem);
            3. se ainda passar do orçamento, o histórico antigo é RESUMIDO pelo modelo (com fallback determinístico).
