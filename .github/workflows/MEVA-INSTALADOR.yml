              return result


          def detect_test_command(ws) -> str | None:
              pr = ws.project
              if (pr / 'build' / 'CTestTestfile.cmake').is_file():
                  return 'ctest --test-dir build --output-on-failure'
              if (pr / 'CTestTestfile.cmake').is_file():
                  return 'ctest --test-dir . --output-on-failure'
              mk = pr / 'Makefile'
              if mk.is_file() and re.search(r'(?m)^test\s*:', mk.read_text(encoding='utf-8', errors='replace')):
                  return 'make test'
              pj = pr / 'package.json'
              if pj.is_file():
                  try:
                      if (json.loads(pj.read_text(encoding='utf-8')).get('scripts') or {}).get('test'):
                          return 'npm test'
                  except Exception:  # noqa: BLE001
                      pass
              if (pr / 'Cargo.toml').is_file():
