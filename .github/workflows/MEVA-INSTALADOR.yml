              # ------------------------------------------------------------ ZIP seguro
              def zip_safe_extract(self, path: Path, destination: Path, strip_output: bool = False) -> dict:
                  stage = destination.with_name(destination.name + '.staging')
                  if stage.exists():
                      shutil.rmtree(stage)
                  stage.mkdir(parents=True, exist_ok=True)
                  total = 0
                  seen: set[str] = set()
                  links: dict[str, str] = {}
                  dir_modes: dict[Path, int] = {}
