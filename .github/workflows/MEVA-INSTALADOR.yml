          def clear_old_tool_results(messages: list, keep_recent: int = KEEP_RECENT) -> int:
              """Troca o conteúdo de tool_results antigos por um stub. Devolve quantos foram limpos."""
              cleared = 0
              for m in messages[:max(0, len(messages) - keep_recent)]:
                  if not isinstance(m.get('content'), list):
                      continue
                  for b in m['content']:
                      if b.get('type') == 'tool_result' and len(b.get('content', '')) > 400:
                          n = len(b['content'])
                          head = b['content'][:200].replace('\n', ' ')
                          b['content'] = json.dumps({'omitido': 'resultado antigo removido do contexto', 'bytes': n, 'inicio': head}, ensure_ascii=False)
