                          'CONFIG_USB=' + str(usb) + '; CONFIG_INPUT/EVDEV=' + str(inp) + '. Isso não confirma que drivers Xenon foram implementados ou funcionam.')
                  add('Xbox 360 hardware', 'NOT_TESTED', 'Drivers Xenos, vídeo, USB, controle, boot chain e estabilidade exigem teste no console físico; auditoria estática não confirma hardware.')
                  return report

              def _audit_rootfs(self, path: Path, name: str, add) -> None:
                  try:
                      entries: dict[str, int] = {}
                      trailer = False
                      trailing_nonzero = False
                      with gzip.open(path, 'rb') as f:
                          while True:
                              h = f.read(110)
                              if not h:
