          exit 1

      - name: Publicar ZIP verificado no Release
        id: publish
        if: ${{ always() && (inputs.mode == 'agent' || inputs.mode == 'linux_zip' || inputs.mode == 'resume') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CID: ${{ inputs.conversation_id || format('run-{0}', github.run_id) }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -s /tmp/MEVA-LINUX-PROJECT-V19.zip ]]; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            echo 'Nenhum ZIP foi produzido; não será criado Release vazio.'
            exit 0
          fi
          TAG="meva-v19-${CID}-${RUN_ID}"; NAME="MEVA-LINUX-PROJECT-V19-${RUN_ID}.zip"
          cp /tmp/MEVA-LINUX-PROJECT-V19.zip "/tmp/${NAME}"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "/tmp/${NAME}" --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" "/tmp/${NAME}" --repo "$GH_REPO" --target "$BRANCH" --title "MEVA V19 — Projeto (${RUN_ID})" --notes 'Pacote de projeto MEVA V19. Consulte MEVA-REPORT.md, MEVA-CHANGES.diff, MEVA-MANIFEST.json e MEVA-ACTIONS.json. O pacote não comprova boot físico.' --prerelease
          fi
          gh api "repos/${GH_REPO}/releases/tags/${TAG}" > /tmp/meva-v19-release.json
          python3 - <<'PYREL'
          import json,os
          from pathlib import Path
          d=json.loads(Path('/tmp/meva-v19-release.json').read_text(encoding='utf-8'))
          name='MEVA-LINUX-PROJECT-V19-'+os.environ['RUN_ID']+'.zip'
          a=next((x for x in d.get('assets',[]) if x.get('name')==name),None)
          if not a: raise SystemExit('Asset final não localizado no Release.')
          if not isinstance(d.get('id'),int) or not isinstance(a.get('id'),int): raise SystemExit('API não retornou IDs numéricos.')
          if int(a.get('size',0))<=0 or not a.get('browser_download_url'): raise SystemExit('Asset sem tamanho/URL válidos.')
          Path('/tmp/meva-v19-published.json').write_text(json.dumps({'release_id':d['id'],'release_url':d.get('html_url',''),'asset_id':a['id'],'asset_name':a['name'],'asset_size':a['size'],'asset_url':a['browser_download_url']}),encoding='utf-8')
          print('Release/asset verificados:',a['name'],a['size'])
          PYREL
          echo 'published=true' >> "$GITHUB_OUTPUT"

      - name: Enviar diagnóstico e ZIP como artefato
