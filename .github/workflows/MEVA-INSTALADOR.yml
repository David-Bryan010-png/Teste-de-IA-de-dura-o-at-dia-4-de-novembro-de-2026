                  done=0; started=time.time(); max_seconds=105*60 if MODE in ('agent','linux_zip','resume') else 12*60; malformed=0; answer=''
                  AUDIT.clear(); ERROR_PATH.unlink(missing_ok=True); persist_audit()
                  while done<MAX_ACTIONS and time.time()-started<max_seconds:
                      raw=ask_api(msgs,tokens=14000)
                      try: obj=extract_json(raw); actions=obj['actions']; reply=obj.get('reply',''); malformed=0
                      except Exception as exc:
                          malformed+=1
                          if malformed<=2:
                              msgs.extend([{'role':'assistant','content':raw[:10000]},{'role':'user','content':'A resposta não é JSON válido. Refaça com JSON contendo reply string e actions array. Erro: '+str(exc)}]); continue
                          answer='O modelo não conseguiu produzir um plano estruturado válido após duas tentativas de correção.'; break
                      if not actions: answer=reply or 'Tarefa concluída.'; break
                      results=[]
                      for action in actions[:min(4,MAX_ACTIONS-done)]:
                          kind=action.get('type') if isinstance(action,dict) else 'unknown'
                          event={'index':done+1,'tool':str(kind)[:80],'target':audit_target(action) if isinstance(action,dict) else '', 'status':'running','started_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
                          AUDIT.append(event); persist_audit()
                          try:
                              result=tool(action)
                              event['status']='failed' if isinstance(result,dict) and result.get('ok') is False else 'success'
                              event['result']=audit_result(result)
                              results.append({'tool':kind,'result':result})
                          except Exception as exc:
                              event['status']='error'; event['error']=redact_text(exc)
                              results.append({'tool':kind,'error':redact_text(exc)})
                          event['finished_at']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
                          persist_audit(); done+=1
                      log('Ações concluídas: '+str(done)+'/'+str(MAX_ACTIONS)+'; falhas registradas: '+str(sum(1 for x in AUDIT if x.get('status') in ('error','failed'))))
                      msgs.extend([{'role':'assistant','content':raw[:14000]},{'role':'user','content':'Resultados reais das ferramentas: '+json.dumps(results,ensure_ascii=False)[:20000]+'. Continue, corrija falhas e finalize somente após verificar o estado.'}])
                      if len(msgs)>18: msgs=msgs[:2]+msgs[-10:]
                      answer=reply or answer
                  if not answer: answer='Limite de ações ou tempo atingido. Resultado parcial; revise o relatório e use Retomar para continuar.'
                  if PROJECT.is_dir():
                      answer+='\n\nResumo do projeto: '+json.dumps(project_info(),ensure_ascii=False)[:4000]
                      verified_changes,_=make_diff(before)
                      answer+='\n\nALTERAÇÕES VERIFICADAS: '
                      answer+=('; '.join(x['status']+': '+x['path'] for x in verified_changes[:80]) if verified_changes else 'nenhuma alteração real detectada nos arquivos do projeto.')
                  if AUDIT:
                      answer+='\n\nAUDITORIA: '+str(len(AUDIT))+' ações registradas; '+str(sum(1 for x in AUDIT if x.get('status') in ('error','failed')))+' com erro/falha. Consulte MEVA-REPORT.md e MEVA-ACTIONS.json no ZIP.'
              stamp=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
              prev=history.get('messages',[])
              if not isinstance(prev,list): prev=[]
              prev=prev[-36:]
              if MODE!='self_test': prev.extend([{'role':'user','content':USER,'created_at':stamp},{'role':'assistant','content':answer,'created_at':stamp}])
              history.update({'id':CID,'updated_at':stamp,'provider':PROVIDER,'autonomy':AUTONOMY,'allow_build':ALLOW_BUILD,'mode':MODE,'messages':prev})
              STATE.write_text(json.dumps(history,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              project_loaded = PROJECT.is_dir() and any(p.is_file() for p in PROJECT.rglob('*'))
              completed = (not actions) if 'actions' in locals() else False
              status = 'completed' if completed else ('partial' if done > 0 else 'waiting')
              CHECKPOINT.write_text(json.dumps({
                  'conversation_id': CID,
                  'actions': done,
                  'updated_at': stamp,
                  'project_loaded': project_loaded,
                  'completed': completed,
                  'status': status,
                  'summary': answer[:4000],
                  'objective': USER[:2000],
                  'provider': PROVIDER,
                  'autonomy': AUTONOMY
              }, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
              package=create_package(answer,done,before) if PROJECT.is_dir() and MODE in ('agent','linux_zip','resume') else None
              Path('/tmp/meva-v15-answer.txt').write_text(answer,encoding='utf-8')
              log('MEVA_RESULT_BEGIN'); print(answer); log('MEVA_RESULT_END')
              log('PROVIDER='+PROVIDER+' ACTIONS='+str(done)+' BUILD='+str(ALLOW_BUILD)+' PACKAGE='+str(bool(package)))
              if package: log('PACKAGE_SIZE='+str(package['size'])+' CHANGED='+str(package['changed_files']))
          except Exception as exc:
              error_text=type(exc).__name__+': '+str(exc)
              error_text=redact_text(error_text)
              log('MEVA_FATAL: '+error_text)
              try:
                  WORK.mkdir(parents=True,exist_ok=True)
                  persist_audit()
                  ERROR_PATH.write_text('# MEVA V15 — Execução interrompida\n\n'+error_text+'\n',encoding='utf-8')
                  if PROJECT.is_dir():
                      partial_answer=(answer or 'O agente foi interrompido antes de produzir uma resposta final.')+'\n\nA execução foi interrompida por erro. O pacote, quando disponível, é PARCIAL e não deve ser considerado validado.'
                      try:
                          package=create_package(partial_answer,done,before,AUDIT,error_text)
                          log('PACOTE_PARCIAL_GERADO: '+str(package.get('size',0))+' bytes')
                      except Exception as package_exc:
                          log('FALHA_AO_GERAR_PACOTE_PARCIAL: '+redact_text(package_exc))
                  stamp=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
                  previous=history.get('messages',[]) if isinstance(history,dict) else []
                  if not isinstance(previous,list): previous=[]
                  previous=previous[-36:]
                  failure_message='EXECUÇÃO INTERROMPIDA: '+error_text+'\nAções de ferramenta registradas: '+str(len(AUDIT))+'. Verifique MEVA-ACTIONS.json e MEVA-ERROR.md nos diagnósticos da execução.'
                  if previous and isinstance(previous[-1],dict) and previous[-1].get('role')=='assistant':
                      previous[-1]['content']=(str(previous[-1].get('content',''))+'\n\n'+failure_message)[:12000]
                  else:
                      previous.extend([{'role':'user','content':USER or 'Execução do MEVA V15','created_at':stamp},{'role':'assistant','content':failure_message,'created_at':stamp}])
                  history.update({'id':CID,'updated_at':stamp,'provider':PROVIDER,'autonomy':AUTONOMY,'allow_build':ALLOW_BUILD,'mode':MODE,'status':'failed','last_error':error_text,'messages':previous})
                  STATE.parent.mkdir(parents=True,exist_ok=True); CHECKPOINT.parent.mkdir(parents=True,exist_ok=True)
                  STATE.write_text(json.dumps(history,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  CHECKPOINT.write_text(json.dumps({'conversation_id':CID,'actions':done,'updated_at':stamp,'project_loaded':PROJECT.is_dir() and any(x.is_file() for x in PROJECT.rglob('*')),'completed':False,'status':'failed','error':error_text,'audit_events':len(AUDIT),'summary':(answer or '')[:2000]},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              except Exception as preserve_exc:
                  log('FALHA_AO_PRESERVAR_RESULTADO_PARCIAL: '+redact_text(preserve_exc))
              print('MEVA_FATAL: '+error_text,file=sys.stderr)
              raise
          PY

          python3 -m py_compile /tmp/meva-v15.py
          python3 /tmp/meva-v15.py | tee /tmp/meva-v15-output.txt

      - name: Salvar diagnóstico e ZIP parcial mesmo quando houver falha
        if: ${{ always() && (failure() || cancelled()) }}
        uses: actions/upload-artifact@v4
        with:
          name: MEVA-V15-DIAGNOSTICO-${{ github.run_id }}
          path: |
            /tmp/meva-v15-output.txt
            /tmp/MEVA-LINUX-PROJECT-V15.zip
            meva-workspace/MEVA-REPORT.md
            meva-workspace/MEVA-ACTIONS.json
            meva-workspace/MEVA-ERROR.md
            meva-data/checkpoints/${{ inputs.conversation_id || format('run-{0}', github.run_id) }}.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publicar ZIP Linux completo atualizado
        id: publish
        if: ${{ (inputs.mode == 'agent' || inputs.mode == 'linux_zip' || inputs.mode == 'resume') && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CID: ${{ inputs.conversation_id || format('run-{0}', github.run_id) }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -s /tmp/MEVA-LINUX-PROJECT-V15.zip ]]; then
            echo 'ERRO: o agente terminou sem gerar o ZIP final; a execução não pode ser considerada concluída.' >&2
            exit 1
          fi
          TAG="meva-v15-linux-${CID}-${RUN_ID}"
          NAME="MEVA-LINUX-PROJECT-V15-${RUN_ID}.zip"
          cp /tmp/MEVA-LINUX-PROJECT-V15.zip "/tmp/${NAME}"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'Release já existe; atualizando o ZIP desta execução.'
            gh release upload "$TAG" "/tmp/${NAME}" --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" "/tmp/${NAME}" \
              --repo "$GH_REPO" --target "$BRANCH" \
              --title "MEVA V15 — Linux atualizado (${RUN_ID})" \
              --notes 'Projeto completo atualizado em linux-project/, acompanhado de relatório, manifesto e diff.' \
              --prerelease
          fi
          # REST retorna IDs numéricos; GraphQL databaseId é um node ID opaco.
          gh api "repos/${GH_REPO}/releases/tags/${TAG}" > /tmp/meva-v15-release.json
          python3 - <<'PYRELEASE'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/meva-v15-release.json').read_text(encoding='utf-8'))
          assets=data.get('assets',[])
          asset=next((a for a in assets if a.get('name','').startswith('MEVA-LINUX-PROJECT-V15-') and a.get('name','').endswith('.zip')),None)
          if not asset: raise SystemExit('Release criado, mas o asset ZIP não foi localizado.')
          release_id=data.get('id'); asset_id=asset.get('id'); browser_url=asset.get('browser_download_url')
          if not isinstance(release_id,int) or not isinstance(asset_id,int): raise SystemExit('GitHub REST não retornou IDs numéricos do Release/asset.')
          if not browser_url: raise SystemExit('Release criado, mas a URL pública do ZIP está ausente.')
          Path('/tmp/meva-v15-published.json').write_text(json.dumps({'release_id':release_id,'release_url':data.get('html_url',''),'asset_id':asset_id,'asset_name':asset['name'],'asset_size':int(asset['size']),'asset_url':browser_url},ensure_ascii=False),encoding='utf-8')
          print('ZIP publicado:',asset['name'],'bytes=',asset['size'])
          PYRELEASE

      - name: Salvar conversa, checkpoint e referência do ZIP final
        if: ${{ always() && steps.request.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
          CID: ${{ inputs.conversation_id || format('run-{0}', github.run_id) }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -s /tmp/meva-v15-published.json ]]; then
            python3 - "$CID" <<'PYUPDATE'
          import json,sys
          from pathlib import Path
          cid=sys.argv[1]
          state=Path('meva-data/conversations')/(cid+'.json')
          published=json.loads(Path('/tmp/meva-v15-published.json').read_text(encoding='utf-8'))
          if state.is_file():
              obj=json.loads(state.read_text(encoding='utf-8'))
              obj['last_release']=published['release_url']
              obj['last_asset_url']=published['asset_url']
              obj['project_archive']={'release_id':published['release_id'],'asset_id':published['asset_id'],'name':published['asset_name'],'size':published['asset_size']}
              state.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PYUPDATE
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p meva-data/conversations meva-data/checkpoints
          # Preserve only the conversation data, then return to the original branch.
          # This prevents the temporary ZIP commit from being pushed into the main project history.
          cp -a meva-data /tmp/meva-data-persist
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git checkout -f -B "$BRANCH" "origin/${BRANCH}"
          mkdir -p meva-data
          cp -a /tmp/meva-data-persist/. meva-data/
          git add -A -- meva-data
          if ! git diff --cached --quiet; then
            git commit -m "MEVA V15: salvar conversa ${CID}"
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:${BRANCH}"
          fi

      - name: Remover branch temporário do upload
        if: ${{ always() && inputs.upload_ref != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPLOAD_REF: ${{ inputs.upload_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "$UPLOAD_REF" =~ ^meva-upload-[a-z0-9-]{8,80}$ ]]; then
            echo 'Branch de upload fora do padrão; limpeza automática recusada.'
            exit 0
          fi
          if gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${UPLOAD_REF}"; then
            echo 'Branch temporário removido.'
          else
            echo 'Aviso: não foi possível remover a branch temporária. Remova-a manualmente após verificar a execução.'
          fi

      - name: Resumo da execução
        if: always()
        env:
          MODE: ${{ inputs.mode }}
          CID: ${{ inputs.conversation_id || format('run-{0}', github.run_id) }}
          PROVIDER: ${{ steps.request.outputs.provider }}
          AUTONOMY: ${{ inputs.autonomy }}
          ALLOW_BUILD: ${{ inputs.allow_build }}
        shell: bash
        run: |
          {
            echo '## MEVA CODE V15 — Linux ZIP Engineering Agent'
            echo "- Modo: ${MODE}"
            echo "- Conversa: ${CID}"
            echo "- Provedor: ${PROVIDER:-não selecionado}"
            echo "- Autonomia: ${AUTONOMY}"
            echo "- Build autorizado: ${ALLOW_BUILD}"
            echo '- Entrada: ZIP transmitido em blocos pela REST API CORS do GitHub ou Release legado; tamanho verificado.'
            echo '- Extração: validação de traversal, arquivos especiais, symlinks e arquivos sensíveis.'
            echo '- Projeto: workspace separado do repositório MEVA.'
            echo '- Saída: ZIP completo em Release com relatório, manifesto e diff, quando houve projeto carregado.'
            echo '- Segurança: branch temporário removido ao final; chaves de API não são incluídas no ZIP.'
          } >> "$GITHUB_STEP_SUMMARY"
