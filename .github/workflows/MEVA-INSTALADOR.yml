name: MEVA CODE V18 — Linux Project Engineering Agent
run-name: MEVA V18 / ${{ inputs.mode || 'install' }} / ${{ inputs.conversation_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "install | chat | agent | linux_zip | self_test | resume"
        type: choice
        options: [install, chat, agent, linux_zip, self_test, resume]
        default: install
        required: true
      message:
        description: Tarefa para a MEVA
        type: string
        required: false
        default: ""
      conversation_id:
        description: ID da conversa
        type: string
        required: false
        default: ""
      branch:
        description: Branch do projeto MEVA
        type: string
        required: false
        default: ""
      max_actions:
        description: Limite de ações do agente (1–80)
        type: number
        required: false
        default: 60
      attachments:
        description: Manifesto de upload Git temporário (gerado pela interface V18)
        type: string
        required: false
        default: ""
      upload_ref:
        description: Branch temporária do upload
        type: string
        required: false
        default: ""
      autonomy:
        description: "safe = leitura | ask = plano | auto = edição"
        type: choice
        options: [safe, ask, auto]
        default: auto
        required: true
      model_provider:
        description: "auto | nvidia | claude | openai | xai"
        type: choice
        options: [auto, nvidia, claude, openai, xai]
        default: auto
        required: true
      model_id:
        description: ID opcional do modelo; vazio usa o padrão preservado do provedor
        type: string
        required: false
        default: ""
      allow_build:
        description: Autoriza execução de builds e testes; execute somente projetos confiáveis
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: meva-v18-${{ github.repository }}
  cancel-in-progress: false

jobs:
  install:
    name: Instalar interface MEVA CODE V18
    if: ${{ inputs.mode == 'install' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    steps:
      - name: Baixar branch padrão
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Construir interface web móvel
        env:
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p public meva-config meva-data/conversations meva-data/checkpoints
          for f in IDENTITY.md RESPONSE_RULES.md AGENT_RULES.md; do
            if [[ ! -s "meva-config/$f" ]]; then
              printf '# %s\n\nMEVA CODE V18 — agente de engenharia verificável.\n' "$f" > "meva-config/$f"
            fi
          done
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR"><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#09111f"><title>MEVA CODE V18</title><link rel="manifest" href="./manifest.webmanifest">
          <style>
          :root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;--bg:#09111f;--panel:#121e31;--line:#2a3b56;--text:#edf4ff;--muted:#9aacc7;--accent:#5798ff;--ok:#55d99a;--err:#ff7b91}
          *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text)}.app{min-height:100dvh;max-width:900px;margin:auto;display:flex;flex-direction:column}header{padding:13px 15px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}.brand{font-weight:850}main{flex:1;padding:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px}h1,h2{font-size:17px;margin:0 0 9px}label{display:block;margin:10px 0 5px;font-size:12px;color:var(--muted)}.muted{font-size:12px;color:var(--muted);line-height:1.5}input,textarea,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0b1526;color:var(--text);font:inherit;font-size:14px}textarea{resize:vertical}button{background:#203451;font-weight:750;cursor:pointer}button.primary{background:linear-gradient(135deg,#5798ff,#3674df);border:0;color:white}button:disabled{opacity:.55;cursor:wait}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.messages{height:34vh;min-height:180px;max-height:500px;overflow:auto;background:#0b1526;border:1px solid var(--line);border-radius:12px;padding:8px;margin:10px 0}.bubble{max-width:96%;padding:10px 12px;border-radius:12px;margin:6px 0;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#203e64;margin-left:auto}.assistant{background:#17263c}.status{font-size:12px;min-height:19px;margin-top:8px;color:var(--muted)}.status.ok{color:var(--ok)}.status.err{color:var(--err)}.warning{padding:10px;border-radius:10px;border:1px solid #765c2b;background:#2a2213;color:#f6dda7;font-size:11px;line-height:1.5;margin-top:10px}.progress{height:7px;background:#27364c;border-radius:9px;overflow:hidden;margin-top:8px}.progress>div{height:100%;width:0;background:var(--accent)}.fileinfo{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin-top:5px}.checkrow{display:flex;align-items:center;gap:9px;margin-top:10px}.checkrow input{width:19px;height:19px;flex:0 0 auto}.checkrow label{margin:0;color:var(--text)}.good{font-size:11px;line-height:1.5;color:#b8e8ce;background:#10271e;border:1px solid #285940;border-radius:10px;padding:10px;margin-top:10px}.view{display:none}.view.active{display:block}nav{display:flex;background:var(--panel);border-top:1px solid var(--line);position:sticky;bottom:0}nav button{border:0;border-radius:0;background:transparent;color:var(--muted);font-size:11px;padding:13px 3px;flex:1}nav button.active{color:var(--accent)}.item{padding:10px 2px;border-bottom:1px solid var(--line);font-size:12px;overflow-wrap:anywhere}.link{color:#8dbbff;text-decoration:none}
          @media(min-width:850px){.app{max-width:1000px}.messages{height:44vh}}
          </style></head><body><div class="app">
          <header><div class="brand">◆ MEVA CODE V18</div><div id="connection" class="muted">Desconectado</div></header>
          <main>
          <section id="view-login" class="view active"><div class="panel"><h1>Conectar ao GitHub</h1>
          <p class="muted">Use um fine-grained token limitado a este repositório: Contents (Read and write), Actions (Read and write) e Metadata (Read-only). Pages é publicado pelo GitHub Actions.</p>
          <form id="loginForm"><label>GitHub token</label><input id="token" type="password" autocomplete="off" required><button class="primary" style="margin-top:10px">Conectar</button></form>
          <div id="loginStatus" class="status"></div><div class="warning">O token fica somente na sessão desta aba. Cadastre NVIDIA_API_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY e/ou XAI_API_KEY em GitHub Secrets. Em repositórios públicos, os uploads temporários ficam visíveis enquanto são processados. Não envie segredos, chaves privadas ou arquivos de credenciais.</div></div></section>
          <section id="view-chat" class="view"><div class="panel">
          <div class="row" style="align-items:center"><h2 style="flex:2">Agente de engenharia</h2><button id="newChat" style="flex:0 0 auto;width:auto">＋ Nova</button></div><div id="repoInfo" class="muted"></div><div id="messages" class="messages"></div>
          <form id="composer">
          <label>Arquivos do projeto</label><input id="projectFiles" type="file" multiple><label>Ou selecione uma pasta inteira</label><input id="projectFolder" type="file" webkitdirectory directory multiple>
          <div id="fileInfo" class="fileinfo">ZIP, múltiplos arquivos ou pasta com subpastas. Para preservar permissões e links simbólicos Linux, prefira ZIP.</div><div class="progress"><div id="uploadProgress"></div></div>
          <label>Instrução</label><textarea id="message" rows="3" placeholder="Ex.: audite e corrija o XWT Linux, investigue kernel, rootfs, vídeo e controle…"></textarea>
          <div class="row"><select id="mode"><option value="agent">Agente</option><option value="chat">Chat · leitura</option><option value="resume">Retomar</option></select><select id="autonomy"><option value="auto">Auto · pode editar</option><option value="ask">Ask · somente plano</option><option value="safe">Safe · leitura</option></select></div>
          <label>Provedor</label><select id="provider"><option value="auto">Auto · provedores configurados</option><option value="nvidia">NVIDIA NIM</option><option value="claude">Anthropic Claude</option><option value="openai">OpenAI</option><option value="xai">xAI Grok</option></select>
          <label>ID do modelo (opcional)</label><input id="modelId" list="modelOptions" maxlength="160" placeholder="Ex.: nvidia/nemotron-3.5-lightning-30b-a3b">
          <datalist id="modelOptions"><option value="nvidia/nemotron-3-ultra-550b-a55b"><option value="nvidia/nemotron-3.5-lightning-30b-a3b"><option value="nvidia/nemotron-3.5-bolt-e4b"><option value="nvidia/nemotron-3.5-super-vl-120b-a12b"><option value="nvidia/nemotron-3-nano-30b-a3b"><option value="nvidia/nemotron-3-super-120b-a12b"><option value="z-ai/glm-5.3"><option value="z-ai/glm-5.3-flash"><option value="claude-fable-5"><option value="claude-opus-5"><option value="claude-sonnet-5"><option value="claude-opus-4-8"><option value="claude-sonnet-4-6"><option value="claude-haiku-4-5-20251001"><option value="gpt-6-astra"><option value="gpt-6.1-sol"><option value="gpt-6.1-terra"><option value="gpt-6-luna"><option value="grok-4.7"></datalist>
          <div class="muted">Os IDs preservam a configuração V16. A disponibilidade real depende do catálogo, da conta e da API de cada provedor.</div>
          <div class="checkrow"><input id="allowBuild" type="checkbox"><label for="allowBuild">Autorizo executar builds e testes. Scripts do projeto podem executar código no runner.</label></div>
          <label>Limite de ações</label><select id="maxActions"><option value="30">30 · econômico</option><option value="60" selected>60 · recomendado</option><option value="80">80 · extenso</option></select>
          <button class="primary" id="send" style="margin-top:11px">Enviar para a MEVA</button></form>
          <div id="status" class="status">Pronto.</div><div id="downloadArea"></div><div class="good">A MEVA separa análise, plano, implementação e validação. Builds não autorizados são marcados como NOT_RUN. Falha, limite ou teste ausente não pode ser apresentado como sucesso.</div>
          </div></section>
          <section id="view-convos" class="view"><div class="panel"><h2>Conversas</h2><div id="convoList" class="muted">Carregando…</div><button id="refreshConvos" style="margin-top:10px">Atualizar</button></div></section>
          <section id="view-files" class="view"><div class="panel"><h2>Arquivos do repositório MEVA</h2><div id="fileList" class="muted">Conecte-se.</div><button id="refreshFiles" style="margin-top:10px">Atualizar</button></div></section>
          <section id="view-settings" class="view"><div class="panel"><h2>Configurações</h2><label>Branch de trabalho</label><input id="branch"><p class="muted">Cadastre as chaves nos GitHub Secrets. Nunca coloque chaves de IA na interface.</p><p><a id="secretLink" class="link" href="#" target="_blank" rel="noopener">Abrir GitHub Secrets</a></p><button id="logout" style="background:#421d27">Desconectar</button></div></section>
          </main><nav><button data-view="chat">◉ Agente</button><button data-view="convos">▤ Conversas</button><button data-view="files">▣ Repo</button><button data-view="settings">⚙ Ajustes</button></nav>
          </div><script>
          (()=>{'use strict';
          const REPO_FULL='REPO_PLACEHOLDER',[owner,repo]=REPO_FULL.split('/'),$=id=>document.getElementById(id);
          const KEY='meva_v18_pat',CHAT='meva_v18_chat',WORKFLOW_NAME='MEVA CODE V18 — Linux Project Engineering Agent';
          const CHUNK=2*1024*1024,MAX_TOTAL=100*1024*1024,MAX_FILES=2000;
          let branch='main',cid='',busy=false,messages=[],isPrivate=false,workflowId=null,repoSizeBytes=0;
          const say=(s,k='')=>{$('status').textContent=s;$('status').className='status '+k},sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const repoPath=`/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
          function show(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.querySelectorAll('nav button').forEach(e=>e.classList.remove('active'));$('view-'+v).classList.add('active');const b=document.querySelector(`nav button[data-view="${v}"]`);if(b)b.classList.add('active')}
          document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));
          async function api(path,opt={}){const token=sessionStorage.getItem(KEY);if(!token)throw Error('Desconectado.');if(typeof path!=='string'||!path.startsWith(repoPath))throw Error('Caminho da API inválido.');const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),Number(opt.timeoutMs)||90000),request={...opt};delete request.timeoutMs;let r;try{r=await fetch('https://api.github.com'+path,{...request,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',...(request.body?{'Content-Type':'application/json'}:{}),...(request.headers||{})},signal:ctl.signal,cache:'no-store'})}catch(e){if(e.name==='AbortError')throw Error('Tempo esgotado ao acessar GitHub API.');throw Error('Falha de rede: '+(e.message||'conexão interrompida.'))}finally{clearTimeout(timer)}if(r.status===204)return null;const raw=await r.text();let d=null;try{d=raw?JSON.parse(raw):null}catch{}if(!r.ok)throw Error(`GitHub HTTP ${r.status}: ${String((d&&d.message)||raw||r.statusText).slice(0,220)}`);return d}
          async function apiRetry(path,opt={},max=4){let last;for(let i=0;i<max;i++){try{return await api(path,opt)}catch(e){last=e;const transient=/GitHub HTTP (408|429|500|502|503|504)/i.test(String(e.message));if(!transient||i+1>=max)throw e;await sleep(Math.min(10000,1000*2**i))}}throw last||Error('Falha na API GitHub.')}
          function decode64(v){const raw=atob(String(v||'').replace(/\s/g,''));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));return new TextDecoder('utf-8',{fatal:true}).decode(bytes)}
          function validBranch(v){return typeof v==='string'&&v.length<=240&&/^[A-Za-z0-9._/-]+$/.test(v)&&!v.startsWith('/')&&!v.endsWith('/')&&!v.includes('..')&&!v.includes('//')}
          async function resolveWorkflow(){const d=await api(`${repoPath}/actions/workflows?per_page=100`),w=(d.workflows||[]).find(x=>x.name===WORKFLOW_NAME&&x.state==='active');if(!w)throw Error('Workflow V18 não encontrado. Salve este arquivo em .github/workflows/MEVA-INSTALADOR.yml e execute install.');workflowId=w.id}
          function safeReleaseUrl(v){try{const u=new URL(v);return u.protocol==='https:'&&u.hostname==='github.com'&&u.pathname.startsWith('/'+owner+'/'+repo+'/releases/')?u.href:null}catch{return null}}
          function render(){const root=$('messages');root.replaceChildren();if(!messages.length){const d=document.createElement('div');d.className='muted';d.textContent='Envie arquivos, uma pasta, um ZIP ou descreva sua tarefa.';root.append(d);return}for(const m of messages){const d=document.createElement('div');d.className='bubble '+(m.role==='user'?'user':'assistant');d.textContent=(m.role==='user'?'VOCÊ: ':'MEVA: ')+(m.content||'');root.append(d)}root.scrollTop=root.scrollHeight}
          async function loadConversation(){if(!cid)return;const p=`${repoPath}/contents/meva-data/conversations/${encodeURIComponent(cid)}.json?ref=${encodeURIComponent($('branch').value||branch)}`;try{const d=await api(p),o=JSON.parse(decode64(d.content));messages=Array.isArray(o.messages)?o.messages.filter(m=>m&&['user','assistant'].includes(m.role)&&typeof m.content==='string').slice(-50):[];render();$('downloadArea').replaceChildren();const url=safeReleaseUrl(o.last_asset_url)||safeReleaseUrl(o.last_release);if(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.className='link';a.textContent='⬇ Abrir/baixar ZIP do projeto';$('downloadArea').append(a)}}catch(e){if(String(e.message).includes('HTTP 404')){messages=[];render();$('downloadArea').replaceChildren();return}throw e}}
          async function connect(){const info=await api(repoPath);if(info.name.toLowerCase()!==repo.toLowerCase()||info.owner.login.toLowerCase()!==owner.toLowerCase())throw Error('Repositório divergente.');isPrivate=Boolean(info.private);repoSizeBytes=Math.max(0,Number(info.size||0)*1024);branch=info.default_branch||'main';$('branch').value=branch;$('repoInfo').textContent=owner+'/'+repo+' · '+branch+' · '+(isPrivate?'Privado':'Público');$('secretLink').href=`https://github.com/${owner}/${repo}/settings/secrets/actions`;await resolveWorkflow();const q=new URLSearchParams(location.search).get('conversation'),stored=localStorage.getItem(CHAT);cid=q&&/^[A-Za-z0-9_-]{8,80}$/.test(q)?q:(stored&&/^[A-Za-z0-9_-]{8,80}$/.test(stored)?stored:crypto.randomUUID());localStorage.setItem(CHAT,cid);await loadConversation();$('connection').textContent='Conectado';show('chat');say('Conectado ao GitHub.','ok')}
          $('loginForm').addEventListener('submit',async e=>{e.preventDefault();const t=$('token').value.trim();if(!t)return;sessionStorage.setItem(KEY,t);$('loginStatus').textContent='Verificando token, repositório e workflow…';try{await connect();$('token').value='';$('loginStatus').textContent=''}catch(x){sessionStorage.removeItem(KEY);$('connection').textContent='Falha';$('loginStatus').textContent=x.message}});
          function selectedFiles(){const all=[...$('projectFiles').files,...$('projectFolder').files],seen=new Set(),out=[];for(const f of all){const p=(f.webkitRelativePath||f.name).normalize('NFC');if(!p||p.startsWith('/')||p.includes('\\')||p.split('/').some(x=>!x||x==='.'||x==='..'))throw Error('Caminho inválido no upload: '+p);if(seen.has(p))throw Error('Arquivo duplicado: '+p);seen.add(p);const low=p.toLowerCase().split('/');if(low.some(x=>['.git','.meva-cache','node_modules','.venv','venv','__pycache__','.pytest_cache','.env','.env.local','.env.production','.ssh','id_rsa','id_ed25519','credentials.json','authorized_keys','.ds_store','thumbs.db'].includes(x))||/\.(pem|p12|pfx|key|keystore)$/.test(p.toLowerCase()))continue;out.push({file:f,path:p})}return out}
          function toBase64(buffer){const b=new Uint8Array(buffer);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode(...b.subarray(i,i+0x8000));return btoa(s)}
          async function uploadProject(files){if(!files.length)return null;if(files.length>MAX_FILES)throw Error('Limite de '+MAX_FILES+' arquivos por envio.');const total=files.reduce((n,x)=>n+x.file.size,0);if(total<=0||total>MAX_TOTAL||repoSizeBytes+total>950*1024*1024)throw Error('Upload vazio, acima de 100 MiB ou acima do orçamento de 950 MiB do repositório.');if(!isPrivate&&!confirm('Este repositório é público. Os arquivos enviados ficarão visíveis durante o processamento. Continuar?'))throw Error('Upload cancelado.');const baseBranch=$('branch').value.trim()||branch;if(!validBranch(baseBranch))throw Error('Branch-base inválida.');const refs=await apiRetry(`${repoPath}/git/matching-refs/heads/${baseBranch.split('/').map(encodeURIComponent).join('/')}`),base=Array.isArray(refs)?refs.find(x=>x.ref==='refs/heads/'+baseBranch):null;if(!base?.object?.sha)throw Error('Branch-base não encontrada: '+baseBranch);const c=await apiRetry(`${repoPath}/git/commits/${base.object.sha}`);if(!c?.tree?.sha)throw Error('Árvore Git da branch-base indisponível.');const uploadId=Date.now().toString(36)+'-'+crypto.randomUUID().replace(/-/g,'').slice(0,12),uploadRef='meva-upload-'+uploadId,entries=[],manifestFiles=[];let done=0,chunkIndex=0;for(const item of files){const f=item.file,parts=[];for(let offset=0;offset<f.size||(!f.size&&offset===0);offset+=CHUNK){const end=Math.min(f.size,offset+CHUNK),buf=await f.slice(offset,end).arrayBuffer(),sha256=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',buf)),b=>b.toString(16).padStart(2,'0')).join(''),blob=await apiRetry(`${repoPath}/git/blobs`,{method:'POST',timeoutMs:180000,body:JSON.stringify({content:toBase64(buf),encoding:'base64'})});if(!blob?.sha)throw Error('GitHub não retornou blob de '+item.path);const rel='part-'+String(chunkIndex++).padStart(6,'0')+'.bin',path='.meva-upload/'+uploadId+'/'+rel;entries.push({path,mode:'100644',type:'blob',sha:blob.sha});parts.push({blob_sha:blob.sha,size:buf.byteLength,sha256,path});