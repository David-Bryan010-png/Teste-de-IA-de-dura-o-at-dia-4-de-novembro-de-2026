          SUMMARY_SYSTEM = (
              'Você resume o histórico de um agente de engenharia de software para que ele continue o trabalho sem perder contexto. '
              'Escreva em português, objetivo e factual, com estas seções: OBJETIVO; DECISÕES TOMADAS; ARQUIVOS LIDOS/EDITADOS (com caminhos); '
              'COMANDOS/TESTES EXECUTADOS E RESULTADOS (inclua exit codes e erros exatos); PROBLEMAS EM ABERTO; PRÓXIMOS PASSOS. '
              'Não invente nada que não esteja no histórico. Não inclua segredos.'
          )


          class ContextManager:
