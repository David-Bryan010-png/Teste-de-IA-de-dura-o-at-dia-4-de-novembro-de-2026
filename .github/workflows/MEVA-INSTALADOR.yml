                              add(name, 'FAIL', 'Esperado ELF32 big-endian; e_ident class/data divergentes.')
                              continue
                          if len(head) < 52:
                              add(name, 'FAIL', 'Cabeçalho ELF32 incompleto.')
                              continue
                          etype, machine = struct.unpack('>HH', head[16:20])
                          version = struct.unpack('>I', head[20:24])[0]
                          entry, phoff = struct.unpack('>II', head[24:32])
                          ehsize, phentsize, phnum = struct.unpack('>HHH', head[40:46])
                          if machine != 20:
                              add(name, 'FAIL', 'e_machine=' + str(machine) + '; esperado EM_PPC (20).')
                          elif etype not in (2, 3):
                              add(name, 'FAIL', 'e_type=' + str(etype) + '; esperado ELF executável (ET_EXEC/ET_DYN), não objeto relocável.')
                          elif version != 1 or ehsize < 52:
                              add(name, 'FAIL', 'Versão/tamanho ELF inconsistente.')
                          elif entry == 0:
                              add(name, 'FAIL', 'ELF PowerPC big-endian sem entry point.')
                          elif phnum and (phentsize < 32 or phoff + phentsize * phnum > size):
                              add(name, 'FAIL', 'Tabela de program headers inválida ou truncada.')
                          else:
                              add(name, 'PASS', 'ELF32 big-endian EM_PPC; tipo=' + str(etype) + '; entry=0x' + format(entry, 'x')
                                  + '; program_headers=' + str(phnum) + '. Não prova boot no Xbox 360.')
