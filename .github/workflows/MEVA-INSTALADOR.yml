              """Serializa o resultado de uma ferramenta para o modelo, com cortes que preservam o fim."""
              if not isinstance(result, dict):
                  text, _ = head_tail(json.dumps(result, ensure_ascii=False, default=str), RESULT_TOTAL_LIMIT)
                  return text
              out = {}
              for k, v in result.items():
                  if isinstance(v, str):
                      lim = RESULT_FIELD_LIMITS.get(k, 6000)
                      cut, did = head_tail(v, lim, head_ratio=0.2 if k == 'output' else 0.7)
                      out[k] = cut
                      if did:
                          out[k + '_truncated'] = True
                  else:
                      out[k] = v
