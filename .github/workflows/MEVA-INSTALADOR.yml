                      raise RuntimeError('Commit temporário sem árvore raiz válida.')
                  root = gh.get('/git/trees/' + root_sha)
                  if root.get('truncated'):
                      raise RuntimeError('Árvore raiz truncada pelo GitHub.')
                  up = next((x for x in root.get('tree', []) if x.get('path') == '.meva-upload' and x.get('type') == 'tree'), None)
                  if not up:
                      raise RuntimeError('Diretório .meva-upload não pertence ao commit.')
                  up_tree = gh.get('/git/trees/' + up['sha'])
                  if up_tree.get('truncated'):
                      raise RuntimeError('Árvore de uploads truncada pelo GitHub.')
                  uid_entry = next((x for x in up_tree.get('tree', []) if x.get('path') == meta['upload_id'] and x.get('type') == 'tree'), None)
                  if not uid_entry:
                      raise RuntimeError('Pasta do upload_id não pertence ao commit.')
                  leaf = gh.get('/git/trees/' + uid_entry['sha'])
                  if leaf.get('truncated'):
                      raise RuntimeError('Árvore de blocos truncada pelo GitHub.')
                  committed = {x.get('path'): x.get('sha') for x in leaf.get('tree', []) if x.get('type') == 'blob'}
                  if committed.get('manifest.json') != meta['manifest_blob_sha']:
                      raise RuntimeError('Manifesto não corresponde ao blob registrado na árvore do commit.')
                  work = self.cfg.work
                  stage = work / 'staging'
                  tmp = work / 'staging.tmp'
                  for p in (stage, tmp):
                      if p.exists():
                          shutil.rmtree(p)
                  tmp.mkdir(parents=True, exist_ok=True)
                  total = 0
                  seen_files: set[str] = set()
                  seen_chunks: set[str] = set()
                  prefix = '.meva-upload/' + meta['upload_id'] + '/'
                  try:
                      for item in files:
                          if not isinstance(item, dict):
                              raise RuntimeError('Entrada de arquivo inválida no manifesto.')
                          rel = valid_rel(item.get('path'))
                          name = rel.as_posix()
                          if name in seen_files:
                              raise RuntimeError('Caminho duplicado no manifesto: ' + name)
                          seen_files.add(name)
                          size = item.get('size')
                          chunks = item.get('chunks')
                          if isinstance(size, bool) or not isinstance(size, int) or size < 0 or size > MAX_INPUT:
                              raise RuntimeError('Tamanho de arquivo inválido: ' + name)
                          if not isinstance(chunks, list) or not chunks:
                              raise RuntimeError('Blocos ausentes: ' + name)
                          dest = tmp.joinpath(*rel.parts)
                          dest.parent.mkdir(parents=True, exist_ok=True)
