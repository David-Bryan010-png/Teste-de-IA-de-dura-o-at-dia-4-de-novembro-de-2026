          def paired(messages):
              """Todo tool_use tem seu tool_result na mensagem seguinte; nenhum tool_result órfão."""
              for i, m in enumerate(messages):
                  if isinstance(m['content'], list):
                      uses = {b['id'] for b in m['content'] if b.get('type') == 'tool_use'}
                      res = {b['tool_use_id'] for b in m['content'] if b.get('type') == 'tool_result'}
                      if uses:
                          nxt = messages[i + 1]['content'] if i + 1 < len(messages) else []
                          got = {b['tool_use_id'] for b in nxt if isinstance(nxt, list) and b.get('type') == 'tool_result'}
                          if not uses <= got:
                              return False
                      if res:
                          prev = messages[i - 1]['content'] if i else []
                          had = {b['id'] for b in prev if isinstance(prev, list) and b.get('type') == 'tool_use'}
                          if not res <= had:
                              return False
              return True


          def long_history(n=30, size=6000):
              msgs = [{'role': 'user', 'content': 'TAREFA ORIGINAL'}]
              for i in range(n):
                  msgs.append({'role': 'assistant', 'content': [{'type': 'text', 'text': f'passo {i}'}, {'type': 'tool_use', 'id': f't{i}', 'name': 'read_file', 'input': {'path': f'f{i}'}}]})
                  msgs.append({'role': 'user', 'content': [{'type': 'tool_result', 'tool_use_id': f't{i}', 'content': 'x' * size, 'is_error': False}]})
              return msgs


