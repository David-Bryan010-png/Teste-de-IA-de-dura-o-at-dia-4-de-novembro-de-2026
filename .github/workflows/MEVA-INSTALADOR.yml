        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar .NET
        if: ${{ inputs.mode == 'agent' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ========================================================
      # ANEXOS
      # ========================================================

      - name: Baixar e validar anexos
        id: attachments
        if: ${{ inputs.mode == 'agent' && contains(inputs.message, 'MEVA_ATTACHMENT_MANIFEST:') }}
        env:
          MEVA_MESSAGE: ${{ inputs.message }}
          CID: ${{ inputs.conversation_id }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          message = os.environ.get("MEVA_MESSAGE", "")
          repo = os.environ["GH_REPOSITORY"]
          cid = os.environ.get("CID", "")

          marker = "MEVA_ATTACHMENT_MANIFEST: "

          manifests = [
              line[len(marker):]
              for line in message.splitlines()
              if line.startswith(marker)
          ]

          if len(manifests) != 1:
              raise SystemExit("Manifesto de anexos ausente ou duplicado.")

          items = json.loads(manifests[0])

          if not isinstance(items, list) or not 1 <= len(items) <= 5:
              raise SystemExit("Esperados de 1 a 5 anexos.")

          root = Path("meva-inbox") / cid
          root.mkdir(parents=True, exist_ok=True)

          total = 0
          source_tag = None

          for item in items:
              if not isinstance(item, dict):
                  raise SystemExit("Item de anexo inválido.")

              name = item.get("name", "")
              url = item.get("url", "")
              expected = item.get("size")

              if not isinstance(name, str) or not re.fullmatch(
                  r"[A-Za-z0-9._-]{1,100}", name
              ):
                  raise SystemExit("Nome de arquivo inválido.")

              if not isinstance(expected, int) or expected <= 0:
                  raise SystemExit("Tamanho declarado inválido.")

              if expected > 200 * 1024 * 1024:
                  raise SystemExit("Arquivo acima de 200 MB.")

              total += expected

              if total > 500 * 1024 * 1024:
                  raise SystemExit("Total dos anexos acima de 500 MB.")

              parsed = urllib.parse.urlparse(url)

              prefix = f"/{repo}/releases/download/"

              if (
                  parsed.scheme != "https"
                  or parsed.netloc != "github.com"
                  or not parsed.path.startswith(prefix)
              ):
                  raise SystemExit("URL fora da Release deste repositório.")

              parts = parsed.path.split("/")
              tag = urllib.parse.unquote(parts[5]) if len(parts) > 6 else ""

              if not tag.startswith(f"meva-upload-{cid}-"):
                  raise SystemExit("Tag de anexo não corresponde à conversa.")

              if source_tag is not None and source_tag != tag:
                  raise SystemExit("Anexos de Releases diferentes.")

              source_tag = tag

              target = root / name
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "MEVA-GitHub-Action"}
              )

              digest = hashlib.sha256()
              downloaded = 0

              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      with target.open("wb") as output:
                          while True:
                              chunk = response.read(1024 * 1024)

                              if not chunk:
                                  break

                              downloaded += len(chunk)

                              if downloaded > 200 * 1024 * 1024:
                                  raise ValueError("Limite de 200 MB excedido.")

                              digest.update(chunk)
                              output.write(chunk)

              except Exception:
                  target.unlink(missing_ok=True)
                  raise

              if downloaded != expected:
                  target.unlink(missing_ok=True)
                  raise SystemExit(
                      f"Tamanho divergente em {name}: "
                      f"{downloaded} recebido, {expected} esperado."
                  )

              print(
                  f"Anexo recebido: {name} · {downloaded} bytes · "
                  f"SHA256 {digest.hexdigest()}"
              )

          if not source_tag:
              raise SystemExit("Release de origem não identificada.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"source_tag={source_tag}\n")
          PY

      # ========================================================
      # EXECUÇÃO DO AGENTE E FERRAMENTAS
      # ========================================================

      - name: Executar MEVA com ferramentas
        env:
          MEVA_MODE: ${{ inputs.mode }}
          MEVA_MESSAGE: ${{ inputs.message }}
          MEVA_CONVERSATION_ID: ${{ inputs.conversation_id }}
          MEVA_MAX_ACTIONS: ${{ inputs.max_actions }}
          MODEL_ID: ${{ env.MODEL_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > /tmp/meva_agent.py <<'PY'
          import html
          import ipaddress
          import json
          import os
          import re
          import shutil
          import socket
          import stat
          import subprocess
          import sys
          import time
          import urllib.parse
          import urllib.request
          import zipfile

          from html.parser import HTMLParser
          from pathlib import Path, PurePosixPath
          from urllib.error import HTTPError, URLError
          from urllib.request import HTTPRedirectHandler, build_opener

          ROOT = Path.cwd().resolve()
          MODE = os.environ.get("MEVA_MODE", "chat")
          RAW_MESSAGE = os.environ.get("MEVA_MESSAGE", "")
          CID = (
              os.environ.get("MEVA_CONVERSATION_ID", "")
              or f"run-{os.environ.get('GITHUB_RUN_ID', 'unknown')}"
          )
          MAX_ACTIONS = max(
