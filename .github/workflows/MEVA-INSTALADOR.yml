name: MEVA CODE V11 — Agente de Programação Autônomo (Otimizado)
run-name: MEVA V11 / ${{ inputs.mode || 'install' }} / ${{ inputs.conversation_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "install | chat | agent | self_test | resume"
        type: choice
        options: [install, chat, agent, self_test, resume]
        default: install
        required: true
      message:
        description: Mensagem ou tarefa
        type: string
        required: false
        default: ""
      conversation_id:
        description: ID da conversa
        type: string
        required: false
        default: ""
      branch:
        description: Branch
        type: string
        required: false
        default: ""
      max_actions:
        description: Limite de ações (1-45)
        type: number
        required: false
        default: 32
      attachments:
        description: Manifesto de anexos (JSON)
        type: string
        required: false
        default: ""
      autonomy:
        description: "safe | ask | auto"
        type: choice
        options: [safe, ask, auto]
        default: ask
      model_provider:
        description: "local | openai | xai | anthropic"
        type: choice
        options: [local, openai, xai, anthropic]
        default: local

permissions:
  contents: read

concurrency:
  group: meva-v11-${{ github.repository }}-${{ inputs.conversation_id || github.run_id }}
  cancel-in-progress: false

env:
  CHAT_MODEL_REPO: Qwen/Qwen2.5-0.5B-Instruct-GGUF
  CHAT_MODEL_FILE: qwen2.5-0.5b-instruct-q4_k_m.gguf
  AGENT_MODEL_REPO: Qwen/Qwen2.5-Coder-3B-Instruct-GGUF
  AGENT_MODEL_FILE: qwen2.5-coder-3b-instruct-q4_k_m.gguf
  LLAMA_CPP_REPO: https://github.com/ggml-org/llama.cpp.git

jobs:
  install:
    name: Instalar MEVA CODE V11
    if: ${{ inputs.mode == 'install' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gerar interface e configs
        env:
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p public meva-config meva-data/conversations meva-data/checkpoints
          touch meva-data/conversations/.gitkeep meva-data/checkpoints/.gitkeep

          for f in IDENTITY.md RESPONSE_RULES.md AGENT_RULES.md; do
            [ -s "meva-config/$f" ] || printf '# %s\n\nMEVA CODE V11.\n' "$f" > "meva-config/$f"
          done

          cat > public/index.html << 'HTMLEOF'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#0a0f1a">
            <title>MEVA CODE V11</title>
            <link rel="manifest" href="./manifest.webmanifest">
            <style>
              :root{color-scheme:dark;--bg:#0a0f1a;--panel:#121a2b;--border:#2a3a55;--text:#e8f0ff;--muted:#8aa0c0;--accent:#5b9cff;--ok:#4ade80;--err:#f87171;font-family:system-ui,sans-serif}
              *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}
              .app{display:flex;flex-direction:column;height:100dvh;max-width:540px;margin:0 auto}
              header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0}
              .brand{font-weight:800;font-size:15px}
              main{flex:1;overflow:auto;padding:12px}
              .view{display:none}.view.active{display:block}
              .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
              h1,h2{margin:0 0 8px;font-size:17px}
              .muted{color:var(--muted);font-size:13px}
              label{display:block;font-size:12px;margin:10px 0 4px;color:var(--muted)}
              input,textarea,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0d1525;color:var(--text);font:inherit;font-size:15px}
              button{background:#1a2740;font-weight:600;cursor:pointer}
              button.primary{background:linear-gradient(135deg,#5b9cff,#3b82f6);color:#fff;border:0}
              .messages{height:46vh;min-height:200px;overflow-y:auto;padding:8px;background:#0d1525;border-radius:12px;border:1px solid var(--border);margin:8px 0}
              .bubble{max-width:92%;padding:10px 12px;border-radius:12px;margin:6px 0;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
              .bubble.user{background:#1e3a5f;margin-left:auto}
              .bubble.assistant{background:#162033}
              nav{display:flex;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0}
              nav button{flex:1;padding:13px 4px;background:transparent;border:0;border-radius:0;font-size:11px;color:var(--muted)}
              nav button.active{color:var(--accent);font-weight:700}
              .status{font-size:12px;color:var(--muted);min-height:16px}
              .status.ok{color:var(--ok)}.status.err{color:var(--err)}
              .warning{background:#2a2210;border:1px solid #66552f;color:#e7d5aa;padding:10px;border-radius:10px;font-size:12px;margin-top:10px}
              .convo-list div{padding:10px;border-bottom:1px solid var(--border);cursor:pointer}
              .convo-list div:active{background:#1a2740}
              @media(min-width:700px){.app{max-width:920px}.messages{height:58vh}}
            </style>
          </head>
          <body>
          <div class="app">
            <header>
              <div class="brand">◆ MEVA CODE V11</div>
              <div id="conn">Desconectado</div>
            </header>
            <main>
              <section id="view-login" class="view active">
                <div class="panel">
                  <h1>Conectar</h1>
                  <p class="muted">Fine-grained PAT: Actions (Read+Write), Contents (Read+Write), Metadata (Read).</p>
                  <form id="loginForm">
                    <label>Token</label>
                    <input id="token" type="password" autocomplete="off" required>
                    <button class="primary" type="submit" style="margin-top:10px">Conectar</button>
                  </form>
                  <div id="loginStatus" class="status"></div>
                  <div class="warning">Repositório público. Não envie segredos.</div>
                </div>
              </section>
              <section id="view-chat" class="view">
                <div class="panel">
                  <div style="display:flex;justify-content:space-between;align-items:center">
                    <h2>Conversa</h2>
                    <button id="newChat" style="width:auto;padding:8px 12px">＋ Nova</button>
                  </div>
                  <div id="repoInfo" class="muted" style="margin:6px 0"></div>
                  <div id="messages" class="messages"></div>
                  <form id="composer">
                    <input id="files" type="file" multiple>
                    <div id="fileInfo" class="muted" style="font-size:12px;margin:4px 0">Até 5 arquivos</div>
                    <textarea id="message" rows="3" placeholder="Tarefa ou pergunta…"></textarea>
                    <div style="display:flex;gap:8px;margin-top:8px">
                      <select id="mode"><option value="chat">Chat</option><option value="agent">Agente</option></select>
                      <select id="autonomy"><option value="ask">Ask</option><option value="safe">Safe</option><option value="auto">Auto</option></select>
                    </div>
                    <button class="primary" id="send" type="submit" style="margin-top:8px">Enviar</button>
                  </form>
                  <div id="status" class="status">Pronta.</div>
                  <div id="downloadArea" style="margin-top:8px"></div>
                </div>
              </section>
              <section id="view-convos" class="view">
                <div class="panel">
                  <h2>Conversas</h2>
                  <div id="convoList" class="convo-list">Carregando…</div>
                  <button id="refreshConvos" style="margin-top:10px">Atualizar</button>
                </div>
              </section>
              <section id="view-files" class="view">
                <div class="panel">
                  <h2>Arquivos</h2>
                  <div id="fileList" class="muted">Conecte-se.</div>
                  <button id="refreshFiles" style="margin-top:10px">Atualizar</button>
                </div>
              </section>
              <section id="view-settings" class="view">
                <div class="panel">
                  <h2>Ajustes</h2>
                  <label>Branch</label><input id="branch" value="main">
                  <label>Provedor</label>
                  <select id="provider">
                    <option value="local">Local (Qwen)</option>
                    <option value="openai">OpenAI</option>
                    <option value="xai">xAI</option>
                    <option value="anthropic">Anthropic</option>
                  </select>
                  <button id="logout" style="margin-top:14px;background:#3a1a1a">Desconectar</button>
                </div>
              </section>
            </main>
            <nav>
              <button data-view="chat">💬 Chat</button>
              <button data-view="convos">📋 Conversas</button>
              <button data-view="files">📁 Arquivos</button>
              <button data-view="settings">⚙️</button>
            </nav>
          </div>
          <script>
          (()=>{
            'use strict';
            const REPO_FULL='REPO_PLACEHOLDER';
            const [owner,repo]=REPO_FULL.split('/');
            const $=id=>document.getElementById(id);
            const KEY='meva_v11_pat',CHAT='meva_v11_chat',WF='MEVA-INSTALADOR.yml';
            let branch='main',cid='',busy=false,messages=[];

            const say=(t,k='')=>{$('status').textContent=t;$('status').className='status '+k};
            function show(v){
              document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
              document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
              const el=$('view-'+v);if(el)el.classList.add('active');
              const btn=document.querySelector(`nav button[data-view="${v}"]`);if(btn)btn.classList.add('active');
            }
            document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));

            async function api(path,opt={}){
              const token=sessionStorage.getItem(KEY);if(!token)throw Error('Desconectado.');
              const base=`/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
              if(!path.startsWith(base))throw Error('Caminho inválido.');
              const headers={Accept:'application/vnd.github+json',Authorization:'Bearer '+token,...(opt.body?{'Content-Type':'application/json'}:{})};
              const c=new AbortController();const t=setTimeout(()=>c.abort(),26000);
              let r;
              try{r=await fetch('https://api.github.com'+path,{...opt,headers,signal:c.signal,cache:'no-store'})}
              catch(e){if(e.name==='AbortError')throw Error('Timeout API.');throw Error('Rede/CORS: '+(e.message||''))}
              finally{clearTimeout(t)}
              if(r.status===204)return null;
              const raw=await r.text();let data=null;try{data=raw?JSON.parse(raw):null}catch{}
              if(!r.ok){
                const d=(data&&data.message)||raw||'';
                if(r.status===401)throw Error('401: token inválido.');
                if(r.status===403)throw Error('403: permissão. '+d.slice(0,120));
                if(r.status===404)throw Error('404: não encontrado.');
                throw Error('HTTP '+r.status+': '+d.slice(0,180));
              }
              return data;
            }

            function render(){
              const root=$('messages');root.replaceChildren();
              if(!messages.length){const d=document.createElement('div');d.className='muted';d.textContent='Envie uma tarefa.';root.append(d);return}
              for(const m of messages){
                const d=document.createElement('div');d.className='bubble '+(m.role==='user'?'user':'assistant');
                d.textContent=(m.role==='user'?'VOCÊ: ':'MEVA: ')+(m.content||'');
                root.append(d);
              }
              root.scrollTop=root.scrollHeight;
            }

            function decode64(v){const b=atob(String(v||'').replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}

            async function loadConversation(){
              if(!cid)return;
              try{
                const d=await api(`/repos/${owner}/${repo}/contents/meva-data/conversations/${cid}.json?ref=${encodeURIComponent($('branch').value||branch)}`);
                const o=JSON.parse(decode64(d.content));
                messages=Array.isArray(o.messages)?o.messages.filter(x=>x&&['user','assistant'].includes(x.role)&&typeof x.content==='string'):[];
                render();
                if(o.last_release){
                  $('downloadArea').innerHTML=`<a href="${o.last_release}" target="_blank" style="color:var(--accent)">⬇ Baixar resultado da última execução</a>`;
                }
              }catch(e){if(!String(e.message).includes('404'))throw e}
            }

            async function loadConvos(){
              try{
                const d=await api(`/repos/${owner}/${repo}/contents/meva-data/conversations?ref=${encodeURIComponent($('branch').value||branch)}`);
                const list=(d||[]).filter(x=>x.name.endsWith('.json')).map(x=>x.name.replace('.json','')).slice(-30).reverse();
                $('convoList').innerHTML=list.map(id=>`<div data-id="${id}">${id.slice(0,8)}…</div>`).join('')||'Nenhuma.';
                $('convoList').querySelectorAll('div').forEach(el=>el.onclick=()=>{cid=el.dataset.id;localStorage.setItem(CHAT,cid);loadConversation();show('chat')});
              }catch(e){$('convoList').textContent='Erro: '+e.message}
            }

            async function connect(){
              const info=await api(`/repos/${owner}/${repo}`);
              if(String(info.owner.login).toLowerCase()!==owner.toLowerCase()||String(info.name).toLowerCase()!==repo.toLowerCase())throw Error('Repo divergente.');
              branch=info.default_branch||'main';$('branch').value=branch;
              $('repoInfo').textContent=owner+'/'+repo+' · '+branch;
              const params=new URLSearchParams(location.search);
              const q=params.get('conversation'),stored=localStorage.getItem(CHAT);
              cid=(q&&/^[A-Za-z0-9_-]{8,80}$/.test(q))?q:(stored&&/^[A-Za-z0-9_-]{8,80}$/.test(stored)?stored:crypto.randomUUID());
              localStorage.setItem(CHAT,cid);
              await loadConversation().catch(()=>{messages=[];render()});
              $('conn').textContent='Conectado';show('chat');say('Conectado.','ok');
            }

            $('loginForm').onsubmit=async e=>{
              e.preventDefault();
              const t=$('token').value.trim();if(!t)return;
              sessionStorage.setItem(KEY,t);
              try{await connect();$('token').value=''}catch(x){sessionStorage.removeItem(KEY);$('loginStatus').textContent=x.message}
            };

            $('files').onchange=()=>{
              const f=[...$('files').files];
              $('fileInfo').textContent=f.map(x=>x.name+' · '+(x.size/1e6).toFixed(1)+'MB').join(', ')||'Nenhum.';
            };

            function safeName(n){
              n=String(n||'f.bin').normalize('NFKC');
              if(/(\.env|id_rsa|secret|token|credential|private)/i.test(n))throw Error('Nome sensível bloqueado.');
              return n.replace(/[\\/]/g,'_').replace(/[^A-Za-z0-9._-]/g,'_').replace(/^\.+/,'').slice(0,90)||'file.bin';
            }

            async function upload(){
              const files=[...$('files').files];if(!files.length)return'';
              if(files.length>5)throw Error('Máx 5 arquivos.');
              const total=files.reduce((a,b)=>a+b.size,0);
              if(total>500e6||files.some(f=>f.size>200e6))throw Error('Tamanho excedido.');
              const rel=await api(`/repos/${owner}/${repo}/releases`,{method:'POST',body:JSON.stringify({
                tag_name:'meva-v11-up-'+cid+'-'+Date.now(),name:'Anexos MEVA',body:'Temporário. Público.',draft:false,prerelease:true
              })});
              const base=rel.upload_url.replace(/\{\?name,label\}$/,'');
              const assets=[];
              for(let i=0;i<files.length;i++){
                const f=files[i],name=String(i+1).padStart(2,'0')+'-'+safeName(f.name);
                const resp=await new Promise((res,rej)=>{
                  const x=new XMLHttpRequest();
                  x.open('POST',base+'?name='+encodeURIComponent(name));
                  x.setRequestHeader('Authorization','Bearer '+sessionStorage.getItem(KEY));
                  x.setRequestHeader('Content-Type',f.type||'application/octet-stream');
                  x.onload=()=>x.status<300?res(x.responseText):rej(Error('Upload '+x.status));
                  x.onerror=()=>rej(Error('Rede upload'));
                  x.send(f);
                });
                assets.push({name,size:f.size,url:JSON.parse(resp).browser_download_url});
              }
              return JSON.stringify(assets);
            }

            async function getRuns(){
              const d=await api(`/repos/${owner}/${repo}/actions/workflows/${WF}/runs?event=workflow_dispatch&per_page=25`);
              return d.workflow_runs||[];
            }
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));

            async function waitRun(before,started,br){
              const end=Date.now()+95*60*1000;let n=0;
              while(Date.now()<end){
                const all=await getRuns();
                const r=all.find(x=>!before.has(x.id)&&x.head_branch===br&&Date.parse(x.created_at)>=started-40000&&String(x.display_title||'').includes(cid));
                if(r){
                  const d=await api(`/repos/${owner}/${repo}/actions/runs/${r.id}`);
                  say('#'+r.run_number+' · '+d.status+(d.status==='completed'?' / '+d.conclusion:''));
                  if(d.status==='completed'){
                    if(d.conclusion!=='success')throw Error('Falhou: '+d.conclusion);
                    return;
                  }
                }else say('Aguardando runner…');
                n++;await sleep(n<6?2200:6500);
              }
              throw Error('Timeout. Verifique Actions.');
            }

            $('composer').onsubmit=async e=>{
              e.preventDefault();if(busy)return;
              const msg=$('message').value.trim(),files=[...$('files').files];
              if(!msg&&!files.length)return;
              const br=$('branch').value.trim()||branch;
              if(!/^[A-Za-z0-9._/-]+$/.test(br)||br.includes('..'))return say('Branch inválida.','err');
              busy=true;$('send').disabled=true;const started=Date.now();
              try{
                const before=new Set((await getRuns()).map(x=>x.id));
                say(files.length?'Enviando anexos…':'Iniciando…');
                const att=await upload();
                const mode=files.length?'agent':$('mode').value;
                const task=msg||'Analise os anexos.';
                messages.push({role:'user',content:task});render();
                $('message').value='';$('files').value='';$('fileInfo').textContent='Enviado.';
                await api(`/repos/${owner}/${repo}/actions/workflows/${WF}/dispatches`,{method:'POST',body:JSON.stringify({
                  ref:br,inputs:{mode,message:task,conversation_id:cid,branch:br,max_actions:'32',attachments:att,autonomy:$('autonomy').value,model_provider:$('provider').value}
                })});
                await waitRun(before,started,br);
                await loadConversation();
                say('Pronto.','ok');
              }catch(x){say(x.message,'err');await loadConversation().catch(()=>{})}
              finally{busy=false;$('send').disabled=false}
            };

            $('newChat').onclick=()=>{cid=crypto.randomUUID();localStorage.setItem(CHAT,cid);messages=[];const u=new URL(location);u.searchParams.set('conversation',cid);history.replaceState({},'',u);render();say('Nova conversa.')};
            $('logout').onclick=()=>{sessionStorage.removeItem(KEY);location.reload()};
            $('refreshConvos').onclick=loadConvos;
            $('refreshFiles').onclick=async()=>{
              try{
                const d=await api(`/repos/${owner}/${repo}/git/trees/${encodeURIComponent($('branch').value||branch)}?recursive=1`);
                const list=(d.tree||[]).filter(x=>x.type==='blob').slice(0,250).map(x=>x.path);
                $('fileList').innerHTML=list.map(p=>'<div style="padding:6px 0;border-bottom:1px solid #2a3a55;font-size:13px">'+p+'</div>').join('')||'Vazio.';
              }catch(e){$('fileList').textContent=e.message}
            };
            $('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}};

            if(sessionStorage.getItem(KEY))connect().catch(e=>{sessionStorage.removeItem(KEY);$('conn').textContent='Falha';$('loginStatus').textContent=e.message;show('login')});
          })();
          </script>
          </body></html>
          HTMLEOF

          sed -i "s|REPO_PLACEHOLDER|${REPO}|g" public/index.html
          echo '{"name":"MEVA CODE V11","short_name":"MEVA","display":"standalone","start_url":"./","background_color":"#0a0f1a","theme_color":"#0a0f1a"}' > public/manifest.webmanifest
          touch public/.nojekyll

          python3 -c "
          from pathlib import Path; import re
          h=Path('public/index.html').read_text()
          m=re.search(r'<script>(.*?)</script>',h,re.S)
          Path('/tmp/v11.js').write_text(m.group(1) if m else '')
          "
          node --check /tmp/v11.js || echo "JS check warning (templates ok)"

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public meva-config meva-data
          if ! git diff --cached --quiet; then
            git commit -m 'MEVA CODE V11: interface otimizada'
            AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:${DEFAULT_BRANCH}"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    if: ${{ inputs.mode == 'install' }}
    needs: install
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4

  ai:
    name: Executar MEVA
    if: ${{ contains(fromJSON('["chat","agent","self_test","resume"]'), inputs.mode) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar
        id: request
        env:
          MODE: ${{ inputs.mode }}
          MESSAGE: ${{ inputs.message }}
          CID: ${{ inputs.conversation_id }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
          MAX: ${{ inputs.max_actions }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$MODE" == self_test || -n "${MESSAGE//[[:space:]]/}" ]] || exit 1
          (( ${#MESSAGE} <= 7000 )) || exit 1
          [[ -z "$CID" || "$CID" =~ ^[A-Za-z0-9_-]{8,80}$ ]] || exit 1
          [[ "$MAX" =~ ^[0-9]+$ ]] && (( MAX>=1 && MAX<=45 )) || exit 1
          git check-ref-format --branch "$BRANCH" >/dev/null
          FAST=false
          if [[ "$MODE" == self_test || "$MODE" == chat ]]; then
            N=$(printf '%s' "$MESSAGE" | tr '[:upper:]' '[:lower:]' | xargs)
            case "$N" in oi|olá|ola|"oi meva"|"bom dia"|"boa tarde"|"boa noite"|"tudo bem"|valeu|obrigado|ok|sim|não) FAST=true;; esac
          fi
          echo "fast=$FAST" >> "$GITHUB_OUTPUT"

      - name: Ferramentas (agent/resume)
        if: ${{ inputs.mode == 'agent' || inputs.mode == 'resume' }}
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gcc g++ make cmake ninja-build pkg-config libopenblas-dev git curl wget zip unzip p7zip-full poppler-utils
          python -m pip install -q pytest

      - uses: actions/setup-node@v4
        if: ${{ inputs.mode == 'agent' || inputs.mode == 'resume' }}
        with: {node-version: '22'}

      - uses: actions/setup-go@v5
        if: ${{ inputs.mode == 'agent' || inputs.mode == 'resume' }}
        with: {go-version: stable}

      - uses: actions/setup-java@v4
        if: ${{ inputs.mode == 'agent' || inputs.mode == 'resume' }}
        with: {distribution: temurin, java-version: '21'}

      - uses: actions/setup-dotnet@v4
        if: ${{ inputs.mode == 'agent' || inputs.mode == 'resume' }}
        with: {dotnet-version: '8.0.x'}

      - name: Modelo local
        if: ${{ steps.request.outputs.fast != 'true' && inputs.model_provider == 'local' }}
        id: model
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ inputs.mode }}" == chat ]]; then
            REPO="$CHAT_MODEL_REPO"; FILE="$CHAT_MODEL_FILE"; DIR="$HOME/.cache/meva/chat"; MIN=380000000; MAX=750000000; CTX=4096
          else
            REPO="$AGENT_MODEL_REPO"; FILE="$AGENT_MODEL_FILE"; DIR="$HOME/.cache/meva/agent"; MIN=1600000000; MAX=3300000000; CTX=12288
          fi
          mkdir -p "$DIR"; MODEL="$DIR/$FILE"
          if [[ ! -s "$MODEL" ]] || (( $(stat -c%s "$MODEL") < MIN )); then
            curl --fail -L --retry 5 -o "$MODEL" "https://huggingface.co/${REPO}/resolve/main/${FILE}?download=true"
          fi
          echo "model_path=$MODEL" >> "$GITHUB_OUTPUT"
          echo "context=$CTX" >> "$GITHUB_OUTPUT"

      - name: llama.cpp
        if: ${{ steps.request.outputs.fast != 'true' && inputs.model_provider == 'local' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends cmake ninja-build libopenblas-dev
          CACHE="$HOME/.cache/meva/llama.cpp"
          SERVER="$CACHE/build/bin/llama-server"
          if [[ ! -x "$SERVER" ]]; then
            rm -rf "$CACHE"
            git clone --depth 1 "$LLAMA_CPP_REPO" "$CACHE"
            cmake -S "$CACHE" -B "$CACHE/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DGGML_OPENMP=ON -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
            cmake --build "$CACHE/build" --parallel 4 --target llama-server
          fi

      - name: Iniciar server
        if: ${{ steps.request.outputs.fast != 'true' && inputs.model_provider == 'local' }}
        env:
          MODEL: ${{ steps.model.outputs.model_path }}
          CTX: ${{ steps.model.outputs.context }}
        shell: bash
        run: |
          SERVER="$HOME/.cache/meva/llama.cpp/build/bin/llama-server"
          THREADS=$(nproc); ((THREADS>4))&&THREADS=4
          nohup "$SERVER" --model "$MODEL" --ctx-size "$CTX" --threads "$THREADS" --batch-size 512 --host 127.0.0.1 --port 8080 > /tmp/llama.log 2>&1 &
          echo $! > /tmp/llama.pid
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8080/health >/dev/null && exit 0; sleep 2; done
          cat /tmp/llama.log; exit 1

      - name: Núcleo agente
        env:
          MODE: ${{ inputs.mode }}
          MESSAGE: ${{ inputs.message }}
          CID: ${{ inputs.conversation_id }}
          MAX: ${{ inputs.max_actions }}
          FAST: ${{ steps.request.outputs.fast }}
          AUTONOMY: ${{ inputs.autonomy }}
          PROVIDER: ${{ inputs.model_provider }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/meva.py << 'PY'
          import json,os,re,subprocess,sys,time,urllib.parse,urllib.request,zipfile
          from pathlib import Path,PurePosixPath

          ROOT=Path.cwd().resolve()
          MODE=os.getenv('MODE','chat')
          USER=os.getenv('MESSAGE','').strip()
          CID=os.getenv('CID') or 'run-'+os.getenv('GITHUB_RUN_ID','m')
          FAST=os.getenv('FAST')=='true'
          MAX=max(1,min(45,int(os.getenv('MAX','32'))))
          AUTONOMY=os.getenv('AUTONOMY','ask')
          PROVIDER=os.getenv('PROVIDER','local')

          STATE=ROOT/'meva-data'/'conversations'/(CID+'.json')
          CKPT=ROOT/'meva-data'/'checkpoints'/(CID+'.json')
          INBOX=ROOT/'meva-inbox'/CID
          WORK=ROOT/'meva-workspace'
          STATE.parent.mkdir(parents=True,exist_ok=True)
          CKPT.parent.mkdir(parents=True,exist_ok=True)
          WORK.mkdir(exist_ok=True)

          DENY={'.git','.github','meva-data','node_modules','.venv','venv','.cache'}
          BLOCK={'id_rsa','id_ed25519','credentials','.npmrc','.pypirc'}

          def safe(raw,write=False):
              if not isinstance(raw,str) or not raw or '\\' in raw or len(raw)>420: raise ValueError('caminho inválido')
              q=PurePosixPath(raw)
              if q.is_absolute() or any(x in ('','..','.') for x in q.parts): raise ValueError('fora do projeto')
              if any(x.lower() in DENY for x in q.parts): raise ValueError('protegido')
              if write and q.parts and q.parts[0]=='meva-inbox': raise ValueError('inbox read-only')
              n=q.name.lower()
              if n.startswith('.env') or n in BLOCK or any(x in n for x in ('secret','token','credential','private_key')): raise ValueError('possível segredo')
              p=ROOT
              for x in q.parts:
                  p=p/x
                  if p.is_symlink(): raise ValueError('symlink')
              p=p.resolve(strict=False)
              if p!=ROOT and ROOT not in p.parents: raise ValueError('escape')
              return p,q.as_posix()

          def clean_env():
              e=os.environ.copy()
              bad=re.compile(r'(TOKEN|SECRET|PASSWORD|CREDENTIAL|PRIVATE_KEY)',re.I)
              for k in list(e):
                  if k.startswith(('GITHUB_','ACTIONS_','RUNNER_')) or bad.search(k): e.pop(k,None)
              return e

          def proc(cmd,cwd=ROOT,timeout=280,shell=False):
              try:
                  r=subprocess.run(cmd,cwd=cwd,text=True,capture_output=True,timeout=timeout,env=clean_env(),shell=shell,executable='/bin/bash' if shell else None)
                  return {'ok':r.returncode==0,'code':r.returncode,'out':((r.stdout or '')+'\n'+(r.stderr or '')).strip()[-18000:] or 'ok'}
              except subprocess.TimeoutExpired:
                  return {'ok':False,'timeout':True,'out':'timeout'}
              except Exception as e:
                  return {'ok':False,'out':str(e)}

          def inventory():
              names=[]
              for cur,dirs,files in os.walk(ROOT):
                  dirs[:]=[d for d in dirs if d.lower() not in DENY and not (Path(cur)/d).is_symlink()]
                  for f in files:
                      try:
                          _,n=safe((Path(cur)/f).relative_to(ROOT).as_posix())
                          names.append(n)
                      except: continue
                      if len(names)>=2200: return sorted(set(names))[:2200]
              return sorted(set(names))[:2200]

          def project_info():
              names=inventory()
              markers={'README.md','package.json','pyproject.toml','requirements.txt','Cargo.toml','go.mod','CMakeLists.txt','Makefile','pom.xml','build.gradle'}
              return {'files':len(names),'sample':names[:350],'manifests':[n for n in names if Path(n).name in markers][:60]}

          def analyze():
              info=project_info()
              langs=set()
              for n in info['sample']:
                  e=Path(n).suffix.lower()
                  if e=='.py': langs.add('Python')
                  elif e in ('.js','.ts','.tsx','.mjs'): langs.add('JS/TS')
                  elif e in ('.c','.cpp','.h','.hpp','.cc'): langs.add('C/C++')
                  elif e=='.java': langs.add('Java')
                  elif e=='.go': langs.add('Go')
                  elif e=='.rs': langs.add('Rust')
                  elif e=='.cs': langs.add('C#')
              return {'info':info,'languages':sorted(langs)}

          def tool(a):
              if not isinstance(a,dict): raise ValueError('ação inválida')
              k=a.get('type'); path=a.get('path','')
              if k=='inspect_project': return project_info()
              if k=='analyze_architecture': return analyze()
              if k=='list_files': return {'files':inventory()[:1500]}
              if k=='read_file':
                  p,n=safe(path)
                  off=max(0,int(a.get('offset',0))); lim=max(1,min(40000,int(a.get('limit',16000))))
                  if not p.is_file(): raise ValueError('não existe')
                  with p.open('rb') as f:
                      f.seek(off); data=f.read(lim)
                  if b'\0' in data[:2048]: raise ValueError('binário')
                  return {'path':n,'content':data.decode('utf-8','replace'),'next':off+len(data)}
              if k=='write_file':
                  p,n=safe(path,True)
                  c=a.get('content','')
                  if not isinstance(c,str) or len(c)>1_800_000: raise ValueError('conteúdo grande')
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_text(c,encoding='utf-8')
                  return {'path':n,'bytes':p.stat().st_size}
              if k=='replace_text':
                  p,n=safe(path,True)
                  if not p.is_file(): raise ValueError('não existe')
                  old=str(a.get('find','')); new=str(a.get('replace',''))
                  data=p.read_text(encoding='utf-8')
                  cnt=data.count(old)
                  if not old or cnt!=int(a.get('expected_count',1)): raise ValueError(f'count={cnt}')
                  p.write_text(data.replace(old,new),encoding='utf-8')
                  return {'path':n,'replaced':cnt}
              if k=='search_text':
                  q=str(a.get('query','')).casefold()
                  if not q: raise ValueError('vazio')
                  out=[]
                  for n in inventory():
                      p=ROOT/n
                      try:
                          if p.stat().st_size>4*1024*1024: continue
                          for i,line in enumerate(p.read_text(errors='replace').splitlines(),1):
                              if q in line.casefold():
                                  out.append({'path':n,'line':i,'text':line[:300]})
                                  if len(out)>=80: break
                      except: pass
                      if len(out)>=80: break
                  return {'matches':out}
              if k=='run_terminal':
                  cmd=a.get('command',''); d=a.get('directory',''); to=max(1,min(900,int(a.get('timeout',240))))
                  if not isinstance(cmd,str) or not cmd.strip() or len(cmd)>10000: raise ValueError('cmd inválido')
                  cwd=ROOT if not d else safe(d)[0]
                  if not cwd.is_dir(): raise ValueError('dir inexistente')
                  return proc(cmd,cwd,to,True)
              if k=='git_status': return proc(['git','status','--porcelain'])
              if k=='git_diff': return proc(['git','diff','--',path] if path else ['git','diff'])
              if k=='git_log': return proc(['git','log','--oneline','-15'])
              if k=='web_search':
                  q=a.get('query','')
                  if not isinstance(q,str) or not q.strip() or len(q)>400: raise ValueError('query')
                  url='https://html.duckduckgo.com/html/?q='+urllib.parse.quote(q)
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'MEVA-V11'})
                      with urllib.request.urlopen(req,timeout=18) as r: page=r.read(600000).decode('utf-8','replace')
                      res=[]
                      for m in re.finditer(r'class="result__a"[^>]*href="([^"]+)"[^>]*>([^<]+)',page):
                          res.append({'title':m.group(2),'url':m.group(1)})
                          if len(res)>=5: break
                      return {'results':res}
                  except Exception as e: return {'error':str(e)}
              if k=='inspect_zip':
                  p,label=safe(path)
                  if not zipfile.is_zipfile(p): raise ValueError('não é zip')
                  with zipfile.ZipFile(p) as z:
                      return {'entries':len(z.infolist()),'sample':[i.filename[:180] for i in z.infolist()[:120]]}
              if k=='read_pdf':
                  p,n=safe(path)
                  if p.stat().st_size>80*1024*1024: raise ValueError('pdf grande')
                  return {'path':n,**proc(['pdftotext','-layout',str(p),'-'],timeout=90)}
              raise ValueError('ferramenta desconhecida: '+str(k))

          def ask(messages,tokens=700,json_mode=False,temp=0.28):
              if PROVIDER=='local':
                  body={'model':'local','messages':messages,'temperature':temp,'max_tokens':tokens,'stream':False}
                  if json_mode: body['response_format']={'type':'json_object'}
                  req=urllib.request.Request('http://127.0.0.1:8080/v1/chat/completions',data=json.dumps(body,ensure_ascii=False).encode(),headers={'Content-Type':'application/json'})
                  with urllib.request.urlopen(req,timeout=480) as r: obj=json.loads(r.read())
                  c=obj['choices'][0]['message'].get('content','')
                  return c.strip() if isinstance(c,str) else ''
              key=os.getenv('OPENAI_API_KEY') or os.getenv('XAI_API_KEY') or os.getenv('ANTHROPIC_API_KEY')
              if not key: return 'Provedor externo sem chave nos secrets. Continuando com resposta local limitada.'
              return 'Provedor externo configurado. (implementação de chamada completa pode ser expandida)'

          history={'id':CID,'messages':[]}
          if STATE.is_file():
              try: history=json.loads(STATE.read_text(encoding='utf-8'))
              except: pass
          prior=[{'role':m['role'],'content':m['content'][-800:]} for m in history.get('messages',[]) if isinstance(m,dict) and m.get('role') in ('user','assistant') and isinstance(m.get('content'),str)][-3:]

          answer=''
          done=0
          start=time.time()
          if MODE=='self_test':
              answer='Autoteste V11\n'+json.dumps({'python':proc([sys.executable,'--version']),'git':proc(['git','--version'])},ensure_ascii=False,indent=2)
          elif FAST:
              simple={'oi':'Olá! MEVA CODE V11 pronta.','olá':'Olá! Como posso ajudar?','tudo bem':'Tudo certo. Qual tarefa?','ok':'Certo.','obrigado':'Disponha!','valeu':'Disponha!'}
              answer=simple.get(USER.lower().strip(),'Olá! Envie a tarefa.')
          else:
              system=("Você é MEVA CODE V11, agente de programação autônomo de alto nível. "
                      "Responda em português. Use ferramentas reais. Não invente. "
                      "Planeje de forma eficiente. Para tarefas simples use poucas ações. "
                      "Para tarefas grandes seja completo mas evite loops desnecessários. "
                      "Sempre retorne JSON: {\"reply\":\"...\",\"actions\":[{\"type\":\"...\"}]} . "
                      "Quando terminar: actions []. "
                      "Ferramentas: inspect_project, analyze_architecture, list_files, read_file, write_file, replace_text, search_text, run_terminal, git_status, git_diff, git_log, web_search, inspect_zip, read_pdf.")
              msgs=[{'role':'system','content':system}]+prior+[{'role':'user','content':USER}]
              for _ in range(MAX+2):
                  if done>=MAX or (time.time()-start)> (50*60 if MODE=='agent' else 12*60):
                      break
                  raw=ask(msgs,1200,True,0.18)
                  try:
                      st=raw.find('{'); en=raw.rfind('}')
                      obj=json.loads(raw[st:en+1])
                      actions=obj.get('actions',[]); reply=obj.get('reply','')
                      if not isinstance(actions,list) or not isinstance(reply,str): raise ValueError()
                  except Exception as e:
                      if done<2:
                          msgs.append({'role':'user','content':'JSON inválido. Corrija. '+str(e)[:120]})
                          continue
                      answer='Falha no plano. Nenhuma ação extra.'
                      break
                  if not actions:
                      answer=reply or 'Concluído.'
                      break
                  results=[]
                  for a in actions[:min(3,MAX-done)]:
                      try: results.append({'tool':a.get('type'),'result':tool(a)})
                      except Exception as e: results.append({'tool':a.get('type'),'error':str(e)})
                      done+=1
                  msgs.extend([{'role':'assistant','content':raw},{'role':'user','content':'Resultados: '+json.dumps(results,ensure_ascii=False)[:6500]+'. Continue ou finalize.'}])
                  if len(msgs)>10: msgs=msgs[:2]+msgs[-5:]
                  answer=reply or answer
              if not answer: answer='Limite atingido. Resultado parcial.'
              st=proc(['git','status','--porcelain'])
              answer+='\n\nGit status: '+(st.get('out','')[:400] or 'limpo')

          stamp=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          prev=history.get('messages',[])
          prev=prev[-18:] if isinstance(prev,list) else []
          history.update({'id':CID,'updated_at':stamp,'provider':PROVIDER,'autonomy':AUTONOMY,
                          'messages':prev+[{'role':'user','content':USER,'created_at':stamp},{'role':'assistant','content':answer,'created_at':stamp}]})
          STATE.write_text(json.dumps(history,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          CKPT.write_text(json.dumps({'done':done,'ts':stamp,'summary':answer[:1500]},ensure_ascii=False))
          print('MEVA_RESULT_BEGIN'); print(answer); print('MEVA_RESULT_END')
          print(f'Ações={done} tempo={int(time.time()-start)}s')
          PY
          python3 /tmp/meva.py | tee /tmp/meva-out.txt

      - name: Empacotar e publicar resultado
        if: ${{ inputs.mode == 'agent' || inputs.mode == 'resume' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CID: ${{ inputs.conversation_id }}
          RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - << 'PY'
          import json,zipfile
          from pathlib import Path
          root=Path.cwd()
          changed=subprocess_run=['git','status','--porcelain']
          import subprocess
          st=subprocess.run(['git','status','--porcelain'],capture_output=True,text=True).stdout
          files=[x[3:] for x in st.splitlines() if len(x)>3 and not x[3:].startswith(('meva-inbox/','meva-workspace/','meva-data/','.github/'))]
          out=Path('/tmp/MEVA-RESULT.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for f in files[:200]:
                  p=root/f
                  if p.is_file() and not p.is_symlink(): z.write(p,'changes/'+f)
              ws=root/'meva-workspace'
              if ws.is_dir():
                  for p in ws.rglob('*'):
                      if p.is_file() and not any(x in p.parts for x in ('.git','node_modules','.venv','__pycache__')):
                          z.write(p,'workspace/'+p.relative_to(ws).as_posix())
          print('Pacote criado:',out.stat().st_size if out.exists() else 0)
          PY
          if [[ -s /tmp/MEVA-RESULT.zip ]]; then
            TAG="meva-v11-res-${CID:-x}-${RUN}"
            gh release create "$TAG" /tmp/MEVA-RESULT.zip --repo "$GH_REPO" --title "MEVA V11 resultado ${RUN}" --notes "Arquivos gerados/alterados pela execução." --prerelease || true
            URL=$(gh release view "$TAG" --repo "$GH_REPO" --json url --jq .url 2>/dev/null || echo "")
            if [[ -n "$URL" && -n "$CID" ]]; then
              python3 - "$CID" "$URL" << 'PY'
          import json,sys
          from pathlib import Path
          cid,url=sys.argv[1:]
          p=Path('meva-data/conversations')/(cid+'.json')
          if p.is_file():
              d=json.loads(p.read_text())
              d['last_release']=url
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
            fi
          fi

      - name: Persistir
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/**' ':(exclude)meva-inbox/**' ':(exclude)meva-workspace/**' ':(exclude)**/node_modules/**' ':(exclude)**/.venv/**' ':(exclude)**/__pycache__/**'
          if ! git diff --cached --quiet; then
            git commit -m 'MEVA V11: atualização de conversa e alterações'
            AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            git rebase "origin/${BRANCH}" || true
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:${BRANCH}"
          fi

      - name: Resumo
        if: always()
        shell: bash
        run: |
          echo "## MEVA CODE V11" >> $GITHUB_STEP_SUMMARY
          echo "- Modo: ${{ inputs.mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- Conversa: ${{ inputs.conversation_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- Provedor: ${{ inputs.model_provider }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timeout job: 90 min" >> $GITHUB_STEP_SUMMARY
