                  package=create_package(status,answer,provider,model,done,before_snapshot,AUDIT);history['last_package_sha256']=package['sha256'];log('PACOTE '+json.dumps(package,ensure_ascii=False))
              if upload_meta:history['pending_upload']=upload_meta
              save_state()
              log('MEVA_STATUS='+status+' PROVIDER='+provider+' MODEL='+model+' ACTIONS='+str(done)+' BUILD='+str(ALLOW_BUILD))
              log('MEVA_RESULT_BEGIN');print(answer);log('MEVA_RESULT_END')
          except Exception as exc:
              status='failed';error=type(exc).__name__+': '+redact(exc);answer=(answer+'\n\n' if answer else '')+'EXECUÇÃO INTERROMPIDA: '+error
              try:
                  if PROJECT.is_dir() and any(x.is_file() for x in PROJECT.rglob('*')):
                      create_package('failed',answer,provider,model,done,before_snapshot,AUDIT,error)
                  history['messages']=old_messages[-36:]+[{'role':'user','content':USER or 'Execução MEVA V16'},{'role':'assistant','content':answer}];history['last_error']=error
                  if upload_meta:history['pending_upload']=upload_meta
