          API_KEYS={k:os.environ.get(k,'') for k in ('NVIDIA_API_KEY','ANTHROPIC_API_KEY','OPENAI_API_KEY','XAI_API_KEY')}
          for k in ('NVIDIA_API_KEY','ANTHROPIC_API_KEY','OPENAI_API_KEY','XAI_API_KEY','GH_TOKEN'):
