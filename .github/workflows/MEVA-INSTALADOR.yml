          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public meva-config meva-data/conversations/.gitkeep MEVA-LEIA-ME.md
          git diff --cached --check

          if ! git diff --cached --quiet; then
            git commit -m "MEVA V6: instalar painel e configurações"

            AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
              push origin "HEAD:${DEFAULT_BRANCH}"
          else
            echo "Instalação já está atualizada."
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Criar artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  # ============================================================
  # CACHE E PREPARAÇÃO DO MODELO
  # ============================================================

  prepare-model:
    name: Preparar cache do Qwen
    if: ${{ inputs.mode == 'install' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Restaurar cache do modelo
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/meva/models
          key: meva-model-${{ runner.os }}-${{ env.MODEL_CACHE_VERSION }}
          restore-keys: |
            meva-model-${{ runner.os }}-

      - name: Baixar e validar modelo
        shell: bash
        run: |
          set -Eeuo pipefail

          MODEL_DIR="$HOME/.cache/meva/models"
          MODEL="$MODEL_DIR/$MODEL_FILE"

          mkdir -p "$MODEL_DIR"

          if [[ ! -s "$MODEL" ]] ||
             (( $(stat -c%s "$MODEL") < 1900000000 )); then

            rm -f "$MODEL"

            curl \
              --fail \
              --location \
              --retry 8 \
              --retry-all-errors \
              --connect-timeout 30 \
              --retry-delay 5 \
              --output "$MODEL" \
              "https://huggingface.co/${MODEL_REPO}/resolve/main/${MODEL_FILE}?download=true"
          fi

          SIZE="$(stat -c%s "$MODEL")"

          if (( SIZE < 1900000000 || SIZE > 2600000000 )); then
            echo "Tamanho inesperado do modelo: $SIZE bytes." >&2
            exit 1
          fi

          python3 - "$MODEL" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          with path.open("rb") as stream:
              magic = stream.read(4)

          if magic != b"GGUF":
              raise SystemExit("O arquivo não possui cabeçalho GGUF válido.")

          print(f"Modelo validado: {path.name} ({path.stat().st_size} bytes)")
          PY

          {
            echo "## Modelo da MEVA"
            echo "- Modelo: Qwen2.5-Coder-3B-Instruct Q4_K_M"
            echo "- Tamanho: $SIZE bytes"
            echo "- Cache: ~/.cache/meva/models"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    name: Publicar painel da MEVA
    if: ${{ inputs.mode == 'install' }}
    needs:
      - install
      - prepare-model
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================
  # EXECUÇÃO DA INTELIGÊNCIA ARTIFICIAL
  # ============================================================

  ai:
    name: Executar MEVA
    if: ${{ inputs.mode == 'chat' || inputs.mode == 'agent' || inputs.mode == 'self_test' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configurar cache do modelo
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/meva/models
          key: meva-model-${{ runner.os }}-${{ env.MODEL_CACHE_VERSION }}
          restore-keys: |
            meva-model-${{ runner.os }}-

      - name: Configurar cache do llama.cpp
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/meva/llama.cpp
          key: meva-llama-${{ runner.os }}-${{ env.LLAMA_CACHE_VERSION }}
          restore-keys: |
            meva-llama-${{ runner.os }}-

      - name: Validar solicitação
        env:
          MODE: ${{ inputs.mode }}
          MESSAGE: ${{ inputs.message }}
          CID: ${{ inputs.conversation_id }}
          TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
          MAX_ACTIONS: ${{ inputs.max_actions }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$MODE" != "self_test" &&
                -z "${MESSAGE//[[:space:]]/}" ]]; then
            echo "Mensagem vazia." >&2
            exit 1
          fi

          if (( ${#MESSAGE} > 6000 )); then
            echo "Mensagem acima de 6.000 caracteres." >&2
            exit 1
          fi

          if [[ -n "$CID" ]] &&
             ! [[ "$CID" =~ ^[A-Za-z0-9_-]{8,80}$ ]]; then
            echo "ID de conversa inválido." >&2
            exit 1
          fi

          if ! [[ "$MAX_ACTIONS" =~ ^[0-9]+$ ]] ||
             (( MAX_ACTIONS < 1 || MAX_ACTIONS > 24 )); then
            echo "max_actions deve estar entre 1 e 24." >&2
            exit 1
          fi

          if ! git check-ref-format --branch "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Branch inválida." >&2
            exit 1
          fi

          echo "Solicitação validada."

      - name: Preparar ou restaurar llama.cpp
        shell: bash
        run: |
          set -Eeuo pipefail

          CACHE="$HOME/.cache/meva"
          SRC="$CACHE/llama.cpp"
          SERVER="$SRC/build/bin/llama-server"

          mkdir -p "$CACHE/models"

          if [[ ! -x "$SERVER" ]]; then
            echo "Cache do llama.cpp ausente. Construindo servidor pela primeira vez."

            sudo apt-get update

            sudo apt-get install -y --no-install-recommends \
              build-essential \
              cmake \
              ninja-build \
              pkg-config

            rm -rf "$SRC"

            git clone --depth 1 \
              https://github.com/ggml-org/llama.cpp.git \
              "$SRC"

            cmake \
              -S "$SRC" \
              -B "$SRC/build" \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DGGML_NATIVE=ON \
              -DGGML_OPENMP=ON \
              -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_EXAMPLES=OFF

            cmake \
              --build "$SRC/build" \
              --config Release \
              --parallel 4 \
              --target llama-server
          else
            echo "Servidor llama.cpp restaurado do cache."
          fi

          test -x "$SERVER"
          "$SERVER" --version

      - name: Restaurar ou baixar modelo Qwen
        shell: bash
        run: |
          set -Eeuo pipefail

          MODEL="$HOME/.cache/meva/models/$MODEL_FILE"

          mkdir -p "$(dirname "$MODEL")"

          if [[ ! -s "$MODEL" ]] ||
             (( $(stat -c%s "$MODEL") < 1900000000 )); then

            rm -f "$MODEL"

            echo "Modelo não encontrado no cache. Baixando Qwen."

            curl \
              --fail \
              --location \
              --retry 8 \
              --retry-all-errors \
              --connect-timeout 30 \
              --retry-delay 4 \
              --output "$MODEL" \
              "https://huggingface.co/${MODEL_REPO}/resolve/main/${MODEL_FILE}?download=true"
          else
            echo "Qwen encontrado no cache."
          fi

          SIZE="$(stat -c%s "$MODEL")"

          if (( SIZE < 1900000000 || SIZE > 2600000000 )); then
            echo "Tamanho inválido do modelo: $SIZE bytes." >&2
            exit 1
          fi

          python3 - "$MODEL" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          with path.open("rb") as stream:
              if stream.read(4) != b"GGUF":
                  raise SystemExit("GGUF inválido.")

          print(f"Modelo disponível: {path.stat().st_size} bytes.")
          PY

      - name: Iniciar servidor Qwen otimizado
        shell: bash
        run: |
          set -Eeuo pipefail

          MODEL="$HOME/.cache/meva/models/$MODEL_FILE"
          SERVER="$HOME/.cache/meva/llama.cpp/build/bin/llama-server"

          THREADS="$(nproc)"
          if (( THREADS > 4 )); then
            THREADS=4
          fi

          export OMP_NUM_THREADS="$THREADS"

          echo "Iniciando modelo com $THREADS threads."

          nohup "$SERVER" \
            --model "$MODEL" \
            --alias "$MODEL_ID" \
            --ctx-size 8192 \
            --threads "$THREADS" \
            --threads-batch "$THREADS" \
            --batch-size 256 \
            --ubatch-size 128 \
            --parallel 1 \
            --n-gpu-layers 0 \
            --host 127.0.0.1 \
            --port 8080 \
            > /tmp/meva-llama-server.log 2>&1 &

          echo $! > /tmp/meva-llama-server.pid

          for attempt in $(seq 1 240); do
            if curl --silent --fail \
              http://127.0.0.1:8080/health >/dev/null; then
              echo "Qwen carregado e pronto."
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/meva-llama-server.pid)" 2>/dev/null; then
              cat /tmp/meva-llama-server.log
              exit 1
            fi

            sleep 2
          done

          cat /tmp/meva-llama-server.log
          echo "Tempo limite ao carregar Qwen." >&2
          exit 1

      # ========================================================
      # FERRAMENTAS DE COMPILAÇÃO
      # Só são preparadas quando o usuário escolhe o agente.
      # O modo de conversa não paga esse custo.
