                  except Exception as e:  # noqa: BLE001
                      add(name, 'FAIL', 'Falha ao validar gzip/CPIO: ' + redact(e))

              # ------------------------------------------------------------------ gate final
              def final_gate(self, ws, *, compile_requested: bool, build_ok: bool, audit: dict | None = None) -> list[str]:
                  if not compile_requested:
                      return []
                  checks = (audit or self.audit(ws))['checks']
                  kernel_ok = any(str(x.get('check', '')).endswith('xenon.elf') and x.get('status') == 'PASS' for x in checks)
                  rootfs_ok = any(str(x.get('check', '')).endswith('rootfs.cpio.gz') and x.get('status') == 'PASS' for x in checks)
                  if build_ok and kernel_ok and rootfs_ok:
                      return []
                  return ['Validação XWT: não há evidência suficiente de `xenon.elf` ELF32 PowerPC big-endian e `rootfs.cpio.gz` íntegro com '
                          'estrutura/init reconhecido (ou o build não passou depois da última edição). O pacote não será declarado compilação XWT concluída.']
