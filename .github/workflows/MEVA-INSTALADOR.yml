  deploy-pages:
    name: Publicar interface MEVA Pages
    if: ${{ inputs.mode == 'install' }}
    needs: install
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar MEVA CODE
        id: deployment
        uses: actions/deploy-pages@v4

  ai:
    name: Executar agente MEVA V15 — projeto Linux ZIP
    if: ${{ inputs.mode == 'chat' || inputs.mode == 'agent' || inputs.mode == 'linux_zip' || inputs.mode == 'self_test' || inputs.mode == 'resume' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    permissions:
      contents: write
    steps:
      - name: Baixar branch de trabalho e ZIP temporário
        uses: actions/checkout@v4
        with:
          # O runner permanece na branch do projeto. O ZIP é reconstruído
          # pela Git Database API usando o commit temporário verificado.
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: ''

      - name: Instalar ferramentas de análise e compilação autorizada
        if: ${{ inputs.allow_build == true }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex gawk patch perl pkg-config \
            cmake ninja-build meson make gcc g++ clang lld \
            binutils-powerpc-linux-gnu gcc-powerpc-linux-gnu g++-powerpc-linux-gnu \
            binutils-powerpc64-linux-gnu gcc-powerpc64-linux-gnu g++-powerpc64-linux-gnu \
            libelf-dev libssl-dev libncurses-dev libzstd-dev \
            cpio rsync unzip zip xz-utils zstd gzip bzip2 lz4 lzop \
            file wget curl git python3 python3-pip python3-venv \
            device-tree-compiler gettext autoconf automake libtool

      - name: Validar parâmetros e selecionar provedor
        id: request
        env:
          MODE: ${{ inputs.mode }}
          MESSAGE: ${{ inputs.message }}
          CID: ${{ inputs.conversation_id }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
          UPLOAD_REF: ${{ inputs.upload_ref }}
          MAX_ACTIONS: ${{ inputs.max_actions }}
          REQUESTED_PROVIDER: ${{ inputs.model_provider }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$MODE" == self_test || "$MODE" == resume || -n "${MESSAGE//[[:space:]]/}" ]] || { echo 'Mensagem vazia.'; exit 1; }
          (( ${#MESSAGE} <= 12000 )) || { echo 'Mensagem acima de 12000 caracteres.'; exit 1; }
          [[ -z "$CID" || "$CID" =~ ^[A-Za-z0-9_-]{8,80}$ ]] || { echo 'ID de conversa inválido.'; exit 1; }
          [[ "$MAX_ACTIONS" =~ ^[0-9]+$ ]] && (( MAX_ACTIONS >= 1 && MAX_ACTIONS <= 80 )) || { echo 'max_actions fora do intervalo 1-80.'; exit 1; }
          git check-ref-format --branch "$BRANCH" >/dev/null
          if [[ -n "$UPLOAD_REF" ]]; then
            [[ "$UPLOAD_REF" =~ ^meva-upload-[a-z0-9-]{8,80}$ ]] || { echo 'upload_ref temporário inválido.'; exit 1; }
            [[ "$MODE" == linux_zip ]] || { echo 'Branch temporário de upload só pode ser usada no modo linux_zip.'; exit 1; }
          fi
          SELECTED="$REQUESTED_PROVIDER"
          if [[ "$SELECTED" == auto ]]; then
            if [[ -n "${NVIDIA_API_KEY:-}" ]]; then SELECTED=nvidia
            elif [[ -n "${ANTHROPIC_API_KEY:-}" ]]; then SELECTED=claude
            elif [[ -n "${OPENAI_API_KEY:-}" ]]; then SELECTED=openai
            elif [[ -n "${XAI_API_KEY:-}" ]]; then SELECTED=xai
            else echo 'Nenhuma API configurada. Cadastre NVIDIA_API_KEY ou outra chave nos Repository secrets.'; exit 1; fi
          fi
          case "$SELECTED" in
            nvidia) [[ -n "${NVIDIA_API_KEY:-}" ]] || { echo 'Falta NVIDIA_API_KEY.'; exit 1; } ;;
            claude) [[ -n "${ANTHROPIC_API_KEY:-}" ]] || { echo 'Falta ANTHROPIC_API_KEY.'; exit 1; } ;;
            openai) [[ -n "${OPENAI_API_KEY:-}" ]] || { echo 'Falta OPENAI_API_KEY.'; exit 1; } ;;
            xai) [[ -n "${XAI_API_KEY:-}" ]] || { echo 'Falta XAI_API_KEY.'; exit 1; } ;;
            *) echo 'Provedor inválido.'; exit 1 ;;
          esac
          echo "provider=$SELECTED" >> "$GITHUB_OUTPUT"

      - name: Executar agente e editar cópia do projeto
