          class HttpPolicyTests(unittest.TestCase):
              def _err(self, code):
                  return urllib.error.HTTPError('http://x', code, 'err', {'Retry-After': '0'}, __import__('io').BytesIO(b'{"error":"x"}'))

              def test_retries_rejected_requests_only(self):
                  calls = {'n': 0}

                  class Resp:
                      def __enter__(self): return self
                      def __exit__(self, *a): return False
                      def read(self): return b'{"ok": true}'
                      headers = {}

                  def fake_urlopen(req, timeout=0):
                      calls['n'] += 1
                      if calls['n'] < 3:
                          raise self._err(429)
                      return Resp()

                  with mock.patch('urllib.request.urlopen', fake_urlopen), mock.patch('time.sleep'):
                      data, _ = providers._http('POST', 'http://x', {}, {'a': 1})
                  self.assertEqual(data, {'ok': True})
                  self.assertEqual(calls['n'], 3)

              def test_timeout_is_never_retried(self):
                  calls = {'n': 0}

                  def fake_urlopen(req, timeout=0):
                      calls['n'] += 1
                      raise TimeoutError('timed out')

                  with mock.patch('urllib.request.urlopen', fake_urlopen), self.assertRaises(ProviderError) as cm:
                      providers._http('POST', 'http://x', {}, {'a': 1})
                  self.assertEqual(calls['n'], 1)
                  self.assertTrue(cm.exception.transient)

              def test_http_400_is_not_retried(self):
                  calls = {'n': 0}

                  def fake_urlopen(req, timeout=0):
                      calls['n'] += 1
                      raise self._err(400)

                  with mock.patch('urllib.request.urlopen', fake_urlopen), self.assertRaises(ProviderError):
                      providers._http('POST', 'http://x', {}, {'a': 1})
                  self.assertEqual(calls['n'], 1)


