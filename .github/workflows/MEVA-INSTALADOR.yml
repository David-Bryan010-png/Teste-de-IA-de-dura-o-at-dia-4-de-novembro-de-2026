          """Relatório, manifesto e pacote ZIP verificado (com backups originais para rollback)."""
          from __future__ import annotations

          import hashlib
          import json
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          from .util import (
              DENY_DIRS, MAX_FILES, MAX_UPLOAD, OUTPUT_NAMES, VERSION, atomic_json, file_hash, redact, safe_link_target,
              secret_path,
          )
          from .workspace import environment_info

          ZIP_OUT = Path('/tmp/MEVA-LINUX-PROJECT-V19.zip')
          STORED = {'.gz', '.xz', '.zst', '.bz2', '.zip', '.png', '.jpg', '.jpeg', '.webp', '.mp4', '.mkv', '.elf', '.bin', '.cpio', '.so', '.a', '.o', '.pdf'}


          def evidence_table(s) -> list[str]:
              def yn(v):
                  return 'sim' if v else 'não'
              rows = ['| Evidência | Resultado |', '|---|---|']
              v = s.last_validation
              rows.append('| Validação sintática dos arquivos alterados | ' + (json.dumps(v.get('counts'), ensure_ascii=False) if v else 'NOT_RUN') + ' |')
              b = s.last_build
              rows.append('| Build | ' + (f"exit {b['exit_code']} (`{b['command'][:80]}`); válido após a última edição: {yn(s.build_ok_current)}" if b else 'NOT_RUN') + ' |')
              t = s.last_tests
              rows.append('| Testes | ' + (f"{t.get('status') or ('ok' if t.get('ok') else 'falhou')} (`{str(t['command'])[:80]}`); válidos após a última edição: {yn(s.tests_ok_current)}" if t else 'NOT_RUN') + ' |')
              vr = s.verify_result
              rows.append('| Verificador independente | ' + (f"{vr['verdict']} — {vr['summary'][:200]}" if vr else 'não executado') + ' |')
              return rows


          def create_package(s, status: str, answer: str, provider: str, model: str, error=None, usage=None) -> dict:
              cfg, ws = s.cfg, s.ws
              work = cfg.work
              ws.git.checkpoint('meva: estado final', include_untracked=True)
              changes = ws.changes_since(ws.snapshot_before)
              diff = ws.git.diff_base_to_head() if ws.git.enabled else ''
              files = ws.inventory(0, MAX_FILES)
              failed = [x for x in s.audit if x.get('status') in ('error', 'failed')]
              audits = {p.name: p.audit(ws) for p in s.plugins}
              env = {**environment_info(work), 'sandbox': {'name': s.sandbox.name, 'available': s.sandbox.available, 'reason': s.sandbox.reason},
                     'git': {'enabled': ws.git.enabled, 'reason': ws.git.reason}, 'agent_version': VERSION}
              atomic_json(work / 'MEVA-ENVIRONMENT.json', env)
              if s.last_validation is not None:
                  atomic_json(work / 'MEVA-VALIDATION.json', s.last_validation)
              if s.verify_result is not None:
                  atomic_json(work / 'MEVA-VERIFY.json', s.verify_result)
              atomic_json(work / 'MEVA-TODOS.json', {'todos': s.todos, 'plan': s.plan_text})
              (work / 'MEVA-GIT-LOG.txt').write_text(ws.git.log(200) if ws.git.enabled else 'git indisponível: ' + ws.git.reason + '\n', encoding='utf-8')

              report = ['# MEVA CODE V19 — Relatório de engenharia', '', f'- Estado: {status}', f'- Provedor: {provider or "não selecionado"}',
                        f'- Modelo: {model or "não selecionado"}', f'- Modo: {cfg.mode}', f'- Autonomia: {cfg.autonomy}', f'- Build autorizado: {cfg.allow_build}',
                        f'- Sandbox: {s.sandbox.name} ({"disponível" if s.sandbox.available else "indisponível: " + s.sandbox.reason})',
                        f'- Ações do agente: {s.done}', f'- Ações com falha: {len(failed)}', f'- Arquivos no projeto: {len(files)}', f'- Arquivos alterados: {len(changes)}']
              if usage:
                  report.append(f"- Tokens: entrada {usage.get('input', 0)} · saída {usage.get('output', 0)} · cache lido {usage.get('cache_read', 0)} · cache escrito {usage.get('cache_write', 0)} · chamadas {usage.get('calls', 0)}")
              report += ['', '## Resultado', answer, '', '## Evidências', *evidence_table(s)]
              if s.verify_result and s.verify_result.get('findings'):
                  report += ['', '## Achados do verificador']
                  report += [f"- [{f['severity']}] `{f.get('file', '')}` {f['issue']}" for f in s.verify_result['findings']]
              if s.todos:
                  report += ['', '## Lista de tarefas'] + [f"- [{'x' if t['status'] == 'done' else ' '}] {t['content']}" for t in s.todos]
              for name, a in audits.items():
                  report += ['', f'## Auditoria estática — plugin {name}', '```json', json.dumps(a, ensure_ascii=False, indent=2), '```']
              report += ['', '## Arquivos alterados'] + [f"- {x['status']}: `{x['path']}`" for x in changes[:3000]]
              report += ['', '## Auditoria de ações']
              for e in s.audit[:1500]:
                  report.append(f"- #{e.get('index')} [{e.get('agent', 'main')}] `{e.get('tool')}` — {e.get('status')} — {redact(e.get('target', ''))} — {redact(e.get('error', ''))}")
              report += ['', '## Limitações',
                         '- `NOT_RUN` significa não executado.',
                         '- A análise estática não comprova boot físico, compatibilidade Xenos nem funcionamento de USB/controle.',
                         '- Backups originais ficam em MEVA-BACKUPS.json e MEVA-ROLLBACK/; o SHA-256 é verificado antes de restaurar. O histórico git das etapas está em MEVA-GIT-LOG.txt.',
                         '- A validação automática é sintática/estrutural e não substitui build real.',
                         '- O ZIP é um pacote do projeto; só é uma imagem inicializável se os arquivos e o boot forem efetivamente comprovados.']
              (work / 'MEVA-REPORT.md').write_text('\n'.join(report) + '\n', encoding='utf-8')
              (work / 'MEVA-CHANGES.diff').write_text(diff or '# Sem diff textual disponível.\n', encoding='utf-8')
              manifest = {
                  'version': 19, 'agent_version': VERSION, 'status': status, 'provider': provider, 'model': model, 'changes': changes,
                  'actions': s.audit, 'plugin_audits': audits, 'validation': s.last_validation, 'verifier': s.verify_result,
                  'build': s.last_build, 'tests': s.last_tests, 'backup_index': ws.backup_index, 'runner_environment': env,
                  'usage': usage, 'error': redact(error) if error else None, 'file_count': len(files),
                  'files': [{'path': n, 'size': (ws.project / n).stat().st_size, 'mode': oct(stat.S_IMODE((ws.project / n).stat().st_mode)),
                             'sha256': file_hash(ws.project / n)} for n in files],
              }
              (work / 'MEVA-MANIFEST.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              (work / 'MEVA-ACTIONS.json').write_text(json.dumps({'schema': 3, 'events': s.audit}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

              out = ZIP_OUT
              out.unlink(missing_ok=True)
              with zipfile.ZipFile(out, 'w', allowZip64=True) as z:
                  for p in sorted(ws.project.rglob('*')):
                      rel = p.relative_to(ws.project)
                      if secret_path(rel.parts) or any(x.lower() in DENY_DIRS for x in rel.parts) or p.is_symlink():
                          continue
                      arc = 'linux-project/' + rel.as_posix()
                      if p.is_dir():
                          zi = zipfile.ZipInfo(arc.rstrip('/') + '/')
                          zi.create_system = 3
                          zi.external_attr = ((stat.S_IFDIR | stat.S_IMODE(p.stat().st_mode)) << 16) | 0x10
                          z.writestr(zi, b'')
                      elif p.is_file():
                          z.write(p, arc, compress_type=zipfile.ZIP_STORED if p.suffix.lower() in STORED else zipfile.ZIP_DEFLATED)
                  for name, target in sorted(ws.symlinks.items()):
                      rel = PurePosixPath(name)
                      if secret_path(rel.parts) or not safe_link_target(rel.parts, target):
                          continue
                      zi = zipfile.ZipInfo('linux-project/' + rel.as_posix())
                      zi.create_system = 3
                      zi.external_attr = (stat.S_IFLNK | 0o777) << 16
                      zi.compress_type = zipfile.ZIP_STORED
                      z.writestr(zi, target.encode('utf-8'))
                  for n in OUTPUT_NAMES:
                      if (work / n).is_file():
                          z.write(work / n, n, compress_type=zipfile.ZIP_DEFLATED)
                  if ws.backup_dir.exists():
                      for saved in sorted(ws.backup_dir.rglob('*')):
                          if not saved.is_file() or saved.is_symlink():
                              continue
                          rel = saved.relative_to(ws.backup_dir)
                          name = rel.as_posix()
                          meta = ws.backup_index.get(name)
                          if not meta or not meta.get('exists') or secret_path(rel.parts):
                              raise RuntimeError('Arquivo de rollback sem metadados seguros: ' + name)
                          if file_hash(saved) != meta.get('sha256') or saved.stat().st_size != meta.get('size'):
                              raise RuntimeError('Backup original com hash/tamanho divergente: ' + name)
                          z.write(saved, 'MEVA-ROLLBACK/' + name, compress_type=zipfile.ZIP_STORED if saved.suffix.lower() in STORED else zipfile.ZIP_DEFLATED)
              if out.stat().st_size > MAX_UPLOAD:
                  raise RuntimeError('ZIP de saída acima do limite de 1,8 GiB.')
              with zipfile.ZipFile(out) as z:
                  bad = z.testzip()
                  if bad:
                      raise RuntimeError('ZIP final com CRC inválido: ' + bad)
                  names = z.namelist()
                  if not any(x.startswith('linux-project/') for x in names):
                      raise RuntimeError('ZIP final não contém o projeto.')
                  missing = sorted({'MEVA-REPORT.md', 'MEVA-MANIFEST.json', 'MEVA-ACTIONS.json'} - set(names))
                  if missing:
                      raise RuntimeError('ZIP final sem relatórios obrigatórios: ' + ', '.join(missing))
                  m = json.loads(z.read('MEVA-MANIFEST.json').decode('utf-8'))
                  if m.get('version') != 19 or m.get('status') != status:
                      raise RuntimeError('Manifesto do ZIP não corresponde ao estado/versão do pacote.')
                  expected = {'MEVA-ROLLBACK/' + n for n, meta in ws.backup_index.items() if meta.get('exists')}
                  actual = {n for n in names if n.startswith('MEVA-ROLLBACK/') and not n.endswith('/')}
                  if actual != expected:
                      raise RuntimeError('Arquivos do rollback no ZIP não correspondem ao índice de backups.')
              h = hashlib.sha256()
              with out.open('rb') as f:
                  for b in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(b)
              return {'size': out.stat().st_size, 'changes': len(changes), 'files': len(files), 'sha256': h.hexdigest(),
                      'plugin_checks': sum(len(a.get('checks', [])) for a in audits.values()), 'archive_verified': True}
