              tcs = [ToolCall(f'tc_{i}_{time.time_ns()}', n, a) for i, (n, a) in enumerate(calls)]
              blocks = ([{'type': 'text', 'text': text}] if text else []) + [{'type': 'tool_use', 'id': c.id, 'name': c.name, 'input': c.args} for c in tcs]
              return Turn(text, tcs, 'tool_use', {}, blocks, provider, model)


          class ScriptedRouter:
              """Devolve turnos pré-definidos; item pode ser Turn ou callable(system, messages, tools) -> Turn."""

              def __init__(self, script):
                  self.script = list(script)
                  self.calls = []
                  self.provider, self.model = 'fake', 'fake-1'
                  self.usage = {'input': 0, 'output': 0, 'cache_read': 0, 'cache_write': 0, 'calls': 0}

              def complete(self, system, messages, tools, max_tokens=None):
                  self.calls.append({'system': system, 'messages': [dict(m) for m in messages], 'tools': [t['name'] for t in tools]})
                  if not self.script:
                      raise AssertionError('ScriptedRouter sem mais turnos; chamada inesperada #%d' % len(self.calls))
                  item = self.script.pop(0)
                  turn = item(system, messages, tools) if callable(item) else item
                  self.usage['calls'] += 1
                  return turn


