      - name: Commit e push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public .github/workflows/deploy-pages.yml .github/workflows/meva-agent.yml LEIA-PRIMEIRO.md package.json .gitignore
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "MEVA: instalar painel no GitHub Pages"
            git config --unset-all http.https://github.com/.extraheader || true
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
            echo "Commit enviado."
          fi

      - name: Resumo
        run: |
          echo "## MEVA instalada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Vá em **Settings → Pages** e confirme **Source: GitHub Actions**." >> $GITHUB_STEP_SUMMARY
          echo "2. Crie um Fine-grained PAT com **Actions: Read and write** (só este repo)." >> $GITHUB_STEP_SUMMARY
          echo "3. Abra a URL do Pages, cole o token no painel e salve." >> $GITHUB_STEP_SUMMARY
          echo "4. Escreva uma tarefa e execute." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "O deploy do Pages acontece automaticamente no próximo push (ou rode o workflow Deploy MEVA to GitHub Pages)." >> $GITHUB_STEP_SUMMARY
