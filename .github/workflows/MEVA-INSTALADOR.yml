          def project_info():
              names=inventory(MAX_FILES)
              marks={'README','README.md','README.txt','Kconfig','Makefile','CMakeLists.txt','Config.in','.config','buildroot.config','defconfig','rootfs.cpio.gz','zImage','zImage.xenon','xenon.elf','package.json','pyproject.toml','Cargo.toml','go.mod'}
