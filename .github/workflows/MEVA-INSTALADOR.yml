      - name: Persistir conversa e checkpoint sem sobrescrever mudanças remotas
        id: persist
        if: ${{ always() && steps.agent.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
          CID: ${{ inputs.conversation_id || format('run-{0}', github.run_id) }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p meva-data/conversations meva-data/checkpoints
          if [[ -s /tmp/meva-v19-published.json && -s "meva-data/conversations/${CID}.json" ]]; then
            python3 - "$CID" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path('meva-data/conversations')/(sys.argv[1]+'.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          r=json.loads(Path('/tmp/meva-v19-published.json').read_text(encoding='utf-8'))
          d['last_release']=r['release_url'];d['last_asset_url']=r['asset_url'];d['project_archive']={'release_id':r['release_id'],'asset_id':r['asset_id'],'name':r['asset_name'],'size':r['asset_size']};d.pop('pending_upload',None)
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          fi
          cp -a meva-data /tmp/meva-v19-data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git checkout -f -B "$BRANCH" "origin/${BRANCH}"
          mkdir -p meva-data
          cp -a /tmp/meva-v19-data/. meva-data/
          git add -A -- meva-data
          if ! git diff --cached --quiet; then
            git commit -m "MEVA V19: persistir conversa ${CID}"
            for attempt in 1 2 3; do
              if git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:${BRANCH}"; then break; fi
              if [[ "$attempt" -eq 3 ]]; then echo 'Push recusado após três tentativas; dados locais ainda estão no artefato.'; exit 1; fi
              git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
              git pull --rebase origin "$BRANCH"
              sleep $((attempt*2))
            done
          fi
          echo 'persisted=true' >> "$GITHUB_OUTPUT"

